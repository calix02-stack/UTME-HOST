<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>MyUTME</title>
<!--
  GitHub Pages serves this file for any URL it doesn't recognize as a
  real file (e.g. /ai-tutor, /account, /login). Since MyUTME is a
  single-page app, that "unknown" URL is actually a real, valid screen
  inside the app — GitHub Pages just doesn't know that. This redirects
  back to index.html with the intended path encoded in the query
  string; index.html then decodes it and restores the clean URL before
  the app boots (see the script at the top of index.html's <head>).
  Standard, widely-used technique — https://github.com/rafgraph/spa-github-pages
-->
<script>
  // pathSegmentsToKeep: 0 because MyUTME is served from the domain root
  // (myutme.com.ng/...), not from a /reponame/ project subpath. If this
  // site is ever moved to a project-pages subpath, change this to 1.
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body>
  Redirecting…
</body>
</html>
