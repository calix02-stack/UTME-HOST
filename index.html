        const scheduled = document.getElementById('admin-mock-scheduled')?.value || '';
        const regDeadline = document.getElementById('admin-mock-reg-deadline')?.value || '';
        const endDate = document.getElementById('admin-mock-end')?.value || '';
        const qs = parseInt(document.getElementById('admin-mock-qs')?.value || 25);

        if (!title) { showToast('Enter a title.', 'error'); return; }
        if (!scheduled) { showToast('Select a scheduled date.', 'error'); return; }

        let regDeadlineFinal = regDeadline;
        if (!regDeadlineFinal) {
            const date = new Date(scheduled);
            date.setHours(date.getHours() - 1);
            regDeadlineFinal = date.toISOString().slice(0, 16);
        }

        let endDateFinal = endDate;
        if (!endDateFinal) {
            const date = new Date(scheduled);
            date.setHours(date.getHours() + 12);
            endDateFinal = date.toISOString().slice(0, 16);
        }

        supabase.from('mock_exams').insert([{
            title: title,
            scheduled_date: new Date(scheduled).toISOString(),
            registration_deadline: new Date(regDeadlineFinal).toISOString(),
            end_date: new Date(endDateFinal).toISOString(),
            is_active: true,
            results_released: false,
        }]).then(function() {
            showToast('Mock exam scheduled!', 'success');
            state.admin.mockTitle = '';
            state.admin.mockScheduledDate = '';
            state.admin.mockRegistrationDeadline = '';
            state.admin.mockEndDate = '';
            state.admin.mockQuestionsPerSubject = qs;
            loadMockExams();
            render();

            console.error('Schedule mock error:', e);
            showToast('Error scheduling mock: ' + (e.message || 'unknown'), 'error');

            showToast('Mock exam deleted.', 'success');
            loadMockExams();

        const entry = state.historyEntries.find(function(e) { return e.id === id; });
        if (!entry) { showToast('Entry not found.', 'error'); return; }

        const pct = entry.max_score ? Math.round((entry.total_score / entry.max_score) * 100) : 0;
        const studentName = state.profile.name || 'Guest';

        const subjectStr = Object.keys(entry.subject_scores || {}).map(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            return '   • ' + (subj ? subj.name : sid) + ': ' + entry.subject_scores[sid];
        }).join('\n');

        const modeLabel = entry.mode === 'cbt-full' ? 'CBT Full' :
                         entry.mode === 'cbt-single' ? 'CBT Single' :
                         entry.mode === 'novel' ? 'Novel CBT' :
                         entry.mode === 'mock' ? 'Mock Exam' :
                         entry.mode === 'exam' ? 'Exam' :
                         entry.mode === 'topic' ? 'Topic Practice' :
                         entry.mode || 'Unknown';

        const text = '🎓 MyUTME — Result Slip\n' +
            '━━━━━━━━━━━━━━━━━━━━\n' +
            '👤 Candidate: ' + studentName + '\n' +
            '📝 Exam: ' + (entry.exam_title || entry.mode) + '\n' +
            '📋 Mode: ' + modeLabel + '\n' +
            '📅 Date: ' + formatDate(entry.submitted_at) + '\n' +
            '🎯 Score: ' + entry.total_score + ' / ' + entry.max_score + ' (' + pct + '%)\n' +
            (subjectStr ? '📋 Subject Breakdown:\n' + subjectStr + '\n' : '') +
            '✅ ' + entry.answered_count + ' of ' + entry.total_questions + ' answered\n' +
            '━━━━━━━━━━━━━━━━━━━━\n' +
            'Practice smarter with MyUTME';

        if (navigator.share) {
            navigator.share({
                title: 'MyUTME Exam Result — ' + studentName,
                text: text,
            }).catch(function() {});
        } else {
            navigator.clipboard.writeText(text).then(function() {
                showToast('Result copied to clipboard!', 'success');
            }).catch(function() {
                prompt('Copy this result:', text);
            });
        }
        return;
    }

    // REVISE WEAK QUESTIONS - Rebuilt
    if (action === 'revise-select-mode') {
        state.reviseMode = el.getAttribute('data-mode');
        state.reviseView = 'subjects';
        state.reviseIndex = 0;
        render();
        return;
    }
    if (action === 'revise-select-subject') {
        state.reviseSubject = el.getAttribute('data-subject');
        state.reviseView = 'questions';
        state.reviseIndex = 0;
        render();
        return;
    }
    if (action === 'revise-back-to-modes') {
        state.reviseView = 'modes';
        state.reviseMode = null;
        state.reviseSubject = null;
        state.reviseIndex = 0;
        render();
        return;
    }
    if (action === 'revise-back-to-subjects') {
        state.reviseView = 'subjects';
        state.reviseSubject = null;
        state.reviseIndex = 0;
        render();
        return;
    }
    
    if (action === 'revise-next') {
        const mode = state.reviseMode;
        const subjectId = state.reviseSubject;
        let list = state.weakQuestions.filter(function(wq) {
            return (wq.mode || 'unknown') === mode && wq.subject_id === subjectId;
        });
        if (state.reviseIndex < list.length - 1) {
            state.reviseIndex++;
            // Clear state for new question
            const wq = list[state.reviseIndex];
            state.weakQuestionStates['answer_' + wq.id] = undefined;
            delete state.weakQuestionStates['result_' + wq.id];
            render();
        }
        return;
    }
    
    if (action === 'revise-prev') {
        if (state.reviseIndex > 0) {
            state.reviseIndex--;
            const mode = state.reviseMode;
            const subjectId = state.reviseSubject;
            let list = state.weakQuestions.filter(function(wq) {
                return (wq.mode || 'unknown') === mode && wq.subject_id === subjectId;
            });
            const wq = list[state.reviseIndex];
            state.weakQuestionStates['answer_' + wq.id] = undefined;
            delete state.weakQuestionStates['result_' + wq.id];
            render();
        }
        return;
    }
    
    if (action === 'revise-done') {
        state.reviseView = 'subjects';
        state.reviseIndex = 0;
        render();
        return;
    }

    if (action === 'weak-toggle-view') {
        const wid = el.getAttribute('data-wid');
        state.weakQuestionStates['view_' + wid] = !state.weakQuestionStates['view_' + wid];
        render();
        return;
    }

    if (action === 'weak-reattempt-answer') {
        const wid = el.getAttribute('data-wid');
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const wq = state.weakQuestions.find(function(w) { return w.id === wid; });
        if (!wq || !wq.questions) { showToast('Question not found.', 'error'); return; }

        const q = wq.questions;
        const isCorrect = idx === q.correct_answer;

        state.weakQuestionStates['answer_' + wid] = idx;
        state.weakQuestionStates['result_' + wid] = isCorrect;
        render();

        if (isCorrect) {
            removeWeakQuestion(state.authUser.id, wq.question_id).then(function() {
                // Do NOT write to history — revise attempts are not stored in exam_history
                // Reload weak questions after removal
                state.weakQuestionsLoaded = false;
                loadWeakQuestions();
            });
        } else {
            saveWeakQuestion(state.authUser.id, wq.question_id, wq.subject_id, wq.mode, idx, q.correct_answer);
            // Reload to update attempts count
            state.weakQuestionsLoaded = false;
            loadWeakQuestions();
        }
        return;
    }

    if (action === 'weak-remove-question') {
        const wid = el.getAttribute('data-wid');
        const qid = el.getAttribute('data-qid');
        if (!state.authUser) { showToast('Please login first.', 'error'); return; }
        if (!confirm('Remove this question from your weak list?')) return;

        removeWeakQuestion(state.authUser.id, qid).then(function() {
            showToast('Removed from weak list.', 'success');
            delete state.weakQuestionStates['view_' + wid];
            delete state.weakQuestionStates['reattempt_' + wid];
            delete state.weakQuestionStates['answer_' + wid];
            delete state.weakQuestionStates['result_' + wid];
            state.weakQuestionsLoaded = false;
            loadWeakQuestions();
        }).catch(function() {
            showToast('Error removing question.', 'error');
        });
        return;
    }

    if (action === 'flag-review-question') {
        const qid = el.getAttribute('data-qid');
        const subject = el.getAttribute('data-subject');
        const mode = el.getAttribute('data-mode') || 'unknown';
        
        if (!state.authUser) { showToast('Please login first.', 'error'); return; }
        
        state.showFlagModal = true;
        state.flagModalData = {
            questionId: qid,
            subjectId: subject || '',
            mode: mode,
        };
        render();
        return;
    }

    if (action === 'flag-close') {
        state.showFlagModal = false;
        state.flagModalData = null;
        render();
        return;
    }

    if (action === 'flag-submit') {
        const data = state.flagModalData;
        if (!data || !data.questionId) { showToast('Could not identify this question — please try again from the question screen.', 'error'); return; }
        
        const reason = document.getElementById('flag-reason-input')?.value?.trim() || '';
        const userId = state.authUser?.id;
        const username = state.profile?.name || 'Unknown';
        
        if (!userId) { showToast('Please login first.', 'error'); return; }
        
        saveFlaggedQuestion(userId, username, data.questionId, data.subjectId, data.mode, reason).then(function() {
            showToast('Question flagged. Thank you — our team will review it.', 'success');
            if (state.myFlaggedIds.indexOf(data.questionId) === -1) state.myFlaggedIds.push(data.questionId);
            state.showFlagModal = false;
            state.flagModalData = null;
            loadFlaggedCount();
            render();
        });
        return;
    }

    // SUPPORT CHAT
    if (action === 'support-quick-issue') {
        const issueKey = el.getAttribute('data-issue');
        const issue = SUPPORT_QUICK_ISSUES.find(function(i) { return i.key === issueKey; });
        if (issue) {
            sendSupportMessage(issue.label, issueKey);
        }
        return;
    }

    if (action === 'send-support-message') {
        const input = document.getElementById('support-chat-input');
        if (input) {
            sendSupportMessage(input.value, null);
            input.value = '';
        }
        return;
    }

    if (action === 'admin-open-support') {
        state.adminSelectedSupportUser = el.getAttribute('data-userid');
        state.adminSelectedSupportUsername = el.getAttribute('data-username');
        loadAdminSupportThread(state.adminSelectedSupportUser);
        return;
    }

    if (action === 'admin-close-support') {
        state.adminSelectedSupportUser = null;
        state.adminSelectedSupportUsername = null;
        state.adminSupportMessages = [];
        render();
        return;
    }

    if (action === 'admin-send-support-reply') {
        const userId = el.getAttribute('data-userid');
        const username = el.getAttribute('data-username');
        const val = document.getElementById('admin-support-reply-input')?.value || '';
        sendAdminSupportReply(userId, username, val);
        const input = document.getElementById('admin-support-reply-input');
        if (input) input.value = '';
        return;
    }

    if (action === 'notif-image-upload') {
        const input = document.getElementById('admin-notif-image');
        if (input) input.click();
        return;
    }

    if (action === 'notif-remove-image') {
        state.admin.notifImageData = null;
        state.admin.notifImage = null;
        render();
        return;
    }

    if (action === 'admin-support-reply') {
        const userId = el.getAttribute('data-userid');
        const username = el.getAttribute('data-username');
        const input = document.getElementById('admin-support-reply-input');
        if (input && input.value.trim()) {
            sendAdminSupportReply(userId, username, input.value.trim());
            input.value = '';
        }
        return;
    }

    // ============================================================
    //  NEW: AVATAR UPLOAD
    // ============================================================
    if (action === 'open-avatar-upload') {
        state.showAvatarUpload = true;
        state.avatarUploadFile = null;
        render();
        return;
    }
    if (action === 'cancel-avatar-upload') {
        state.showAvatarUpload = false;
        state.avatarUploadFile = null;
        render();
        return;
    }
    if (action === 'choose-avatar-photo') {
        const input = document.getElementById('avatar-file-input');
        if (input) input.click();
        return;
    }
    if (action === 'save-avatar-upload') {
        if (!state.avatarUploadFile || !state.avatarUploadFile.dataUrl) {
            showToast('Please choose a photo first.', 'error');
            return;
        }
        
        const dataUrl = state.avatarUploadFile.dataUrl;
        
        supabase.from('profiles')
            .update({ profile_image_url: dataUrl })
            .eq('id', state.authUser.id)
            .then(function() {
                state.profile.avatarUrl = dataUrl;
                state.showAvatarUpload = false;
                state.avatarUploadFile = null;
                showToast('Profile photo updated!', 'success');
                render();
            })
            .catch(function(err) {
                console.warn('Avatar upload error:', err);
                showToast('Error updating profile photo.', 'error');
            });
        return;
    }

    // ============================================================
    //  NEW: FUND WALLET
    // ============================================================
    if (action === 'open-fund-wallet') {
        state.showFundWallet = true;
        state.fundWalletAmount = '';
        render();
        return;
    }
    if (action === 'close-fund-wallet') {
        state.showFundWallet = false;
        state.fundWalletAmount = '';
        render();
        return;
    }
    if (action === 'fund-quick-amount') {
        const amt = parseInt(el.getAttribute('data-amount'), 10);
        state.fundWalletAmount = String(amt);
        const input = document.getElementById('fund-wallet-amount-input');
        if (input) input.value = String(amt);
        render();
        return;
    }
    if (action === 'fund-wallet-paystack') {
        const amt = parseInt(document.getElementById('fund-wallet-amount-input')?.value || 0);
        if (!amt || amt <= 0) {
            showToast('Please enter a valid amount.', 'error');
            return;
        }
        state.fundWalletAmount = String(amt);
        
        if (typeof PaystackPop === 'undefined') {
            showToast('Payment system not loaded. Check your connection and try again.', 'error');
            return;
        }
        
        const handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: state.profile.email || (state.authUser.email || 'noemail@example.com'),
            amount: amt * 100,
            currency: 'NGN',
            ref: 'WALLET-' + Date.now() + '-' + Math.floor(Math.random() * 100000),
            metadata: {
                custom_fields: [
                    { display_name: "Purpose", variable_name: "purpose", value: "Wallet Funding" },
                    { display_name: "Username", variable_name: "username", value: state.profile.name || 'Guest' },
                ]
            },
            callback: function(response) {
                showToast('Payment received! Verifying...', '');
                verifyWalletFunding(response.reference, amt);
            },
            onClose: function() {
                showToast('Payment window closed.', '');
            }
        });
        handler.openIframe();
        return;
    }

    // ============================================================
    //  NEW: ACTIVATE WITH WALLET (from checkout)
    // ============================================================
    if (action === 'activate-with-wallet') {
        const planId = el.getAttribute('data-planid');
        const plan = state.activationPlans.find(function(p) { return p.id === planId; });
        if (!plan) { showToast('Plan not found.', 'error'); return; }
        activateWithWallet(plan);
        return;
    }

    // ============================================================
    //  NEW: STUDY REMINDER
    // ============================================================
    if (action === 'toggle-reminder-day') {
        const day = parseInt(el.getAttribute('data-day'), 10);
        const idx = state.studyReminderDays.indexOf(day);
        if (idx !== -1) {
            state.studyReminderDays.splice(idx, 1);
        } else {
            state.studyReminderDays.push(day);
            state.studyReminderDays.sort(function(a, b) { return a - b; });
        }
        render();
        return;
    }
    if (action === 'toggle-reminder-enabled') {
        if (!state.studyReminder) {
            state.studyReminder = { enabled: true, hour: state.studyReminderHour, minute: state.studyReminderMinute, days: state.studyReminderDays };
        } else {
            state.studyReminder.enabled = !state.studyReminder.enabled;
        }
        render();
        return;
    }
    if (action === 'save-study-reminder') {
        const hour = parseInt(document.getElementById('study-reminder-hour')?.value || 19);
        const minute = parseInt(document.getElementById('study-reminder-minute')?.value || 0);
        if (hour < 0 || hour > 23) { showToast('Hour must be between 0 and 23.', 'error'); return; }
        if (minute < 0 || minute > 59) { showToast('Minute must be between 0 and 59.', 'error'); return; }
        state.studyReminderHour = hour;
        state.studyReminderMinute = minute;
        const enabled = state.studyReminder ? state.studyReminder.enabled : true;
        saveStudyReminder(enabled);
        return;
    }
});

document.addEventListener('change', function(e) {
    const id = e.target.id;

    if (id === 'exam-year-select') {
        state.examYear = parseInt(e.target.value, 10);
    } else if (id === 'doc-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.docFile = { name: file.name, type: file.type, size: file.size, dataUrl: ev.target.result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-qsubject') {
        state.admin.qSubject = e.target.value || '';
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'admin-qyear') {
        state.admin.examYear = parseInt(e.target.value, 10) || 2026;
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'subject-lb-select') {
        state.subjectLeaderboardSubject = e.target.value || null;
        loadSubjectLeaderboard(state.subjectLeaderboardSubject);
        render();
    } else if (e.target.getAttribute && e.target.getAttribute('data-action') === 'qform-correct') {
        state.admin.qCorrect = parseInt(e.target.value, 10);
    } else if (id === 'admin-notif-image') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.notifImageData = ev.target.result;
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-view-subject-filter') {
        state.admin.viewModeSubject = e.target.value || '';
        render();
    } else if (id === 'admin-topic-subject-select') {
        state.admin.adminTopicSubject = e.target.value || null;
        state.admin.adminTopicsLoaded = false;
        state.admin.adminSelectedTopicId = null;
        state.admin.adminTopicQuestionsLoaded = false;
        render();
    } else if (id === 'offline-import-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                importOfflineData(data, 'replace').then(function(result) {
                    showToast('Imported ' + result.questions + ' questions, ' + result.passages +
                        ' passages, ' + result.topics + ' topics, ' + result.topic_questions +
                        ' topic questions.', 'success');
                    state.allQuestions = [];
                    loadAllQuestionsCount();
                    render();
                }).catch(function(err) {
                    console.error('Import error:', err);
                    showToast('Error importing file: ' + (err.message || 'unknown'), 'error');
                });
            } catch (parseErr) {
                showToast('Invalid JSON file — could not parse.', 'error');
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    } else if (id === 'avatar-file-input' || id === 'profile-edit-avatar-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.avatarUploadFile = {
                dataUrl: ev.target.result,
                name: file.name,
                type: file.type,
            };
            render();
        };
        reader.readAsDataURL(file);
    }
});

});

// ============================================================
//  INIT
// ============================================================
async function init() {
    const darkPref = storage.get('darkMode');
    if (darkPref === 'true') {
        state.darkMode = true;
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    const hasSeenSplash = storage.get('hasSeenSplash');
    if (hasSeenSplash) {
        state.phase = 'app';
    }
    render();

    if (!hasSeenSplash) {
        storage.set('hasSeenSplash', 'true');
        setTimeout(function() {
            if (state.phase === 'splash') {
                state.phase = 'app';
                render();
            }
        }, 5000);
    }

    await loadSettings();
    await checkAuthSession();
    // Restore session snapshot after auth is ready
    const restored = restoreSessionSnapshot();
    if (restored) {
        // Re-route to the restored view
        const examViews = ['cbt-exam', 'exam-exam', 'topic-exam', 'lit-exam', 'mock-exam'];
        if (examViews.indexOf(state.view) !== -1) {
            // Resume timers if needed
            if (state.view === 'cbt-exam' && state.cbtTimer === null && state.cbtTimeLeft > 0 && !state.cbtSubmitted) {
                state.cbtTimer = setInterval(function() {
                    state.cbtTimeLeft--;
                    if (state.cbtTimeLeft <= 0) {
                        clearInterval(state.cbtTimer);
                        state.cbtTimer = null;
                        if (!state.cbtSubmitted) {
                            const hasAnswers = state.cbtAnswers.some(function(a) { return a !== null && a !== undefined; });
                            if (hasAnswers) {
                                state.cbtSubmitted = true;
                                state.cbtFinished = true;
                                showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                            } else {
                                state.cbtSubmitted = false;
                                state.cbtFinished = true;
                                showToast('⏰ Time\'s up! No answers recorded.', '');
                            }
                        }
                        render();
                    } else {
                        render();
                    }
                }, 1000);
            }
            if (state.view === 'mock-exam' && state.mockTimer === null && state.mockTimeLeft > 0 && !state.mockSubmitted) {
                state.mockTimer = setInterval(function() {
                    state.mockTimeLeft--;
                    if (state.mockTimeLeft <= 0) {
                        clearInterval(state.mockTimer);
                        state.mockTimer = null;
                        submitMockExam(true);
                    } else {
                        render();
                    }
                }, 1000);
            }
            if (state.view === 'topic-exam' && state.topicTimer === null && state.topicTimeLeft > 0 && !state.topicSubmitted) {
                state.topicTimer = setInterval(function() {
                    state.topicTimeLeft--;
                    if (state.topicTimeLeft <= 0) {
                        clearInterval(state.topicTimer);
                        state.topicTimer = null;
                        if (!state.topicSubmitted) {
                            const hasAnswers = state.topicAnswers.some(function(a) { return a !== null && a !== undefined; });
                            if (hasAnswers) {
                                state.topicSubmitted = true;
                                state.topicFinished = true;
                                showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                            } else {
                                state.topicSubmitted = false;
                                state.topicFinished = true;
                                showToast('⏰ Time\'s up! No answers recorded.', '');
                            }
                        }
                        render();
                    } else {
                        render();
                    }
                }, 1000);
            }
            if (state.view === 'lit-exam' && state.litTimer === null && state.litTimeLeft > 0 && !state.litSubmitted) {
                state.litTimer = setInterval(function() {
                    state.litTimeLeft--;
                    if (state.litTimeLeft <= 0) {
                        clearInterval(state.litTimer);
                        state.litTimer = null;
                        if (!state.litSubmitted) {
                            const hasAnswers = state.litAnswers.some(function(a) { return a !== null && a !== undefined; });
                            if (hasAnswers) {
                                state.litSubmitted = true;
                                state.litFinished = true;
                                showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                            } else {
                                state.litSubmitted = false;
                                state.litFinished = true;
                                showToast('⏰ Time\'s up! No answers recorded.', '');
                            }
                        }
                        render();
                    } else {
                        render();
                    }
                }, 1000);
            }
        }
    }
    if (typeof seedOfflineDataIfNeeded === 'function') {
        await seedOfflineDataIfNeeded();
    } else {
        console.warn('seedOfflineDataIfNeeded is not defined — skipping offline seed.');
    }
    render();

    // Auto-sync per-subject question files
    const localQuestionCounts = await loadAllQuestionsCountOffline();
    const hasNoLocalQuestions = Object.keys(localQuestionCounts).length === 0;
    const lastSync = parseInt(storage.get('lastSubjectFileSync') || '0', 10);
    const syncIsStale = Date.now() - lastSync > 12 * 60 * 60 * 1000;

    if (hasNoLocalQuestions || syncIsStale) {
        const subjectIds = SUBJECTS.map(function(s) { return s.id; });
        if (window.OfflineDB && typeof window.OfflineDB.syncAllSubjectFiles === 'function') {
            window.OfflineDB.syncAllSubjectFiles(subjectIds).then(function(results) {
                const foundAnySubjectFile = Object.keys(results).some(function(k) { return !!results[k]; });
                if (foundAnySubjectFile || !hasNoLocalQuestions) {
                    storage.set('lastSubjectFileSync', String(Date.now()));
                } else {
                    console.warn('Subject file sync found nothing (offline or files missing) — will retry on next load.');
                }
                if (state.view === 'admin') {
                    loadAllQuestionsForAdmin();
                    loadAllQuestionsCountOffline();
                }
                render();
            });
        } else {
            console.warn('window.OfflineDB.syncAllSubjectFiles is not defined — skipping subject file sync.');
        }
    }

    // Check for expired users on init and periodically
    await checkAndDeactivateExpiredUsers();
    setInterval(function() {
        checkAndDeactivateExpiredUsers();
    }, 5 * 60 * 1000); // Every 5 minutes

    loadAllUsers();
    loadLeaderboard('cbt');
    loadNotifications();
    loadActivationPlans();
    loadFlaggedCount();
    if (state.authUser) cacheAllDataForOffline();

    addLog(state.authUser ? state.authUser.id : null, state.profile.name || 'Guest', 'page_view', 'App opened');
    if (state.authUser) {
        supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', state.authUser.id).then(function() {});
        setInterval(function() {
            if (state.authUser) {
                supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', state.authUser.id).then(function() {});
            }
        }, 2 * 60 * 1000);
    }
    window.addEventListener('online', function() {
        showToast('Back online — syncing data...', '');
        cacheAllDataForOffline();
        checkAndDeactivateExpiredUsers();
    });

    setInterval(function() {
        const examViews = ['cbt-exam', 'exam-exam', 'topic-exam', 'lit-exam', 'mock-exam'];
        if (examViews.indexOf(state.view) !== -1) return;
        loadSettings().then(function(s) {
            state.settingsCache = s;
            render();
        });
    }, 60000);

    // Study reminder tick
    setInterval(checkStudyReminderTick, 60000);
    if (state.authUser) {
        loadStudyReminder();
    }
}

(function () {
    const installBtn = document.getElementById("pwa-install-btn");
    const iosTip = document.getElementById("pwa-ios-tip");
    const iosTipClose = document.getElementById("pwa-ios-tip-close");
    let deferredPrompt = null;

    function isStandalone() {
        return window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;
    }

    if (isStandalone()) {
        return;
    }

    window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.classList.add("show");
    });

    if (installBtn) {
        installBtn.addEventListener("click", async function () {
            if (!deferredPrompt) return;
            installBtn.classList.remove("show");
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            deferredPrompt = null;
        });
    }

    window.addEventListener("appinstalled", function () {
        if (installBtn) installBtn.classList.remove("show");
        if (iosTip) iosTip.classList.remove("show");
        deferredPrompt = null;
    });

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    if (isIOS && isSafari && iosTip) {
        const dismissed = storage.get("pwaIosTipDismissed");
        if (!dismissed) {
            setTimeout(function () { iosTip.classList.add("show"); }, 2500);
        }
    }
    if (iosTipClose) {
        iosTipClose.addEventListener("click", function () {
            iosTip.classList.remove("show");
            storage.set("pwaIosTipDismissed", "true");
        });
    }
})();
