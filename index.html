//  MOCK RESULT
// ============================================================
function renderMockResult() {
    if (state.mockWaitingForResults) {
        return (
            '<div class="card" style="text-align:center;padding:32px">' +
            '<p style="font-size:48px;margin:0 0 16px">⏳</p>' +
            '<h2 class="title">Waiting for Results</h2>' +
            '<p style="font-size:14px;color:var(--muted);margin:0">Your mock has been submitted. Results will be released by the admin.</p>' +
            '<button class="btn btn-green" style="margin-top:20px" data-action="mock-exit">Back to Home</button>' +
            '</div>'
        );
    }

    if (state.mockResultReleased) {
        const score = state.mockScore;
        const maxScore = state.mockTotal || 400;
        const questions = state.mockQuestions || [];
        const answers = state.mockAnswers || [];
        const subjectScores = state.mockSubjectScores || {};
        const submittedAt = state.mockSubmittedAt ? new Date(state.mockSubmittedAt) : null;
        const exam = state.mockExams.find(function(e) { return e.id === state.mockExamId; });

        let subjRows = "";
        Object.keys(subjectScores).forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const sScore = subjectScores[sid] || 0;
            subjRows += (
                '<div class="subj-score">' +
                '<span>' + (subj ? subj.name : sid) + '</span>' +
                '<span style="color:var(--green)">' + sScore + '/100</span>' +
                '</div>'
            );
        });

        let reviewItems = "";
        questions.forEach(function(item, i) {
            const userAns = answers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + item.correct_answer);
            const subj = SUBJECTS.find(function(s) { return s.id === item.subject_id; });
            reviewItems += (
                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="q-text">Q' + (i + 1) + ' (' + (subj ? subj.name : '') + '). ' + esc(item.text) +
                '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '</div>'
            );
        });

        return (
            '<div class="result-card">' +
            '<p style="font-size:16px;font-weight:600;margin:0 0 4px">' + (exam ? esc(exam.title) : 'Mock Exam') +
            '</p>' +
            '<p style="font-size:12px;color:var(--muted);margin:0 0 8px">📅 ' + (exam ? new Date(exam.scheduled_date)
                .toLocaleString() : '') + '</p>' +
            (submittedAt ? '<p style="font-size:12px;color:var(--muted);margin:0 0 8px">⏱️ Submitted: ' + submittedAt
                .toLocaleString() + '</p>' : '') +
            '<div class="score-big">' + score + ' / ' + maxScore + '</div>' +
            '<p style="font-size:13px;color:var(--muted);margin:0 0 12px">' + Math.round((score / maxScore) * 100) +
            '%</p>' +
            '<div style="text-align:left;border-top:1px solid var(--line);padding-top:12px">' +
            subjRows +
            '</div>' +
            '<button class="btn btn-green" style="margin-top:12px" data-action="mock-exit">Back to Home</button>' +
            '<button class="btn btn-outline" style="margin-top:8px" data-action="mock-toggle-review">' +
            (state.mockReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.mockReviewMode ? '<div style="margin-top:16px;text-align:left">' + reviewItems + '</div>' : '') +
            '</div>'
        );
    }

    return renderHome();
}

        displayData.forEach(function(entry, i) {

// ============================================================
//  ADMIN VIEW MODE QUESTIONS
// ============================================================
function renderAdminViewModeQuestions() {
    const type = state.admin.viewModeType;
    const subject = state.admin.viewModeSubject;
    const year = state.admin.viewModeYear;
    const search = state.admin.searchQuery || '';

    let title = 'All Questions';
    if (type === 'cbt') title = 'CBT Mode Questions';
    else if (type === 'exam') title = 'Exam Mode Questions';
    else if (type === 'mock') title = 'Mock Exam Questions';
    else if (type === 'topic') title = 'Topic Practice Questions';
    else if (type === 'literature') title = 'Literature Questions';

    let filtered = state.allQuestions || [];
    if (type === 'literature') {
    filtered = filtered.filter(function(q) { return q.type === 'literature' && q.subject_id === 'LHM'; });
} else if (type === 'cbt') {
    filtered = filtered.filter(function(q) { return q.type === 'cbt' && q.subject_id !== 'lit'; });
} else if (type) {
    filtered = filtered.filter(function(q) { return q.type === type; });
}
    if (subject) filtered = filtered.filter(function(q) { return q.subject_id === subject; });
    if (year) filtered = filtered.filter(function(q) { return q.year === year; });
    if (search) {
        const s = search.toLowerCase();
        filtered = filtered.filter(function(q) {
            return q.text.toLowerCase().includes(s) ||
                (q.subject_name && q.subject_name.toLowerCase().includes(s)) ||
                (q.options && q.options.some(function(o) { return o.toLowerCase().includes(s); }));
        });
    }

    let subjOpts = '<option value="">All subjects</option>';
    SUBJECTS.forEach(function(s) {
        subjOpts += '<option value="' + s.id + '"' + (state.admin.viewModeSubject === s.id ? ' selected' : '') +
            '>' + esc(s.name) + '</option>';
    });

    let rows = "";
    if (filtered.length === 0) {
        rows = '<p style="text-align:center;color:var(--faint);padding:24px 0">No questions found.</p>';
    } else {
        filtered.forEach(function(q) {
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            const isEditing = state.admin.editingQuestionId === q.id;

            if (isEditing) {
                let editOptsHtml = "";
                for (let i = 0; i < 4; i++) {
                    editOptsHtml += (
                        '<div class="opt-row">' +
                        '<input type="radio" name="edit-correct" value="' + i + '"' + (q.correct_answer ===
                            i ? ' checked' : '') +
                        ' data-action="edit-correct" />' +
                        '<input class="field" data-action="edit-opt" data-idx="' + i +
                        '" placeholder="Option ' + (i + 1) + '" value="' + esc(q.options[i] || '') +
                        '" />' +
                        '</div>'
                    );
                }
                rows += (
                    '<div class="edit-form">' +
                    '<p style="font-size:12px;font-weight:600;color:var(--gold);margin-bottom:8px">✏️ Editing Question</p>' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:8px">' + esc(q
                        .text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:8px">' + esc(
                        q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:8px">' +
                    '<button class="btn btn-green" style="flex:1" data-action="save-edit" data-qid="' + q
                    .id + '">Save Changes</button>' +
                    '<button class="btn btn-outline" style="flex:0.5" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'
                );
            } else {
                let optsList = '<ul class="admin-list">';
                q.options.forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN +
                        ';font-weight:600"' : '') + '>' + esc(o) + (oi === q.correct_answer ? ' ✓' :
                        '') + '</li>';
                });
                optsList += '</ul>';
                rows += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id +
                    '">✏️</button>' +
                    '<button class="mini-btn danger" data-action="delete-question" data-qid="' + q.id +
                    '">×</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="q-options">' + optsList + '</div>' +
                    (q.explanation ?
                        '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' +
                        esc(q.explanation) + '</div>' : '') +
                    '<div class="q-meta">' + (subj ? subj.name : q.subject_id) + ' · ' + q.type +
                    (q.year ? ' · ' + q.year : '') + '</div>' +
                    '</div>'
                );
            }
        });
    }
 
    let subjOptions = '<option value="">Select subject</option>';
    let filteredSubjects = type === "literature" ? SUBJECTS.filter(function(s) { return s.id === "lit"; }) :
        type === "cbt" ? SUBJECTS.filter(function(s) { return s.id !== "lit"; }) :
        SUBJECTS;
    filteredSubjects.forEach(function(s) {
        subjOptions += '<option value="' + s.id + '"' + (state.admin.qSubject === s.id ? ' selected' : '') +
            '>' + esc(s.name) + '</option>';
    });

    let yearOptions = '';
    if (type === "exam" || type === "mock") {
        for (let y = 2026; y >= 2010; y--) {
            yearOptions += '<option value="' + y + '">' + y + '</option>';
        }
    }

    let optsHtml = "";
    for (let i = 0; i < 4; i++) {
        optsHtml += (
            '<div class="opt-row">' +
            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ?
                ' checked' : '') + ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i +
                1) + '" value="' + esc(state.admin.qOpts[i]) + '" />' +
            '</div>'
        );
    }

    let addForm = (
        '<div class="card" style="margin-top:16px">' +
        '<p style="font-size:14px;font-weight:600;margin:0 0 12px">➕ Add Question</p>' +
        '<div style="margin-bottom:12px">' +
        '<label class="field-label">Subject</label>' +
        '<select class="field" id="admin-qsubject">' + subjOptions + '</select>' +
        '</div>' +
        (type === "exam" || type === "mock" ?
            '<div style="margin-bottom:12px">' +
            '<label class="field-label">Year</label>' +
            '<select class="field" id="admin-qyear">' + yearOptions + '</select>' +
            '</div>' : '') +
        '<label class="field-label">Question text</label>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:10px" placeholder="Enter question...">' +
        esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +
        optsHtml +
        '<label class="field-label">Explanation (shown after answering)</label>' +
        '<textarea class="field" rows="2" data-action="qform-explanation" style="margin-bottom:10px" placeholder="Explain why this answer is correct...">' +
        esc(state.admin.qExplanation) + '</textarea>' +
        '<button class="btn btn-green" data-action="qform-add-admin" style="margin-top:4px">Save Question</button>' +
        '</div>'
    );

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title">' + title + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
        '<select class="field" style="flex:1;min-width:120px" id="admin-view-subject-filter">' + subjOpts + '</select>' +
        '<input class="search-box" style="flex:2;margin-bottom:0" id="admin-view-search" placeholder="🔍 Search questions..." value="' + esc(
            search) + '" />' +
        '</div>' +
        '<div class="admin-question-list">' + rows + '</div>' +
        addForm
    );
}

function renderAdminSyllabus() {
    let chips = "";
    SUBJECTS.forEach(function(s) {
        const sel = state.admin.syllabusSubject === s.id;
        chips += '<button class="subject-chip' + (sel ? ' selected' : '') +
            '" data-action="admin-select-syllabus-subject" data-subject="' + s.id + '">' + subjectBadge(s) +
            '<span class="sname">' + esc(s.name) + '</span></button>';
    });

    let body = '<p class="section-label">Select a subject</p><div class="subject-grid">' + chips + '</div>';

    if (state.admin.syllabusSubject) {
        if (!state.syllabusLoaded || (state.syllabusData && state.syllabusData.subject_id !== state.admin
                .syllabusSubject)) {
            state.admin.syllabusText = "";
            loadSyllabus(state.admin.syllabusSubject);
        }

        let filePreview = "";
        if (state.syllabusData && state.syllabusData.file_url) {
            const fname = (state.syllabusData.file_name || '').toLowerCase();
            const isImage = /\.(png|jpe?g|gif|webp)$/.test(fname);
            if (isImage) {
                filePreview = '<img src="' + state.syllabusData.file_url +
                    '" style="width:100%;border-radius:12px;margin-bottom:12px;display:block" alt="Current syllabus image" />';
            }
            filePreview += '<a class="btn btn-outline" href="' + state.syllabusData.file_url +
                '" target="_blank" style="margin-bottom:12px">' + (isImage ? 'Open full image' :
                    'Download current file') + '</a>';
        }

        let newFilePreview = "";
        if (state.admin.syllabusFile) {
            const isImage = state.admin.syllabusFile.type && state.admin.syllabusFile.type.startsWith('image/');
            if (isImage) {
                newFilePreview = '<img src="' + state.admin.syllabusFile.dataUrl +
                    '" style="width:100%;border-radius:12px;margin-bottom:12px;display:block" alt="New syllabus image" />';
            }
            newFilePreview += '<p style="font-size:11px;color:var(--muted);margin-bottom:12px">New file: ' +
                esc(state.admin.syllabusFile.name) + '</p>';
        }

        body += (
            '<div class="card">' +
            '<label class="field-label">Syllabus content (text)</label>' +
            '<textarea id="syllabus-text-area" class="field" rows="6" style="margin-bottom:12px" placeholder="Paste or type the syllabus outline...">' +
            esc(state.admin.syllabusText) + '</textarea>' +
            '<label class="field-label">Upload file (PDF, Word, or Image)</label>' +
            '<input id="syllabus-file-input" class="file-input" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp" style="margin-bottom:8px" />' +
            filePreview +
            newFilePreview +
            '<button class="btn btn-green" data-action="admin-save-syllabus">Save syllabus</button>' +
            '</div>'
        );
    }
    return body;
}

// ============================================================
//  EVENT HANDLING
// ============================================================
document.addEventListener('click', function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');

    // SPLASH
    if (action === 'skip-splash') {
        state.phase = 'app';
        render();
        return;
    }

    // DRAWER
    if (action === 'open-drawer') {
        state.drawerOpen = true;
        render();
        return;
    }
    if (action === 'close-drawer') {
        state.drawerOpen = false;
        render();
        return;
    }

    // NAVIGATION
    if (action === 'set-view') {
        setView(el.getAttribute('data-view'));
        return;
    }

    // SUBMIT MODAL
    if (action === 'submit-confirm') {
        if (state.submitModalData && state.submitModalData.onConfirm) {
            state.submitModalData.onConfirm();
        }
        return;
    }
    if (action === 'submit-cancel') {
        if (state.submitModalData && state.submitModalData.onCancel) {
            state.submitModalData.onCancel();
        }
        return;
    }

    // ATTEMPT MODAL
    if (action === 'show-attempted-cbt') {
        const questions = state.cbtQuestions.map(function(q, i) {
            const ans = state.cbtAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                idx: i,
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            mode: 'cbt',
            total: state.cbtQuestions.length,
            answered: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-exam') {
        const questions = state.examQuestions.map(function(q, i) {
            const ans = state.examAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.examQuestions.length,
            answered: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-topic') {
        const questions = state.topicQuestions.map(function(q, i) {
            const ans = state.topicAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.topicQuestions.length,
            answered: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-lit') {
        const questions = state.litQuestions.map(function(q, i) {
            const ans = state.litAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.litQuestions.length,
            answered: state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-mock') {
        const questions = state.mockQuestions.map(function(q, i) {
            const ans = state.mockAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.mockQuestions.length,
            answered: state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'attempt-close') {
        state.showAttemptModal = false;
        state.attemptModalData = null;
        render();
        return;
    }

    if (action === 'goto-attempt-question') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const mode = el.getAttribute('data-mode');
        state.showAttemptModal = false;
        state.attemptModalData = null;
        if (mode === 'cbt') {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
        } else if (mode === 'exam') {
            state.examIndex = idx;
        } else if (mode === 'topic') {
            state.topicIndex = idx;
        } else if (mode === 'lit') {
            state.litIndex = idx;
        } else if (mode === 'mock') {
            state.mockIndex = idx;
            const q = state.mockQuestions[idx];
            if (q) state.mockCurrentSubject = q.subject_id;
        }
        render();
        return;
    }

    // CALCULATOR
    if (action === 'toggle-calculator') {
        if (state.settingsCache.calculatorEnabled !== false) {
            state.showCalculator = !state.showCalculator;
            if (state.showCalculator) {
                state.calcDisplay = "0";
                state.calcExpression = "";
                state.calcJustEvaluated = false;
            }
            render();
        }
        return;
    }
    if (action === 'calc-close') {
        state.showCalculator = false;
        render();
        return;
    }
    if (action === 'prevent-close') return;
    
    if (action === 'calc-number') {
        const val = el.getAttribute('data-value');
        if (state.calcJustEvaluated) {
            state.calcDisplay = val;
            state.calcExpression = val;
            state.calcJustEvaluated = false;
        } else {
            if (state.calcDisplay === "0" && val !== ".") {
                state.calcDisplay = val;
            } else {
                state.calcDisplay += val;
            }
            state.calcExpression += val;
        }
        render();
        return;
    }
    if (action === 'calc-operator') {
        const val = el.getAttribute('data-value');
        const lastChar = state.calcExpression.slice(-1);
        if (['+', '-', '×', '÷'].includes(lastChar)) {
            state.calcExpression = state.calcExpression.slice(0, -1) + val;
            state.calcDisplay = state.calcDisplay.slice(0, -1) + val;
        } else {
            state.calcExpression += val;
            state.calcDisplay += val;
        }
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-equals') {
        try {
            let expr = state.calcExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/');
            const result = Function('"use strict"; return (' + expr + ')')();
            state.calcDisplay = String(result);
            state.calcExpression = String(result);
            state.calcJustEvaluated = true;
        } catch (e) {
            state.calcDisplay = 'Error';
        }
        render();
        return;
    }
    if (action === 'calc-clear') {
        state.calcDisplay = "0";
        state.calcExpression = "";
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-delete') {
        if (state.calcDisplay.length > 1) {
            state.calcDisplay = state.calcDisplay.slice(0, -1);
            state.calcExpression = state.calcExpression.slice(0, -1);
        } else {
            state.calcDisplay = "0";
            state.calcExpression = "";
        }
        render();
        return;
    }

    // AUTH
    if (action === 'show-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'show-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'switch-to-reset') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = true;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'close-auth') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'switch-to-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'switch-to-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'do-login') {
        const email = document.getElementById('login-email')?.value?.trim() || '';
        const password = document.getElementById('login-password')?.value || '';
        state.loginEmail = email;
        state.loginPassword = password;
        if (!email || !password) { state.authError = 'Please enter both email/username and password.';
            render(); return; }
        signIn(email, password);
        return;
    }
    if (action === 'do-signup') {
        const username = document.getElementById('signup-username')?.value?.trim() || '';
        const email = document.getElementById('signup-email')?.value?.trim() || '';
        const password = document.getElementById('signup-password')?.value || '';
        const confirm = document.getElementById('signup-confirm')?.value || '';
        state.signupUsername = username;
        state.signupEmail = email;
        state.signupPassword = password;
        state.signupConfirm = confirm;
        if (!username) { state.authError = 'Please choose a username.';
            render(); return; }
        if (!email) { state.authError = 'Please enter your email address.';
            render(); return; }
        if (password.length < 6) { state.authError = 'Password must be at least 6 characters.';
            render(); return; }
        if (password !== confirm) { state.authError = 'Passwords do not match.';
            render(); return; }
        signUp(username, email, password);
        return;
    }
    if (action === 'do-reset') {
        const email = document.getElementById('reset-email')?.value?.trim() || '';
        state.resetEmail = email;
        if (!email) { state.resetError = 'Please enter your email address.';
            render(); return; }
        sendPasswordReset(email);
        return;
    }
    if (action === 'do-password-reset') {
        const password = document.getElementById('reset-new-password')?.value || '';
        const confirm = document.getElementById('reset-confirm-password')?.value || '';
        state.resetPassword = password;
        state.resetConfirm = confirm;
        
        if (password.length < 6) { state.resetError = 'Password must be at least 6 characters.';
            render(); return; }
        if (password !== confirm) { state.resetError = 'Passwords do not match.';
            render(); return; }
        
        updatePassword(password);
        return;
    }
    if (action === 'toggle-password') {
        const field = el.getAttribute('data-field');
        if (field) {
            state.showPassword[field] = !state.showPassword[field];
            render();
        }
        return;
    }
    if (action === 'sign-out') {
        signOut();
        return;
    }

    // DARK MODE
    if (action === 'toggle-dark-mode') {
        state.darkMode = !state.darkMode;
        storage.set('darkMode', state.darkMode ? 'true' : 'false');
        if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');

        const ct = parseInt(document.getElementById('admin-cbt-time')?.value || 100);
        const st = parseInt(document.getElementById('admin-subject-time')?.value || 25);
        const mt = parseInt(document.getElementById('admin-mock-time')?.value || 100);
        const mq = parseInt(document.getElementById('admin-mock-questions')?.value || 25);
        const calcEnabled = document.getElementById('admin-calc-enabled')?.checked !== false;
        
        state.admin.questionsPerSubject = qs;
        state.admin.cbtTimeLimit = ct;
        state.admin.subjectTimeLimit = st;
        state.admin.mockTimeLimit = mt;
        state.admin.mockQuestionsPerSubject = mq;
        state.admin.calculatorEnabled = calcEnabled;

        const updates = [
            { setting_key: 'cbt_settings', setting_value: { questions_per_subject: qs, time_limit_minutes: ct } },
            { setting_key: 'subject_settings', setting_value: { questions_per_subject: qs, time_limit_minutes: st } },
            { setting_key: 'mock_settings', setting_value: { questions_per_subject: mq, time_limit_minutes: mt,
                    subjects: 4 } },
            { setting_key: 'calculator_enabled', setting_value: calcEnabled },
        ];

        Promise.all(updates.map(function(u) {
            return supabase.from('admin_settings').upsert(u, { onConflict: 'setting_key' });
        })).then(function() {
            state.settingsCache = {
                cbtQuestionsPerSubject: qs,
                cbtTimeLimit: ct,
                subjectQuestionsPerSubject: qs,
                subjectTimeLimit: st,
                mockQuestionsPerSubject: mq,
                mockTimeLimit: mt,
                calculatorEnabled: calcEnabled,
            };
            showToast('Settings saved!', 'success');
            render();
        }).catch(function(err) { 
            console.error('Save settings error:', err);
            showToast('Error saving settings: ' + (err.message || 'unknown'), 'error'); 
        });
        return;
    }

    if (action === 'admin-upload-doc') {
        if (!state.admin.docFile) { showToast('Choose a file first.', 'error'); return; }
        const name = state.admin.docName.trim() || state.admin.docFile.name;
        const subj = state.admin.docSubject || 'general';
        supabase.from('materials').insert([{
            subject_id: subj,
            subject_name: SUBJECTS.find(function(s) { return s.id === subj; })?.name || 'General',
            name: name,
            file_name: state.admin.docFile.name,
            file_url: state.admin.docFile.dataUrl,
            file_type: state.admin.docFile.type,
        }]).then(function() {
            showToast('Document uploaded!', 'success');
            state.admin.docFile = null;
            state.admin.docName = '';
            state.docsLoaded = false;
            render();
        }).catch(function(err) { 
            console.error('Upload doc error:', err);
            showToast('Error uploading document: ' + (err.message || 'unknown'), 'error'); 
        });
        return;
    }

    if (action === 'admin-delete-doc') {
        const docId = el.getAttribute('data-docid');
        if (!confirm('Delete this document?')) return;
        supabase.from('materials').delete().eq('id', docId).then(function() {
            showToast('Document deleted.', 'success');
            state.docsLoaded = false;
            render();
        }).catch(function(err) { 
            console.error('Delete doc error:', err);
            showToast('Error deleting document.', 'error'); 
        });
        return;
    }

    if (action === 'admin-select-syllabus-subject') {
        const id = el.getAttribute('data-subject');
        state.admin.syllabusSubject = state.admin.syllabusSubject === id ? null : id;
        state.admin.syllabusFile = null;
        state.syllabusLoaded = false;
        state.syllabusData = null;
        state.admin.syllabusText = '';
        render();
        return;
    }

    if (action === 'admin-save-syllabus') {
        const subj = state.admin.syllabusSubject;
        if (!subj) { showToast('Select a subject first.', 'error'); return; }
        const text = state.admin.syllabusText || '';
        loadSyllabus(subj).then(function() {
            const existing = state.syllabusData;
            const data = {
                subject_id: subj,
                content: text,
                file_url: state.admin.syllabusFile ? state.admin.syllabusFile.dataUrl : (existing?.file_url ||
                    null),
                file_name: state.admin.syllabusFile ? state.admin.syllabusFile.name : (existing?.file_name ||
                    null),
            };
            if (existing) {
                supabase.from('syllabus').update(data).eq('id', existing.id).then(function() {
                    showToast('Syllabus updated!', 'success');
                    state.admin.syllabusFile = null;
                    state.syllabusLoaded = false;
                    state.syllabusData = null;
                    render();
                }).catch(function(err) { 
                    console.error('Update syllabus error:', err);
                    showToast('Error saving syllabus.', 'error'); 
                });
            } else {
                supabase.from('syllabus').insert([data]).then(function() {
                    showToast('Syllabus saved!', 'success');
                    state.admin.syllabusFile = null;
                    state.syllabusLoaded = false;
                    state.syllabusData = null;
                    render();
                }).catch(function(err) { 
                    console.error('Save syllabus error:', err);
                    showToast('Error saving syllabus.', 'error'); 
                });
            }
        });
        return;
    }

    if (action === 'admin-schedule-mock') {
        const title = document.getElementById('admin-mock-title')?.value?.trim() || '';
        const scheduled = document.getElementById('admin-mock-scheduled')?.value || '';
        const regDeadline = document.getElementById('admin-mock-reg-deadline')?.value || '';
        const endDate = document.getElementById('admin-mock-end')?.value || '';
        const qs = parseInt(document.getElementById('admin-mock-qs')?.value || 25);

        if (!title) { showToast('Enter a title.', 'error'); return; }
        if (!scheduled) { showToast('Select a scheduled date.', 'error'); return; }

        let regDeadlineFinal = regDeadline;
        if (!regDeadlineFinal) {
            const date = new Date(scheduled);
            date.setHours(date.getHours() - 1);
            regDeadlineFinal = date.toISOString().slice(0, 16);
        }

        let endDateFinal = endDate;
        if (!endDateFinal) {
            const date = new Date(scheduled);
            date.setHours(date.getHours() + 12);
            endDateFinal = date.toISOString().slice(0, 16);
        }

        supabase.from('mock_exams').insert([{
            title: title,
            scheduled_date: new Date(scheduled).toISOString(),
            registration_deadline: new Date(regDeadlineFinal).toISOString(),
            end_date: new Date(endDateFinal).toISOString(),
            is_active: true,
            results_released: false,
        }]).then(function() {
            showToast('Mock exam scheduled!', 'success');
            state.admin.mockTitle = '';
            state.admin.mockScheduledDate = '';
            state.admin.mockRegistrationDeadline = '';
            state.admin.mockEndDate = '';
            state.admin.mockQuestionsPerSubject = qs;
            loadMockExams();
            render();
        }).catch(function(e) { 
            console.error('Schedule mock error:', e);
            showToast('Error scheduling mock: ' + (e.message || 'unknown'), 'error'); 
        });
        return;
    }

    if (action === 'admin-release-results') {
        const examId = el.getAttribute('data-examid');
        if (!confirm('Release results for this mock exam?')) return;
        supabase.from('mock_exams').update({ results_released: true }).eq('id', examId).then(function() {
            showToast('Results released!', 'success');
            loadMockExams();
            render();
        }).catch(function(err) { 
            console.error('Release results error:', err);
            showToast('Error releasing results.', 'error'); 
        });
        return;
    }

    if (action === 'admin-delete-mock') {
        const examId = el.getAttribute('data-examid');
        if (!confirm('Delete this mock exam and all associated data?')) return;
        supabase.from('mock_registrations').delete().eq('mock_exam_id', examId).then(function() {
            return supabase.from('mock_attempts').delete().eq('mock_exam_id', examId);
        }).then(function() {
            return supabase.from('mock_exams').delete().eq('id', examId);
        }).then(function() {
            showToast('Mock exam deleted.', 'success');
            loadMockExams();
            render();
        }).catch(function(err) { 
            console.error('Delete mock error:', err);
            showToast('Error deleting mock.', 'error'); 
        });
        return;
    }

    if (action === 'admin-send-notification') {
        const title = document.getElementById('admin-notif-title')?.value?.trim() || '';
        const body = document.getElementById('admin-notif-body')?.value?.trim() || '';
        const imageData = state.admin.notifImageData || null;

        if (!title || !body) { showToast('Fill in both title and body.', 'error'); return; }

        const insertData = { title: title, body: body };
        if (imageData) insertData.image_url = imageData;

        supabase.from('notifications').insert([insertData]).then(function() {
            showToast('Notification sent!', 'success');
            document.getElementById('admin-notif-title').value = '';
            document.getElementById('admin-notif-body').value = '';
            state.admin.notifImage = null;
            state.admin.notifImageData = null;
            state.notifsLoaded = false;
            loadNotifications();
        }).catch(function(err) { 
            console.error('Send notification error:', err);
            showToast('Error sending notification.', 'error'); 
        });
        return;
    }

    if (action === 'admin-delete-notification') {
        const id = el.getAttribute('data-id');
        if (!confirm('Delete this notification?')) return;
        supabase.from('notifications').delete().eq('id', id).then(function() {
            showToast('Notification deleted.', 'success');
            state.notifsLoaded = false;
            loadNotifications();
        }).catch(function(err) { 
            console.error('Delete notification error:', err);
            showToast('Error deleting notification.', 'error'); 
        });
        return;
    }

    if (action === 'admin-add-plan') {
        adminAddPlan();
        return;
    }

    if (action === 'admin-delete-plan') {
        const planId = el.getAttribute('data-planid');
        adminDeletePlan(planId);
        return;
    }

    if (action === 'admin-activate-plan') {
        const userId = el.getAttribute('data-userid');
        const planId = el.value;
        adminActivateUserPlan(userId, planId);
        return;
    }

    if (action === 'admin-activate-user') {
        const userId = el.getAttribute('data-userid');
        const plan = prompt('Enter plan ID (leave empty for no plan):');
        if (plan !== null) {
            adminActivateUserPlan(userId, plan);
        }
        return;
    }

    if (action === 'admin-deactivate-user') {
        const userId = el.getAttribute('data-userid');
        adminDeactivateUser(userId);
        return;
    }

    // ACTIVATE
    if (action === 'activate-submit') {
        state.activateStatus = state.activateCode.trim() ? 'pending' : 'empty';
        render();
        return;
    }

    // NOTIFICATION IMAGE UPLOAD
    if (action === 'notif-image-upload') {
        document.getElementById('admin-notif-image')?.click();
        return;
    }

    if (action === 'notif-remove-image') {
        state.admin.notifImage = null;
        state.admin.notifImageData = null;
        render();
        return;
    }
});

// ============================================================
//  INPUT EVENT HANDLING
// ============================================================
document.addEventListener('change', function(e) {
    const id = e.target.id;

    if (id === 'exam-year-select') {
        state.examYear = parseInt(e.target.value, 10);
    } else if (id === 'doc-subject-select') {
        state.admin.docSubject = e.target.value || '';
    } else if (id === 'doc-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.docFile = { name: file.name, type: file.type, size: file.size, dataUrl: ev.target.result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'syllabus-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.syllabusFile = { name: file.name, type: file.type, size: file.size, dataUrl: ev.target
                    .result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-qsubject') {
        state.admin.qSubject = e.target.value || '';
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'admin-qyear') {
        state.admin.examYear = parseInt(e.target.value, 10) || 2026;
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'subject-lb-select') {
        state.subjectLeaderboardSubject = e.target.value || null;
        loadSubjectLeaderboard(state.subjectLeaderboardSubject);
        render();
    } else if (e.target.getAttribute && e.target.getAttribute('data-action') === 'qform-correct') {
        state.admin.qCorrect = parseInt(e.target.value, 10);
    } else if (id === 'admin-notif-image') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.notifImageData = ev.target.result;
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-view-subject-filter') {
        state.admin.viewModeSubject = e.target.value || '';
        render();
    }
});

document.addEventListener('input', function(e) {
    const id = e.target.id;
    const action = e.target.getAttribute && e.target.getAttribute('data-action');

    if (id === 'activate-code-input') state.activateCode = e.target.value;
    else if (id === 'doc-name-input') state.admin.docName = e.target.value;
    else if (id === 'syllabus-text-area') state.admin.syllabusText = e.target.value;
    else if (id === 'admin-mock-title') state.admin.mockTitle = e.target.value;
    else if (id === 'admin-mock-scheduled') state.admin.mockScheduledDate = e.target.value;
    else if (id === 'admin-mock-reg-deadline') state.admin.mockRegistrationDeadline = e.target.value;
    else if (id === 'admin-mock-end') state.admin.mockEndDate = e.target.value;
    else if (id === 'admin-mock-qs') state.admin.mockQuestionsPerSubject = parseInt(e.target.value) || 25;
    else if (id === 'login-email') state.loginEmail = e.target.value;
    else if (id === 'login-password') state.loginPassword = e.target.value;
    else if (id === 'signup-username') state.signupUsername = e.target.value;
    else if (id === 'signup-email') state.signupEmail = e.target.value;
    else if (id === 'signup-password') state.signupPassword = e.target.value;
    else if (id === 'signup-confirm') state.signupConfirm = e.target.value;
    else if (id === 'reset-email') state.resetEmail = e.target.value;
    else if (id === 'reset-new-password') state.resetPassword = e.target.value;
    else if (id === 'reset-confirm-password') state.resetConfirm = e.target.value;
    else if (id === 'admin-view-search') {
        state.admin.searchQuery = e.target.value;
        render();
    } else if (action === 'qform-text') state.admin.qText = e.target.value;
    else if (action === 'qform-explanation') state.admin.qExplanation = e.target.value;
    else if (action === 'qform-opt') {
        const idx = parseInt(e.target.getAttribute('data-idx'), 10);
        state.admin.qOpts[idx] = e.target.value;
    }
});

// ============================================================
//  INIT
// ============================================================
async function init() {
    const darkPref = storage.get('darkMode');
    if (darkPref === 'true') {
        state.darkMode = true;
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    await loadSettings();
    await checkAuthSession();
    await loadAllUsers();
    await loadAllQuestionsCount();
    await loadLeaderboard('cbt');
    await loadNotifications();
    await loadActivationPlans();

    render();

    setTimeout(function() {
        if (state.phase === 'splash') {
            state.phase = 'app';
            render();
        }
    }, 5000);
}

init();
</script>
</body>
</html>
