                        '</div>'
                    );
                }
            } else if (isTime) {
                const end = new Date(exam.end_date);
                if (end > now) {
                    html += (
                        '<div class="mock-card active">' +
                        '<p class="mock-title">' + esc(exam.title) + '</p>' +
                        '<p class="mock-date">⏱️ Ends: ' + end.toLocaleString() + '</p>' +
                        '<span class="mock-status ongoing">🟢 Ongoing</span>' +
                        '<p style="font-size:13px;color:var(--muted);margin-top:8px">Subjects: ' +
                        userReg.subjects.map(function(s) {
                            const subj = SUBJECTS.find(function(x) { return x.id === s; });

                        }).join(', ') +

                        exam.id + '">Start Mock Exam</button>' +
                        '</div>'
                    );
                } else {
                    html += (
                        '<div class="mock-card">' +
                        '<p class="mock-title">' + esc(exam.title) + '</p>' +
                        '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                        '<span class="mock-status ended">⏰ Expired</span>' +
                        '<p style="font-size:13px;color:var(--muted);margin-top:8px">This mock has ended.</p>' +
                        '</div>'
                    );
                }
            } else {
                const timeLeft = scheduled - now;
                const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                const mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                html += (
                    '<div class="mock-card active">' +
                    '<p class="mock-title">' + esc(exam.title) + '</p>' +
                    '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                    '<span class="mock-status registered">✅ Registered</span>' +
                    '<p style="font-size:13px;color:var(--muted);margin-top:8px">Starts in: <b>' + hours +
                    'h ' + mins + 'm</b></p>' +
                    '<p style="font-size:12px;color:var(--muted)">Subjects: ' +
                    userReg.subjects.map(function(s) {
                        const subj = SUBJECTS.find(function(x) { return x.id === s; });
                        return subj ? subj.name : s;
                    }).join(', ') +
                    '</p>' +
                    '</div>'
                );
            }
        }
    }

    if (upcomingExams.length > 0 || activeExams.length > 0) {
        const allDisplay = [...activeExams, ...upcomingExams];
        allDisplay.forEach(function(exam) {
            const isRegistered = state.mockRegistrations.some(function(r) {
                return r.mock_exam_id === exam.id && r.user_id === state.authUser?.id;
            });

            if (isRegistered) return;

            const scheduled = new Date(exam.scheduled_date);
            const isPastRegistration = scheduled <= now;

            const regDeadline = exam.registration_deadline ? new Date(exam.registration_deadline) : scheduled;
            const isRegClosed = regDeadline <= now;

            if (isRegClosed || isPastRegistration) {
                html += (
                    '<div class="mock-card">' +
                    '<p class="mock-title">' + esc(exam.title) + '</p>' +
                    '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                    '<span class="mock-status ended">🔒 Registration Closed</span>' +
                    '</div>'
                );
                return;
            }

            html += renderMockRegistrationForm(exam);
        });
    }

    if (pastExams.length > 0) {
        html += '<p class="section-label" style="margin-top:20px">Past Mocks</p>';
        pastExams.forEach(function(exam) {
            const attempt = state.mockAttempts.find(function(a) {
                return a.mock_exam_id === exam.id && a.user_id === state.authUser?.id && a.is_submitted;
            });

            let statusText = 'Ended';
            if (attempt && exam.results_released) statusText = 'Results Available';
            else if (attempt) statusText = 'Submitted';

            html += (
                '<div class="mock-card">' +
                '<p class="mock-title">' + esc(exam.title) + '</p>' +
                '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                '<span class="mock-status ended">' + statusText + '</span>' +
                (attempt && exam.results_released ?
                    '<button class="btn btn-outline" style="margin-top:8px" data-action="view-mock-result" data-examid="' +
                    exam.id + '">View Results</button>' : '') +
                '</div>'
            );
        });
    }

    return html;
}

function renderMockRegistrationForm(exam) {
    const selected = state.mockSelectedSubjects || [];
    const subjects = SUBJECTS.filter(function(s) { return !s.compulsory; });
    const settings = state.settingsCache;
    const requiredSubjects = settings.mockSubjectCount || 4;

    let chips = "";
    subjects.forEach(function(s) {
        const sel = selected.indexOf(s.id) !== -1;
        chips += (
            '<button class="subject-chip' + (sel ? ' selected' : '') + '" data-action="toggle-mock-subject" data-subject="' +
            s.id + '">' +
            subjectBadge(s) +
            '<span class="sname">' + esc(s.name) + '</span>' +
            '</button>'
        );
    });

    const ready = selected.length === requiredSubjects;

    return (
        '<div class="mock-card active">' +
        '<p class="mock-title">' + esc(exam.title) + '</p>' +
        '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
        '<p class="mock-date">⏰ Register by: ' + (exam.registration_deadline ? new Date(exam.registration_deadline)
            .toLocaleString() : '1 hour before') + '</p>' +
        '<span class="mock-status upcoming">📝 Register</span>' +
        '<p style="font-size:13px;color:var(--muted);margin-top:8px">Select ' + requiredSubjects + ' subjects to register:</p>' +
        '<div class="subject-grid" style="margin-top:8px">' + chips + '</div>' +
        '<div class="picker-footer">' +
        '<p class="picker-count">' + selected.length + ' of ' + requiredSubjects + ' selected</p>' +
        '<button class="btn ' + (ready ? "btn-green" : "btn-outline") + '" data-action="register-mock" data-examid="' +
        exam.id + '"' + (ready ? '' :
            ' disabled style="opacity:0.5;pointer-events:none"') + '>Register for Mock</button>' +
        '</div>' +
        '</div>'
    );
}

function renderMockAttemptsView() {
    const examId = state.admin.viewingMockAttempts;
    const exam = state.mockExams.find(function(e) { return e.id === examId; });
    
    if (!exam) {
        state.admin.viewingMockAttempts = null;
        render();
        return '';
    }

    let rows = '';
    const attempts = state.mockAttempts.filter(function(a) { return a.mock_exam_id === examId && a.is_submitted; });
    
    if (attempts.length === 0) {
        rows = '<p style="text-align:center;color:var(--faint);padding:20px 0">No submitted attempts for this mock yet.</p>';

        attempts.forEach(function(attempt) {
            const user = state.allUsers.find(function(u) { return u.id === attempt.user_id; });
            const username = user ? user.username : 'Unknown User';
            const score = attempt.score || 0;
            const maxScore = attempt.total_questions ? attempt.total_questions * 4 : 400;
            const subjectScores = attempt.subject_scores || {};
            let subjectStr = Object.keys(subjectScores).map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });

        rows
    );
}

// ============================================================
//  MOCK EXAM - Subject-based with tabs
// ============================================================
function renderMockExam() {
    if (!state.mockQuestions || state.mockQuestions.length === 0) return renderHome();

    const totalQ = state.mockQuestions.length;
    const answeredCount = state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;
   
    // Subject tabs
    let subjectTabs = '';
    state.mockSubjectOrder.forEach(function(sid) {
        const subj = SUBJECTS.find(function(s) { return s.id === sid; });
        const isActive = state.mockCurrentSubject === sid;
        const questionsInSubject = getQuestionsForSubject(sid, state.mockSubjectQuestions);
        const answeredInSubject = questionsInSubject.filter(function(idx) {
            return state.mockAnswers[idx] !== null && state.mockAnswers[idx] !== undefined;
        }).length;
        const totalInSubject = questionsInSubject.length;
        const allDone = answeredInSubject === totalInSubject;
        subjectTabs += (
            '<button class="subject-tab' + (isActive ? ' active' : '') + '" data-action="switch-mock-subject" data-subject="' +
            sid + '">' +
            (subj ? subj.code : sid) +
            ' <span class="check-mark' + (allDone ? ' done' : '') + '">' + (allDone ? '✓' : answeredInSubject + '/' + totalInSubject) +
            '</span>' +
            '</button>'
        );
    });

    // Get current question index for this subject
    const currentSubjectQuestions = getQuestionsForSubject(state.mockCurrentSubject, state.mockSubjectQuestions);
    const currentSubjectIndex = currentSubjectQuestions.indexOf(state.mockIndex);
    const totalInCurrentSubject = currentSubjectQuestions.length;
    
    if (currentSubjectQuestions.length === 0) {
        for (const sid of state.mockSubjectOrder) {
            const qs = getQuestionsForSubject(sid, state.mockSubjectQuestions);
            if (qs.length > 0) {
                state.mockCurrentSubject = sid;
                state.mockIndex = qs[0];
                break;
            }
        }
        render();
        return '';
    }
    
    if (currentSubjectIndex === -1 || currentSubjectIndex >= currentSubjectQuestions.length) {
        state.mockIndex = currentSubjectQuestions[0] || 0;
        render();
        return '';
    }

    const item = state.mockQuestions[state.mockIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            const chosen = state.mockAnswers[state.mockIndex] === i;
            opts += (
                '<button class="qa-option' + (chosen ? ' selected' : '') + '" data-action="mock-answer" data-idx="' +
                i + '">' +
                '<span class="qa-letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span>' +
                '</button>'
            );
        });
    }

    const hasPrev = currentSubjectIndex > 0;
    const hasNext = currentSubjectIndex < totalInCurrentSubject - 1;
    const prevIdx = hasPrev ? currentSubjectQuestions[currentSubjectIndex - 1] : null;
    const nextIdx = hasNext ? currentSubjectQuestions[currentSubjectIndex + 1] : null;

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
        '<button class="back-link" data-action="mock-exit" style="margin:0">' + svg("chevleft", 16) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" title="Calculator">' + svg("calculator", 18) + '</button>' :
            '<button class="calc-btn" data-action="toggle-calculator" title="Calculator disabled" style="opacity:0.3;cursor:not-allowed">' + svg("calculator", 18) + '</button>'
        ) +
        '</div>' +
        '<div class="right-group">' +
        '<button class="attempt-btn" data-action="show-attempted-mock">' +
        '📋 <span style="font-weight:600">' + answeredCount + '/' + totalQ + '</span>' +
        '<span class="dot-indicator"></span>' +
        '</button>' +
        '<button class="submit-btn" data-action="mock-submit">Submit</button>' +
        '</div>' +
        '</div>' +
        '<div class="timer-bar">' +
        '<span class="label">⏱️ Time left</span>' +
        '<span class="time' + (state.mockTimeLeft < 300 ? ' warning' : '') + '">' +
        formatTime(state.mockTimeLeft) +
        '</span>' +
        '</div>' +
        '<div class="subject-tabs">' + subjectTabs + '</div>' +
        '<div class="exam-nav">' +
        '<span class="q-counter">Question ' + (currentSubjectIndex + 1) + ' of ' + totalInCurrentSubject + ' in ' + (subj ? subj.name : '') + '</span>' +
        '</div>' +
        '<div class="card" style="margin-bottom:16px"><p style="font-size:15px;font-weight:600;margin:0">' + esc(item
            ?.text || '') + '</p></div>' +
        opts +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">' +
        (hasPrev ? '<button class="btn btn-outline" style="flex:1" data-action="mock-goto" data-idx="' + prevIdx + '">Previous</button>' : '') +
        (hasNext ? '<button class="btn btn-green" style="flex:1" data-action="mock-goto" data-idx="' + nextIdx + '">Next</button>' : '') +
        '</div>'
    );
}

// ============================================================
//  MOCK RESULT
// ============================================================
function renderMockResult() {
    if (state.mockWaitingForResults) {
        return (
            '<div class="card" style="text-align:center;padding:32px">' +
            '<p style="font-size:48px;margin:0 0 16px">⏳</p>' +
            '<h2 class="title">Waiting for Results</h2>' +
            '<p style="font-size:14px;color:var(--muted);margin:0">Your mock has been submitted. Results will be released by the admin.</p>' +
            '<button class="btn btn-green" style="margin-top:20px" data-action="mock-exit">Back to Home</button>' +
            '</div>'
        );
    }

    if (state.mockResultReleased) {
        const score = state.mockScore;
        const maxScore = state.mockTotal || 400;
        const questions = state.mockQuestions || [];
        const answers = state.mockAnswers || [];
        const subjectScores = state.mockSubjectScores || {};
        const submittedAt = state.mockSubmittedAt ? new Date(state.mockSubmittedAt) : null;
        const exam = state.mockExams.find(function(e) { return e.id === state.mockExamId; });

        let subjRows = "";
        Object.keys(subjectScores).forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const sScore = subjectScores[sid] || 0;
            subjRows += (
                '<div class="subj-score">' +
                '<span>' + (subj ? subj.name : sid) + '</span>' +
                '<span style="color:var(--green)">' + sScore + '/100</span>' +
                '</div>'
            );
        });

        let reviewItems = "";
        questions.forEach(function(item, i) {
            const userAns = answers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + item.correct_answer);
            const subj = SUBJECTS.find(function(s) { return s.id === item.subject_id; });
            reviewItems += (
                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="q-text">Q' + (i + 1) + ' (' + (subj ? subj.name : '') + '). ' + esc(item.text) +
                '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="mock">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<div class="result-card">' +
            '<p style="font-size:16px;font-weight:600;margin:0 0 4px">' + (exam ? esc(exam.title) : 'Mock Exam') +
            '</p>' +
            '<p style="font-size:12px;color:var(--muted);margin:0 0 8px">📅 ' + (exam ? new Date(exam.scheduled_date)
                .toLocaleString() : '') + '</p>' +
            (submittedAt ? '<p style="font-size:12px;color:var(--muted);margin:0 0 8px">⏱️ Submitted: ' + submittedAt
                .toLocaleString() + '</p>' : '') +
            '<div class="score-big">' + score + ' / ' + maxScore + '</div>' +
            '<p style="font-size:13px;color:var(--muted);margin:0 0 12px">' + Math.round((score / maxScore) * 100) +
            '%</p>' +
            '<div style="text-align:left;border-top:1px solid var(--line);padding-top:12px">' +
            subjRows +
            '</div>' +
            '<button class="btn btn-green" style="margin-top:12px" data-action="mock-exit">Back to Home</button>' +
            '<button class="btn btn-outline" style="margin-top:8px" data-action="mock-toggle-review">' +
            (state.mockReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.mockReviewMode ? '<div style="margin-top:16px;text-align:left">' + reviewItems + '</div>' : '') +
            '</div>'
        );
    }

    return renderHome();
}

// ============================================================
function renderLeaderboard() {
    const tabs = [
        { key: "cbt", label: "CBT" },
        { key: "subject", label: "Subject" },
        { key: "mock", label: "Mock" },
    ];

    let tabHtml = "";
    tabs.forEach(function(t) {
        tabHtml += '<button class="leaderboard-tab' + (state.leaderboardTab === t.key ? ' active' : '') +
            '" data-action="lb-tab" data-tab="' + t.key + '">' + esc(t.label) + '</button>';
    });

    let subjectSelector = "";
    if (state.leaderboardTab === "subject") {
        let subjOpts = '<option value="">Select subject</option>';
        SUBJECTS.forEach(function(s) {
            subjOpts += '<option value="' + s.id + '"' + (state.subjectLeaderboardSubject === s.id ?
                ' selected' : '') + '>' + esc(s.name) + '</option>';
        });
        subjectSelector = (
            '<div style="margin-bottom:12px">' +
            '<select class="field" id="subject-lb-select">' + subjOpts + '</select>' +
            '</div>'
        );
    }

    if (state.loadingLeaderboard) {
        return (
            '<h2 class="title" style="margin-bottom:4px">🏆 Leaderboard</h2>' +
            '<p class="sub" style="margin-bottom:12px">See how you rank against other students</p>' +
            '<div class="leaderboard-tabs">' + tabHtml + '</div>' +
            subjectSelector +
            '<div class="loading-spinner"><div class="spinner"></div><p>Loading leaderboard...</p></div>'
        );
    }

    let displayData = state.leaderboardTab === "subject" ? state.subjectLeaderboardData : state.leaderboardData;

    let rows = "";
    if (displayData.length === 0) {
        rows = '<div class="lb-empty">No scores yet. Complete a test to appear on the leaderboard!</div>';
    } else {
        displayData.forEach(function(entry, i) {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
            const isCurrentUser = entry.user_id === state.profile.id;
            rows += (
                '<div class="lb-row" style="' + (isCurrentUser ? 'border-color:var(--gold);' : '') + '">' +
                '<div class="left">' +
                '<span class="rank">' + medal + '</span>' +
                '<span>' + esc(entry.username) + (isCurrentUser ? ' (you)' : '') + '</span>' +
                '</div>' +
                '<span class="score">' + entry.score + '</span>' +
                '</div>'
            );
        });
    }

    return (
        '<h2 class="title" style="margin-bottom:4px">🏆 Leaderboard</h2>' +
        '<p class="sub" style="margin-bottom:12px">See how you rank against other students</p>' +
        '<div class="leaderboard-tabs">' + tabHtml + '</div>' +
        subjectSelector +
        '<div style="margin-bottom:12px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">' +
        '<span>Rank</span><span>User</span><span>Score</span>' +
        '</div>' +
        rows +
        '<button class="btn btn-outline" style="margin-top:16px" data-action="refresh-leaderboard">🔄 Refresh</button>'
    );
}

// ============================================================
//  NOTIFICATIONS
// ============================================================
function renderNotifications() {
    if (!state.notifsLoaded) {
        loadNotifications();
        return (
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
            '<h2 class="title" style="margin:0">Notifications</h2>' +
            '</div>' +
            '<div class="loading-spinner"><div class="spinner"></div><p>Loading notifications...</p></div>'
        );
    }

    let items = "";
    if (state.notifs.length === 0) {
        items = '<p style="text-align:center;color:var(--faint);padding:32px 0">No notifications yet.</p>';
    } else {
        state.notifs.forEach(function(n) {
            let fileHtml = '';
            if (n.image_url) {
                fileHtml = renderFileActions(n.image_url, 'notification-image', 'image/');
            }
            items += (
                '<div class="notif-item' + (n.unread ? ' unread' : '') + '" data-action="mark-notif-read" data-id="' +
                n.id + '">' +
                '<div class="row"><p class="t">' + esc(n.title) + '</p>' + (n.unread ?
                    '<span class="ball"></span>' : '') + '</div>' +
                '<p class="b">' + esc(n.body) + '</p>' +
                (fileHtml ? '<div style="margin-top:8px">' + fileHtml + '</div>' : '') +
                '<p class="time">' + esc(n.time) + '</p>' +
                '</div>'
            );
        });
    }

    const hasUnread = state.notifs.some(function(n) { return n.unread; });

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
        '<h2 class="title" style="margin:0">Notifications</h2>' +
        (hasUnread ? '<button data-action="mark-all-notifs-read" style="font-size:12px;color:var(--muted);text-decoration:underline">Mark all read</button>' :
            '') +
        '</div>' +
        items
    );

// ============================================================
function renderAdminViewModeQuestions() {
    const type = state.admin.viewModeType;
    const subject = state.admin.viewModeSubject;
    const year = state.admin.viewModeYear;
    const search = state.admin.searchQuery || '';

    let title = 'All Questions';
    if (type === 'cbt') title = 'CBT Mode Questions';
    else if (type === 'exam') title = 'Exam Mode Questions';
    else if (type === 'mock') title = 'Mock Exam Questions';
    else if (type === 'topic') title = 'Topic Practice Questions';
    else if (type === 'literature') title = 'Novel (CBT) Questions';

    let filtered = state.allQuestions || [];
    if (type === 'literature') {
    filtered = filtered.filter(function(q) { return q.type === 'literature' && q.subject_id === 'LHM'; });
} else if (type === 'cbt') {
    filtered = filtered.filter(function(q) { return q.type === 'cbt' && q.subject_id !== 'lit'; });
} else if (type) {
    filtered = filtered.filter(function(q) { return q.type === type; });
}
    if (subject) filtered = filtered.filter(function(q) { return q.subject_id === subject; });
    if (year) filtered = filtered.filter(function(q) { return q.year === year; });
    if (search) {
        const s = search.toLowerCase();
        filtered = filtered.filter(function(q) {
            return q.text.toLowerCase().includes(s) ||
                (q.subject_name && q.subject_name.toLowerCase().includes(s)) ||
                (q.options && q.options.some(function(o) { return o.toLowerCase().includes(s); }));
        });
    }

    let subjOpts = '<option value="">All subjects</option>';
    SUBJECTS.forEach(function(s) {
        subjOpts += '<option value="' + s.id + '"' + (state.admin.viewModeSubject === s.id ? ' selected' : '') +
            '>' + esc(s.name) + '</option>';
    });

    let rows = "";
    if (filtered.length === 0) {
        rows = '<p style="text-align:center;color:var(--faint);padding:24px 0">No questions found.</p>';
    } else {
        filtered.forEach(function(q) {
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            const isEditing = state.admin.editingQuestionId === q.id;

            if (isEditing) {
                let editOptsHtml = "";
                for (let i = 0; i < 4; i++) {
                    editOptsHtml += (

                            i ? ' checked' : '') +

                        '<input class="field" data-action="edit-opt" data-idx="' + i +
                        '" placeholder="Option ' + (i + 1) + '" value="' + esc(q.options[i] || '') +
                        '" />' +
                        '</div>'
                    );
                }
                rows += (
                    '<div class="edit-form">' +
                    '<p style="font-size:12px;font-weight:600;color:var(--gold);margin-bottom:8px">✏️ Editing Question</p>' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:8px">' + esc(q
                        .text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:8px">' + esc(
                        q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:8px">' +
                    '<button class="btn btn-green" style="flex:1" data-action="save-edit" data-qid="' + q
                    .id + '">Save Changes</button>' +
                    '<button class="btn btn-outline" style="flex:0.5" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'
                );
            } else {
                let optsList = '<ul class="admin-list">';
                q.options.forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN +
                        ';font-weight:600"' : '') + '>' + esc(o) + (oi === q.correct_answer ? ' ✓' :
                        '') + '</li>';
                });
                optsList += '</ul>';
                rows += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id +
                    '">✏️</button>' +
                    '<button class="mini-btn danger" data-action="delete-question" data-qid="' + q.id +
                    '">×</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="q-options">' + optsList + '</div>' +
                    (q.explanation ?
                        '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' +
                        esc(q.explanation) + '</div>' : '') +
                    '<div class="q-meta">' + (subj ? subj.name : q.subject_id) + ' · ' + q.type +
                    (q.year ? ' · ' + q.year : '') + '</div>' +
                    '</div>'
                );
            }
        });
    }
 
    let subjOptions = '<option value="">Select subject</option>';
    let filteredSubjects = type === "literature" ? SUBJECTS.filter(function(s) { return s.id === "lit"; }) :
        type === "cbt" ? SUBJECTS.filter(function(s) { return s.id !== "lit"; }) :
        SUBJECTS;
    filteredSubjects.forEach(function(s) {
        subjOptions += '<option value="' + s.id + '"' + (state.admin.qSubject === s.id ? ' selected' : '') +
            '>' + esc(s.name) + '</option>';

        optsHtml += (
            '<div class="opt-row">' +
            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ?
                ' checked' : '') + ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i +
                1) + '" value="' + esc(state.admin.qOpts[i]) + '" />' +
            '</div>'

        (type === "exam" || type === "mock" ?

            '</div>' : '') +
        '<label class="field-label">Question text</label>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:10px" placeholder="Enter question...">' +
        esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +

        '<label class="field-label">Explanation (shown after answering)</label>' +

        esc(state.admin.qExplanation) + '</textarea>' +
        '<button class="btn btn-green" data-action="qform-add-admin" style="margin-top:4px">Save Question</button>' +
        '</div>'
    );

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title">' + title + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +

// ============================================================
//  ADMIN FLAGGED
// ============================================================
function renderAdminFlagged() {
    if (state.adminLoading) {
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }

    // We'll fetch flagged questions on demand
    if (!state.admin.viewModeQuestions) {
        state.adminLoading = true;
        render();
        
        loadFlaggedQuestions(state.admin.flaggedFilter || 'unresolved').then(function(data) {
            state.admin.flaggedData = data || [];
            state.adminLoading = false;
            render();
        });
        
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }

    const data = state.admin.flaggedData || [];
    const filter = state.admin.flaggedFilter || 'unresolved';
    
    // Group by question_id
    const grouped = {};
    data.forEach(function(f) {
        if (!grouped[f.question_id]) grouped[f.question_id] = [];
        grouped[f.question_id].push(f);
    });

    let html = (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title">🚩 Flagged Questions</span>' +
        '<div style="display:flex;gap:6px">' +
        '<button class="btn btn-sm ' + (filter === 'unresolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="unresolved">Unresolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'resolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="resolved">Resolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'all' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="all">All</button>' +
        '</div>' +
        '</div>'
    );

    if (Object.keys(grouped).length === 0) {
        html += '<div class="card"><p style="text-align:center;color:var(--faint);padding:20px 0">' + 
            (filter === 'unresolved' ? 'No unresolved flagged questions.' : 'No flagged questions in this filter.') + 
            '</p></div>';
        return html;
    }

    Object.keys(grouped).forEach(function(qid) {
        const flags = grouped[qid];
        const q = flags[0].questions;
        const subj = SUBJECTS.find(function(s) { return s.id === q?.subject_id; });
        const isEditing = state.admin.editingQuestionId === qid;
        
        html += '<div class="saved-question-item">';
        html += '<div class="q-header">';
        html += '<p class="q-text">' + esc(q?.text || 'Question not found') + '</p>';
        html += '<div class="q-actions">';
        if (isEditing) {
            html += '<button class="mini-btn" data-action="cancel-edit">Cancel</button>';
        } else {
            html += '<button class="mini-btn edit" data-action="admin-flagged-edit" data-qid="' + qid + '">✏️ Edit</button>';
            if (filter !== 'resolved') {
                html += '<button class="mini-btn primary" data-action="admin-flagged-resolve" data-qid="' + qid + '">✅ Resolve</button>';
            }
        }
        html += '</div>';
        html += '</div>';
        
        // Show flag details
        html += '<div style="font-size:11px;color:var(--muted);margin:4px 0">';
        html += 'Flagged ' + flags.length + ' time' + (flags.length > 1 ? 's' : '') + ' · ';
        flags.slice(0, 3).forEach(function(f, i) {
            if (i > 0) html += ', ';
            html += esc(f.username || 'Unknown') + (f.reason ? ' ("' + esc(f.reason) + '")' : '');
        });
        if (flags.length > 3) html += ' and ' + (flags.length - 3) + ' more';
        html += '</div>';
        
        if (isEditing) {
            // Edit form
            html += '<div class="edit-form" style="margin-top:8px">';
            html += '<label class="field-label">Question text</label>';
            html += '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:8px">' + esc(q?.text || '') + '</textarea>';
            html += '<label class="field-label">Options</label>';
            for (let i = 0; i < 4; i++) {
                html += '<div class="opt-row">';
                html += '<input type="radio" name="edit-correct" value="' + i + '"' + (q?.correct_answer === i ? ' checked' : '') + ' data-action="edit-correct" />';
                html += '<input class="field" data-action="edit-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) + '" value="' + esc(q?.options?.[i] || '') + '" />';
                html += '</div>';
            }
            html += '<label class="field-label">Explanation</label>';
            html += '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:8px">' + esc(q?.explanation || '') + '</textarea>';
            html += '<button class="btn btn-green" data-action="save-edit-flagged" data-qid="' + qid + '">Save & Resolve</button>';
            html += '</div>';
        }
        
        html += '</div>';
    });

    return html;
}

// ============================================================
//  EVENT HANDLING
// ============================================================
document.addEventListener('click', function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');

    // SPLASH
    if (action === 'skip-splash') {
        state.phase = 'app';
        render();
        return;
    }

    // DRAWER
    if (action === 'open-drawer') {
        state.drawerOpen = true;
        render();
        return;
    }
    if (action === 'close-drawer') {
        state.drawerOpen = false;
        render();
        return;
    }

    // NAVIGATION
    if (action === 'set-view') {
        setView(el.getAttribute('data-view'));
        return;
    }

    // SUBMIT MODAL
    if (action === 'submit-confirm') {
        if (state.submitModalData && state.submitModalData.onConfirm) {
            state.submitModalData.onConfirm();
        }
        return;
    }
    if (action === 'submit-cancel') {
        if (state.submitModalData && state.submitModalData.onCancel) {
            state.submitModalData.onCancel();
        }
        return;
    }

    // ATTEMPT MODAL
    if (action === 'show-attempted-cbt') {
        const questions = state.cbtQuestions.map(function(q, i) {
            const ans = state.cbtAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                idx: i,
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            mode: 'cbt',
            total: state.cbtQuestions.length,
            answered: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-exam') {
        const questions = state.examQuestions.map(function(q, i) {
            const ans = state.examAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.examQuestions.length,
            answered: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-topic') {
        const questions = state.topicQuestions.map(function(q, i) {
            const ans = state.topicAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.topicQuestions.length,
            answered: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-lit') {
        const questions = state.litQuestions.map(function(q, i) {
            const ans = state.litAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.litQuestions.length,
            answered: state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-mock') {
        const questions = state.mockQuestions.map(function(q, i) {
            const ans = state.mockAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            total: state.mockQuestions.length,
            answered: state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'attempt-close') {
        state.showAttemptModal = false;
        state.attemptModalData = null;
        render();
        return;
    }

    if (action === 'goto-attempt-question') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const mode = el.getAttribute('data-mode');
        state.showAttemptModal = false;
        state.attemptModalData = null;
        if (mode === 'cbt') {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
        } else if (mode === 'exam') {
            state.examIndex = idx;
        } else if (mode === 'topic') {
            state.topicIndex = idx;
        } else if (mode === 'lit') {
            state.litIndex = idx;
        } else if (mode === 'mock') {
            state.mockIndex = idx;
            const q = state.mockQuestions[idx];
            if (q) state.mockCurrentSubject = q.subject_id;
        }
        render();
        return;
    }

    // CALCULATOR
    if (action === 'toggle-calculator') {
        if (state.settingsCache.calculatorEnabled !== false) {
            state.showCalculator = !state.showCalculator;
            if (state.showCalculator) {
                state.calcDisplay = "0";
                state.calcExpression = "";
                state.calcJustEvaluated = false;
            }
            render();
        }
        return;
    }
    if (action === 'calc-close') {
        state.showCalculator = false;
        render();
        return;
    }
    if (action === 'prevent-close') return;
    
    if (action === 'calc-number') {
        const val = el.getAttribute('data-value');
        if (state.calcJustEvaluated) {
            state.calcDisplay = val;
            state.calcExpression = val;
            state.calcJustEvaluated = false;
        } else {
            if (state.calcDisplay === "0" && val !== ".") {
                state.calcDisplay = val;
            } else {
                state.calcDisplay += val;
            }
            state.calcExpression += val;
        }
        render();
        return;
    }
    if (action === 'calc-operator') {
        const val = el.getAttribute('data-value');
        const lastChar = state.calcExpression.slice(-1);
        if (['+', '-', '×', '÷'].includes(lastChar)) {
            state.calcExpression = state.calcExpression.slice(0, -1) + val;
            state.calcDisplay = state.calcDisplay.slice(0, -1) + val;
        } else {
            state.calcExpression += val;
            state.calcDisplay += val;
        }
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-equals') {
        try {
            let expr = state.calcExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/');
            const result = Function('"use strict"; return (' + expr + ')')();
            state.calcDisplay = String(result);
            state.calcExpression = String(result);
            state.calcJustEvaluated = true;
        } catch (e) {
            state.calcDisplay = 'Error';
        }
        render();
        return;
    }
    if (action === 'calc-clear') {
        state.calcDisplay = "0";
        state.calcExpression = "";
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-delete') {
        if (state.calcDisplay.length > 1) {
            state.calcDisplay = state.calcDisplay.slice(0, -1);
            state.calcExpression = state.calcExpression.slice(0, -1);
        } else {
            state.calcDisplay = "0";
            state.calcExpression = "";
        }
        render();
        return;
    }

    // AUTH
    if (action === 'show-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'show-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'switch-to-reset') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = true;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'close-auth') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'switch-to-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'switch-to-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'do-login') {
        const email = document.getElementById('login-email')?.value?.trim() || '';
        const password = document.getElementById('login-password')?.value || '';
        state.loginEmail = email;
        state.loginPassword = password;
        if (!email || !password) { state.authError = 'Please enter both email/username and password.';
            render(); return; }
        signIn(email, password);
        return;
    }
    if (action === 'do-signup') {
        const username = document.getElementById('signup-username')?.value?.trim() || '';
        const email = document.getElementById('signup-email')?.value?.trim() || '';
        const password = document.getElementById('signup-password')?.value || '';
        const confirm = document.getElementById('signup-confirm')?.value || '';
        state.signupUsername = username;
        state.signupEmail = email;
        state.signupPassword = password;
        state.signupConfirm = confirm;
        if (!username) { state.authError = 'Please choose a username.';
            render(); return; }
        if (!email) { state.authError = 'Please enter your email address.';
            render(); return; }
        if (password.length < 6) { state.authError = 'Password must be at least 6 characters.';
            render(); return; }
        if (password !== confirm) { state.authError = 'Passwords do not match.';
            render(); return; }
        signUp(username, email, password);
        return;
    }
    if (action === 'do-reset') {
        const email = document.getElementById('reset-email')?.value?.trim() || '';
        state.resetEmail = email;
        if (!email) { state.resetError = 'Please enter your email address.';
            render(); return; }
        sendPasswordReset(email);
        return;
    }
    if (action === 'do-password-reset') {
        const password = document.getElementById('reset-new-password')?.value || '';
        const confirm = document.getElementById('reset-confirm-password')?.value || '';
        state.resetPassword = password;
        state.resetConfirm = confirm;
        
        if (password.length < 6) { state.resetError = 'Password must be at least 6 characters.';
            render(); return; }
        if (password !== confirm) { state.resetError = 'Passwords do not match.';
            render(); return; }
        
        updatePassword(password);
        return;
    }
    if (action === 'toggle-password') {
        const field = el.getAttribute('data-field');
        if (field) {
            state.showPassword[field] = !state.showPassword[field];
            render();
        }
        return;
    }
    if (action === 'sign-out') {
        signOut();
        return;
    }

    // DARK MODE
    if (action === 'toggle-dark-mode') {
        state.darkMode = !state.darkMode;
        storage.set('darkMode', state.darkMode ? 'true' : 'false');
        if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        render();
        return;
    }

    // CBT MODE SELECTION
    if (action === 'cbt-mode') {
        state.cbtMode = el.getAttribute('data-mode');
        state.cbtSelected = [];
        render();
        return;
    }

    if (action === 'toggle-cbt-subject') {
        const id = el.getAttribute('data-subject');
        const i = state.cbtSelected.indexOf(id);
        const isFull = state.cbtMode === 'full';
        const max = isFull ? (state.settingsCache.cbtSubjectCount || 3) : 1;
        if (i !== -1) state.cbtSelected.splice(i, 1);
        else if (state.cbtSelected.length < max) state.cbtSelected.push(id);
        render();
        return;
    }

    // START CBT
    if (action === 'start-cbt') {
        startCbt();
        return;
    }

    if (action === 'start-literature-cbt') {
        startLiteratureCbt();
        return;
    }

    // CBT EXAM ACTIONS
    if (action === 'cbt-answer') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        state.cbtAnswers[state.cbtIndex] = idx;
        render();
        return;
    }

    if (action === 'cbt-goto') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        if (idx >= 0 && idx < state.cbtQuestions.length) {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
            render();
        }
        return;
    }

    if (action === 'switch-cbt-subject') {
        const sid = el.getAttribute('data-subject');
        const qs = getQuestionsForSubject(sid, state.cbtSubjectQuestions);
        if (qs.length > 0) {
            state.cbtCurrentSubject = sid;
            state.cbtIndex = qs[0];
            render();
        }
        return;
    }

    if (action === 'cbt-submit') {
        if (state.cbtSubmitted) return;
        const subjectMap = {};
        state.cbtQuestions.forEach(function(q, i) {
            if (!subjectMap[q.subject_id]) {
                const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
                subjectMap[q.subject_id] = {
                    name: subj ? subj.name : q.subject_id,
                    total: 0,
                    answered: 0,
                    unanswered: 0,
                };
            }
            subjectMap[q.subject_id].total++;
            const isAnswered = state.cbtAnswers[i] !== null && state.cbtAnswers[i] !== undefined;
            if (isAnswered) subjectMap[q.subject_id].answered++;
            else subjectMap[q.subject_id].unanswered++;
        });
        const subjectSummaries = Object.values(subjectMap);
        const totalAnswered = state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
        const totalQuestions = state.cbtQuestions.length;

// ============================================================
//  INPUT EVENT HANDLING

document.addEventListener('change', function(e) {
    const id = e.target.id;

    if (id === 'exam-year-select') {
        state.examYear = parseInt(e.target.value, 10);
    } else if (id === 'doc-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.docFile = { name: file.name, type: file.type, size: file.size, dataUrl: ev.target.result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'syllabus-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.syllabusFile = { name: file.name, type: file.type, size: file.size, dataUrl: ev.target
                    .result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-qsubject') {
        state.admin.qSubject = e.target.value || '';
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'admin-qyear') {
        state.admin.examYear = parseInt(e.target.value, 10) || 2026;
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'subject-lb-select') {
        state.subjectLeaderboardSubject = e.target.value || null;
        loadSubjectLeaderboard(state.subjectLeaderboardSubject);
        render();
    } else if (e.target.getAttribute && e.target.getAttribute('data-action') === 'qform-correct') {
        state.admin.qCorrect = parseInt(e.target.value, 10);
    } else if (id === 'admin-notif-image') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.notifImageData = ev.target.result;
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-view-subject-filter') {
        state.admin.viewModeSubject = e.target.value || '';
        render();
    }
});

document.addEventListener('input', function(e) {
    const id = e.target.id;
    const action = e.target.getAttribute && e.target.getAttribute('data-action');

    if (id === 'activate-code-input') state.activateCode = e.target.value;
    else if (id === 'doc-name-input') state.admin.docName = e.target.value;
    else if (id === 'syllabus-text-area') state.admin.syllabusText = e.target.value;
    else if (id === 'syllabus-name-input') { /* handled elsewhere */ }
    else if (id === 'admin-mock-title') state.admin.mockTitle = e.target.value;
    else if (id === 'admin-mock-scheduled') state.admin.mockScheduledDate = e.target.value;
    else if (id === 'admin-mock-reg-deadline') state.admin.mockRegistrationDeadline = e.target.value;
    else if (id === 'admin-mock-end') state.admin.mockEndDate = e.target.value;
    else if (id === 'admin-mock-qs') state.admin.mockQuestionsPerSubject = parseInt(e.target.value) || 25;
    else if (id === 'login-email') state.loginEmail = e.target.value;
    else if (id === 'login-password') state.loginPassword = e.target.value;
    else if (id === 'signup-username') state.signupUsername = e.target.value;
    else if (id === 'signup-email') state.signupEmail = e.target.value;
    else if (id === 'signup-password') state.signupPassword = e.target.value;
    else if (id === 'signup-confirm') state.signupConfirm = e.target.value;
    else if (id === 'reset-email') state.resetEmail = e.target.value;
    else if (id === 'reset-new-password') state.resetPassword = e.target.value;
    else if (id === 'reset-confirm-password') state.resetConfirm = e.target.value;
    else if (id === 'admin-view-search') {
        state.admin.searchQuery = e.target.value;
        render();
    } else if (action === 'qform-text') state.admin.qText = e.target.value;
    else if (action === 'qform-explanation') state.admin.qExplanation = e.target.value;
    else if (action === 'qform-opt') {
        const idx = parseInt(e.target.getAttribute('data-idx'), 10);
        state.admin.qOpts[idx] = e.target.value;
    }
});

// ============================================================
//  INIT
// ============================================================
async function init() {
    const darkPref = storage.get('darkMode');
    if (darkPref === 'true') {
        state.darkMode = true;
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    await loadSettings();
    await checkAuthSession();
    await loadAllUsers();
    await loadAllQuestionsCount();
    await loadLeaderboard('cbt');
    await loadNotifications();
    await loadActivationPlans();   
    loadFlaggedCount();

    render();

    setTimeout(function() {
        if (state.phase === 'splash') {
            state.phase = 'app';
            render();
        }
    }, 5000);

    // Check maintenance status every 60 seconds
    setInterval(function() {
        loadSettings().then(function() {
            render();
        });
    }, 60000);
}

init();
</script>
</body>
</html>
