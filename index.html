            'table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:#8A9990;padding:0 0 8px;border-bottom:1px solid #E1EBE3;}' +
            'table td{padding:9px 0;font-size:13px;border-bottom:1px solid #F0EEE7;}' +
            'table .s-score{text-align:right;font-weight:700;color:#0F6B3F;font-family:"Courier New",monospace;}' +
            '.meta-row{display:flex;justify-content:space-between;font-size:11px;color:#8A9990;margin-top:4px;}' +
            '.footer{text-align:center;padding:16px 24px 24px;font-size:10px;color:#8A9990;border-top:1px dashed #E1EBE3;}' +
            '.footer .verified{color:#0F6B3F;font-weight:700;margin-bottom:4px;}' +
            '@media print{body{background:#fff;padding:0;}.sheet{box-shadow:none;border-radius:0;border:none;max-width:100%;}}' +
            '</style></head><body>' +
            '<div class="sheet">' +
            '<div class="header">' +
            '<div class="brand">' + logoSvg(40) + '<span class="brand-name">My<b>UTME</b></span></div>' +
            '<div class="tagline">JAMB CBT Practice</div>' +
            '<div class="slip-label">Result Slip</div>' +
            '</div>' +
            '<div class="body">' +
            '<div class="student-row">' +
            '<div><div class="label">Candidate</div><div class="value">' + esc(studentName) + '</div>' +
            (studentEmail ? '<div class="value small">' + esc(studentEmail) + '</div>' : '') + '</div>' +
            '<div style="text-align:right"><div class="label">Date</div><div class="value small">' + formatDate(entry.submitted_at) + '</div></div>' +
            '</div>' +
            '<div class="exam-title">' + esc(entry.exam_title || entry.mode) + '</div>' +
            '<div class="exam-mode">' + esc(modeLabel) + '</div>' +
            '<div class="exam-date">' + entry.answered_count + ' of ' + entry.total_questions + ' questions answered</div>' +
            '<div class="score-block">' +
            '<div class="big">' + entry.total_score + ' <span class="of">/ ' + entry.max_score + '</span></div>' +
            '<div class="pct">Overall score: <b>' + pct + '%</b></div>' +
            '</div>' +
            (subjRows ? '<table><tr><th>Subject</th><th style="text-align:right">Score</th></tr>' + subjRows + '</table>' : '') +
            '</div>' +
            '<div class="footer">' +
            '<div class="verified">✓ Generated by MyUTME</div>' +
            'This is a practice result slip, not an official JAMB document.' +
            '</div>' +
            '</div>' +
            '</body></html>';

        win.document.write(printHtml);
        win.document.close();
        setTimeout(function() { win.print(); }, 300);
        return;
    }

    if (action === 'history-share') {
        const id = el.getAttribute('data-id');
        const entry = state.historyEntries.find(function(e) { return e.id === id; });
        if (!entry) { showToast('Entry not found.', 'error'); return; }

        const pct = entry.max_score ? Math.round((entry.total_score / entry.max_score) * 100) : 0;
        const studentName = state.profile.name || 'Guest';

        const subjectStr = Object.keys(entry.subject_scores || {}).map(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            return '   • ' + (subj ? subj.name : sid) + ': ' + entry.subject_scores[sid];
        }).join('\n');

        const modeLabel = entry.mode === 'cbt-full' ? 'CBT Full' :
                         entry.mode === 'cbt-single' ? 'CBT Single' :
                         entry.mode === 'novel' ? 'Novel CBT' :
                         entry.mode === 'revise' ? 'Revision' :
                         entry.mode === 'mock' ? 'Mock Exam' :
                         entry.mode === 'exam' ? 'Exam' :
                         entry.mode === 'topic' ? 'Topic Practice' :
                         entry.mode || 'Unknown';

        const text = '🎓 MyUTME — Result Slip\n' +
            '━━━━━━━━━━━━━━━━━━━━\n' +
            '👤 Candidate: ' + studentName + '\n' +
            '📝 Exam: ' + (entry.exam_title || entry.mode) + '\n' +
            '📋 Mode: ' + modeLabel + '\n' +
            '📅 Date: ' + formatDate(entry.submitted_at) + '\n' +
            '🎯 Score: ' + entry.total_score + ' / ' + entry.max_score + ' (' + pct + '%)\n' +
            (subjectStr ? '📋 Subject Breakdown:\n' + subjectStr + '\n' : '') +
            '✅ ' + entry.answered_count + ' of ' + entry.total_questions + ' answered\n' +
            '━━━━━━━━━━━━━━━━━━━━\n' +
            'Practice smarter with MyUTME';

        if (navigator.share) {
            navigator.share({
                title: 'MyUTME Exam Result — ' + studentName,
                text: text,
            }).catch(function() {});
        } else {
            navigator.clipboard.writeText(text).then(function() {
                showToast('Result copied to clipboard!', 'success');
            }).catch(function() {
                prompt('Copy this result:', text);
            });
        }
        return;
    }

    // REVISE WEAK QUESTIONS
    if (action === 'revise-select-mode') {
        state.reviseMode = el.getAttribute('data-mode');
        state.reviseView = 'subjects';
        render();
        return;
    }
    if (action === 'revise-select-subject') {
        state.reviseSubject = el.getAttribute('data-subject');
        state.reviseView = 'questions';
        render();
        return;
    }
    if (action === 'revise-back-to-modes') {
        state.reviseView = 'modes';
        state.reviseMode = null;
        state.reviseSubject = null;
        render();
        return;
    }
    if (action === 'revise-back-to-subjects') {
        state.reviseView = 'subjects';
        state.reviseSubject = null;
        render();
        return;
    }

    if (action === 'weak-toggle-view') {
        const wid = el.getAttribute('data-wid');
        state.weakQuestionStates['view_' + wid] = !state.weakQuestionStates['view_' + wid];
        render();
        return;
    }

    if (action === 'weak-toggle-reattempt') {
        const wid = el.getAttribute('data-wid');
        const opening = !state.weakQuestionStates['reattempt_' + wid];
        state.weakQuestionStates['reattempt_' + wid] = opening;
        state.weakQuestionStates['answer_' + wid] = null;
        delete state.weakQuestionStates['result_' + wid];
        if (opening) state.weakQuestionStates['view_' + wid] = false;
        render();
        return;
    }

    if (action === 'weak-reattempt-answer') {
        const wid = el.getAttribute('data-wid');
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const wq = state.weakQuestions.find(function(w) { return w.id === wid; });
        if (!wq || !wq.questions) { showToast('Question not found.', 'error'); return; }

        const q = wq.questions;
        const isCorrect = idx === q.correct_answer;

        state.weakQuestionStates['answer_' + wid] = idx;
        state.weakQuestionStates['result_' + wid] = isCorrect;
        render();

        if (isCorrect) {
            removeWeakQuestion(state.authUser.id, wq.question_id).then(function() {
                saveHistoryEntry({
                    mode: 'revise',
                    subjects: [q.subject_name || 'Unknown'],
                    subject_scores: {},
                    total_score: 1,
                    max_score: 1,
                    total_questions: 1,
                    answered_count: 1,
                    submitted_at: new Date().toISOString(),
                    exam_title: 'Revise: ' + (q.subject_name || 'Question'),
                });
            });
        } else {
            saveWeakQuestion(state.authUser.id, wq.question_id, wq.subject_id, wq.mode, idx, q.correct_answer);
        }
        return;
    }

    if (action === 'weak-next-question') {
        const wid = el.getAttribute('data-wid');
        const mode = state.reviseMode;
        const subjectId = state.reviseSubject;

        let list = state.weakQuestions.filter(function(w) {
            return (w.mode || 'unknown') === mode && w.subject_id === subjectId;
        });
        list.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
        const currentIdx = list.findIndex(function(w) { return w.id === wid; });

        state.weakQuestionStates['reattempt_' + wid] = false;
        state.weakQuestionStates['answer_' + wid] = null;
        delete state.weakQuestionStates['result_' + wid];

        state.weakQuestionsLoaded = false;
        loadWeakQuestions().then(function() {
            const refreshedList = state.weakQuestions.filter(function(w) {
                return (w.mode || 'unknown') === mode && w.subject_id === subjectId;
            });
            refreshedList.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
            const nextWq = refreshedList[currentIdx] || refreshedList[0];
            if (nextWq) {
                state.weakQuestionStates['reattempt_' + nextWq.id] = true;
            }
            render();
        });
        return;
    }

    if (action === 'weak-remove-question') {
        const wid = el.getAttribute('data-wid');
        const qid = el.getAttribute('data-qid');
        if (!state.authUser) { showToast('Please login first.', 'error'); return; }
        if (!confirm('Remove this question from your weak list?')) return;

        removeWeakQuestion(state.authUser.id, qid).then(function() {
            showToast('Removed from weak list.', 'success');
            delete state.weakQuestionStates['view_' + wid];
            delete state.weakQuestionStates['reattempt_' + wid];
            delete state.weakQuestionStates['answer_' + wid];
            delete state.weakQuestionStates['result_' + wid];
            state.weakQuestionsLoaded = false;
            loadWeakQuestions();
        }).catch(function() {
            showToast('Error removing question.', 'error');
        });
        return;
    }

    if (action === 'flag-weak-question') {
        const qid = el.getAttribute('data-qid');
        const subject = el.getAttribute('data-subject');
        const mode = el.getAttribute('data-mode') || 'revise';
        
        if (!state.authUser) { showToast('Please login first.', 'error'); return; }
        
        state.showFlagModal = true;
        state.flagModalData = {
            questionId: qid,
            subjectId: subject || '',
            mode: mode,
        };
        render();
        return;
    }

    if (action === 'flag-review-question') {
        const qid = el.getAttribute('data-qid');
        const subject = el.getAttribute('data-subject');
        const mode = el.getAttribute('data-mode');
        
        if (!state.authUser) { showToast('Please login first.', 'error'); return; }
        
        state.showFlagModal = true;
        state.flagModalData = {
            questionId: qid,
            subjectId: subject || '',
            mode: mode || 'unknown',
        };
        render();
        return;
    }

    if (action === 'flag-close') {
        state.showFlagModal = false;
        state.flagModalData = null;
        render();
        return;
    }

    if (action === 'flag-submit') {
        const data = state.flagModalData;
        if (!data || !data.questionId) { showToast('No question to flag.', 'error'); return; }
        
        const reason = document.getElementById('flag-reason-input')?.value?.trim() || '';
        const userId = state.authUser?.id;
        const username = state.profile?.name || 'Unknown';
        
        if (!userId) { showToast('Please login first.', 'error'); return; }
        
        saveFlaggedQuestion(userId, username, data.questionId, data.subjectId, data.mode, reason).then(function() {
            showToast('Question flagged. Thank you — our team will review it.', 'success');
            state.showFlagModal = false;
            state.flagModalData = null;
            loadFlaggedCount();
            render();
        });
        return;
    }

    // SUPPORT CHAT
    if (action === 'support-quick-issue') {
        const issueKey = el.getAttribute('data-issue');
        const issue = SUPPORT_QUICK_ISSUES.find(function(i) { return i.key === issueKey; });
        if (issue) {
            sendSupportMessage(issue.label, issueKey);
        }
        return;
    }

    if (action === 'send-support-message') {
        const input = document.getElementById('support-chat-input');
        if (input) {
            sendSupportMessage(input.value, null);
            input.value = '';
        }
        return;
    }

    if (action === 'admin-open-support') {
        state.adminSelectedSupportUser = el.getAttribute('data-userid');
        state.adminSelectedSupportUsername = el.getAttribute('data-username');
        loadAdminSupportThread(state.adminSelectedSupportUser);
        return;
    }

    if (action === 'admin-close-support') {
        state.adminSelectedSupportUser = null;
        state.adminSelectedSupportUsername = null;
        state.adminSupportMessages = [];
        render();
        return;
    }

    if (action === 'admin-send-support-reply') {
        const userId = el.getAttribute('data-userid');
        const username = el.getAttribute('data-username');
        const val = document.getElementById('admin-support-reply-input')?.value || '';
        sendAdminSupportReply(userId, username, val);
        const input = document.getElementById('admin-support-reply-input');
        if (input) input.value = '';
        return;
    }

    if (action === 'notif-image-upload') {
        const input = document.getElementById('admin-notif-image');
        if (input) input.click();
        return;
    }

    if (action === 'notif-remove-image') {
        state.admin.notifImageData = null;
        state.admin.notifImage = null;
        render();
        return;
    }

    if (action === 'admin-support-reply') {
        const userId = el.getAttribute('data-userid');
        const username = el.getAttribute('data-username');
        const input = document.getElementById('admin-support-reply-input');
        if (input && input.value.trim()) {
            sendAdminSupportReply(userId, username, input.value.trim());
            input.value = '';
        }
        return;
    }
});

// ============================================================
//  INPUT EVENT HANDLING
// ============================================================
document.addEventListener('change', function(e) {
    const id = e.target.id;

    if (id === 'exam-year-select') {
        state.examYear = parseInt(e.target.value, 10);
    } else if (id === 'doc-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.docFile = { name: file.name, type: file.type, size: file.size, dataUrl: ev.target.result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-qsubject') {
        state.admin.qSubject = e.target.value || '';
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'admin-qyear') {
        state.admin.examYear = parseInt(e.target.value, 10) || 2026;
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'subject-lb-select') {
        state.subjectLeaderboardSubject = e.target.value || null;
        loadSubjectLeaderboard(state.subjectLeaderboardSubject);
        render();
    } else if (e.target.getAttribute && e.target.getAttribute('data-action') === 'qform-correct') {
        state.admin.qCorrect = parseInt(e.target.value, 10);
    } else if (id === 'admin-notif-image') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.notifImageData = ev.target.result;
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-view-subject-filter') {
        state.admin.viewModeSubject = e.target.value || '';
        render();
    } else if (id === 'admin-topic-subject-select') {
        state.admin.adminTopicSubject = e.target.value || null;
        state.admin.adminTopicsLoaded = false;
        state.admin.adminSelectedTopicId = null;
        state.admin.adminTopicQuestionsLoaded = false;
        render();
    } else if (id === 'offline-import-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                importOfflineData(data, 'replace').then(function(result) {
                    showToast('Imported ' + result.questions + ' questions, ' + result.passages +
                        ' passages, ' + result.topics + ' topics, ' + result.topic_questions +
                        ' topic questions.', 'success');
                    state.allQuestions = [];
                    loadAllQuestionsCount();
                    render();
                }).catch(function(err) {
                    console.error('Import error:', err);
                    showToast('Error importing file: ' + (err.message || 'unknown'), 'error');
                });
            } catch (parseErr) {
                showToast('Invalid JSON file — could not parse.', 'error');
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    }
});

document.addEventListener('input', function(e) {
    const id = e.target.id;
    const action = e.target.getAttribute && e.target.getAttribute('data-action');

    if (id === 'activate-code-input') state.activateCode = e.target.value;
    else if (id === 'doc-name-input') state.admin.docName = e.target.value;

    else if (id === 'admin-mock-end') state.admin.mockEndDate = e.target.value;

    else if (id === 'login-email') state.loginEmail = e.target.value;
    else if (id === 'login-password') state.loginPassword = e.target.value;
    else if (id === 'signup-username') state.signupUsername = e.target.value;
    else if (id === 'signup-email') state.signupEmail = e.target.value;
    else if (id === 'signup-password') state.signupPassword = e.target.value;
    else if (id === 'signup-confirm') state.signupConfirm = e.target.value;
    else if (id === 'reset-email') state.resetEmail = e.target.value;
    else if (id === 'reset-new-password') state.resetPassword = e.target.value;
    else if (id === 'reset-confirm-password') state.resetConfirm = e.target.value;
    else if (id === 'admin-view-search') {
        state.admin.searchQuery = e.target.value;

    } else if (id === 'docs-search-input') {

        render();
    } else if (id === 'admin-new-topic-name') {
        state.admin.newTopicName = e.target.value;
    } else if (id === 'support-chat-input') {
        state.supportInput = e.target.value;
    } else if (id === 'admin-support-reply-input') {
        // handled on send
    } else if (action === 'qform-text') state.admin.qText = e.target.value;
    else if (action === 'qform-explanation') state.admin.qExplanation = e.target.value;
    else if (action === 'qform-opt') {
        const idx = parseInt(e.target.getAttribute('data-idx'), 10);
        state.admin.qOpts[idx] = e.target.value;
    }
});

// ============================================================
//  INIT
// ============================================================
async function init() {
    const darkPref = storage.get('darkMode');
    if (darkPref === 'true') {
        state.darkMode = true;
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    const hasSeenSplash = storage.get('hasSeenSplash');
    if (hasSeenSplash) {
        state.phase = 'app';
    }
    render();

    if (!hasSeenSplash) {
        storage.set('hasSeenSplash', 'true');
        setTimeout(function() {
            if (state.phase === 'splash') {
                state.phase = 'app';
                render();
            }
        }, 5000);
    }

    await loadSettings();
    await checkAuthSession();
    if (typeof seedOfflineDataIfNeeded === 'function') {
        await seedOfflineDataIfNeeded();
    } else {
        console.warn('seedOfflineDataIfNeeded is not defined — skipping offline seed.');
    }
    render();

    // Auto-sync per-subject question files
    const localQuestionCounts = await loadAllQuestionsCountOffline();
    const hasNoLocalQuestions = Object.keys(localQuestionCounts).length === 0;
    const lastSync = parseInt(storage.get('lastSubjectFileSync') || '0', 10);
    const syncIsStale = Date.now() - lastSync > 12 * 60 * 60 * 1000;

    if (hasNoLocalQuestions || syncIsStale) {
        const subjectIds = SUBJECTS.map(function(s) { return s.id; });
        if (window.OfflineDB && typeof window.OfflineDB.syncAllSubjectFiles === 'function') {
            window.OfflineDB.syncAllSubjectFiles(subjectIds).then(function(results) {
                const foundAnySubjectFile = Object.keys(results).some(function(k) { return !!results[k]; });
                if (foundAnySubjectFile || !hasNoLocalQuestions) {
                    storage.set('lastSubjectFileSync', String(Date.now()));
                } else {
                    console.warn('Subject file sync found nothing (offline or files missing) — will retry on next load.');
                }
                if (state.view === 'admin') {
                    loadAllQuestionsForAdmin();
                    loadAllQuestionsCountOffline();
                }
                render();
            });
        } else {
            console.warn('window.OfflineDB.syncAllSubjectFiles is not defined — skipping subject file sync.');
        }
    }

    // Check for expired users on init and periodically
    await checkAndDeactivateExpiredUsers();
    setInterval(function() {
        checkAndDeactivateExpiredUsers();
    }, 5 * 60 * 1000); // Every 5 minutes

    loadAllUsers();
    loadLeaderboard('cbt');
    loadNotifications();
    loadActivationPlans();
    loadFlaggedCount();
    if (state.authUser) cacheAllDataForOffline();

    window.addEventListener('online', function() {
        showToast('Back online — syncing data...', '');
        cacheAllDataForOffline();
        checkAndDeactivateExpiredUsers();
    });

    setInterval(function() {
        const examViews = ['cbt-exam', 'exam-exam', 'topic-exam', 'lit-exam', 'mock-exam'];
        if (examViews.indexOf(state.view) !== -1) return;
        loadSettings().then(function(s) {
            state.settingsCache = s;
            render();
        });
    }, 60000);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
            console.warn("SW registration failed:", err);
        });
    });
}

(function () {
    const installBtn = document.getElementById("pwa-install-btn");
    const iosTip = document.getElementById("pwa-ios-tip");
    const iosTipClose = document.getElementById("pwa-ios-tip-close");
    let deferredPrompt = null;

    function isStandalone() {
        return window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;
    }

    if (isStandalone()) {
        return;
    }

    window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.classList.add("show");
    });

    if (installBtn) {
        installBtn.addEventListener("click", async function () {
            if (!deferredPrompt) return;
            installBtn.classList.remove("show");
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            deferredPrompt = null;
        });
    }

    window.addEventListener("appinstalled", function () {
        if (installBtn) installBtn.classList.remove("show");
        if (iosTip) iosTip.classList.remove("show");
        deferredPrompt = null;
    });

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    if (isIOS && isSafari && iosTip) {
        const dismissed = storage.get("pwaIosTipDismissed");
        if (!dismissed) {
            setTimeout(function () { iosTip.classList.add("show"); }, 2500);
        }
    }
    if (iosTipClose) {
        iosTipClose.addEventListener("click", function () {
            iosTip.classList.remove("show");
            storage.set("pwaIosTipDismissed", "true");
        });
    }
})();
