function renderAdminOverview() {
    const userCount = state.allUsers.length || 0;

    const modeCounts = {
        cbt: 0,
        exam: 0,
        mock: 0,
        topic: 0,
        literature: 0
    };
    
    // Subject breakdown per mode
    const subjectBreakdown = {};

    if (state.allQuestions && state.allQuestions.length > 0) {
        state.allQuestions.forEach(function(q) {
            const type = q.type || '';
            const subject = q.subject_id || '';
            
            if (!subjectBreakdown[type]) subjectBreakdown[type] = {};
            if (!subjectBreakdown[type][subject]) subjectBreakdown[type][subject] = 0;
            subjectBreakdown[type][subject] += 1;
            
            if (type === 'cbt') {
                modeCounts.cbt += 1;
            } else if (type === 'exam') {
                modeCounts.exam += 1;
            } else if (type === 'mock') {
                modeCounts.mock += 1;
            } else if (type === 'subject') {
                modeCounts.topic += 1;
            } else if (type === 'NOVEL (CBT)') {
                modeCounts.literature += 1;
            }
        });
    }

    function renderSubjectBreakdown(type) {
        const breakdown = subjectBreakdown[type] || {};
        const keys = Object.keys(breakdown);
        if (keys.length === 0) return '';
        let html = '<div class="admin-subject-breakdown">';
        keys.forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const name = subj ? subj.code : sid;
            html += '<span class="subj-tag">' + esc(name) + ' <span class="count">' + breakdown[sid] + '</span></span>';
        });
        html += '</div>';
        return html;
    }

    return (
        '<p class="section-label">Question Counts by Mode</p>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="cbt">' +
        '<div class="mode-info">' +
        '<span class="mode-name">📚 CBT Mode</span>' +
        '<span class="mode-count">' + modeCounts.cbt + ' questions</span>' +
        renderSubjectBreakdown('cbt') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.cbt + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="cbt">✏️</span>' +
        '</div>' +
        '</div>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="exam">' +
        '<div class="mode-info">' +
        '<span class="mode-name">📝 Exam Mode</span>' +
        '<span class="mode-count">' + modeCounts.exam + ' questions</span>' +
        renderSubjectBreakdown('exam') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.exam + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="exam">✏️</span>' +
        '</div>' +
        '</div>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="mock">' +
        '<div class="mode-info">' +
        '<span class="mode-name">🎯 Mock Exam</span>' +
        '<span class="mode-count">' + modeCounts.mock + ' questions</span>' +
        renderSubjectBreakdown('mock') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.mock + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="mock">✏️</span>' +
        '</div>' +

        '<div class="mode-info">' +
        '<span class="mode-name">📋 Topic Practice</span>' +

    if (type === 'literature' && !state.admin.viewModeSubject) {

    else if (type === 'exam') title = 'Exam Mode Questions';
    else if (type === 'mock') title = 'Mock Exam Questions';
    else if (type === 'literature') title = 'Novel (CBT) Questions';

    const typeFilter = type === 'literature' ? 'NOVEL (CBT)' : type;
    const counts = {};
    (state.allQuestions || []).forEach(function(q) {
        if (q.type === typeFilter) counts[q.subject_id] = (counts[q.subject_id] || 0) + 1;
    });

    let cards = '';
    SUBJECTS.filter(function(s) { return s.id !== 'lhm'; }).forEach(function(s) {
        const count = counts[s.id] || 0;
        cards += (
            '<div class="admin-mode-card" data-action="admin-select-view-subject" data-subject="' + s.id + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name">' + esc(s.code) + ' — ' + esc(s.name) + '</span>' +
            '<span class="mode-count">' + count + ' question' + (count === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<div class="mode-actions"><span class="count-badge">' + count + '</span></div>' +
            '</div>'
        );
    });

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + title + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +
        '</div>' +
        '<p class="section-label">Select a subject to view or add questions</p>' +
        cards
    );
}

function renderAdminYearPicker(type, subject) {

function renderAdminSubjectQuestions(type, subject, year) {
    const subj = SUBJECTS.find(function(s) { return s.id === subject; });
    const search = state.admin.searchQuery || '';
    const typeFilter = type === 'literature' ? 'NOVEL (CBT)' : type;

    let filtered = (state.allQuestions || []).filter(function(q) {
        return q.type === typeFilter && q.subject_id === subject && (type !== 'exam' || q.year === year);
    });

    if (search) {
        const s = search.toLowerCase();
        filtered = filtered.filter(function(q) {
            return q.text.toLowerCase().includes(s) ||
                (q.options && q.options.some(function(o) { return o.toLowerCase().includes(s); }));
        });
    }

    const backAction = type === 'exam' ? 'admin-back-to-year-picker' : 'admin-back-to-subject-picker';
    const backLabel = type === 'exam' ? '← Years' : '← Subjects';

    let rows = "";
    if (filtered.length === 0) {
        rows = '<p style="text-align:center;color:var(--faint);padding:20px 0;font-size:13px">No questions yet. Add one below!</p>';
    } else {
        filtered.forEach(function(q, i) {
            const isEditing = state.admin.editingQuestionId === q.id;
            if (isEditing) {
                let editOptsHtml = "";
                for (let oi = 0; oi < 4; oi++) {
                    editOptsHtml += (
                        '<div class="opt-row">' +
                        '<input type="radio" name="edit-correct" value="' + oi + '"' + (q.correct_answer === oi ? ' checked' : '') +
                        ' data-action="edit-correct" />' +
                        '<input class="field" data-action="edit-opt" data-idx="' + oi + '" placeholder="Option ' + (oi + 1) +
                        '" value="' + esc(q.options[oi] || '') + '" style="font-size:13px" />' +
                        '</div>'
                    );
                }
                rows += (
                    '<div class="edit-form">' +
                    '<p style="font-size:11px;font-weight:600;color:var(--gold);margin-bottom:6px">✏️ Editing Question ' + (i + 1) + '</p>' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:6px">' +
                    '<button class="btn btn-green" style="flex:1;padding:8px" data-action="save-edit" data-qid="' + q.id + '">Save Changes</button>' +
                    '<button class="btn btn-outline" style="flex:0.5;padding:8px" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'
                );
            } else {
                let optsList = '<ul class="admin-list">';
                q.options.forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN + ';font-weight:600"' : '') +
                        '>' + esc(o) + (oi === q.correct_answer ? ' ✓' : '') + '</li>';
                });
                optsList += '</ul>';
                rows += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">Q' + (i + 1) + '. ' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id + '">✏️</button>' +
                    '<button class="mini-btn danger" data-action="delete-question-immediate" data-qid="' + q.id + '">🗑️</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="q-options">' + optsList + '</div>' +
                    (q.explanation ? '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' + esc(q.explanation) + '</div>' : '') +
                    '</div>'
                );
            }
        });
    }

    let optsHtml = "";
    for (let i = 0; i < 4; i++) {
        optsHtml += (
            '<div class="opt-row">' +
            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ? ' checked' : '') + ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) + '" value="' + esc(state.admin.qOpts[i]) + '" style="font-size:13px" />' +
            '</div>'
        );
    }

    const addForm = (
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add Question to ' + esc(subj ? subj.name : subject) + (year ? ' (' + year + ')' : '') + '</p>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:8px;font-size:13px" placeholder="Enter question...">' + esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +
        optsHtml +
        '<label class="field-label">Explanation (shown after answering)</label>' +
        '<textarea class="field" rows="2" data-action="qform-explanation" style="margin-bottom:8px;font-size:13px" placeholder="Explain why this answer is correct...">' + esc(state.admin.qExplanation) + '</textarea>' +
        '<button class="btn btn-green" data-action="qform-add-admin" style="padding:10px">Save Question</button>' +
        '</div>' +
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 6px">📋 Or Paste Questions as JSON</p>' +
        '<p style="font-size:10px;color:var(--muted);margin:0 0 8px">Adds to ' + esc(subj ? subj.name : subject) + (year ? ' (' + year + ')' : '') + ' unless a question specifies its own subject_id' + (type === 'exam' ? '/year' : '') + '.</p>' +
        '<textarea class="field" id="admin-json-import" rows="6" placeholder=\'[\n  {\n    "text": "What is 2+2?",\n    "options": ["3","4","5","6"],\n    "correct_answer": 1,\n    "explanation": "2+2 equals 4."\n  }\n]\' style="margin-bottom:8px;font-family:var(--font-mono);font-size:11px"></textarea>' +
        '<button class="btn btn-gold" data-action="qform-import-json" style="padding:10px">Import Questions</button>' +
        '</div>'
    );

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + esc(subj ? subj.name : subject) + (year ? ' — ' + year : '') + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="' + backAction + '">' + backLabel + '</button>' +
        '</div>' +
        '<input class="search-box" id="admin-view-search" placeholder="🔍 Search questions..." value="' + esc(search) + '" />' +
        '<p style="font-size:11px;color:var(--muted);margin-bottom:8px">' + filtered.length + ' question(s)</p>' +
        '<div class="admin-question-list" style="max-height:400px">' + rows + '</div>' +

function renderAdminTopicManagement() {
    const subjectId = state.admin.adminTopicSubject;

    let subjOpts = '<option value="">Select subject</option>';
    SUBJECTS.filter(function(s) { return s.id !== 'lhm'; }).forEach(function(s) {
        subjOpts += '<option value="' + s.id + '"' + (subjectId === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    });

    let body = '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">Topic Practice Questions</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +
        '</div>' +
        '<label class="field-label">Subject</label>' +
        '<select class="field" id="admin-topic-subject-select" style="margin-bottom:12px;font-size:13px">' + subjOpts + '</select>';

    if (!subjectId) {
        return body + '<p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">Select a subject to manage its topics.</p>';
    }

    if (!state.admin.adminTopicsLoaded) {
        loadAdminTopics(subjectId);
        return body + '<div class="loading-spinner"><div class="spinner"></div><p>Loading topics...</p></div>';
    }

    body += '<div class="card" style="margin-bottom:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add New Topic</p>' +
        '<input class="field" id="admin-new-topic-name" placeholder="Topic name e.g. Algebra" value="' + esc(state.admin.newTopicName || '') + '" style="margin-bottom:6px;font-size:13px" />' +
        '<button class="btn btn-green" data-action="admin-create-topic" data-subject="' + subjectId + '" style="padding:10px">Create Topic</button>' +
        '</div>';

    const topics = state.admin.adminTopicsList || [];
    if (topics.length === 0) {
        body += '<p style="text-align:center;color:var(--faint);padding:12px 0;font-size:13px">No topics yet for this subject.</p>';
        return body;
    }

    body += '<p class="section-label">Topics</p>';
    topics.forEach(function(t) {
        const isSelected = state.admin.adminSelectedTopicId === t.id;
        body += '<div class="admin-mode-card" data-action="admin-select-topic" data-topicid="' + t.id + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name" style="font-size:12px">' + esc(t.name) + (isSelected ? ' (viewing)' : '') + '</span>' +
            '<span class="mode-count" style="font-size:10px">' + (t.question_count || 0) + ' questions</span>' +
            '</div>' +
            '<div class="mode-actions">' +
            '<span class="edit-icon" style="background:var(--danger)" data-action="admin-delete-topic" data-topicid="' + t.id + '" style="font-size:11px;width:24px;height:24px">🗑️</span>' +
            '</div>' +
            '</div>';
    });

    if (!state.admin.adminSelectedTopicId) return body;

    if (!state.admin.adminTopicQuestionsLoaded) {
        loadAdminTopicQuestions(state.admin.adminSelectedTopicId);
        return body + '<div class="loading-spinner"><div class="spinner"></div><p>Loading questions...</p></div>';
    }

    body += '<p class="section-label" style="margin-top:12px">Questions in this topic</p>';
    const tqs = state.admin.adminTopicQuestions || [];
    if (tqs.length === 0) {
        body += '<p style="text-align:center;color:var(--faint);padding:12px 0;font-size:13px">No questions in this topic yet.</p>';
    } else {
        tqs.forEach(function(q) {
            const isEditing = state.admin.editingQuestionId === q.id;
            if (isEditing) {
                let editOptsHtml = "";
                for (let i = 0; i < 4; i++) {
                    editOptsHtml += (
                        '<div class="opt-row">' +
                        '<input type="radio" name="edit-correct" value="' + i + '"' + (q.correct_answer === i ? ' checked' : '') +
                        ' data-action="edit-correct" />' +
                        '<input class="field" data-action="edit-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) +
                        '" value="' + esc(q.options[i] || '') + '" style="font-size:13px" />' +
                        '</div>'
                    );
                }
                body += (
                    '<div class="edit-form">' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:6px">' +
                    '<button class="btn btn-green" style="flex:1;padding:8px" data-action="admin-save-topic-question-edit" data-qid="' + q.id + '">Save</button>' +
                    '<button class="btn btn-outline" style="flex:0.5;padding:8px" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'
                );
            } else {
                let optsList = '<ul class="admin-list">';
                (q.options || []).forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN + ';font-weight:600"' : '') + '>' + esc(o) + (oi === q.correct_answer ? ' ✓' : '') + '</li>';
                });
                optsList += '</ul>';
                body += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id + '">✏️</button>' +
                    '<button class="mini-btn danger" data-action="admin-delete-topic-question" data-qid="' + q.id + '">×</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="q-options">' + optsList + '</div>' +
                    (q.explanation ? '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' + esc(q.explanation) + '</div>' : '') +
                    '</div>'
                );
            }
        });
    }

    let optsHtml = "";
    for (let i = 0; i < 4; i++) {
        optsHtml += (
            '<div class="opt-row">' +
            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ? ' checked' : '') +
            ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) +
            '" value="' + esc(state.admin.qOpts[i]) + '" style="font-size:13px" />' +
            '</div>'
        );
    }

    body += (
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add Question to This Topic</p>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:8px;font-size:13px" placeholder="Enter question...">' +
        esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +
        optsHtml +
        '<label class="field-label">Explanation (shown after answering)</label>' +
        '<textarea class="field" rows="2" data-action="qform-explanation" style="margin-bottom:8px;font-size:13px" placeholder="Explain why this answer is correct...">' +
        esc(state.admin.qExplanation) + '</textarea>' +
        '<button class="btn btn-green" data-action="admin-add-topic-question" data-topicid="' + state.admin.adminSelectedTopicId + '" style="padding:10px">Save Question</button>' +
        '</div>'
    );

    return body;
}

// ============================================================
//  ADMIN USERS
// ============================================================
function renderAdminUsers() {
    const users = state.allUsers || [];

    if (users.length === 0) {
        return '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No registered users yet.</p></div>';
    }

    let rows = "";
    users.forEach(function(user) {
        const isActive = user.is_active !== false;
        const expiry = user.activation_expiry ? new Date(user.activation_expiry) : null;
        const daysLeft = expiry ? Math.ceil((expiry - new Date()) / (1000 * 60 * 60 * 24)) : null;
        let statusLabel = isActive ? '✅ Active' : '⛔ Inactive';
        if (isActive && daysLeft !== null && daysLeft < 3) statusLabel = '⚠️ ' + daysLeft + 'd left';
        
        rows += (
            '<div class="admin-user-row">' +
            '<div class="user-info">' +
            '<span class="user-name">' + esc(user.username) + '</span>' +
            '<span class="user-email">' + esc(user.email || '') + (expiry ? ' · Expires: ' + expiry.toLocaleDateString() : '') + '</span>' +
            '</div>' +
            '<span class="user-status ' + (isActive ? 'active' : 'inactive') + '">' +
            statusLabel +
            '</span>' +
            '<div class="user-actions">' +
            '<button class="mini-btn" data-action="admin-notify-user-btn" data-userid="' + user.id + '" data-username="' + esc(user.username) + '" style="font-size:9px">🔔</button>' +
            (isActive ?
                '<button class="mini-btn danger" data-action="admin-deactivate-user" data-userid="' + user
                .id + '" style="font-size:9px">Deactivate</button>' :
                '<button class="mini-btn primary" data-action="admin-activate-user" data-userid="' + user
                .id + '" style="font-size:9px">Activate</button>'
            ) +
            '</div>' +
            '</div>'
        );
    });

    return (
        '<div style="font-weight:700;font-size:14px;margin-bottom:10px;color:var(--ink)">👥 Total registered users: ' + users.length + '</div>' +
        rows
    );
}

// ============================================================
//  ADMIN FLAGGED
// ============================================================
function renderAdminFlagged() {
    if (state.admin.flaggedLoading) {
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }

    if (!state.admin.flaggedLoaded) {
        state.admin.flaggedLoading = true;
        loadFlaggedQuestions(state.admin.flaggedFilter || 'unresolved').then(function(data) {
            state.admin.flaggedData = data || [];
            state.admin.flaggedLoaded = true;
            state.admin.flaggedLoading = false;
            render();
        });
        
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }
    const data = state.admin.flaggedData || [];
    const filter = state.admin.flaggedFilter || 'unresolved';
    
    const grouped = {};
    data.forEach(function(f) {
        if (!grouped[f.question_id]) grouped[f.question_id] = [];
        grouped[f.question_id].push(f);
    });

    let html = (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">🚩 Flagged Questions</span>' +
        '<div style="display:flex;gap:4px">' +
        '<button class="btn btn-sm ' + (filter === 'unresolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="unresolved" style="font-size:9px;padding:3px 8px">Unresolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'resolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="resolved" style="font-size:9px;padding:3px 8px">Resolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'all' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="all" style="font-size:9px;padding:3px 8px">All</button>' +
        '</div>' +
        '</div>'
    );

    if (Object.keys(grouped).length === 0) {
        html += '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">' + 
            (filter === 'unresolved' ? 'No unresolved flagged questions.' : 'No flagged questions in this filter.') + 
            '</p></div>';
        return html;
    }

    Object.keys(grouped).forEach(function(qid) {
        const flags = grouped[qid];
        const q = flags[0].questions;
        const subj = SUBJECTS.find(function(s) { return s.id === q?.subject_id; });
        const isEditing = state.admin.editingQuestionId === qid;
        
        html += '<div class="saved-question-item">';
        html += '<div class="q-header">';
        html += '<p class="q-text">' + esc(q?.text || 'Question not found') + '</p>';
        html += '<div class="q-actions">';
        if (isEditing) {
            html += '<button class="mini-btn" data-action="cancel-edit" style="font-size:9px">Cancel</button>';
        } else {
            html += '<button class="mini-btn edit" data-action="admin-flagged-edit" data-qid="' + qid + '" style="font-size:9px">✏️</button>';
            if (filter !== 'resolved') {
                html += '<button class="mini-btn primary" data-action="admin-flagged-resolve" data-qid="' + qid + '" style="font-size:9px">✅ Resolve</button>';
            }
        }
        html += '</div>';
        html += '</div>';
        
        html += '<div style="font-size:10px;color:var(--muted);margin:3px 0">';
        html += 'Flagged ' + flags.length + ' time' + (flags.length > 1 ? 's' : '') + ' · ';
        flags.slice(0, 3).forEach(function(f, i) {
            if (i > 0) html += ', ';
            html += esc(f.username || 'Unknown') + (f.reason ? ' ("' + esc(f.reason) + '")' : '');
        });
        if (flags.length > 3) html += ' and ' + (flags.length - 3) + ' more';
        html += '</div>';
        
        if (isEditing) {
            html += '<div class="edit-form" style="margin-top:6px">';
            html += '<label class="field-label">Question text</label>';
            html += '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q?.text || '') + '</textarea>';
            html += '<label class="field-label">Options</label>';
            for (let i = 0; i < 4; i++) {
                html += '<div class="opt-row">';
                html += '<input type="radio" name="edit-correct" value="' + i + '"' + (q?.correct_answer === i ? ' checked' : '') + ' data-action="edit-correct" />';
                html += '<input class="field" data-action="edit-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) + '" value="' + esc(q?.options?.[i] || '') + '" style="font-size:13px" />';
                html += '</div>';
            }
            html += '<label class="field-label">Explanation</label>';
            html += '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q?.explanation || '') + '</textarea>';
            html += '<button class="btn btn-green" data-action="save-edit-flagged" data-qid="' + qid + '" style="padding:8px">Save & Resolve</button>';
            html += '</div>';
        }
        
        html += '</div>';
    });

    return html;
}

        planOptions += '<option value="' + plan.id + '">' + esc(plan.name) + ' — ₦' +

    let keysHtml = "";
    if (!state.adminKeysLoaded) {
        keysHtml = '<div class="loading-spinner"><div class="spinner"></div><p>Loading keys...</p></div>';
        loadActivationKeys();

        keysHtml = '<p style="font-size:12px;color:var(--faint);text-align:center;padding:12px 0;font-size:13px">No activation keys generated yet.</p>';

// ============================================================
//  EVENT HANDLING
// ============================================================
document.addEventListener('click', function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');

    if (action === 'skip-splash') {
        state.phase = 'app';
        render();
        return;
    }

    if (action === 'open-drawer') {
        state.drawerOpen = true;
        render();
        return;
    }
    if (action === 'close-drawer') {
        state.drawerOpen = false;
        render();
        return;
    }

    if (action === 'set-view') {
        setView(el.getAttribute('data-view'));
        return;
    }

    // Question count selection
    if (action === 'select-q-count') {
        const count = parseInt(el.getAttribute('data-count'), 10);
        state.selectedQuestionCount = count;
        render();
        return;
    }

    // SUBMIT MODAL
    if (action === 'submit-confirm') {
        if (state.submitModalData && state.submitModalData.onConfirm) {
            state.submitModalData.onConfirm();
        }
        return;
    }
    if (action === 'submit-cancel') {
        if (state.submitModalData && state.submitModalData.onCancel) {
            state.submitModalData.onCancel();
        }
        return;
    }

    // ATTEMPT MODAL
    if (action === 'show-attempted-cbt') {
        const questions = state.cbtQuestions.map(function(q, i) {
            const ans = state.cbtAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                idx: i,
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            mode: 'cbt',
            total: state.cbtQuestions.length,
            answered: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-exam') {
        const questions = state.examQuestions.map(function(q, i) {
            const ans = state.examAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                idx: i,
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            mode: 'exam',
            total: state.examQuestions.length,
            answered: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-topic') {
        const questions = state.topicQuestions.map(function(q, i) {
            const ans = state.topicAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                idx: i,
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            mode: 'topic',
            total: state.topicQuestions.length,
            answered: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-lit') {
        const questions = state.litQuestions.map(function(q, i) {
            const ans = state.litAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                idx: i,
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            mode: 'lit',
            total: state.litQuestions.length,
            answered: state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'show-attempted-mock') {
        const questions = state.mockQuestions.map(function(q, i) {
            const ans = state.mockAnswers[i];
            const isAnswered = ans !== null && ans !== undefined;
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            return {
                idx: i,
                number: i + 1,
                subject: subj ? subj.name : q.subject_id,
                answered: isAnswered,
            };
        });
        state.showAttemptModal = true;
        state.attemptModalData = {
            mode: 'mock',
            total: state.mockQuestions.length,
            answered: state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            questions: questions,
        };
        render();
        return;
    }
    if (action === 'attempt-close') {
        state.showAttemptModal = false;
        state.attemptModalData = null;
        render();
        return;
    }

    if (action === 'goto-attempt-question') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const mode = el.getAttribute('data-mode');
        state.showAttemptModal = false;
        state.attemptModalData = null;
        if (mode === 'cbt') {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
        } else if (mode === 'exam') {
            state.examIndex = idx;
        } else if (mode === 'topic') {
            state.topicIndex = idx;
        } else if (mode === 'lit') {
            state.litIndex = idx;
        } else if (mode === 'mock') {
            state.mockIndex = idx;
            const q = state.mockQuestions[idx];
            if (q) state.mockCurrentSubject = q.subject_id;
        }
        render();
        return;
    }

    // GOTO QUESTION
    if (action === 'show-goto-cbt') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'cbt',
            total: state.cbtQuestions.length,
            current: state.cbtIndex,
            answers: state.cbtAnswers,
            answered: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
        };
        render();
        return;
    }
    if (action === 'show-goto-exam') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'exam',
            total: state.examQuestions.length,
            current: state.examIndex,
            answers: state.examAnswers,
            answered: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
        };
        render();
        return;
    }
    if (action === 'show-goto-topic') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'topic',
            total: state.topicQuestions.length,
            current: state.topicIndex,
            answers: state.topicAnswers,
            answered: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
        };
        render();
        return;
    }
    if (action === 'show-goto-lit') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'lit',
            total: state.litQuestions.length,
            current: state.litIndex,
            answers: state.litAnswers,
            answered: state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
        };
        render();
        return;
    }
    if (action === 'show-goto-mock') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'mock',
            total: state.mockQuestions.length,
            current: state.mockIndex,
            answers: state.mockAnswers,
            answered: state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
        };
        render();
        return;
    }
    if (action === 'goto-close') {
        state.showGotoModal = false;
        state.gotoModalData = null;
        render();
        return;
    }
    if (action === 'goto-q-select') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const mode = el.getAttribute('data-mode');
        state.showGotoModal = false;
        state.gotoModalData = null;
        if (mode === 'cbt') {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
        } else if (mode === 'exam') {
            state.examIndex = idx;
        } else if (mode === 'topic') {
            state.topicIndex = idx;
        } else if (mode === 'lit') {
            state.litIndex = idx;
        } else if (mode === 'mock') {
            state.mockIndex = idx;
            const q = state.mockQuestions[idx];
            if (q) state.mockCurrentSubject = q.subject_id;
        }
        render();
        return;
    }
    if (action === 'prevent-close') return;

    // CALCULATOR
    if (action === 'toggle-calculator') {
        if (state.settingsCache.calculatorEnabled !== false) {
            state.showCalculator = !state.showCalculator;
            if (state.showCalculator) {
                state.calcDisplay = "0";
                state.calcExpression = "";
                state.calcJustEvaluated = false;
            }
            render();
        }
        return;
    }
    if (action === 'calc-close') {
        state.showCalculator = false;
        render();
        return;
    }
    
    if (action === 'calc-number') {
        const val = el.getAttribute('data-value');
        if (state.calcJustEvaluated) {
            state.calcDisplay = val;
            state.calcExpression = val;
            state.calcJustEvaluated = false;
        } else {
            if (state.calcDisplay === "0" && val !== ".") {
                state.calcDisplay = val;
            } else {
                state.calcDisplay += val;
            }
            state.calcExpression += val;
        }
        render();
        return;
    }
    if (action === 'calc-operator') {
        const val = el.getAttribute('data-value');
        const lastChar = state.calcExpression.slice(-1);
        if (['+', '-', '×', '÷'].includes(lastChar)) {
            state.calcExpression = state.calcExpression.slice(0, -1) + val;
            state.calcDisplay = state.calcDisplay.slice(0, -1) + val;
        } else {
            state.calcExpression += val;
            state.calcDisplay += val;
        }
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-equals') {
        try {
            let expr = state.calcExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/');
            const result = Function('"use strict"; return (' + expr + ')')();
            state.calcDisplay = String(result);
            state.calcExpression = String(result);
            state.calcJustEvaluated = true;
        } catch (e) {
            state.calcDisplay = 'Error';
        }
        render();
        return;
    }
    if (action === 'calc-clear') {
        state.calcDisplay = "0";
        state.calcExpression = "";
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-delete') {
        if (state.calcDisplay.length > 1) {
            state.calcDisplay = state.calcDisplay.slice(0, -1);
            state.calcExpression = state.calcExpression.slice(0, -1);
        } else {
            state.calcDisplay = "0";
            state.calcExpression = "";
        }
        render();
        return;
    }

    // AUTH
    if (action === 'dismiss-activate-icon') {
        state.activateIconDismissed = true;
        render();
        return;
    }

    if (action === 'show-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'show-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'switch-to-reset') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = true;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'close-auth') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'switch-to-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'switch-to-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'do-login') {
        const email = document.getElementById('login-email')?.value?.trim() || '';
        const password = document.getElementById('login-password')?.value || '';
        state.loginEmail = email;
        state.loginPassword = password;
        if (!email || !password) { state.authError = 'Please enter both email/username and password.';
            render(); return; }
        signIn(email, password);
        return;
    }
    if (action === 'do-signup') {
        const username = document.getElementById('signup-username')?.value?.trim() || '';
        const email = document.getElementById('signup-email')?.value?.trim() || '';
        const password = document.getElementById('signup-password')?.value || '';
        const confirm = document.getElementById('signup-confirm')?.value || '';
        state.signupUsername = username;
        state.signupEmail = email;
        state.signupPassword = password;
        state.signupConfirm = confirm;
        if (!username) { state.authError = 'Please choose a username.';
            render(); return; }
        if (!email) { state.authError = 'Please enter your email address.';
            render(); return; }
        if (password.length < 6) { state.authError = 'Password must be at least 6 characters.';
            render(); return; }
        if (password !== confirm) { state.authError = 'Passwords do not match.';
            render(); return; }
        signUp(username, email, password);
        return;
    }
    if (action === 'do-reset') {
        const email = document.getElementById('reset-email')?.value?.trim() || '';
        state.resetEmail = email;
        if (!email) { state.resetError = 'Please enter your email address.';
            render(); return; }
        sendPasswordReset(email);
        return;
    }
    if (action === 'do-password-reset') {
        const password = document.getElementById('reset-new-password')?.value || '';
        const confirm = document.getElementById('reset-confirm-password')?.value || '';
        state.resetPassword = password;
        state.resetConfirm = confirm;
        
        if (password.length < 6) { state.resetError = 'Password must be at least 6 characters.';
            render(); return; }
        if (password !== confirm) { state.resetError = 'Passwords do not match.';
            render(); return; }
        
        updatePassword(password);
        return;
    }
    if (action === 'reset-goto-login') {
        const url = new URL(window.location);
        url.searchParams.delete('reset');
        window.history.replaceState({}, '', url);
        state.resetSuccess = false;
        state.showLogin = true;
        render();
        return;
    }
    if (action === 'toggle-password') {
        const field = el.getAttribute('data-field');
        if (field) {
            state.showPassword[field] = !state.showPassword[field];
            render();
        }
        return;
    }
    if (action === 'sign-out') {
        signOut();
        return;
    }

    // DARK MODE
    if (action === 'toggle-dark-mode') {
        state.darkMode = !state.darkMode;
        storage.set('darkMode', state.darkMode ? 'true' : 'false');
        if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        render();
        return;
    }

    // WHATSAPP SHARE - Share App Link
    if (action === 'whatsapp-share') {
        const shareUrl = 'https://myutme.name.ng';
        const shareText = '📚 Check out MyUTME — the best JAMB CBT practice app! Practice real UTME questions, take mock exams, and track your progress. Get it here: ' + shareUrl;
        const waUrl = 'https://wa.me/?text=' + encodeURIComponent(shareText);
        window.open(waUrl, '_blank');
        return;
    }

    // Profile editing
    if (action === 'start-profile-edit') {
        state.profileEditing = true;
        state.profileEditError = null;
        render();
        return;
    }

    if (action === 'cancel-profile-edit') {
        state.profileEditing = false;
        state.profileEditError = null;
        render();
        return;
    }

    if (action === 'save-profile-edit') {
        const newUsername = document.getElementById('edit-profile-username')?.value?.trim() || '';
        const newEmail = document.getElementById('edit-profile-email')?.value?.trim() || '';

        if (!newUsername) {
            state.profileEditError = 'Username cannot be empty.';
            render();
            return;
        }
        if (!newEmail || !newEmail.includes('@')) {
            state.profileEditError = 'Enter a valid email.';
            render();
            return;
        }

        state.profileEditLoading = true;
        state.profileEditError = null;
        render();

        (async function() {
            try {
                if (newUsername !== state.profile.name) {
                    const { data: existing, error: checkErr } = await supabase
                        .from('profiles')
                        .select('id')
                        .eq('username', newUsername)
                        .neq('id', state.authUser.id)
                        .maybeSingle();

                    if (checkErr) {
                        state.profileEditError = 'Could not check username availability.';
                        state.profileEditLoading = false;
                        render();
                        return;
                    }

                    if (existing) {
                        state.profileEditError = 'That username is already taken.';
                        state.profileEditLoading = false;
                        render();
                        return;
                    }

                    const { error: updateErr } = await supabase
                        .from('profiles')
                        .update({ username: newUsername })
                        .eq('id', state.authUser.id);

                    if (updateErr) {
                        state.profileEditError = 'Error updating username: ' + updateErr.message;
                        state.profileEditLoading = false;
                        render();
                        return;
                    }
                }

                if (newEmail !== state.profile.email) {
                    const { error: emailErr } = await supabase.auth.updateUser({ email: newEmail });
                    if (emailErr) {
                        state.profileEditError = 'Email update failed: ' + emailErr.message;
                        state.profileEditLoading = false;
                        render();
                        return;
                    }

                    const { error: updateErr } = await supabase
                        .from('profiles')
                        .update({ email: newEmail })
                        .eq('id', state.authUser.id);

                    if (updateErr) {
                        state.profileEditError = 'Email saved but profile update failed: ' + updateErr.message;
                        state.profileEditLoading = false;
                        render();
                        return;
                    }

                    showToast('Username saved! Check your new email to confirm the change.', 'success');
                } else {
                    showToast('Profile updated!', 'success');
                }

                state.profile.name = newUsername;
                state.formName = newUsername;
                state.profile.email = newEmail;
                state.formEmail = newEmail;
                storage.set('profile', JSON.stringify(state.profile));

                state.profileEditing = false;
                state.profileEditLoading = false;
                render();

            } catch (err) {
                console.warn('Save profile error:', err);
                state.profileEditError = err.message || 'Could not save changes.';
                state.profileEditLoading = false;
                render();
            }
        })();
        return;
    }

    // CBT MODE SELECTION
    if (action === 'cbt-mode') {
        state.cbtMode = el.getAttribute('data-mode');
        state.cbtSelected = [];
        render();
        return;
    }

    if (action === 'toggle-cbt-subject') {
        const id = el.getAttribute('data-subject');
        const i = state.cbtSelected.indexOf(id);
        const isFull = state.cbtMode === 'full';
        const max = isFull ? (state.settingsCache.cbtSubjectCount || 3) : 1;
        if (i !== -1) state.cbtSelected.splice(i, 1);
        else if (state.cbtSelected.length < max) state.cbtSelected.push(id);
        render();
        return;
    }

    // START CBT
    if (action === 'start-cbt') {
        // Get hours and minutes from inputs
        const hoursInput = document.getElementById('cbt-hours');
        const minutesInput = document.getElementById('cbt-minutes');
        if (hoursInput && minutesInput) {
            const h = parseInt(hoursInput.value) || 0;
            const m = parseInt(minutesInput.value) || 0;
            const totalMinutes = h * 60 + m;
            const isFull = state.cbtMode === 'full';
            if (isFull) {
                state.settingsCache.cbtTimeLimit = totalMinutes || 1;
            } else {
                state.settingsCache.subjectTimeLimit = totalMinutes || 1;
            }
        }
        startCbt();
        return;
    }

    if (action === 'start-literature-cbt') {
        startLiteratureCbt();
        return;
    }

    // CBT EXAM ACTIONS
    if (action === 'cbt-answer') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        state.cbtAnswers[state.cbtIndex] = idx;
        render();
        return;
    }

    if (action === 'cbt-goto') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        if (idx >= 0 && idx < state.cbtQuestions.length) {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
            render();
        }
        return;
    }

    if (action === 'switch-cbt-subject') {
        const sid = el.getAttribute('data-subject');
        const qs = getQuestionsForSubject(sid, state.cbtSubjectQuestions);
        if (qs.length > 0) {
            state.cbtCurrentSubject = sid;
            state.cbtIndex = qs[0];
            render();
        }
        return;
    }

    if (action === 'cbt-submit') {
        if (state.cbtSubmitted) return;
        const subjectMap = {};
        state.cbtQuestions.forEach(function(q, i) {
            if (!subjectMap[q.subject_id]) {
                const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
                subjectMap[q.subject_id] = {
                    name: subj ? subj.name : q.subject_id,
                    total: 0,
                    answered: 0,
                    unanswered: 0,
                };
            }
            subjectMap[q.subject_id].total++;
            const isAnswered = state.cbtAnswers[i] !== null && state.cbtAnswers[i] !== undefined;
            if (isAnswered) subjectMap[q.subject_id].answered++;
            else subjectMap[q.subject_id].unanswered++;
        });
        const subjectSummaries = Object.values(subjectMap);
        const totalAnswered = state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
        const totalQuestions = state.cbtQuestions.length;
        
        const hasEnglish = state.cbtQuestions.some(function(q) { return q.subject_id === 'eng'; });
        if (hasEnglish && state.authUser) {
            const submittedBatches = JSON.parse(storage.get('submittedBatches_' + state.authUser.id) || '[]');
            const currentBatch = state.englishBatchTracker || 1;
            
            if (submittedBatches.indexOf(currentBatch) === -1) {
                submittedBatches.push(currentBatch);
                storage.set('submittedBatches_' + state.authUser.id, JSON.stringify(submittedBatches));
            }
            
            let nextBatch = 1;
            for (let i = 1; i <= 6; i++) {
                if (submittedBatches.indexOf(i) === -1) {
                    nextBatch = i;
                    break;
                }
            }
            
            if (submittedBatches.length >= 6) {
                nextBatch = 1;
                storage.set('submittedBatches_' + state.authUser.id, JSON.stringify([]));
            }
            
            state.englishBatchTracker = nextBatch;
            storage.set('englishBatchTracker_' + state.authUser.id, String(nextBatch));
        }
        
        state.showSubmitModal = true;
        state.submitModalData = {
            total: totalQuestions,
            answered: totalAnswered,
            subjects: subjectSummaries,
            isMock: false,
            onConfirm: function() {
                state.showSubmitModal = false;
                state.submitModalData = null;
                state.cbtSubmitted = true;
                state.cbtFinished = true;
                state.currentEnglishPassage = null;
                state.hasPassage = false;
                state.passageRead = false;
                state.passageQuestionIds = [];
                if (state.cbtTimer) { clearInterval(state.cbtTimer);
                    state.cbtTimer = null; }
                render();
            },
            onCancel: function() {
                state.showSubmitModal = false;
                state.submitModalData = null;
                render();
            }
        };
        render();
        return;
    }

    if (action === 'cbt-exit') {
        if (state.cbtTimer) { clearInterval(state.cbtTimer);
            state.cbtTimer = null; }
        state.cbtQuestions = [];
        state.cbtIndex = 0;
        state.cbtAnswers = [];
        state.cbtFinished = false;
        state.cbtSubmitted = false;
        state.cbtHistorySaved = false;
        state.cbtSelected = [];
        state.cbtSubjectQuestions = {};
        state.cbtSubjectOrder = [];
        state.cbtCurrentSubject = null;
        state.currentEnglishPassage = null;
        state.hasPassage = false;
        state.passageRead = false;
        state.view = 'home';
        render();
        return;
    }
    if (action === 'cbt-toggle-review') {
        state.cbtReviewMode = !state.cbtReviewMode;
        render();
        return;
    }

    if (action === 'passage-done') {
        state.passageRead = true;
        if (state.passageQuestionIds && state.passageQuestionIds.length > 0) {
            const firstPassageId = state.passageQuestionIds[0];
            const firstIndex = state.cbtQuestions.findIndex(function(q) { return q.id === firstPassageId; });
            if (firstIndex !== -1) {
                state.cbtIndex = firstIndex;
                const q = state.cbtQuestions[state.cbtIndex];
                if (q) state.cbtCurrentSubject = q.subject_id;
            }
        }
        render();
        return;
    }
    if (action === 'show-passage') {
        state.showPassageModal = true;
        render();
        return;
    }

    if (action === 'close-passage') {
        state.showPassageModal = false;
        render();
        return;
    }

    // EXAM MODE
    if (action === 'select-exam-subject') {
        const id = el.getAttribute('data-subject');
        state.examSubject = state.examSubject === id ? null : id;
        render();
        return;
    }

    if (action === 'start-exam') {
        const hoursInput = document.getElementById('exam-hours');
        const minutesInput = document.getElementById('exam-minutes');
        if (hoursInput && minutesInput) {
            const h = parseInt(hoursInput.value) || 0;
            const m = parseInt(minutesInput.value) || 0;
            state.settingsCache.examTimeLimit = h * 60 + m || 1;
        }
        startExam();
        return;
    }

    if (action === 'exam-answer') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        state.examAnswers[state.examIndex] = idx;
        render();
        return;
    }

    if (action === 'exam-next') {
        if (state.examIndex < state.examQuestions.length - 1) {
            state.examIndex++;
            render();
        }
        return;
    }

    if (action === 'exam-prev') {
        if (state.examIndex > 0) {
            state.examIndex--;
            render();
        }
        return;
    }

    if (action === 'exam-submit') {
        if (state.examSubmitted) return;
        const subjectMap = {};
        state.examQuestions.forEach(function(q, i) {
            if (!subjectMap[q.subject_id]) {
                const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
                subjectMap[q.subject_id] = {
                    name: subj ? subj.name : q.subject_id,
                    total: 0,
                    answered: 0,
                    unanswered: 0,
                };
            }
            subjectMap[q.subject_id].total++;
            const isAnswered = state.examAnswers[i] !== null && state.examAnswers[i] !== undefined;
            if (isAnswered) subjectMap[q.subject_id].answered++;
            else subjectMap[q.subject_id].unanswered++;
        });
        const subjectSummaries = Object.values(subjectMap);
        const totalAnswered = state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
        const totalQuestions = state.examQuestions.length;
        
        state.showSubmitModal = true;
        state.submitModalData = {
            total: totalQuestions,
            answered: totalAnswered,
            subjects: subjectSummaries,
            isMock: false,
            onConfirm: function() {
                state.showSubmitModal = false;
                state.submitModalData = null;
                state.examSubmitted = true;
                state.examFinished = true;
                render();
            },
            onCancel: function() {
                state.showSubmitModal = false;
                state.submitModalData = null;
                render();
            }
        };
        render();
        return;
    }

    if (action === 'exam-exit') {
        state.examQuestions = [];
        state.examIndex = 0;
        state.examAnswers = [];
        state.examFinished = false;
        state.examSubmitted = false;
        state.examHistorySaved = false;
        state.view = 'home';
        render();
        return;
    }

    if (action === 'exam-toggle-review') {
        state.examReviewMode = !state.examReviewMode;
        render();
        return;
    }

    // TOPICS
    if (action === 'select-topic-subject') {
        const id = el.getAttribute('data-subject');
        state.topicSubject = state.topicSubject === id ? null : id;
        state.topicId = null;
        state.topicsLoaded = false;
        state.topicsList = [];
        state.topicsSubjectId = null;
        render();
        return;
    }

    if (action === 'select-topic') {
        state.topicId = el.getAttribute('data-topic');
        render();
        return;
    }

    // ADMIN TOPIC PRACTICE MANAGEMENT
    if (action === 'admin-create-topic') {
        const subjectId = el.getAttribute('data-subject');
        const name = (document.getElementById('admin-new-topic-name')?.value || '').trim();
        if (!name) { showToast('Enter a topic name.', 'error'); return; }
        addTopicOffline(subjectId, name).then(function() {
            showToast('Topic created!', 'success');
            state.admin.newTopicName = '';
            state.admin.adminTopicsLoaded = false;
            loadAdminTopics(subjectId);
        }).catch(function(err) {
            console.error('Create topic error:', err);
            showToast('Error creating topic.', 'error');
        });
        return;
    }

    if (action === 'admin-select-topic') {
        const topicId = el.getAttribute('data-topicid');
        state.admin.adminSelectedTopicId = topicId;
        state.admin.adminTopicQuestionsLoaded = false;
        state.admin.adminTopicQuestions = [];
        state.admin.editingQuestionId = null;
        loadAdminTopicQuestions(topicId);
        return;
    }

    if (action === 'admin-delete-topic') {
        const topicId = el.getAttribute('data-topicid');
        if (!confirm('Delete this topic and all its questions?')) return;
        deleteTopicOffline(topicId).then(function() {
            showToast('Topic deleted.', 'success');
            if (state.admin.adminSelectedTopicId === topicId) {
                state.admin.adminSelectedTopicId = null;
            }
            state.admin.adminTopicsLoaded = false;
            loadAdminTopics(state.admin.adminTopicSubject);
        }).catch(function(err) {
            console.error('Delete topic error:', err);
            showToast('Error deleting topic.', 'error');
        });
        return;
    }

    if (action === 'admin-add-topic-question') {
        const topicId = el.getAttribute('data-topicid');
        const text = state.admin.qText || '';
        const opts = state.admin.qOpts.map(function(o) { return o || ''; });
        const explanation = state.admin.qExplanation || '';

        if (!text || opts.some(function(o) { return !o; })) {
            showToast('Fill in question text and all 4 options.', 'error');
            return;
        }

        addTopicQuestionOffline(topicId, {
            text: text,
            options: opts,
            correct_answer: state.admin.qCorrect,
            explanation: explanation,
        }).then(function() {
            showToast('Question added!', 'success');
            state.admin.qText = '';
            state.admin.qOpts = ['', '', '', ''];
            state.admin.qCorrect = 0;
            state.admin.qExplanation = '';
            state.admin.adminTopicQuestionsLoaded = false;
            state.admin.adminTopicsLoaded = false;
            loadAdminTopicQuestions(topicId);
            loadAdminTopics(state.admin.adminTopicSubject);
        }).catch(function(err) {
            console.error('Add topic question error:', err);
            showToast('Error adding question.', 'error');
        });
        return;
    }

    if (action === 'admin-delete-topic-question') {
        const qid = el.getAttribute('data-qid');
        if (!confirm('Delete this question?')) return;
        deleteTopicQuestionOffline(qid).then(function() {
            showToast('Question deleted.', 'success');
            state.admin.adminTopicQuestionsLoaded = false;
            state.admin.adminTopicsLoaded = false;
            loadAdminTopicQuestions(state.admin.adminSelectedTopicId);
            loadAdminTopics(state.admin.adminTopicSubject);
        }).catch(function(err) {
            console.error('Delete topic question error:', err);
            showToast('Error deleting question.', 'error');
        });
        return;
    }

    if (action === 'admin-save-topic-question-edit') {
        const qid = el.getAttribute('data-qid');
        const text = document.getElementById('edit-text')?.value?.trim() || '';
        const explanation = document.getElementById('edit-explanation')?.value?.trim() || '';
        const options = [];
        for (let i = 0; i < 4; i++) {
            const opt = document.querySelector('[data-action="edit-opt"][data-idx="' + i + '"]')?.value?.trim() || '';
            options.push(opt);
        }
        const correctRadio = document.querySelector('[data-action="edit-correct"]:checked');
        const correct = correctRadio ? parseInt(correctRadio.value) : 0;

        if (!text || options.some(function(o) { return !o; })) {
            showToast('Fill in all fields.', 'error');
            return;
        }

        updateTopicQuestionOffline(qid, {
            text: text,
            options: options,
            correct_answer: correct,
            explanation: explanation,
        }).then(function() {
            showToast('Question updated!', 'success');
            state.admin.editingQuestionId = null;
            state.admin.adminTopicQuestionsLoaded = false;
            loadAdminTopicQuestions(state.admin.adminSelectedTopicId);
        }).catch(function(err) {
            console.error('Update topic question error:', err);
            showToast('Error updating question.', 'error');
        });
        return;
    }
