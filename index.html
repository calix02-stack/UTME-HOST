    } else if (action === 'qform-text') state.admin.qText = e.target.value;
    else if (action === 'qform-explanation') state.admin.qExplanation = e.target.value;
    else if (action === 'qform-opt') {
        const idx = parseInt(e.target.getAttribute('data-idx'), 10);
        state.admin.qOpts[idx] = e.target.value;
    } else if (id === 'admin-json-import') {
        state.admin.jsonImportText = e.target.value;
    }
});

// ============================================================
//  INIT
// ============================================================
async function init() {
    const darkPref = storage.get('darkMode');
    if (darkPref === 'true') {
        state.darkMode = true;
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    const hasSeenSplash = storage.get('hasSeenSplash');
    if (hasSeenSplash) {
        state.phase = 'app';
    }
    render();

    if (!hasSeenSplash) {
        storage.set('hasSeenSplash', 'true');
        setTimeout(function() {
            if (state.phase === 'splash') {
                state.phase = 'app';
                render();
            }
        }, 5000);
    }

    if (usingOfflineSupabaseStub && navigator.onLine) {
        upgradeSupabaseClientIfNeeded();
    }

    await loadSettings();
    await checkAuthSession();
    // Restore session snapshot after auth is ready
    const restored = restoreSessionSnapshot();
    if (restored) {
        // Re-route to the restored view
        const examViews = ['cbt-exam', 'exam-exam', 'topic-exam', 'lit-exam', 'mock-exam'];
        if (examViews.indexOf(state.view) !== -1) {
            // Resume timers if needed
            if (state.view === 'cbt-exam' && state.cbtTimer === null && state.cbtTimeLeft > 0 && !state.cbtSubmitted) {
                state.cbtTimer = setInterval(function() {
                    state.cbtTimeLeft--;
                    if (state.cbtTimeLeft <= 0) {
                        clearInterval(state.cbtTimer);
                        state.cbtTimer = null;
                        if (!state.cbtSubmitted) {
                            const hasAnswers = state.cbtAnswers.some(function(a) { return a !== null && a !== undefined; });
                            if (hasAnswers) {
                                state.cbtSubmitted = true;
                                state.cbtFinished = true;
                                showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                            } else {
                                state.cbtSubmitted = false;
                                state.cbtFinished = true;
                                showToast('⏰ Time\'s up! No answers recorded.', '');
                            }
                        }
                        render();
                    } else {
                        render();
                    }
                }, 1000);
            }
            if (state.view === 'mock-exam' && state.mockTimer === null && state.mockTimeLeft > 0 && !state.mockSubmitted) {
                state.mockTimer = setInterval(function() {
                    state.mockTimeLeft--;
                    if (state.mockTimeLeft <= 0) {
                        clearInterval(state.mockTimer);
                        state.mockTimer = null;
                        submitMockExam(true);
                    } else {
                        render();
                    }
                }, 1000);
            }
            if (state.view === 'topic-exam' && state.topicTimer === null && state.topicTimeLeft > 0 && !state.topicSubmitted) {
                state.topicTimer = setInterval(function() {
                    state.topicTimeLeft--;
                    if (state.topicTimeLeft <= 0) {
                        clearInterval(state.topicTimer);
                        state.topicTimer = null;
                        if (!state.topicSubmitted) {
                            const hasAnswers = state.topicAnswers.some(function(a) { return a !== null && a !== undefined; });
                            if (hasAnswers) {
                                state.topicSubmitted = true;
                                state.topicFinished = true;
                                showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                            } else {
                                state.topicSubmitted = false;
                                state.topicFinished = true;
                                showToast('⏰ Time\'s up! No answers recorded.', '');
                            }
                        }
                        render();
                    } else {
                        render();
                    }
                }, 1000);
            }
            if (state.view === 'lit-exam' && state.litTimer === null && state.litTimeLeft > 0 && !state.litSubmitted) {
                state.litTimer = setInterval(function() {
                    state.litTimeLeft--;
                    if (state.litTimeLeft <= 0) {
                        clearInterval(state.litTimer);
                        state.litTimer = null;
                        if (!state.litSubmitted) {
                            const hasAnswers = state.litAnswers.some(function(a) { return a !== null && a !== undefined; });
                            if (hasAnswers) {
                                state.litSubmitted = true;
                                state.litFinished = true;
                                showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                            } else {
                                state.litSubmitted = false;
                                state.litFinished = true;
                                showToast('⏰ Time\'s up! No answers recorded.', '');
                            }
                        }
                        render();
                    } else {
                        render();
                    }
                }, 1000);
            }
        }
    }
    if (typeof seedOfflineDataIfNeeded === 'function') {
        await seedOfflineDataIfNeeded();
    } else {
        console.warn('seedOfflineDataIfNeeded is not defined — skipping offline seed.');
    }
    render();

    // Auto-sync per-subject question files
    const localQuestionCounts = await loadAllQuestionsCountOffline();
    const hasNoLocalQuestions = Object.keys(localQuestionCounts).length === 0;
    const lastSync = parseInt(storage.get('lastSubjectFileSync') || '0', 10);
    const syncIsStale = Date.now() - lastSync > 12 * 60 * 60 * 1000;

    if (hasNoLocalQuestions || syncIsStale) {
        const subjectIds = SUBJECTS.map(function(s) { return s.id; });
        if (window.OfflineDB && typeof window.OfflineDB.syncAllSubjectFiles === 'function') {
            window.OfflineDB.syncAllSubjectFiles(subjectIds).then(function(results) {
                const foundAnySubjectFile = Object.keys(results).some(function(k) { return !!results[k]; });
                if (foundAnySubjectFile || !hasNoLocalQuestions) {
                    storage.set('lastSubjectFileSync', String(Date.now()));
                } else {
                    console.warn('Subject file sync found nothing (offline or files missing) — will retry on next load.');
                }
                if (state.view === 'admin') {
                    loadAllQuestionsForAdmin();
                    loadAllQuestionsCountOffline();
                }
                render();
            });
        } else {
            console.warn('window.OfflineDB.syncAllSubjectFiles is not defined — skipping subject file sync.');
        }
    }

    // Check for expired users on init and periodically
    await checkAndDeactivateExpiredUsers();
    setInterval(function() {
        checkAndDeactivateExpiredUsers();
    }, 5 * 60 * 1000); // Every 5 minutes

    loadAllUsers();
    loadLeaderboard('cbt');
    loadNotifications();
    loadActivationPlans();
    loadFlaggedCount();
    if (state.authUser) cacheAllDataForOffline();

    addLog(state.authUser ? state.authUser.id : null, state.profile.name || 'Guest', 'page_view', 'App opened');
    if (state.authUser) {
        supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', state.authUser.id).then(function() {});
        setInterval(function() {
            if (state.authUser) {
                supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', state.authUser.id).then(function() {});
            }
        }, 2 * 60 * 1000);
    }
    window.addEventListener('online', function() {
        showToast('Back online — syncing data...', 'success');
        upgradeSupabaseClientIfNeeded();
        cacheAllDataForOffline();
        checkAndDeactivateExpiredUsers();
    });
    window.addEventListener('offline', function() {
        showToast("You're offline. Some features won't work until you're back online.", 'offline');
        render();
    });

    setInterval(function() {
        const examViews = ['cbt-exam', 'exam-exam', 'topic-exam', 'lit-exam', 'mock-exam'];
        if (examViews.indexOf(state.view) !== -1) return;
        loadSettings().then(function(s) {
            state.settingsCache = s;
            render();
        });
    }, 60000);

    // Study reminder tick
    setInterval(checkStudyReminderTick, 60000);
    if (state.authUser) {
        loadStudyReminder();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
            console.warn("SW registration failed:", err);
        });
    });
}

(function () {
    const installBtn = document.getElementById("pwa-install-btn");
    const iosTip = document.getElementById("pwa-ios-tip");
    const iosTipClose = document.getElementById("pwa-ios-tip-close");
    let deferredPrompt = null;

    function isStandalone() {
        return window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;
    }

    if (isStandalone()) {
        return;
    }

    window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.classList.add("show");
    });

    if (installBtn) {
        installBtn.addEventListener("click", async function () {
            if (!deferredPrompt) return;
            installBtn.classList.remove("show");
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            deferredPrompt = null;
        });
    }

    window.addEventListener("appinstalled", function () {
        if (installBtn) installBtn.classList.remove("show");
        if (iosTip) iosTip.classList.remove("show");
        deferredPrompt = null;
    });

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    if (isIOS && isSafari && iosTip) {
        const dismissed = storage.get("pwaIosTipDismissed");
        if (!dismissed) {
            setTimeout(function () { iosTip.classList.add("show"); }, 2500);
        }
    }
    if (iosTipClose) {
        iosTipClose.addEventListener("click", function () {
            iosTip.classList.remove("show");
            storage.set("pwaIosTipDismissed", "true");
        });
    }
})();
