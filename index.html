        '<button class="btn btn-gold" data-action="qform-import-json" style="padding:10px">Import Questions</button>' +
        '</div>'

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + esc(subj ? subj.name : subject) + (year ? ' — ' + year : '') + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="' + backAction + '">' + backLabel + '</button>' +

// ============================================================
function renderAdminTopicManagement() {
    const subjectId = state.admin.adminTopicSubject;

    let subjOpts = '<option value="">Select subject</option>';
    SUBJECTS.filter(function(s) { return s.id !== 'lhm'; }).forEach(function(s) {
        subjOpts += '<option value="' + s.id + '"' + (subjectId === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    });

    let body = '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">Topic Practice Questions</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +
        '</div>' +
        '<label class="field-label">Subject</label>' +
        '<select class="field" id="admin-topic-subject-select" style="margin-bottom:12px;font-size:13px">' + subjOpts + '</select>';

    if (!subjectId) {
        return body + '<p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">Select a subject to manage its topics.</p>';
    }

    if (!state.admin.adminTopicsLoaded) {
        loadAdminTopics(subjectId);
        return body + '<div class="loading-spinner"><div class="spinner"></div><p>Loading topics...</p></div>';
    }

    body += '<div class="card" style="margin-bottom:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add New Topic</p>' +
        '<input class="field" id="admin-new-topic-name" placeholder="Topic name e.g. Algebra" value="' + esc(state.admin.newTopicName || '') + '" style="margin-bottom:6px;font-size:13px" />' +
        '<button class="btn btn-green" data-action="admin-create-topic" data-subject="' + subjectId + '" style="padding:10px">Create Topic</button>' +
        '</div>';

    const topics = state.admin.adminTopicsList || [];
    if (topics.length === 0) {
        body += '<p style="text-align:center;color:var(--faint);padding:12px 0;font-size:13px">No topics yet for this subject.</p>';
        return body;
    }

    body += '<p class="section-label">Topics</p>';
    topics.forEach(function(t) {
        const isSelected = state.admin.adminSelectedTopicId === t.id;
        body += '<div class="admin-mode-card" data-action="admin-select-topic" data-topicid="' + t.id + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name" style="font-size:12px">' + esc(t.name) + (isSelected ? ' (viewing)' : '') + '</span>' +
            '<span class="mode-count" style="font-size:10px">' + (t.question_count || 0) + ' questions</span>' +
            '</div>' +
            '<div class="mode-actions">' +
            '<span class="edit-icon" style="background:var(--danger)" data-action="admin-delete-topic" data-topicid="' + t.id + '" style="font-size:11px;width:24px;height:24px">🗑️</span>' +
            '</div>' +
            '</div>';
    });

    if (!state.admin.adminSelectedTopicId) return body;

    if (!state.admin.adminTopicQuestionsLoaded) {
        loadAdminTopicQuestions(state.admin.adminSelectedTopicId);
        return body + '<div class="loading-spinner"><div class="spinner"></div><p>Loading questions...</p></div>';
    }

    body += '<p class="section-label" style="margin-top:12px">Questions in this topic</p>';
    const tqs = state.admin.adminTopicQuestions || [];
    if (tqs.length === 0) {
        body += '<p style="text-align:center;color:var(--faint);padding:12px 0;font-size:13px">No questions in this topic yet.</p>';
    } else {
        tqs.forEach(function(q) {
            const isEditing = state.admin.editingQuestionId === q.id;
            if (isEditing) {
                let editOptsHtml = "";
                for (let i = 0; i < 4; i++) {
                    editOptsHtml += (
                        '<div class="opt-row">' +
                        '<input type="radio" name="edit-correct" value="' + i + '"' + (q.correct_answer === i ? ' checked' : '') +
                        ' data-action="edit-correct" />' +
                        '<input class="field" data-action="edit-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) +
                        '" value="' + esc(q.options[i] || '') + '" style="font-size:13px" />' +
                        '</div>'
                    );
                }
                body += (
                    '<div class="edit-form">' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:6px">' +
                    '<button class="btn btn-green" style="flex:1;padding:8px" data-action="admin-save-topic-question-edit" data-qid="' + q.id + '">Save</button>' +
                    '<button class="btn btn-outline" style="flex:0.5;padding:8px" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'
                );
            } else {
                let optsList = '<ul class="admin-list">';
                (q.options || []).forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN + ';font-weight:600"' : '') + '>' + esc(o) + (oi === q.correct_answer ? ' ✓' : '') + '</li>';
                });
                optsList += '</ul>';
                body += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id + '">✏️</button>' +
                    '<button class="mini-btn danger" data-action="admin-delete-topic-question" data-qid="' + q.id + '">×</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="q-options">' + optsList + '</div>' +
                    (q.explanation ? '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' + esc(q.explanation) + '</div>' : '') +
                    '</div>'
                );
            }
        });
    }

    let optsHtml = "";
    for (let i = 0; i < 4; i++) {
        optsHtml += (
            '<div class="opt-row">' +
            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ? ' checked' : '') +
            ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) +
            '" value="' + esc(state.admin.qOpts[i]) + '" style="font-size:13px" />' +
            '</div>'
        );
    }

    body += (
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add Question to This Topic</p>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:8px;font-size:13px" placeholder="Enter question...">' +
        esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +
        optsHtml +
        '<label class="field-label">Explanation (shown after answering)</label>' +
        '<textarea class="field" rows="2" data-action="qform-explanation" style="margin-bottom:8px;font-size:13px" placeholder="Explain why this answer is correct...">' +
        esc(state.admin.qExplanation) + '</textarea>' +
        '<button class="btn btn-green" data-action="admin-add-topic-question" data-topicid="' + state.admin.adminSelectedTopicId + '" style="padding:10px">Save Question</button>' +
        '</div>'
    );

    return body;
}

// ============================================================
function renderAdminUsers() {
    if (state.adminSelectedUserId) return renderAdminUserDetail();

    const users = state.allUsers || [];

    if (users.length === 0) {
        if (state.allUsersError) {
            return (
                '<div class="card" style="text-align:center;padding:20px 16px">' +
                '<p style="color:var(--danger);font-weight:700;font-size:13px;margin:0 0 6px">⚠️ Couldn\'t load users</p>' +
                '<p style="color:var(--faint);font-size:11px;margin:0 0 12px;word-break:break-word">' + esc(state.allUsersError) + '</p>' +
                '<button class="btn btn-outline" style="font-size:12px;padding:8px 14px" data-action="admin-tab" data-tab="users">Try again</button>' +
                '</div>'
            );
        }
        return '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No registered users yet.</p></div>';
    }

    let rows = "";
    users.forEach(function(user) {
        const isActive = user.is_active !== false;
        const expiry = user.activation_expiry ? new Date(user.activation_expiry) : null;
        const daysLeft = expiry ? Math.ceil((expiry - new Date()) / (1000 * 60 * 60 * 24)) : null;
        let statusLabel = isActive ? '✅ Active' : '⛔ Inactive';
        if (isActive && daysLeft !== null && daysLeft < 3) statusLabel = '⚠️ ' + daysLeft + 'd left';
        
        const displayName = user.full_name || user.username || 'User';
        const avatarLetter = displayName.trim().charAt(0).toUpperCase();
        const avatarHtml = user.profile_image_url 
            ? '<img src="' + esc(user.profile_image_url) + '" style="width:32px;height:32px;border-radius:999px;object-fit:cover" />'

        const isOnlineNow = user.last_seen && (Date.now() - new Date(user.last_seen).getTime()) < 5 * 60 * 1000;
        
        rows += (
            '<div class="admin-user-row" data-action="admin-view-user" data-userid="' + user.id + '" style="cursor:pointer">' +
            '<div style="display:flex;align-items:center;gap:8px">' +
            '<div style="position:relative">' +
            avatarHtml +
            (isOnlineNow ? '<span style="position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:999px;background:#22c55e;border:2px solid var(--card-bg)"></span>' : '') +
            '</div>' +
            '<div class="user-info">' +
            '<span class="user-name">' + esc(displayName) + '</span>' +
            '<span class="user-email">@' + esc(user.username) + ' · ' + esc(user.email || '') + '</span>' +
            '<span style="font-size:9px;color:' + (isOnlineNow ? '#22c55e' : 'var(--faint)') + '">' + (isOnlineNow ? '🟢 Online now' : '⚪ Last seen ' + (user.last_seen ? formatTimeAgo(user.last_seen) : 'never')) + '</span>' +
            '</div>' +
            '</div>' +
            '<span class="user-status ' + (isActive ? 'active' : 'inactive') + '">' +
            statusLabel +
            '</span>' +
            '<div class="user-actions">' +
            '<button class="mini-btn" data-action="admin-notify-user-btn" data-userid="' + user.id + '" data-username="' + esc(user.username) + '" style="font-size:9px">🔔</button>' +
            (isActive ?

                .id + '" style="font-size:9px">Deactivate</button>' :

                .id + '" style="font-size:9px">Activate</button>'

        '<div style="font-weight:700;font-size:14px;margin-bottom:10px;color:var(--ink)">👥 Total registered users: ' + users.length + '</div>' +
        '<p style="font-size:11px;color:var(--faint);margin:-6px 0 10px">Tap a user to see their full profile, courses, and AI chat history.</p>' +
        rows
    );
}

function renderAdminUserDetail() {

    if (!user) {

        '<p style="font-size:11px;color:var(--faint);margin:2px 0 0">' + esc(user.email || 'No email') + '</p>' +
        '<p style="font-size:11px;font-weight:700;margin:4px 0 0;color:' + (isOnlineNow ? '#22c55e' : 'var(--faint)') + '">' + (isOnlineNow ? '🟢 Online now' : '⚪ Last seen ' + lastSeenStr) + '</p>' +
        '</div>' +
        '</div>'
    );

    // --- Account status + actions card ---
    body += (
        '<div class="card" style="margin-bottom:12px">' +
        '<p style="font-weight:700;font-size:13px;margin:0 0 8px">Account</p>' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span style="color:var(--muted)">Activation status</span><span style="font-weight:600">' + statusLabel + '</span></div>' +
        (registeredStr ? '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span style="color:var(--muted)">Registered</span><span style="font-weight:600">' + registeredStr + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span style="color:var(--muted)">Last seen</span><span style="font-weight:600">' + (isOnlineNow ? 'Online now' : lastSeenStr) + '</span></div>' +

        (isActive ?
            '<button class="btn btn-outline" style="flex:1;font-size:12px" data-action="admin-deactivate-user" data-userid="' + user.id + '">Deactivate</button>' :
            '<button class="btn btn-green" style="flex:1;font-size:12px" data-action="admin-activate-user" data-userid="' + user.id + '">Activate</button>'
        ) +
        '<button class="btn btn-outline" style="flex:1;font-size:12px" data-action="admin-notify-user-btn" data-userid="' + user.id + '" data-username="' + esc(user.username || '') + '">💬 Message</button>' +
        '</div>' +
        '</div>'
    );

    // --- Courses card ---
    let coursesHtml = '';
    if (!state.adminUserDetailLoaded) {
        coursesHtml = '<div class="loading-spinner" style="padding:10px 0"><div class="spinner"></div></div>';
    } else if (state.adminUserEnrollments.length === 0) {
        coursesHtml = '<p style="font-size:12px;color:var(--faint);margin:0">Not enrolled in any course yet.</p>';
    } else {
        state.adminUserEnrollments.forEach(function(e) {
            const course = (state.courses || []).find(function(c) { return c.id === e.course_id; });
            const title = course ? course.title : 'Course (' + e.course_id + ')';
            const when = e.created_at ? new Date(e.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
            coursesHtml += (
                '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)">' +
                '<div><p style="font-size:12.5px;font-weight:600;margin:0">' + esc(title) + '</p><p style="font-size:10px;color:var(--faint);margin:2px 0 0">Enrolled ' + when + '</p></div>' +

    body += (
        '<div class="card" style="margin-bottom:12px">' +
        '<p style="font-weight:700;font-size:13px;margin:0 0 8px">📚 Courses (' + (state.adminUserEnrollments.length || 0) + ')</p>' +
        coursesHtml +
        '</div>'
    );

    // --- AI chat history card ---
    let chatHtml = '';
    if (!state.adminUserDetailLoaded) {
        chatHtml = '<div class="loading-spinner" style="padding:10px 0"><div class="spinner"></div></div>';
    } else if (state.adminUserAiMessages.length === 0) {
        chatHtml = '<p style="font-size:12px;color:var(--faint);margin:0">No AI Tutor chats yet.</p>';
    } else {
        chatHtml += '<div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">';
        state.adminUserAiMessages.forEach(function(m) {
            const isUser = m.sender === 'user';
            chatHtml += (
                '<div style="align-self:' + (isUser ? 'flex-end' : 'flex-start') + ';max-width:85%;background:' + (isUser ? 'var(--green)' : 'var(--bg)') + ';color:' + (isUser ? '#fff' : 'var(--ink)') + ';border-radius:12px;padding:7px 10px;font-size:12px">' +
                renderChatBubbleContent(m.message) +

        chatHtml += '</div>';
    }
    body += (
        '<div class="card" style="margin-bottom:12px">' +
        '<p style="font-weight:700;font-size:13px;margin:0 0 8px">💬 AI Tutor chat history</p>' +
        chatHtml +
        '</div>'
    );

    return (
        '<button class="back-link" data-action="admin-close-user-detail">' + svg("chevleft", 14) + ' Back to Users</button>' +
        body
    );
}

// ============================================================
//  ADMIN FLAGGED
// ============================================================
function renderAdminFlagged() {
    if (state.admin.flaggedLoading) {
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }

    if (!state.admin.flaggedLoaded) {
        state.admin.flaggedLoading = true;
        loadFlaggedQuestions(state.admin.flaggedFilter || 'unresolved').then(function(data) {
            state.admin.flaggedData = data || [];
            state.admin.flaggedLoaded = true;
            state.admin.flaggedLoading = false;
            render();
        });
        
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }
    const data = state.admin.flaggedData || [];
    const filter = state.admin.flaggedFilter || 'unresolved';
    
    const grouped = {};
    data.forEach(function(f) {
        if (!grouped[f.question_id]) grouped[f.question_id] = [];
        grouped[f.question_id].push(f);
    });

    let html = (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">🚩 Flagged Questions</span>' +
        '<div style="display:flex;gap:4px">' +
        '<button class="btn btn-sm ' + (filter === 'unresolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="unresolved" style="font-size:9px;padding:3px 8px">Unresolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'resolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="resolved" style="font-size:9px;padding:3px 8px">Resolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'all' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="all" style="font-size:9px;padding:3px 8px">All</button>' +
        '</div>' +
        '</div>'
    );

    if (Object.keys(grouped).length === 0) {
        html += '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">' + 
            (filter === 'unresolved' ? 'No unresolved flagged questions.' : 'No flagged questions in this filter.') + 
            '</p></div>';
        return html;
    }

    Object.keys(grouped).forEach(function(qid) {
        const flags = grouped[qid];
        const q = flags[0].questions;
        const subj = SUBJECTS.find(function(s) { return s.id === q?.subject_id; });
        const isEditing = state.admin.editingQuestionId === qid;
        
        html += '<div class="saved-question-item">';
        html += '<div class="q-header">';
        html += '<p class="q-text">' + esc(q?.text || 'Question not found') + '</p>';
        html += '<div class="q-actions">';
        if (isEditing) {
            html += '<button class="mini-btn" data-action="cancel-edit" style="font-size:9px">Cancel</button>';
        } else {
            html += '<button class="mini-btn edit" data-action="admin-flagged-edit" data-qid="' + qid + '" style="font-size:9px">✏️</button>';
            if (filter !== 'resolved') {
                html += '<button class="mini-btn primary" data-action="admin-flagged-resolve" data-qid="' + qid + '" style="font-size:9px">✅ Resolve</button>';
            }
        }
        html += '</div>';
        html += '</div>';
        
        html += '<div style="font-size:10px;color:var(--muted);margin:3px 0">';
        html += 'Flagged ' + flags.length + ' time' + (flags.length > 1 ? 's' : '') + ' · ';
        flags.slice(0, 3).forEach(function(f, i) {
            if (i > 0) html += ', ';
            html += esc(f.username || 'Unknown') + (f.reason ? ' ("' + esc(f.reason) + '")' : '');
        });
        if (flags.length > 3) html += ' and ' + (flags.length - 3) + ' more';
        html += '</div>';
        
        if (isEditing) {
            html += '<div class="edit-form" style="margin-top:6px">';
            html += '<label class="field-label">Question text</label>';
            html += '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q?.text || '') + '</textarea>';
            html += '<label class="field-label">Options</label>';
            for (let i = 0; i < 4; i++) {
                html += '<div class="opt-row">';
                html += '<input type="radio" name="edit-correct" value="' + i + '"' + (q?.correct_answer === i ? ' checked' : '') + ' data-action="edit-correct" />';
                html += '<input class="field" data-action="edit-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) + '" value="' + esc(q?.options?.[i] || '') + '" style="font-size:13px" />';
                html += '</div>';
            }
            html += '<label class="field-label">Explanation</label>';
            html += '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q?.explanation || '') + '</textarea>';
            html += '<button class="btn btn-green" data-action="save-edit-flagged" data-qid="' + qid + '" style="padding:8px">Save & Resolve</button>';
            html += '</div>';
        }
        
        html += '</div>';
    });

    return html;
}

// ============================================================
//  EVENT HANDLING
// ============================================================
document.addEventListener('click', function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');

    if (action === 'skip-splash') {
        state.phase = 'app';
        render();
        return;
    }

    if (action === 'open-drawer') {
        state.drawerOpen = true;
        render();
        return;
    }
    if (action === 'close-drawer') {
        state.drawerOpen = false;
        render();
        return;
    }

    if (action === 'set-view') {
        setView(el.getAttribute('data-view'));
        return;
    }
    
    if (action === 'open-subject-modes') {
        state.selectedSubjectId = el.getAttribute('data-subjectid');
        setView('subject-modes');
        return;
    }
    if (action === 'myc-toggle-add') {
        if (state.mycSaving) return;
        state.mycAdding = !state.mycAdding;
        state.mycSwappingSubjectId = null;
        render();
        return;
    }
    if (action === 'myc-swap-subject') {
        if (state.mycSaving) return;
        const sid = el.getAttribute('data-subjectid');
        if (!state.authUser) { showToast('Please log in first.', 'error'); return; }
        state.mycSwappingSubjectId = sid;
        state.mycAdding = true;
        render();
        return;
    }
    if (action === 'myc-add-subject') {
        if (state.mycSaving) return;
        const sid = el.getAttribute('data-subjectid');
        if (!state.authUser) { showToast('Please log in first.', 'error'); return; }
        const course = state.courses.find(function(c) {
            return c.exam_type === 'jamb' && (c.subject_ids || []).length === 1 && c.subject_ids[0] === sid;
        });
        if (!course) { showToast('Course not found for this subject.', 'error'); return; }
        if (blockIfOffline()) return;
        if (!isValidUuid(course.id)) {
            // This subject only has a local placeholder course (no matching
            // row in the database yet) — enrolling would fail with a raw
            // database error, so stop here with a clear explanation instead.
            showToast('This subject isn\'t set up for enrollment yet. Please contact support or try again later.', 'error');
            return;
        }
        if ((course.price || 0) > 0) {
            state.mycAdding = false;
            payForCourse(course);
            return;
        }
        const swapOutSid = state.mycSwappingSubjectId;
        const s = SUBJECTS.find(function(x) { return x.id === sid; });
        const oldSubject = swapOutSid ? SUBJECTS.find(function(x) { return x.id === swapOutSid; }) : null;

        // Lock the UI and close the picker immediately so a second tap can't
        // start an overlapping change while this one is still talking to the server.
        state.mycSaving = true;
        state.mycAdding = false;
        render();

        (async function() {
            const insertRes = await supabase.from('course_enrollments').insert([{
                user_id: state.authUser.id, course_id: course.id, amount: 0,
            }]);
            if (insertRes && insertRes.error) {
                showNetworkAwareError('Could not add ' + (s ? s.name : 'the subject') + ': ' + insertRes.error.message, insertRes.error);
                state.mycSaving = false;
                render();
                return;
            }
            if (!swapOutSid) {
                state.myEnrollmentsLoaded = false;
                await loadMyEnrollments();
                showToast('Added ' + (s ? s.name : 'subject') + '!', 'success');
                state.mycSaving = false;
                render();
                return;
            }

            const oldEnrollments = state.myEnrollments.filter(function(e) {
                const c = state.courses.find(function(cc) { return cc.id === e.course_id; });
                return c && (c.subject_ids || []).length === 1 && c.subject_ids[0] === swapOutSid;
            });

            if (oldEnrollments.length === 0) {
                state.myEnrollmentsLoaded = false;
                await loadMyEnrollments();
                showToast('Added ' + (s ? s.name : 'new subject') + ', but could not find your old ' + (oldSubject ? oldSubject.name : 'subject') + ' enrollment to remove. Please remove it manually.', 'error');
                state.mycSwappingSubjectId = null;
                state.mycSaving = false;
                render();
                return;
            }

            const idsToDelete = oldEnrollments.map(function(e) { return e.id; });
            const delRes = await supabase.from('course_enrollments').delete().in('id', idsToDelete).select();

            state.myEnrollmentsLoaded = false;
            await loadMyEnrollments();

            // Trust nothing — re-check what's ACTUALLY in the database now, since Supabase
            // can silently delete 0 rows (no error) if a row-level-security policy blocks it.
            const stillHasOld = state.myEnrollments.some(function(e) { return idsToDelete.indexOf(e.id) !== -1; });

            if (delRes && delRes.error) {
                showNetworkAwareError('Added ' + (s ? s.name : 'new subject') + ', but removing ' + (oldSubject ? oldSubject.name : 'the old subject') + ' failed: ' + delRes.error.message, delRes.error);
            } else if (stillHasOld) {
                showToast((oldSubject ? oldSubject.name : 'Old subject') + ' could not be removed — check database permissions. ' + (s ? s.name : 'The new subject') + ' was still added.', 'error');
            } else {
                showToast('Swapped ' + (oldSubject ? oldSubject.name : 'subject') + ' for ' + (s ? s.name : 'new subject') + '!', 'success');
            }
            state.mycSwappingSubjectId = null;
            state.mycSaving = false;
            render();
        })().catch(function(err) {
            showNetworkAwareError('Swap failed: ' + (err && err.message ? err.message : 'unknown error'), err);
            state.mycSwappingSubjectId = null;
            state.mycSaving = false;
            render();
        });
        return;
    }
    if (action === 'myc-remove-subject') {
        if (state.mycSaving) return;
        const sid = el.getAttribute('data-subjectid');
        if (!state.authUser) return;
        if (!confirm('Remove this subject from My Subjects?')) return;
        const s = SUBJECTS.find(function(x) { return x.id === sid; });
        const singleSubjectEnrollments = state.myEnrollments.filter(function(e) {
            const c = state.courses.find(function(cc) { return cc.id === e.course_id; });
            return c && (c.subject_ids || []).length === 1 && c.subject_ids[0] === sid;
        });
        if (singleSubjectEnrollments.length === 0) {
            showToast((s ? s.name : 'This subject') + ' is part of a combined course package and can\'t be removed on its own. Please contact support.', 'error');
            return;
        }
        if (blockIfOffline()) return;
        state.mycSaving = true;
        render();
        const idsToDelete = singleSubjectEnrollments.map(function(e) { return e.id; });
        supabase.from('course_enrollments').delete().in('id', idsToDelete).select().then(function(res) {
            if (res && res.error) {
                showNetworkAwareError('Error removing subject: ' + res.error.message, res.error);
                state.mycSaving = false;
                render();
                return;
            }
            state.myEnrollmentsLoaded = false;
            loadMyEnrollments().then(function() {
                const stillHas = enrolledSubjectIds().has(sid);
                showToast(stillHas
                    ? (s ? s.name : 'Subject') + ' could not be removed — check database permissions.'
                    : 'Removed ' + (s ? s.name : 'subject') + '.',
                    stillHas ? 'error' : 'success');
                state.mycSaving = false;
                render();
            });
        }).catch(function(err) {
            showNetworkAwareError('Error removing subject: ' + (err && err.message ? err.message : 'unknown error'), err);
            state.mycSaving = false;
            render();
        });
        return;
    }
    if (action === 'subj-start-cbt') {
        const sid = el.getAttribute('data-subjectid');
        state.cbtMode = 'single';
        state.cbtSelected = [sid];
        startCbt();
        return;
    }
    if (action === 'subj-start-exam') {
        const sid = el.getAttribute('data-subjectid');
        state.examSubject = sid;
        setView('exam');
        return;
    }
    if (action === 'subj-start-topic') {
        const sid = el.getAttribute('data-subjectid');
        state.topicSubject = sid;
        state.topicId = null;
        state.topicsLoaded = false;
        state.topicsList = [];
        state.topicsSubjectId = null;
        setView('topics');
        return;
    }

    if (action === 'dismiss-inapp-banner') {
        dismissInAppBanner();
        return;
    }

    if (action === 'dismiss-activate-icon') {
        state.activateIconDismissed = true;
        render();
        return;
    }

    if (action === 'dismiss-activation-banner') {
        state.showActivationBanner = false;
        render();
        return;
    }
    if (action === 'activation-banner-activate') {
        state.showActivationBanner = false;
        setView('activate');
        return;
    }

    // NOTIFICATION TAB
    if (action === 'notif-tab') {
        state.notifTab = el.getAttribute('data-tab');
        render();
        return;
    }

    // SUBMIT MODAL
    if (action === 'submit-confirm') {
        if (state.submitModalData && state.submitModalData.onConfirm) {
            state.submitModalData.onConfirm();
        }
        return;
    }
    if (action === 'submit-cancel') {
        if (state.submitModalData && state.submitModalData.onCancel) {
            state.submitModalData.onCancel();
        } else {
            state.showSubmitModal = false;
            state.submitModalData = null;
            render();
        }
        return;
    }

    // GOTO QUESTION (replaces attempt modal)
    if (action === 'show-goto-cbt') {
        const bySubject = state.cbtSubjectOrder.map(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const indices = state.cbtSubjectQuestions[sid] || [];
            const startNum = Math.min(...indices);
            return {
                subjectName: subj ? subj.name : sid,
                subjectCode: subj ? subj.code : sid,
                indices: indices,
                startNum: startNum,
            };
        });
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'cbt',
            total: state.cbtQuestions.length,
            current: state.cbtIndex,
            answers: state.cbtAnswers,
            answered: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: bySubject.length > 1 ? bySubject : null,
        };
        render();
        return;
    }
    if (action === 'show-goto-exam') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'exam',
            total: state.examQuestions.length,
            current: state.examIndex,
            answers: state.examAnswers,
            answered: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: null,
        };
        render();
        return;
    }
    if (action === 'show-goto-topic') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'topic',
            total: state.topicQuestions.length,
            current: state.topicIndex,
            answers: state.topicAnswers,
            answered: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: null,
        };
        render();
        return;
    }
    if (action === 'show-goto-lit') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'lit',
            total: state.litQuestions.length,
            current: state.litIndex,
            answers: state.litAnswers,
            answered: state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: null,
        };
        render();
        return;
    }
    if (action === 'show-goto-mock') {
        const bySubject = state.mockSubjectOrder.map(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const indices = state.mockSubjectQuestions[sid] || [];
            const startNum = Math.min(...indices);
            return {
                subjectName: subj ? subj.name : sid,
                subjectCode: subj ? subj.code : sid,
                indices: indices,
                startNum: startNum,
            };
        });
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'mock',
            total: state.mockQuestions.length,
            current: state.mockIndex,
            answers: state.mockAnswers,
            answered: state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: bySubject.length > 1 ? bySubject : null,
        };
        render();
        return;
    }
    if (action === 'goto-close') {
        state.showGotoModal = false;
        state.gotoModalData = null;
        render();
        return;
    }
    if (action === 'goto-q-select') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const mode = el.getAttribute('data-mode');
        state.showGotoModal = false;
        state.gotoModalData = null;
        if (mode === 'cbt') {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
        } else if (mode === 'exam') {
            state.examIndex = idx;
        } else if (mode === 'topic') {
            state.topicIndex = idx;
        } else if (mode === 'lit') {
            state.litIndex = idx;
        } else if (mode === 'mock') {
            state.mockIndex = idx;
            const q = state.mockQuestions[idx];
            if (q) state.mockCurrentSubject = q.subject_id;
        }
        render();
        return;
    }
    if (action === 'prevent-close') return;

    // CALCULATOR
    if (action === 'toggle-calculator') {
        if (state.settingsCache.calculatorEnabled !== false) {
            state.showCalculator = !state.showCalculator;
            if (state.showCalculator) {
                state.calcDisplay = "0";
                state.calcExpression = "";
                state.calcJustEvaluated = false;
                const appInner = document.getElementById('app-inner');
                if (appInner) {
                    const rect = appInner.getBoundingClientRect();
                    state.calcPosition = {
                        x: Math.max(8, rect.right - 296),
                        y: Math.max(8, rect.bottom - 380)
                    };
                } else {
                    state.calcPosition = { x: null, y: null };
                }
            }
            render();
        }
        return;
    }
    if (action === 'calc-close') {
        state.showCalculator = false;
        render();
        return;
    }
    
    // Calculator drag
    if (action === 'calc-drag-start') {
        const modal = el.closest('.calc-modal');
        if (!modal) return;
        const rect = modal.getBoundingClientRect();
        const startX = rect.left;
        const startY = rect.top;
        const offsetX = rect.width / 2;
        const offsetY = 20;
        
        function onMove(ev) {
            const x = (ev.clientX || ev.touches?.[0]?.clientX || 0) - offsetX;
            const y = (ev.clientY || ev.touches?.[0]?.clientY || 0) - offsetY;
            const clampedX = Math.max(0, Math.min(window.innerWidth - rect.width, x));
            const clampedY = Math.max(0, Math.min(window.innerHeight - rect.height - 20, y));
            state.calcPosition = { x: clampedX, y: clampedY };
            modal.style.left = clampedX + 'px';
            modal.style.top = clampedY + 'px';
            render();
        }
        function onEnd() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: true });
        document.addEventListener('touchend', onEnd, { passive: true });
        return;
    }
    
    if (action === 'calc-number') {
        const val = el.getAttribute('data-value');
        if (state.calcJustEvaluated) {
            state.calcDisplay = val;
            state.calcExpression = val;
            state.calcJustEvaluated = false;
        } else {
            if (state.calcDisplay === "0" && val !== ".") {
                state.calcDisplay = val;
            } else {
                state.calcDisplay += val;
            }
            state.calcExpression += val;
        }
        render();
        return;
    }
    if (action === 'calc-operator') {
        const val = el.getAttribute('data-value');
        const lastChar = state.calcExpression.slice(-1);
        if (['+', '-', '×', '÷'].includes(lastChar)) {
            state.calcExpression = state.calcExpression.slice(0, -1) + val;
            state.calcDisplay = state.calcDisplay.slice(0, -1) + val;
        } else {
            state.calcExpression += val;
            state.calcDisplay += val;
        }
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-equals') {
        try {
            let expr = state.calcExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/');
            const result = Function('"use strict"; return (' + expr + ')')();
            state.calcDisplay = String(result);
            state.calcExpression = String(result);
            state.calcJustEvaluated = true;
        } catch (e) {
            state.calcDisplay = 'Error';
        }
        render();
        return;
    }
    if (action === 'calc-clear') {
        state.calcDisplay = "0";
        state.calcExpression = "";
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-delete') {
        if (state.calcDisplay.length > 1) {
            state.calcDisplay = state.calcDisplay.slice(0, -1);
            state.calcExpression = state.calcExpression.slice(0, -1);
        } else {
            state.calcDisplay = "0";
            state.calcExpression = "";
        }
        render();
        return;
    }

    // AUTH
    if (action === 'show-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'show-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'switch-to-reset') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = true;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'close-auth') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'switch-to-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'switch-to-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'do-login') {
        const email = document.getElementById('login-email')?.value?.trim() || '';
        const password = document.getElementById('login-password')?.value || '';
        state.loginEmail = email;
        state.loginPassword = password;
        if (!email || !password) { state.authError = 'Please enter both email/username and password.';
            render(); return; }
        signIn(email, password);
        return;
    }
    if (action === 'do-signup') {
        const fullName = document.getElementById('signup-fullname')?.value?.trim() || '';
        const username = document.getElementById('signup-username')?.value?.trim() || '';
        const email = document.getElementById('signup-email')?.value?.trim() || '';
        const password = document.getElementById('signup-password')?.value || '';
        const confirm = document.getElementById('signup-confirm')?.value || '';
        
        state.signupFullName = fullName;
        state.signupUsername = username;
        state.signupEmail = email;
        state.signupPassword = password;
        state.signupConfirm = confirm;
        
        if (!fullName) { state.authError = 'Please enter your full name.'; render(); return; }
        if (!username) { state.authError = 'Please choose a username.'; render(); return; }
        if (!email) { state.authError = 'Please enter your email address.'; render(); return; }
        if (password.length < 6) { state.authError = 'Password must be at least 6 characters.'; render(); return; }
        if (password !== confirm) { state.authError = 'Passwords do not match.'; render(); return; }
        
        signUp(fullName, username, email, password);
        return;
    }
    if (action === 'do-reset') {
        const email = document.getElementById('reset-email')?.value?.trim() || '';
        state.resetEmail = email;
        if (!email) { state.resetError = 'Please enter your email address.'; render(); return; }
        sendPasswordReset(email);
        return;
    }
    if (action === 'do-password-reset') {
        const password = document.getElementById('reset-new-password')?.value || '';
        const confirm = document.getElementById('reset-confirm-password')?.value || '';
        state.resetPassword = password;
        state.resetConfirm = confirm;
        
        if (password.length < 6) { state.resetError = 'Password must be at least 6 characters.'; render(); return; }
        if (password !== confirm) { state.resetError = 'Passwords do not match.'; render(); return; }
        
        updatePassword(password);
        return;
    }
    if (action === 'reset-goto-login') {
        const url = new URL(window.location);
        url.searchParams.delete('reset');
        window.history.replaceState({}, '', url);
        state.resetSuccess = false;
        state.showLogin = true;
        render();
        return;
    }
    if (action === 'toggle-password') {
        const field = el.getAttribute('data-field');
        if (field) {
            state.showPassword[field] = !state.showPassword[field];
            render();
        }
        return;
    }
    if (action === 'sign-out') {
        signOut();
        return;
    }

    // DARK MODE
    if (action === 'toggle-dark-mode') {
        state.darkMode = !state.darkMode;
        storage.set('darkMode', state.darkMode ? 'true' : 'false');
        if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        render();
        return;
    }

    // WHATSAPP SHARE - Share App Link
    if (action === 'whatsapp-share') {
        const shareUrl = 'https://myutme.name.ng';
        const shareText = '📚 Check out MyUTME — the best JAMB CBT practice app! Practice real UTME questions, take mock exams, and track your progress. Get it here: ' + shareUrl;
        const waUrl = 'https://wa.me/?text=' + encodeURIComponent(shareText);
        window.open(waUrl, '_blank');
        return;
    }

    // Profile editing — now a full page
    if (action === 'start-profile-edit') {
        state.profileEditError = null;
        state.avatarUploadFile = null;
        state.view = 'profile-edit';
        render();
        return;
    }

    if (action === 'cancel-profile-edit') {
        state.profileEditError = null;
        state.avatarUploadFile = null;
        state.view = 'profile';
        render();
        return;
    }

    if (action === 'choose-profile-photo') {
        const input = document.getElementById('profile-edit-avatar-input');
        if (input) input.click();
        return;
    }
    
    // SAVE PROFILE EDIT - updated: only full_name and username, email is NOT editable
    if (action === 'save-profile-edit') {
        const newFullName = document.getElementById('edit-profile-fullname')?.value?.trim() || '';
        const newUsername = document.getElementById('edit-profile-username')?.value?.trim() || '';

        if (!newFullName) {
            state.profileEditError = 'Full name cannot be empty.';
            render();
            return;
        }
        if (!newUsername) {
            state.profileEditError = 'Username cannot be empty.';
            render();
            return;
        }

        state.profileEditLoading = true;
        state.profileEditError = null;
        render();

        (async function() {
            try {
                const updateData = {};
                let usernameChanged = false;

                if (newUsername !== state.profile.name) {
                    const { data: existing, error: checkErr } = await supabase
                        .from('profiles')
                        .select('id')
                        .eq('username', newUsername)
                        .neq('id', state.authUser.id)
                        .maybeSingle();

                    if (checkErr) {
                        state.profileEditError = 'Could not check username availability.';
                        state.profileEditLoading = false;
                        render();
                        return;
                    }

                    if (existing) {
                        state.profileEditError = 'That username is already taken.';
                        state.profileEditLoading = false;
                        render();
                        return;
                    }

                    updateData.username = newUsername;
                    usernameChanged = true;
                }

                if (newFullName !== state.profile.fullName) {
                    updateData.full_name = newFullName;
                }

                if (state.avatarUploadFile && state.avatarUploadFile.dataUrl) {
                    updateData.profile_image_url = state.avatarUploadFile.dataUrl;
                }

                if (Object.keys(updateData).length === 0) {
                    state.profileEditLoading = false;
                    state.view = 'profile';
                    showToast('No changes made.', '');
                    render();
                    return;
                }

                const { error: updateErr } = await supabase
                    .from('profiles')
                    .update(updateData)
                    .eq('id', state.authUser.id);

                if (updateErr) {
                    state.profileEditError = 'Error updating profile: ' + updateErr.message;
                    state.profileEditLoading = false;
                    render();
                    return;
                }

                if (usernameChanged) {
                    state.profile.name = newUsername;
                    state.formName = newUsername;
                }
                if (updateData.full_name !== undefined) {
                    state.profile.fullName = updateData.full_name;
                }
                if (updateData.profile_image_url !== undefined) {
                    state.profile.avatarUrl = updateData.profile_image_url;
                }

                storage.set('profile', JSON.stringify(state.profile));
                showToast('Profile updated!', 'success');
                state.avatarUploadFile = null;
                state.profileEditLoading = false;
                state.view = 'profile';
                render();
                
            } catch (err) {
                console.warn('Save profile error:', err);
                state.profileEditError = err.message || 'Could not save changes.';
                state.profileEditLoading = false;
                render();
            }
        })();
        return;
    }

    // CBT MODE SELECTION
    if (action === 'cbt-mode') {
        state.cbtMode = el.getAttribute('data-mode');
        state.cbtSelected = [];
        render();
        return;
    }

    if (action === 'toggle-cbt-subject') {
        const id = el.getAttribute('data-subject');
        const i = state.cbtSelected.indexOf(id);
        const isFull = state.cbtMode === 'full';
        const max = isFull ? (state.settingsCache.cbtSubjectCount || 3) : 1;
        if (i !== -1) state.cbtSelected.splice(i, 1);
        else if (state.cbtSelected.length < max) state.cbtSelected.push(id);
        render();
        return;
    }

    // START CBT
    if (action === 'start-cbt') {
        startCbt();
        return;
    }

    if (action === 'start-literature-cbt') {
        startLiteratureCbt();
        return;
    }

    // CBT EXAM ACTIONS
    if (action === 'cbt-answer') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        state.cbtAnswers[state.cbtIndex] = idx;
        saveSessionSnapshot();
        render();
        return;
    }

    if (action === 'cbt-goto') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        if (idx >= 0 && idx < state.cbtQuestions.length) {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
            saveSessionSnapshot();
            render();
        }
        return;
    }

    if (action === 'switch-cbt-subject') {
        const sid = el.getAttribute('data-subject');
        const qs = getQuestionsForSubject(sid, state.cbtSubjectQuestions);
        if (qs.length > 0) {
            state.cbtCurrentSubject = sid;
            state.cbtIndex = firstUnansweredOrFirst(qs, state.cbtAnswers);
            saveSessionSnapshot();
            render();
        }
        return;
    }

    if (action === 'cbt-submit') {
        if (state.cbtSubmitted) return;
        const subjectMap = {};
        state.cbtQuestions.forEach(function(q, i) {
            if (!subjectMap[q.subject_id]) {
                const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
                subjectMap[q.subject_id] = {
                    name: subj ? subj.name : q.subject_id,
                    total: 0,
                    answered: 0,
                    unanswered: 0,
                };
            }
            subjectMap[q.subject_id].total++;
            const isAnswered = state.cbtAnswers[i] !== null && state.cbtAnswers[i] !== undefined;
            if (isAnswered) subjectMap[q.subject_id].answered++;
            else subjectMap[q.subject_id].unanswered++;
        });
        const subjectSummaries = Object.values(subjectMap);
        const totalAnswered = state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
        const totalQuestions = state.cbtQuestions.length;
        
        const hasEnglish = state.cbtQuestions.some(function(q) { return q.subject_id === 'eng'; });
        if (hasEnglish && state.authUser) {

                        text: item.text,
                        options: item.options,
                        correct_answer: item.correct_answer,
                        explanation: item.explanation || '',
                    });
                    added++;

                    skipped++;

            (subjectStr ? '📋 Subject Breakdown:\n' + subjectStr + '\n' : '') +
            '✅ ' + entry.answered_count + ' of ' + entry.total_questions + ' answered\n' +
            '━━━━━━━━━━━━━━━━━━━━\n' +
            'Practice smarter with MyUTME';

        if (navigator.share) {
            navigator.share({
                title: 'MyUTME Exam Result — ' + studentName,
                text: text,
            }).catch(function() {});
        } else {
            navigator.clipboard.writeText(text).then(function() {
                showToast('Result copied to clipboard!', 'success');
            }).catch(function() {
                prompt('Copy this result:', text);
            });
        }
        return;
    }

    // REVISE WEAK QUESTIONS - Rebuilt
    if (action === 'revise-select-mode') {
        state.reviseMode = el.getAttribute('data-mode');
        state.reviseView = 'subjects';
        state.reviseIndex = 0;
        render();
        return;
    }
    if (action === 'revise-select-subject') {
        state.reviseSubject = el.getAttribute('data-subject');
        state.reviseView = 'questions';
        state.reviseIndex = 0;
        render();
        return;
    }
    if (action === 'revise-back-to-modes') {
        state.reviseView = 'modes';
        state.reviseMode = null;
        state.reviseSubject = null;
        state.reviseIndex = 0;
        render();
        return;
    }
    if (action === 'revise-back-to-subjects') {
        state.reviseView = 'subjects';
        state.reviseSubject = null;
        state.reviseIndex = 0;
        render();
        return;
    }
    
    if (action === 'revise-next') {
        const mode = state.reviseMode;
        const subjectId = state.reviseSubject;
        let list = state.weakQuestions.filter(function(wq) {
            return (wq.mode || 'unknown') === mode && wq.subject_id === subjectId;
        });
        if (state.reviseIndex < list.length - 1) {
            state.reviseIndex++;
            // Clear state for new question
            const wq = list[state.reviseIndex];
            state.weakQuestionStates['answer_' + wq.id] = undefined;
            delete state.weakQuestionStates['result_' + wq.id];
            render();
        }
        return;
    }
    
    if (action === 'revise-prev') {
        if (state.reviseIndex > 0) {
            state.reviseIndex--;
            const mode = state.reviseMode;
            const subjectId = state.reviseSubject;
            let list = state.weakQuestions.filter(function(wq) {
                return (wq.mode || 'unknown') === mode && wq.subject_id === subjectId;
            });
            const wq = list[state.reviseIndex];
            state.weakQuestionStates['answer_' + wq.id] = undefined;
            delete state.weakQuestionStates['result_' + wq.id];
            render();
        }
        return;
    }
    
    if (action === 'revise-done') {
        state.reviseView = 'subjects';
        state.reviseIndex = 0;
        render();
        return;
    }

    if (action === 'weak-toggle-view') {
        const wid = el.getAttribute('data-wid');
        state.weakQuestionStates['view_' + wid] = !state.weakQuestionStates['view_' + wid];
        render();
        return;
    }

    if (action === 'weak-reattempt-answer') {
        const wid = el.getAttribute('data-wid');
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const wq = state.weakQuestions.find(function(w) { return w.id === wid; });
        if (!wq || !wq.questions) { showToast('Question not found.', 'error'); return; }

        const q = wq.questions;
        const isCorrect = idx === q.correct_answer;

        state.weakQuestionStates['answer_' + wid] = idx;
        state.weakQuestionStates['result_' + wid] = isCorrect;
        render();

        if (isCorrect) {
            removeWeakQuestion(state.authUser.id, wq.question_id).then(function() {
                // Do NOT write to history — revise attempts are not stored in exam_history
                // Reload weak questions after removal
                state.weakQuestionsLoaded = false;
                loadWeakQuestions();
            });
        } else {
            saveWeakQuestion(state.authUser.id, wq.question_id, wq.subject_id, wq.mode, idx, q.correct_answer);
            // Reload to update attempts count
            state.weakQuestionsLoaded = false;
            loadWeakQuestions();
        }
        return;
    }

    if (action === 'weak-remove-question') {
        const wid = el.getAttribute('data-wid');
        const qid = el.getAttribute('data-qid');
        if (!state.authUser) { showToast('Please login first.', 'error'); return; }
        if (!confirm('Remove this question from your weak list?')) return;

        removeWeakQuestion(state.authUser.id, qid).then(function() {
            showToast('Removed from weak list.', 'success');
            delete state.weakQuestionStates['view_' + wid];
            delete state.weakQuestionStates['reattempt_' + wid];
            delete state.weakQuestionStates['answer_' + wid];
            delete state.weakQuestionStates['result_' + wid];
            state.weakQuestionsLoaded = false;
            loadWeakQuestions();
        }).catch(function(err) {
            showNetworkAwareError('Error removing question.', err);
        });
        return;
    }

    if (action === 'flag-review-question') {
        const qid = el.getAttribute('data-qid');
        const subject = el.getAttribute('data-subject');
        const mode = el.getAttribute('data-mode') || 'unknown';
        
        if (!state.authUser) { showToast('Please login first.', 'error'); return; }
        
        state.showFlagModal = true;
        state.flagModalData = {
            questionId: qid,
            subjectId: subject || '',
            mode: mode,
        };
        render();
        return;
    }

    if (action === 'flag-close') {
        state.showFlagModal = false;
        state.flagModalData = null;
        render();
        return;
    }

    if (action === 'flag-submit') {
        const data = state.flagModalData;
        if (!data || !data.questionId) { showToast('Could not identify this question — please try again from the question screen.', 'error'); return; }
        
        const reason = document.getElementById('flag-reason-input')?.value?.trim() || '';
        const userId = state.authUser?.id;
        const username = state.profile?.name || 'Unknown';
        
        if (!userId) { showToast('Please login first.', 'error'); return; }
        
        saveFlaggedQuestion(userId, username, data.questionId, data.subjectId, data.mode, reason).then(function() {
            showToast('Question flagged. Thank you — our team will review it.', 'success');
            if (state.myFlaggedIds.indexOf(data.questionId) === -1) state.myFlaggedIds.push(data.questionId);
            state.showFlagModal = false;
            state.flagModalData = null;
            loadFlaggedCount();
            render();
        });
        return;
    }

    // SUPPORT CHAT
    if (action === 'support-quick-issue') {
        const issueKey = el.getAttribute('data-issue');
        const issue = SUPPORT_QUICK_ISSUES.find(function(i) { return i.key === issueKey; });
        if (issue) {
            sendSupportMessage(issue.label, issueKey);
        }
        return;
    }
    
    if (action === 'ai-toggle-attach-menu') {
        state.aiShowAttachMenu = !state.aiShowAttachMenu;
        render();
        return;
    }
    if (action === 'ai-attach-image') {
        state.aiShowAttachMenu = false;
        const input = document.getElementById('ai-image-input');
        if (input) input.click();
        return;
    }
    if (action === 'ai-remove-image') {
        state.aiPendingImage = null;
        render();
        return;
    }
    if (action === 'ai-attach-document') {
        state.aiShowAttachMenu = false;
        const input = document.getElementById('ai-document-input');
        if (input) input.click();
        return;
    }
    if (action === 'ai-remove-document') {
        state.aiPendingDocument = null;
        render();
        return;
    }
    if (action === 'ai-toggle-voice') {
        toggleAiVoiceRecording();
        return;
    }
    if (action === 'ai-copy-message') {
        const msgId = el.getAttribute('data-msgid');
        const m = state.aiMessages.find(function(x) { return String(x.id) === String(msgId); });
        if (m) copyChatMessage(stripChatMarkers(m.message));
        return;
    }
    if (action === 'ai-edit-message') {
        const msgId = el.getAttribute('data-msgid');
        editAiMessage(msgId);
        return;
    }
    if (action === 'ai-cancel-edit') {
        state.aiEditingMessageId = null;
        state.aiInput = '';
        render();
        return;
    }
    if (action === 'view-chat-image') {
        state.viewingImage = el.getAttribute('data-src');
        render();
        return;
    }
    if (action === 'close-image-viewer') {
        state.viewingImage = null;
        render();
        return;
    }
    
    if (action === 'ai-toggle-history') {
        state.showAiHistoryPanel = !state.showAiHistoryPanel;
        render();
        return;
    }
    if (action === 'ai-new-chat') {
        // Lazy: just clear to a blank chat locally. The DB session row is
        // only created once the user actually sends a message, so tapping
        // "New chat" repeatedly doesn't clutter history with empty chats.
        state.aiCurrentSessionId = null;
        state.aiMessages = [];
        state.aiMessagesLoaded = true;
        state.aiInput = '';
        state.aiPendingImage = null;
        state.aiPendingDocument = null;
        state.aiShowAttachMenu = false;
        state.aiEditingMessageId = null;
        state.showAiHistoryPanel = false;
        render();
        return;
    }
    if (action === 'ai-switch-session') {
        switchAiSession(el.getAttribute('data-sessionid'));
        return;
    }
    if (action === 'ai-delete-session') {
        deleteAiSession(el.getAttribute('data-sessionid'));
        return;
    }
    if (action === 'ai-suggestion') {
        sendAiMessage(el.getAttribute('data-text') || '', null);
        return;
    }
    if (action === 'send-ai-message') {
        const input = document.getElementById('ai-chat-input');
        if (input) {
            sendAiMessage(input.value, state.aiQuestionContext);
            input.value = '';
            state.aiQuestionContext = null;
            state.aiEditingMessageId = null;
        }
        return;
    }
    
    if (action === 'send-support-message') {
        const input = document.getElementById('support-chat-input');
        if (input) {
            sendSupportMessage(input.value, null);
            input.value = '';
        }
        return;
    }

    if (action === 'admin-open-support') {
        state.adminSelectedSupportUser = el.getAttribute('data-userid');
        state.adminSelectedSupportUsername = el.getAttribute('data-username');
        loadAdminSupportThread(state.adminSelectedSupportUser);
        return;
    }

    if (action === 'admin-view-user') {
        state.adminSelectedUserId = el.getAttribute('data-userid');
        loadAdminUserDetail(state.adminSelectedUserId);
        return;
    }

    if (action === 'admin-close-user-detail') {
        state.adminSelectedUserId = null;
        state.adminUserDetailLoaded = false;
        state.adminUserEnrollments = [];
        state.adminUserAiMessages = [];
        render();
        return;
    }

    if (action === 'admin-close-support') {
        state.adminSelectedSupportUser = null;
        state.adminSelectedSupportUsername = null;
        state.adminSupportMessages = [];
        render();
        return;
    }

    if (action === 'admin-send-support-reply') {
        const userId = el.getAttribute('data-userid');
        const username = el.getAttribute('data-username');
        const val = document.getElementById('admin-support-reply-input')?.value || '';
        sendAdminSupportReply(userId, username, val);
        const input = document.getElementById('admin-support-reply-input');
        if (input) input.value = '';
        return;
    }

    if (action === 'notif-image-upload') {
        const input = document.getElementById('admin-notif-image');
        if (input) input.click();
        return;
    }

    if (action === 'notif-remove-image') {
        state.admin.notifImageData = null;
        state.admin.notifImage = null;
        render();
        return;
    }

    if (action === 'admin-support-reply') {
        const userId = el.getAttribute('data-userid');
        const username = el.getAttribute('data-username');
        const input = document.getElementById('admin-support-reply-input');
        if (input && input.value.trim()) {
            sendAdminSupportReply(userId, username, input.value.trim());
            input.value = '';
        }
        return;
    }

    // ============================================================
    //  NEW: AVATAR UPLOAD
    // ============================================================
    if (action === 'open-avatar-upload') {
        state.showAvatarUpload = true;
        state.avatarUploadFile = null;
        render();
        return;
    }
    if (action === 'cancel-avatar-upload') {
        state.showAvatarUpload = false;
        state.avatarUploadFile = null;
        render();
        return;
    }
    if (action === 'choose-avatar-photo') {
        const input = document.getElementById('avatar-file-input');
        if (input) input.click();
        return;
    }
    if (action === 'save-avatar-upload') {
        if (!state.avatarUploadFile || !state.avatarUploadFile.dataUrl) {
            showToast('Please choose a photo first.', 'error');
            return;
        }
        
        const dataUrl = state.avatarUploadFile.dataUrl;
        
        supabase.from('profiles')
            .update({ profile_image_url: dataUrl })
            .eq('id', state.authUser.id)
            .then(function() {
                state.profile.avatarUrl = dataUrl;
                state.showAvatarUpload = false;
                state.avatarUploadFile = null;
                showToast('Profile photo updated!', 'success');
                render();
            })
            .catch(function(err) {
                console.warn('Avatar upload error:', err);
                showNetworkAwareError('Error updating profile photo.', err);
            });
        return;
    }

    // ============================================================
    //  NEW: FUND WALLET
    // ============================================================
    if (action === 'open-fund-wallet') {
        state.showFundWallet = true;
        state.fundWalletAmount = '';
        render();
        return;
    }
    if (action === 'close-fund-wallet') {
        state.showFundWallet = false;
        state.fundWalletAmount = '';
        render();
        return;
    }
    if (action === 'fund-quick-amount') {
        const amt = parseInt(el.getAttribute('data-amount'), 10);
        state.fundWalletAmount = String(amt);
        const input = document.getElementById('fund-wallet-amount-input');
        if (input) input.value = String(amt);
        render();
        return;
    }
    if (action === 'fund-wallet-paystack') {
        const amt = parseInt(document.getElementById('fund-wallet-amount-input')?.value || 0);
        if (!amt || amt <= 0) {
            showToast('Please enter a valid amount.', 'error');
            return;
        }
        state.fundWalletAmount = String(amt);
        
        if (typeof PaystackPop === 'undefined') {
            showToast(!isOnline() ? "You're offline — payment needs an internet connection." : 'Payment system not loaded. Please try again.', !isOnline() ? 'offline' : 'error');
            return;
        }
        
        const handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: state.profile.email || (state.authUser.email || 'noemail@example.com'),
            amount: amt * 100,
            currency: 'NGN',
            ref: 'WALLET-' + Date.now() + '-' + Math.floor(Math.random() * 100000),
            metadata: {
                custom_fields: [
                    { display_name: "Purpose", variable_name: "purpose", value: "Wallet Funding" },
                    { display_name: "Username", variable_name: "username", value: state.profile.name || 'Guest' },
                ]
            },
            callback: function(response) {
                showToast('Payment received! Verifying...', '');
                verifyWalletFunding(response.reference, amt);
            },
            onClose: function() {
                showToast('Payment window closed.', '');
            }
        });
        handler.openIframe();
        return;
    }

    // ============================================================
    //  NEW: ACTIVATE WITH WALLET (from checkout)
    // ============================================================
    if (action === 'activate-with-wallet') {
        const planId = el.getAttribute('data-planid');
        const plan = state.activationPlans.find(function(p) { return p.id === planId; });
        if (!plan) { showToast('Plan not found.', 'error'); return; }
        activateWithWallet(plan);
        return;
    }

    // ============================================================
    //  NEW: STUDY REMINDER
    // ============================================================
    if (action === 'toggle-reminder-day') {
        const day = parseInt(el.getAttribute('data-day'), 10);
        const idx = state.studyReminderDays.indexOf(day);
        if (idx !== -1) {
            state.studyReminderDays.splice(idx, 1);
        } else {
            state.studyReminderDays.push(day);
            state.studyReminderDays.sort(function(a, b) { return a - b; });
        }
        render();
        return;
    }
    if (action === 'toggle-reminder-enabled') {
        const newEnabled = !(state.studyReminder && state.studyReminder.enabled);
        saveStudyReminder(newEnabled);
        return;
    }
    if (action === 'save-study-reminder') {
        const hour = parseInt(document.getElementById('study-reminder-hour')?.value || 19);
        const minute = parseInt(document.getElementById('study-reminder-minute')?.value || 0);
        if (hour < 0 || hour > 23) { showToast('Hour must be between 0 and 23.', 'error'); return; }
        if (minute < 0 || minute > 59) { showToast('Minute must be between 0 and 59.', 'error'); return; }
        state.studyReminderHour = hour;
        state.studyReminderMinute = minute;
        const enabled = state.studyReminder ? state.studyReminder.enabled : true;
        saveStudyReminder(enabled);
        return;
    }
});

// ============================================================
//  INPUT EVENT HANDLING
// ============================================================
document.addEventListener('change', function(e) {
    const id = e.target.id;

    if (id === 'exam-year-select') {
        state.examYear = parseInt(e.target.value, 10);
    } else if (id === 'doc-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.docFile = { name: file.name, type: file.type, size: file.size, dataUrl: ev.target.result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-qsubject') {
        state.admin.qSubject = e.target.value || '';
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'admin-qyear') {
        state.admin.examYear = parseInt(e.target.value, 10) || 2026;
        state.adminQuestionsLoaded = false;
        state.adminQuestionsList = [];
        state.adminQuestionsKey = null;
        render();
    } else if (id === 'subject-lb-select') {
        state.subjectLeaderboardSubject = e.target.value || null;
        loadSubjectLeaderboard(state.subjectLeaderboardSubject);
        render();
    } else if (e.target.getAttribute && e.target.getAttribute('data-action') === 'qform-correct') {
        state.admin.qCorrect = parseInt(e.target.value, 10);
    } else if (id === 'course-image-input') {
    const file = e.target.files[0];
    if (!file) return;
    compressImageFile(file, 800, 0.7, function(dataUrl) {
        state.admin.courseImageData = dataUrl;
        render();
    });
} else if (id === 'admin-notif-image') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.admin.notifImageData = ev.target.result;
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'admin-view-subject-filter') {
        state.admin.viewModeSubject = e.target.value || '';
        render();
    } else if (id === 'admin-topic-subject-select') {
        state.admin.adminTopicSubject = e.target.value || null;
        state.admin.adminTopicsLoaded = false;
        state.admin.adminSelectedTopicId = null;
        state.admin.adminTopicQuestionsLoaded = false;
        render();
   } else if (id === 'ai-image-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.aiPendingImage = ev.target.result;
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'ai-document-input') {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
            showToast('That document is too large (max 8MB).', 'error');
            return;
        }
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.aiPendingDocument = { name: file.name, data: ev.target.result };
            render();
        };
        reader.readAsDataURL(file);
    } else if (id === 'offline-import-file-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                importOfflineData(data, 'replace').then(function(result) {
                    showToast('Imported ' + result.questions + ' questions, ' + result.passages +
                        ' passages, ' + result.topics + ' topics, ' + result.topic_questions +
                        ' topic questions.', 'success');
                    state.allQuestions = [];
                    loadAllQuestionsCount();
                    render();
                }).catch(function(err) {
                    console.error('Import error:', err);
                    showNetworkAwareError('Error importing file: ' + (err.message || 'unknown'), err);
                });
            } catch (parseErr) {
                showToast('Invalid JSON file — could not parse.', 'error');
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    } else if (id === 'avatar-file-input' || id === 'profile-edit-avatar-input') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            state.avatarUploadFile = {
                dataUrl: ev.target.result,
                name: file.name,
                type: file.type,
            };
            render();
        };
        reader.readAsDataURL(file);
    }
});

   } else if (id === 'support-chat-input') {

    } else if (id === 'ai-chat-input') {
        state.aiInput = e.target.value;
        e.target.style.height = 'auto';
        e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
    } else if (id === 'admin-support-reply-input') {
        // handled on send
    } else if (id === 'fund-wallet-amount-input') {
        state.fundWalletAmount = e.target.value;
    } else if (id === 'study-reminder-hour') {
        const val = parseInt(e.target.value, 10);
        if (!isNaN(val) && val >= 0 && val <= 23) state.studyReminderHour = val;
    } else if (id === 'study-reminder-minute') {
