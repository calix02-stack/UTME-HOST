        '<p class="section-label">Choose 1 subject</p>' +
        '<div class="subject-grid">' + chips + '</div>' +
        '<div class="picker-footer">' +
        '<p class="picker-count">' + (selectedSubject ? esc(selectedSubject.name) + ' · ' + state.examYear :
            'No subject selected yet') + '</p>' +
        '<button class="btn ' + (ready ? "btn-green" : "btn-outline") + '" data-action="start-exam"' + (ready ? '' :
            ' disabled style="opacity:0.5;pointer-events:none"') + '>Start Exam</button>' +
        '</div>'
    );
}

// ============================================================
//  EXAM EXAM
// ============================================================
function renderExamExam() {
    if (!state.examQuestions || state.examQuestions.length === 0) return renderHome();

    if (state.examFinished || state.examSubmitted) {
        let score = 0;
        const subjectScores = {};
        const weakQuestionsToSave = [];
        state.examQuestions.forEach(function(item, i) {
            const isCorrect = state.examAnswers[i] === item.correct_answer;
            if (isCorrect) {
                score++;
                if (!subjectScores[item.subject_id]) subjectScores[item.subject_id] = 0;
                subjectScores[item.subject_id]++;
            } else {
                weakQuestionsToSave.push({ questionId: item.id, subjectId: item.subject_id, userAnswer: state.examAnswers[i], correctAnswer: item.correct_answer });
            }
        });
        if (state.authUser && state.examSubmitted && !state.examHistorySaved) {
            state.examHistorySaved = true;
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'exam', wq.userAnswer, wq.correctAnswer);
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            const subjName = state.examQuestions[0]?.subject_name || 'Unknown Subject';
            saveHistoryEntry({
                mode: 'exam',
                subjects: subjectNames,
                subject_scores: subjectScores,
                total_score: score,
                max_score: state.examQuestions.length,
                total_questions: state.examQuestions.length,
                answered_count: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),
                exam_title: subjName + ' Exam ' + state.examYear,
            });
            
            addLog(state.authUser.id, state.profile.name, 'completed_exam', 'Completed Exam ' + subjName + ' ' + state.examYear + ' with score ' + score + '/' + state.examQuestions.length);
        }

        let reviewItems = "";
        state.examQuestions.forEach(function(item, i) {
            const userAns = state.examAnswers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + item.correct_answer);
            const subj = SUBJECTS.find(function(s) { return s.id === item.subject_id; });
            reviewItems += (
                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="q-text">Q' + (i + 1) + '. ' + esc(item.text) + '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="exam">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<h2 class="title">Exam — Result</h2>' +
            '<div class="card" style="text-align:center;padding:20px;margin-bottom:12px">' +
            '<p style="font-family:var(--font-mono);font-size:40px;margin:0;color:' + GREEN + '">' + score +
            ' / ' + state.examQuestions.length + '</p>' +
            '<p style="font-size:12px;color:var(--muted);margin:4px 0 0">Questions answered correctly</p>' +
            '</div>' +
            '<button class="btn btn-green" style="margin-bottom:10px" data-action="exam-exit">Back to Home</button>' +
            '<button class="btn btn-outline" data-action="exam-toggle-review">' +
            (state.examReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.examReviewMode ? '<div style="margin-top:12px">' + reviewItems + '</div>' : '')
        );
    }

    const totalQ = state.examQuestions.length;
    const item = state.examQuestions[state.examIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;
    
    const answeredCount = state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;
    const isInstant = state.examVariant === 'instant';
    const instantResult = state.examInstantResults[state.examIndex];

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            let cls = 'qa-option';
            let disabled = false;
            let letter = String.fromCharCode(65 + i);
            let label = esc(o);
            
            if (isInstant && instantResult !== undefined) {
                if (i === item.correct_answer) cls += ' correct';
                else if (i === state.examAnswers[state.examIndex]) cls += ' wrong';
                disabled = true;
            } else {
                const chosen = state.examAnswers[state.examIndex] === i;
                if (chosen) cls += ' selected';
            }
            
            opts += (
                '<button class="' + cls + '" data-action="exam-answer" data-idx="' + i + '"' + 
                (disabled ? ' disabled style="cursor:default"' : '') + '>' +
                '<span class="qa-letter">' + letter + '</span><span>' + label + '</span>' +
                '</button>'
            );
        });
    }

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +

// ============================================================
//  TOPIC EXAM
// ============================================================
function renderTopicExam() {
    if (!state.topicQuestions || state.topicQuestions.length === 0) return renderHome();

    if (state.topicFinished || state.topicSubmitted) {
        let score = 0;
        const subjectScores = {};
        const weakQuestionsToSave = []; 
        state.topicQuestions.forEach(function(item, i) {
            const isCorrect = state.topicAnswers[i] === item.correct_answer;
            if (isCorrect) {
                score++;
                if (!subjectScores[item.subject_id]) subjectScores[item.subject_id] = 0;
                subjectScores[item.subject_id]++;
            } else {
                weakQuestionsToSave.push({ questionId: item.id, subjectId: item.subject_id, userAnswer: state.topicAnswers[i], correctAnswer: item.correct_answer });
            }
        });

        if (state.authUser && state.topicSubmitted && !state.topicHistorySaved) {
            state.topicHistorySaved = true;
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'topic', wq.userAnswer, wq.correctAnswer);
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            const topicName = state.topicsList.find(function(t) { return t.id === state.topicId; })?.name || 'Topic Practice';
            saveHistoryEntry({
                mode: 'topic',
                subjects: subjectNames,
                subject_scores: subjectScores,
                total_score: score,
                max_score: state.topicQuestions.length,
                total_questions: state.topicQuestions.length,
                answered_count: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),
                exam_title: topicName,

            addLog(state.authUser.id, state.profile.name, 'completed_topic', 'Completed Topic Practice ' + topicName + ' with score ' + score + '/' + state.topicQuestions.length);

        let reviewItems = "";
        state.topicQuestions.forEach(function(item, i) {

// ============================================================
function renderDocumentsUser() {
    let rows = "";
    if (!state.docsLoaded) {
        rows = '<div class="loading-spinner"><div class="spinner"></div><p>Loading documents...</p></div>';
        loadDocuments();
    } else {
        let docs = state.docsList;
        const q = (state.docsSearchQuery || '').trim().toLowerCase();
        if (q) {
            docs = docs.filter(function(d) {
                return (d.name || '').toLowerCase().includes(q) ||
                    (d.file_name || '').toLowerCase().includes(q);
            });
        }
        if (docs.length === 0) {
            rows =
                '<p style="font-size:11px;color:var(--faint);text-align:center;margin-top:12px">' +
                (q ? 'No documents match your search.' : 'No documents available yet.') +
                '</p>';
        } else {
            rows = "";
            docs.forEach(function(d) {
                const loadedUrl = state.docFileUrls && state.docFileUrls[d.id];
                rows += (
                    '<div class="card" style="margin-bottom:6px">' +
                    '<p style="font-size:12px;font-weight:600;margin:0">' + esc(d.name) + '</p>' +
                    '<p style="font-size:10px;color:var(--muted);margin:1px 0 8px">' + esc(d.file_name || '') + '</p>' +
                    (loadedUrl
                        ? renderFileActions(loadedUrl, d.file_name, d.file_type)
                        : '<button class="btn btn-outline btn-sm" data-action="load-doc-file" data-docid="' + d.id + '">Load File</button>') +
                    '</div>'
                );
            });
        }
    }

    return (
        '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
        '<div class="feature-icon" style="background:#4C5FD5">' + svg("folder", 30) + '</div>' +
        '<h2 class="title">Document File</h2>' +
        '<p class="sub">Past questions & study files</p>' +
        '<input class="search-box" id="docs-search-input" placeholder="🔍 Search documents..." value="' + esc(state.docsSearchQuery || '') + '" />' +
        rows
    );
}

function renderFileActions(fileUrl, fileName, fileType) {
    if (!fileUrl) return '';
    const isImage = fileType && fileType.startsWith('image/');
    let html = '';
    if (isImage) {
        html += '<img src="' + fileUrl + '" style="width:100%;border-radius:6px;margin-bottom:6px" alt="' + esc(fileName || 'Image') + '" />';
    }
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    if (isImage) {
        html += '<a class="btn btn-outline btn-sm" href="' + fileUrl + '" target="_blank" style="flex:1">View Image</a>';
        html += '<a class="btn btn-green btn-sm" href="' + fileUrl + '" download="' + esc(fileName || 'image') + '" style="flex:1">Download</a>';
    } else {
        html += '<a class="btn btn-outline btn-sm" href="' + fileUrl + '" target="_blank" style="flex:1">View</a>';
        html += '<a class="btn btn-green btn-sm" href="' + fileUrl + '" download="' + esc(fileName || 'document') + '" style="flex:1">Download</a>';
    }
    html += '</div>';
    return html;
}

async function loadWeakQuestions() {
    if (!state.authUser) {
        state.weakQuestionsLoaded = true;
        state.weakQuestions = [];
        render();
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('weak_questions')
            .select('*')
            .eq('user_id', state.authUser.id)
            .order('created_at', { ascending: false });
            
        if (error) {
            console.warn("Load weak questions error:", error.message, error.code);
            showUserError("Load weak questions", error, "Couldn't load your weak questions right now.");
            state.weakQuestions = [];
            state.weakQuestionsLoaded = true;
            render();
            return;
        }

        const rows = data || [];
        const withQuestions = await Promise.all(rows.map(async function(row) {
            let q = null;
            try {
                q = await dbGet('questions', row.question_id);
            } catch (e) {
                q = null;
            }
            return Object.assign({}, row, { questions: q });
        }));

        state.weakQuestions = withQuestions.filter(function(w) { return w.questions; });
        state.weakQuestionsLoaded = true;
        render();
    } catch (e) {
        console.warn("Load weak questions exception:", e.message || e);
        showUserError("Load weak questions", e, "Couldn't load your weak questions right now.");
        state.weakQuestions = [];
        state.weakQuestionsLoaded = true;
        render();
    }
}

// ============================================================
//  SUPPORT CHAT
// ============================================================
// Turns AI Tutor text into properly displayed content instead of raw
// markdown/LaTeX/code-style syntax: "3 * 4" becomes "3 × 4", "x^2" becomes
// x with a real superscript, \frac{1}{2} becomes a readable fraction,
// **bold** becomes actual bold text, ```code``` becomes a real code block,
// and so on — so math and formatting look natural instead of looking like
// programming syntax.
function formatAiChatText(raw) {
    if (!raw) return '';

    // 1) Pull out fenced code blocks and inline code first so their content
    // is left completely alone by the math/markdown transforms below.
    // AI models often wrap worked calculations/equations in backticks or
    // triple-backtick fences out of habit - that content is NOT real code,
    // so we only treat something as a code block if it actually looks like
    // programming code. Anything else gets unwrapped and flows through the
    // normal math/markdown formatting below like regular text.
    const KNOWN_CODE_LANGS = /^(js|javascript|jsx|ts|typescript|tsx|py|python|java|c|cpp|c\+\+|cs|csharp|html|css|json|sql|bash|sh|shell|php|go|golang|rust|rb|ruby|swift|kotlin|xml|yaml|yml)$/i;
    function looksLikeCode(code, lang) {
        if (lang && KNOWN_CODE_LANGS.test(lang.trim())) return true;
        return /[;{}]|=>|\b(function|def|class|import|const|let|var|return|console\.|print\()\b/.test(code);
    }
    const codeBlocks = [];
    let text = raw.replace(/```([a-zA-Z0-9+#]*)\n?([\s\S]*?)```/g, function(_, lang, code) {
        const trimmed = code.replace(/\n$/, '');
        if (looksLikeCode(trimmed, lang)) {
            codeBlocks.push(trimmed);
            return '\u0000CB' + (codeBlocks.length - 1) + '\u0000';
        }
        return trimmed;
    });
    const codeSpans = [];
    text = text.replace(/`([^`\n]+)`/g, function(_, code) {
        if (looksLikeCode(code, '')) {
            codeSpans.push(code);
            return '\u0000CS' + (codeSpans.length - 1) + '\u0000';
        }
        return code;
    });

    // 2) Strip LaTeX math delimiters, keeping their inner content.
    text = text
        .replace(/\$\$([\s\S]+?)\$\$/g, '$1')
        .replace(/\\\[([\s\S]+?)\\\]/g, '$1')
        .replace(/\\\(([\s\S]+?)\\\)/g, '$1')
        .replace(/\$([^\n$]+?)\$/g, '$1');

    // 3) Common LaTeX math commands -> real symbols/words.
    text = text
        .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1 ÷ $2)')
        .replace(/\\sqrt\{([^{}]+)\}/g, '√($1)')
        .replace(/\\sqrt/g, '√')
        .replace(/\\times/g, '×')
        .replace(/\\div/g, '÷')
        .replace(/\\pm/g, '±')
        .replace(/\\cdot/g, '·')
        .replace(/\\leq/g, '≤')
        .replace(/\\geq/g, '≥')
        .replace(/\\neq/g, '≠')
        .replace(/\\approx/g, '≈')
        .replace(/\\pi\b/g, 'π')
        .replace(/\\infty/g, '∞')
        .replace(/\\(?:rightarrow|to)\b/g, '→')
        .replace(/\\%/g, '%')
        .replace(/\\text\{([^{}]*)\}/g, '$1')
        .replace(/\\(?:left|right)([()\[\]{}|])/g, '$1')
        .replace(/\\begin\{[^{}]*\}|\\end\{[^{}]*\}/g, '');

    // 4) Plain "3 * 4" style multiplication -> "3 × 4" (only between digits,
    // so markdown bold/italic elsewhere is untouched).
    text = text.replace(/(\d)\s*\*\s*(\d)/g, '$1 × $2');

    // 5) Exponents and subscripts written as x^2 / x_1 -> real sup/sub
    // markers (placeholder tags applied after HTML-escaping below).
    text = text
        .replace(/([A-Za-z0-9\)\]])\^\{([^{}]+)\}/g, '$1\u0001SUP$2\u0001')
        .replace(/([A-Za-z0-9\)\]])\^(-?[A-Za-z0-9]+)/g, '$1\u0001SUP$2\u0001')
        .replace(/([A-Za-z0-9\)\]])_\{([^{}]+)\}/g, '$1\u0001SUB$2\u0001')
        .replace(/([A-Za-z0-9\)\]])_(-?[A-Za-z0-9])/g, '$1\u0001SUB$2\u0001');

    // 6) Now escape any real HTML in the message so nothing can inject markup.
    text = esc(text);

    // 7) Turn the sup/sub placeholders into real tags.
    text = text
        .replace(/\u0001SUP([^\u0001]+)\u0001/g, '<sup>$1</sup>')
        .replace(/\u0001SUB([^\u0001]+)\u0001/g, '<sub>$1</sub>');

    // 8) Lightweight markdown -> real formatting.
    text = text.replace(/^\s*#{1,6}\s+(.+)$/gm, '<strong>$1</strong>');
    text = text.replace(/\*\*([^\n*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^\s*][^*]*?)\*/g, '<em>$1</em>');
    text = text.replace(/(^|[^A-Za-z0-9])_([^\s_][^_]*?)_(?![A-Za-z0-9])/g, '$1<em>$2</em>');
    text = text.replace(/(?:^|\n)((?:[-*]\s+.+(?:\n|$))+)/g, function(block) {
        const items = block.trim().split(/\n/).map(function(line) {
            return '<li>' + line.replace(/^[-*]\s+/, '') + '</li>';
        }).join('');
        return '\n<ul class="chat-list">' + items + '</ul>\n';
    });

    // 9) Restore code spans/blocks, escaping their content for safety.
    text = text.replace(/\u0000CS(\d+)\u0000/g, function(_, i) {
        return '<code>' + esc(codeSpans[i]) + '</code>';
    });
    text = text.replace(/\u0000CB(\d+)\u0000/g, function(_, i) {
        return '<pre class="chat-code"><code>' + esc(codeBlocks[i]) + '</code></pre>';
    });

    // 10) Remaining newlines -> line breaks.
    text = text.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');

    return text;
}

function renderChatBubbleContent(message) {
    if (!message) return '';
    let rest = message;
    let out = '';
    const imgMatch = /\[\[img:([^\]]+)\]\]/.exec(rest);
    if (imgMatch) {
        out += '<img src="' + esc(imgMatch[1]) + '" class="chat-img" data-action="view-chat-image" data-src="' + esc(imgMatch[1]) + '" />';
        rest = rest.replace(imgMatch[0], '').trim();
    }
    const docMatch = /\[\[doc:([^|]*)\|([^\]]+)\]\]/.exec(rest);
    if (docMatch) {
        out += (
            '<a class="chat-doc-chip" href="' + esc(docMatch[2]) + '" download="' + esc(docMatch[1]) + '">' +
            svg('filetext', 16) + '<span>' + esc(docMatch[1] || 'Document') + '</span></a>'
        );
        rest = rest.replace(docMatch[0], '').trim();
    }
    if (rest) {
        out += '<div' + (out ? ' style="margin-top:6px"' : '') + '>' + formatAiChatText(rest) + '</div>';
    }
    return out || formatAiChatText(message);
}

function groupAiSessionsByDay(sessions) {
    const groups = [];
    const labelFor = function(dateStr) {
        const d = new Date(dateStr);
        const now = new Date();
        const startOfDay = function(x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
        const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
        if (diffDays <= 0) return 'Today';
        if (diffDays === 1) return 'Yesterday';
        if (diffDays < 7) return 'This week';
        return 'Earlier';
    };
    sessions.forEach(function(s) {
        const label = labelFor(s.updated_at || s.created_at);
        let group = groups.find(function(g) { return g.label === label; });
        if (!group) { group = { label: label, items: [] }; groups.push(group); }
        group.items.push(s);
    });
    return groups;
}

    const listeningBanner = state.aiRecording
        ? '<div class="ai-listening-banner"><span class="ai-listening-dot"></span>Listening… speak now, then edit and send</div>'

    const editingBanner = state.aiEditingMessageId

    return (
        '<div class="ai-chat-page">' +
        headerHtml +
        '<div class="chat-window">' + bubbles + '</div>' +
        listeningBanner +
        editingBanner +
        attachPreview +

        '<button class="icon-btn chat-tool-btn' + (state.aiRecording ? ' recording' : '') + '" data-action="ai-toggle-voice" title="Voice input" aria-label="Voice input">' + svg(state.aiRecording ? 'stop' : 'mic', 18) + '</button>' +

function renderHistory() {
    if (!state.authUser) {
        return (
            '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
            '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
            '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
            '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">Please log in to view your results.</p></div>'
        );
    }

    if (!state.historyLoaded) {
        loadHistory();
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading results...</p></div>';
    }

    // Filter modes - removed 'revise'
    const modeFilters = [
        { key: 'all', label: 'All' },
        { key: 'cbt-full', label: 'CBT Full' },
        { key: 'cbt-single', label: 'CBT Single' },
        { key: 'exam', label: 'Exam' },
        { key: 'mock', label: 'Mock' },
        { key: 'novel', label: 'Novel CBT' },
        { key: 'topic', label: 'Topic' },
    ];

    let filterHtml = '<div class="result-mode-tabs">';
    modeFilters.forEach(function(f) {
        filterHtml += '<button class="result-mode-tab' + (state.historyFilter === f.key ? ' active' : '') + '" data-action="history-filter" data-filter="' + f.key + '">' + esc(f.label) + '</button>';
    });
    filterHtml += '</div>';

    let filtered = state.historyEntries;
    if (state.historyFilter !== 'all') {
        filtered = filtered.filter(function(e) { return e.mode === state.historyFilter; });
    }

    if (filtered.length === 0) {
        return (
            '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
            '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
            '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
            filterHtml +
            '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No results yet for this filter. Complete an exam to see it here.</p></div>'
        );
    }

    // Calculate stats - only 2 cards now
    let totalExams = filtered.length;
    let totalQuestions = 0;
    let totalCorrect = 0;
    let totalMaxScore = 0;
    filtered.forEach(function(entry) {
        totalQuestions += entry.total_questions || 0;
        totalCorrect += entry.total_score || 0;
        totalMaxScore += entry.max_score || 0;
    });
    const overallPercentage = totalMaxScore > 0 ? Math.round((totalCorrect / totalMaxScore) * 100) : 0;

    let statsHtml = (
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">' +
        '<div class="card" style="text-align:center;padding:10px;margin:0">' +
        '<p style="font-size:20px;font-weight:700;color:var(--green);margin:0">' + totalExams + '</p>' +
        '<p style="font-size:9px;color:var(--muted);margin:2px 0 0">Exams</p>' +
        '</div>' +
        '<div class="card" style="text-align:center;padding:10px;margin:0">' +
        '<p style="font-size:20px;font-weight:700;color:' + (overallPercentage >= 70 ? 'var(--green)' : overallPercentage >= 50 ? 'var(--gold)' : 'var(--danger)') + ';margin:0">' + overallPercentage + '%</p>' +
        '<p style="font-size:9px;color:var(--muted);margin:2px 0 0">Avg Score</p>' +
        '</div>' +
        '</div>'
    );

    let html = (
        '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
        '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
        '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
        statsHtml +
        filterHtml
    );

    filtered.forEach(function(entry) {
        const subjectScores = entry.subject_scores || {};
        let subjectScoreHtml = '';
        Object.keys(subjectScores).forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const name = subj ? subj.name : sid;
            subjectScoreHtml += '<span>' + esc(name) + ': ' + subjectScores[sid] + '</span>';
        });

        const pct = entry.max_score > 0 ? Math.round((entry.total_score / entry.max_score) * 100) : 0;
        const modeLabel = entry.mode === 'cbt-full' ? 'CBT Full' :
                         entry.mode === 'cbt-single' ? 'CBT Single' :
                         entry.mode === 'novel' ? 'Novel CBT' :
                         entry.mode === 'mock' ? 'Mock Exam' :
                         entry.mode === 'exam' ? 'Exam' :
                         entry.mode === 'topic' ? 'Topic Practice' :
                         entry.mode || 'Unknown';

        html += (
            '<div class="history-card">' +
            '<p class="h-title">' + esc(entry.exam_title || modeLabel) + '</p>' +
            '<p class="h-date">📅 ' + formatDate(entry.submitted_at) + ' · ' + esc(modeLabel) + '</p>' +
            '<p class="h-score" style="color:' + (pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--danger)') + '">' + 
            entry.total_score + ' / ' + entry.max_score + ' (' + pct + '%)</p>' +
            '<p style="font-size:11px;color:var(--muted);margin:0 0 4px">' + entry.answered_count + ' of ' + entry.total_questions + ' answered</p>' +
            '<div class="h-subject-scores">' + subjectScoreHtml + '</div>' +
            '<div class="h-actions">' +
            '<button class="btn btn-outline btn-sm" data-action="history-print" data-id="' + entry.id + '" aria-label="Print result" style="flex:1;font-size:10px;padding:4px 8px">' + svg("print", 12) + ' Print</button>' +
            '<button class="btn btn-outline btn-sm" data-action="history-share" data-id="' + entry.id + '" aria-label="Share result" style="flex:1;font-size:10px;padding:4px 8px">' + svg("share", 12) + ' Share</button>' +
            '</div>' +
            '</div>'
        );
    });

    return html;
}

// ============================================================
//  WALLET FUNCTIONS
// ============================================================
async function loadWalletTransactions() {
    if (!state.authUser) {
        state.walletTransactionsLoaded = true;
        state.walletTransactions = [];
        render();
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('wallet_transactions')
            .select('*')
            .eq('user_id', state.authUser.id)
            .order('created_at', { ascending: false });
            
        if (error) {
            console.warn("Load wallet transactions error:", error.message, error.code);
            showToast("Could not load transactions.", "error");
            state.walletTransactions = [];
            state.walletTransactionsLoaded = true;
            render();
            return;
        }
        
        state.walletTransactions = data || [];
        state.walletTransactionsLoaded = true;
        render();
    } catch (e) {
        console.warn("Load wallet transactions exception:", e);
        state.walletTransactions = [];
        state.walletTransactionsLoaded = true;
        render();
    }
}

// ============================================================
//  STUDY REMINDER FUNCTIONS
// ============================================================
async function loadStudyReminder() {
    if (!state.authUser) {
        state.studyReminderLoaded = true;
        state.studyReminder = null;
        render();
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('study_reminders')
            .select('*')
            .eq('user_id', state.authUser.id)
            .maybeSingle();
            
        if (error) {
            console.warn("Load study reminder error:", error.message, error.code);
            state.studyReminder = null;
            state.studyReminderLoaded = true;
            render();
            return;
        }
        
        if (data) {
            state.studyReminder = data;
            state.studyReminderHour = data.hour || 19;
            state.studyReminderMinute = data.minute || 0;
            state.studyReminderDays = data.days || [1,2,3,4,5,6,0];
        } else {
            state.studyReminder = null;
            state.studyReminderHour = 19;
            state.studyReminderMinute = 0;
            state.studyReminderDays = [1,2,3,4,5,6,0];
        }
        state.studyReminderLoaded = true;
        render();
    } catch (e) {
        console.warn("Load study reminder exception:", e);
        state.studyReminder = null;
        state.studyReminderLoaded = true;
        render();
    }
}

async function saveStudyReminder(enabled) {
    if (!state.authUser) {
        showToast("Please log in first.", "error");
        return;
    }
    
    const hour = state.studyReminderHour;
    const minute = state.studyReminderMinute;
    const days = state.studyReminderDays;
    const payload = {
        user_id: state.authUser.id,
        hour: hour,
        minute: minute,
        days: days,
        enabled: enabled !== undefined ? enabled : (state.studyReminder ? state.studyReminder.enabled : false),
        updated_at: new Date().toISOString(),
    };
    
    try {
        await supabase
            .from('study_reminders')
            .upsert(payload, { onConflict: 'user_id' });
            
        state.studyReminder = payload;
        showToast(enabled ? 'Reminder set! We\'ll nudge you while the app is open.' : 'Reminder turned off.', 'success');
        render();
    } catch (e) {
        console.warn("Save study reminder error:", e);
        showToast("Error saving reminder.", "error");
    }
}

// ============================================================
//  STUDY REMINDER TICK (foreground-only)
//  NOTE: this only fires while the app/tab is open in the foreground.
//  True background push reminders require a server-side scheduled job.
// ============================================================
function checkStudyReminderTick() {
    if (!state.studyReminder || !state.studyReminder.enabled) return;
    const now = new Date();
    const day = now.getDay();
    
    if ((state.studyReminder.days || []).indexOf(day) === -1) return;
    if (now.getHours() !== state.studyReminder.hour || now.getMinutes() !== state.studyReminder.minute) return;
    
    const todayKey = 'reminderFired_' + now.toISOString().slice(0,10);
    if (storage.get(todayKey)) return; // already fired today
    
    storage.set(todayKey, 'true');
    
    if (Notification.permission === 'granted') {
        new Notification('📚 Study time!', {
            body: 'Your scheduled MyUTME practice session is starting now.',
        });
    } else {
        showInAppNotificationBanner({ title: '📚 Study time!', body: 'Time for your scheduled practice session.' });
    }
}

// ============================================================
//  ACTIVATE WITH WALLET
// ============================================================
async function activateWithWallet(plan) {
    if (!state.authUser) {
        showToast("Please log in first.", "error");
        return;
    }
    
    const balance = state.profile.walletBalance || 0;
    if (balance < plan.price) {
        showToast('Insufficient wallet balance. Please fund your wallet first.', 'error');
        state.view = 'profile';
        state.showFundWallet = true;
        render();
        return;
    }
    
    const newBalance = balance - plan.price;
    const expiryDate = new Date();
    expiryDate.setDate(expiryDate.getDate() + plan.days);
    
    try {
        await supabase
            .from('profiles')
            .update({
                wallet_balance: newBalance,
                is_active: true,
                activation_expiry: expiryDate.toISOString(),
            })
            .eq('id', state.authUser.id);
            
        await supabase
            .from('wallet_transactions')
            .insert([{
                user_id: state.authUser.id,
                type: 'purchase',
                amount: -plan.price,
                balance_after: newBalance,
                description: 'Activation: ' + plan.name,
            }]);
            
        state.profile.walletBalance = newBalance;
        state.profile.is_active = true;
        state.profile.activation_expiry = expiryDate.toISOString();
        showToast('🎉 Activated! ' + plan.days + ' days added.', 'success');
        state.view = 'activate';
        render();
    } catch (e) {
        console.warn("Activate with wallet error:", e);
        showToast("Error activating with wallet. Please try again.", "error");
    }
}

// ============================================================
//  VERIFY WALLET FUNDING (client-side fallback)
//  For production, verify server-side to prevent tampering.
// ============================================================
async function verifyWalletFunding(reference, amount) {
    // client-side fallback (see comment above)
    const newBalance = (state.profile.walletBalance || 0) + amount;
    
    try {
        await supabase
            .from('profiles')
            .update({ wallet_balance: newBalance })
            .eq('id', state.authUser.id);
            
        await supabase
            .from('wallet_transactions')
            .insert([{
                user_id: state.authUser.id,
                type: 'fund',
                amount: amount,
                balance_after: newBalance,
                description: 'Wallet funding via Paystack',
                reference: reference,
            }]);
            
        state.profile.walletBalance = newBalance;
        state.showFundWallet = false;
        state.fundWalletAmount = '';
        showToast('✅ Wallet funded! New balance: ₦' + newBalance.toLocaleString(), 'success');
        state.walletTransactionsLoaded = false;
        loadWalletTransactions();
        render();
    } catch (e) {
        console.warn("Verify wallet funding error:", e);
        showToast("Error processing funding. Please check your transactions.", "error");
    }
}

function renderMockExam() {
    if (state.engMockHasPassage && state.engMockPassage && !state.engMockPassageRead) {

    }
    
    if (!state.mockQuestions || state.mockQuestions.length === 0) return renderHome();

    const totalQ = state.mockQuestions.length;
    const answeredCount = state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;
   
    let subjectTabs = '';
    state.mockSubjectOrder.forEach(function(sid) {
        const subj = SUBJECTS.find(function(s) { return s.id === sid; });
        const isActive = state.mockCurrentSubject === sid;
        const questionsInSubject = getQuestionsForSubject(sid, state.mockSubjectQuestions);
        const answeredInSubject = questionsInSubject.filter(function(idx) {
            return state.mockAnswers[idx] !== null && state.mockAnswers[idx] !== undefined;
        }).length;
        const totalInSubject = questionsInSubject.length;
        const allDone = answeredInSubject === totalInSubject;
        subjectTabs += (
            '<button class="subject-tab' + (isActive ? ' active' : '') + '" data-action="switch-mock-subject" data-subject="' +
            sid + '">' +
            (subj ? subj.code : sid) +
            ' <span class="check-mark' + (allDone ? ' done' : '') + '">' + (allDone ? '✓' : answeredInSubject + '/' + totalInSubject) +
            '</span>' +
            '</button>'
        );
    });

    const currentSubjectQuestions = getQuestionsForSubject(state.mockCurrentSubject, state.mockSubjectQuestions);
    const currentSubjectIndex = currentSubjectQuestions.indexOf(state.mockIndex);
    const totalInCurrentSubject = currentSubjectQuestions.length;
    
    if (currentSubjectQuestions.length === 0) {
        for (const sid of state.mockSubjectOrder) {
            const qs = getQuestionsForSubject(sid, state.mockSubjectQuestions);
            if (qs.length > 0) {
                state.mockCurrentSubject = sid;
                state.mockIndex = firstUnansweredOrFirst(qs, state.mockAnswers);
                break;
            }
        }
        render();
        return '';
    }
    
    if (currentSubjectIndex === -1 || currentSubjectIndex >= currentSubjectQuestions.length) {
        state.mockIndex = firstUnansweredOrFirst(currentSubjectQuestions, state.mockAnswers);
        render();
        return '';
    }

    const item = state.mockQuestions[state.mockIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            const chosen = state.mockAnswers[state.mockIndex] === i;
            opts += (
                '<button class="qa-option' + (chosen ? ' selected' : '') + '" data-action="mock-answer" data-idx="' +
                i + '">' +
                '<span class="qa-letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span>' +
                '</button>'
            );
        });
    }

    const hasPrev = currentSubjectIndex > 0;
    const hasNext = currentSubjectIndex < totalInCurrentSubject - 1;
    const prevIdx = hasPrev ? currentSubjectQuestions[currentSubjectIndex - 1] : null;
    const nextIdx = hasNext ? currentSubjectQuestions[currentSubjectIndex + 1] : null;

    const hasPassage = state.engMockHasPassage && state.engMockPassage;

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<button class="back-link" data-action="mock-exit" style="margin:0;font-size:13px">' + svg("chevleft", 14) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" aria-label="Calculator" title="Calculator">' + svg("calculator", 18) + ' Calc</button>' :
            '<button class="calc-btn" data-action="toggle-calculator" aria-label="Calculator" title="Calculator disabled" style="opacity:0.3;cursor:not-allowed">' + svg("calculator", 18) + ' Calc</button>'
        ) +
        (hasPassage ? 
            '<button class="calc-btn" style="background:var(--gold);color:var(--ink);height:28px;padding:0 8px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600" data-action="show-mock-passage" title="View Passage" aria-label="View Passage">📖 Passage</button>' : 
            ''
        ) +
        '</div>' +
        '<div class="right-group">' +
        '<button class="submit-btn" data-action="mock-submit">Submit</button>' +
        '</div>' +
        '</div>' +
        '<div class="timer-bar">' +
        '<span class="label">⏱️ Time left</span>' +
        '<span class="time' + (state.mockTimeLeft < 300 ? ' warning' : '') + '">' +
        formatTime(state.mockTimeLeft) +
        '</span>' +
        '</div>' +
        '<div class="subject-tabs">' + subjectTabs + '</div>' +
        '<div class="exam-nav">' +
        '<span class="q-counter">Question ' + (currentSubjectIndex + 1) + ' of ' + totalInCurrentSubject + ' in ' + (subj ? subj.name : '') + '</span>' +
        '<div class="goto-btn-wrap">' +
        '<button class="goto-btn" data-action="show-goto-mock">📋 Questions (' + answeredCount + '/' + totalQ + ')</button>' +
        '</div>' +

        (hasNext ? '<button class="btn btn-green" style="flex:1" data-action="mock-goto" data-idx="' + nextIdx + '">Next</button>' : '') +
        '</div>' +
        '</div>'
    );
}

function renderMockExamPicker() {
    if (!state.mockLoaded || !state.liveExamsLoaded) {
        if (!state.mockLoaded) loadMockExams();
        if (!state.liveExamsLoaded) loadLiveExams();
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading exams...</p></div>';
    }
    if (!state.authUser) {
        return (
            '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
            '<h2 class="title">Live Exam</h2><p class="sub">Create or join a live exam</p>' +
            '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">Please log in first.</p></div>'
        );
    }

    if (state.liveExamView === 'create') return renderLiveExamCreateWizard();
    if (state.liveExamView === 'join-code') return renderLiveExamJoinCode();

    const now = new Date();
    const allExams = state.mockExams.map(function(e) { return Object.assign({}, e, { source: 'admin' }); })
        .concat(state.liveExams.filter(function(e) { return e.is_public !== false || e.created_by === state.authUser.id; })
            .map(function(e) { return Object.assign({}, e, { source: 'live' }); }));

    function status(e) {
        const sch = new Date(e.scheduled_date), end = new Date(e.end_date);
        if (now > end) return 'completed';
        if (now >= sch && now <= end) return 'ongoing';
        return 'upcoming';
    }

    const tab = state.liveExamTab || 'ongoing';
    const filtered = allExams.filter(function(e) { return status(e) === tab; })
        .sort(function(a, b) { return new Date(a.scheduled_date) - new Date(b.scheduled_date); });

    let tabsHtml = '<div class="leaderboard-tabs">';
    [['upcoming', '📅 Upcoming'], ['ongoing', '🟢 Ongoing'], ['completed', '🔒 Completed']].forEach(function(t) {
        tabsHtml += '<button class="leaderboard-tab' + (tab === t[0] ? ' active' : '') + '" data-action="live-exam-tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
    });
    tabsHtml += '</div>';

    let cards = "";
    if (filtered.length === 0) {
        cards = '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No ' + tab + ' exams.</p></div>';
    } else {
        filtered.forEach(function(exam) {
            const scheduled = new Date(exam.scheduled_date);
            const endDate = new Date(exam.end_date);
            const st = status(exam);
            const subj = exam.source === 'live' ? SUBJECTS.find(function(s) { return s.id === exam.subject_id; }) : null;
            const regList = exam.source === 'live' ? state.liveExamRegistrations : state.mockRegistrations;
            const attemptsList = exam.source === 'live' ? state.liveExamAttempts : state.mockAttempts;
            const reg = regList.find(function(r) { return r.live_exam_id === exam.id || r.mock_exam_id === exam.id; });
            const attempt = attemptsList.find(function(a) { return a.live_exam_id === exam.id || a.mock_exam_id === exam.id; });

            let statusText = st === 'upcoming' ? '📅 Upcoming' : st === 'ongoing' ? '🟢 Ongoing' : '🔒 Ended';

            let actionHtml = "";
            if (reg) {
                if (attempt && attempt.is_submitted) {
                    actionHtml = (exam.source === 'admin' ? exam.results_released : true)
                        ? '<button class="btn btn-outline" data-action="view-mock-result" data-examid="' + exam.id + '" data-source="' + exam.source + '" style="padding:8px">View Result</button>'
                        : '<p style="font-size:11px;color:var(--muted);text-align:center">✅ Submitted — waiting for results</p>';
                } else if (st === 'ongoing') {
                    actionHtml = '<button class="btn btn-green" data-action="start-mock" data-examid="' + exam.id + '" data-source="' + exam.source + '" style="padding:8px">' + (attempt ? 'Continue' : 'Start Exam') + '</button>';
                } else {
                    actionHtml = '<p style="font-size:11px;color:var(--muted);text-align:center">✅ Joined — starts ' + scheduled.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</p>';
                }
            } else if (st !== 'completed') {
                actionHtml = exam.source === 'live'
                    ? '<button class="btn btn-gold" data-action="join-live-exam" data-examid="' + exam.id + '" style="padding:8px">Join Exam</button>'
                    : '<button class="btn btn-gold" data-action="register-mock" data-examid="' + exam.id + '" data-source="admin" style="padding:8px">Register</button>';
            } else {
                actionHtml = '<p style="font-size:11px;color:var(--faint);text-align:center">Ended</p>';
            }

            let liveMeta = '';
            if (exam.source === 'live') {
                liveMeta = '<p style="font-size:11px;color:var(--muted);margin:2px 0">📘 ' + (subj ? esc(subj.name) : esc(exam.subject_id)) + ' · ' + (exam.num_questions || '-') + ' questions · ' + formatTimeShort((exam.time_limit_minutes || 0) * 60) + '</p>';
                if (st === 'ongoing') {
                    liveMeta += '<p style="font-size:11px;color:var(--danger);margin:2px 0">⏰ Ends ' + endDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</p>';
                }
            }

            cards += (
                '<div class="mock-card' + (st === 'ongoing' ? ' active' : '') + '">' +
                '<p class="mock-title">' + esc(exam.title) + (exam.source === 'live' ? ' 👤' : ' 🛡️') + '</p>' +
                '<p class="mock-date">📅 ' + scheduled.toLocaleString() + (exam.source === 'live' ? ' · by ' + esc(exam.creator_username || 'user') : '') + '</p>' +
                liveMeta +
                '<span class="mock-status ' + st + '">' + statusText + '</span>' +
                (reg ? '<span class="mock-status registered" style="margin-left:4px">✅ Joined</span>' : '') +
                (exam.source === 'live' && exam.is_public === false ? '<span class="mock-status waiting" style="margin-left:4px">🔒 Private</span>' : '') +
                '<div style="margin-top:8px">' + actionHtml + '</div>' +
                '</div>'
            );
        });
    }

    return (
        '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
        '<h2 class="title">Live Exam</h2>' +
        '<p class="sub">Create your own, or join anyone\'s exam</p>' +
        '<div style="display:flex;gap:6px;margin-bottom:12px">' +
        '<button class="btn btn-green" style="flex:1;padding:8px;font-size:12px" data-action="live-exam-view" data-view="create">➕ Create</button>' +
        '<button class="btn btn-outline" style="flex:1;padding:8px;font-size:12px" data-action="live-exam-view" data-view="join-code">🔑 Join by Code</button>' +
        '</div>' +
        (state.lastCreatedJoinCode ?
            '<div class="card" style="border-color:var(--gold);text-align:center;padding:12px;margin-bottom:12px">' +
            '<p style="font-size:10px;color:var(--muted);margin:0 0 4px">🔒 Your private exam\'s join code</p>' +
            '<p style="font-family:var(--font-mono);font-size:20px;font-weight:700;letter-spacing:0.1em;color:var(--ink);margin:0 0 8px">' + esc(state.lastCreatedJoinCode) + '</p>' +
            '<button class="mini-btn primary" data-action="copy-text" data-copy="' + esc(state.lastCreatedJoinCode) + '">📋 Copy Code</button>' +
            '<button class="mini-btn" style="margin-left:6px" data-action="dismiss-join-code-banner">Dismiss</button>' +
            '</div>' : '') +
        tabsHtml +
        cards
    );
}

            '<button class="btn btn-green" style="margin-top:16px;padding:10px" data-action="mock-exit">Back to Home</button>' +
            '</div>'
        );
    }

    if (state.mockResultReleased) {
        const score = state.mockScore;
        const maxScore = (state.settingsCache.mockSubjectCount || 4) * 100;
        const questions = state.mockQuestions || [];
        const answers = state.mockAnswers || [];
        const subjectScores = state.mockSubjectScores || {};
        const submittedAt = state.mockSubmittedAt ? new Date(state.mockSubmittedAt) : null;
        const examsList = state.mockExamSource === 'live' ? state.liveExams : state.mockExams;
        const exam = examsList.find(function(e) { return e.id === state.mockExamId; });
        let subjRows = "";
        Object.keys(subjectScores).forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const sScore = subjectScores[sid] || 0;
            subjRows += (
                '<div class="subj-score">' +
                '<span>' + (subj ? subj.name : sid) + '</span>' +
                '<span style="color:var(--green)">' + sScore + '/100</span>' +
                '</div>'
            );
        });

        let reviewItems = "";
        questions.forEach(function(item, i) {
            const userAns = answers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + item.correct_answer);
            const subj = SUBJECTS.find(function(s) { return s.id === item.subject_id; });
            reviewItems += (
                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="q-text">Q' + (i + 1) + ' (' + (subj ? subj.name : '') + '). ' + esc(item.text) +
                '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="mock">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<div class="result-card">' +
            '<p style="font-size:14px;font-weight:600;margin:0 0 2px">' + (exam ? esc(exam.title) : 'Mock Exam') +
            '</p>' +
            '<p style="font-size:11px;color:var(--muted);margin:0 0 6px">📅 ' + (exam ? new Date(exam.scheduled_date)
                .toLocaleString() : '') + '</p>' +
            (submittedAt ? '<p style="font-size:11px;color:var(--muted);margin:0 0 6px">⏱️ Submitted: ' + submittedAt
                .toLocaleString() + '</p>' : '') +
            '<div class="score-big" style="font-size:36px">' + score + ' / ' + maxScore + '</div>' +
            '<p style="font-size:12px;color:var(--muted);margin:0 0 10px">' + Math.round((score / maxScore) * 100) +
            '%</p>' +
            '<div style="text-align:left;border-top:1px solid var(--line);padding-top:10px">' +
            subjRows +
            '</div>' +
            '<button class="btn btn-green" style="margin-top:10px;padding:10px" data-action="mock-exit">Back to Home</button>' +
            '<button class="btn btn-outline" style="margin-top:6px;padding:8px" data-action="mock-toggle-review">' +
            (state.mockReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.mockReviewMode ? '<div style="margin-top:10px;text-align:left">' + reviewItems + '</div>' : '') +
            '</div>'
        );
    }

    return renderHome();
}

function dayKey(d) {
    const dt = new Date(d);
    return dt.toISOString().slice(0, 10);
}
function lastNDays(n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        out.push(d.toISOString().slice(0, 10));
    }
    return out;
}
function shortDay(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 3) + ' ' + d.getDate();
}

async function loadAnalyticsData() {
    if (state.analyticsLoading) return; // prevent overlapping fetches
    state.analyticsLoading = true;
    render();

    const rangeDays = state.analyticsRange || 14;
    const sinceDate = new Date();
    sinceDate.setDate(sinceDate.getDate() - rangeDays);
    const sinceISO = sinceDate.toISOString();

    try {
        // Use the working loadAllUsers function
        await loadAllUsers();
        const profiles = state.allUsers || [];
        
        const historyRes = await supabase.from('exam_history').select('id, user_id, mode, total_score, max_score, submitted_at').gte('submitted_at', sinceISO);
        const keysRes = await supabase.from('activation_keys').select('*').eq('is_used', true);
        const logsRes = await supabase.from('activity_logs').select('action, created_at, username').gte('created_at', sinceISO);
        const cbtRes = await supabase.from('cbt_scores').select('score, username');
        const mockRes = await supabase.from('mock_scores').select('score, username');
        const subjRes = await supabase.from('subject_scores').select('score, subject_id, username');

        const history = historyRes.data || [];
        const paidKeys = keysRes.data || [];
        const logs = logsRes.data || [];

        const now = Date.now();
        const totalUsers = profiles.length;
        const activatedUsers = profiles.filter(function(p) {
            return p.is_active && (!p.activation_expiry || new Date(p.activation_expiry).getTime() > now);
        }).length;
        const onlineNow = profiles.filter(function(p) {
            return p.last_seen && (now - new Date(p.last_seen).getTime()) < 5 * 60 * 1000;
        });
        const activeToday = profiles.filter(function(p) {
            return p.last_seen && (now - new Date(p.last_seen).getTime()) < 24 * 60 * 60 * 1000;
        });

        const days = lastNDays(rangeDays);
        const signupsByDay = {};
        const viewsByDay = {};
        const modeAttemptsByDay = {};
        const modeUsers = {};
        const paymentsByDay = {};

        days.forEach(function(d) { signupsByDay[d] = 0; viewsByDay[d] = 0; paymentsByDay[d] = 0; modeAttemptsByDay[d] = {}; });

        profiles.forEach(function(p) {
            if (!p.created_at) return;
            const k = dayKey(p.created_at);
            if (signupsByDay[k] !== undefined) signupsByDay[k]++;
        });

        logs.forEach(function(l) {
            if (l.action !== 'page_view') return;
            const k = dayKey(l.created_at);
            if (viewsByDay[k] !== undefined) viewsByDay[k]++;
        });

        const modeLabels = { 'cbt-full': 'CBT Full', 'cbt-single': 'CBT Single', 'exam': 'Exam', 'mock': 'Mock', 'novel': 'Novel', 'topic': 'Topic' };
        const modeAttemptsList = {};

        history.forEach(function(h) {
            const k = dayKey(h.submitted_at);
            if (!modeAttemptsByDay[k]) modeAttemptsByDay[k] = {};
            modeAttemptsByDay[k][h.mode] = (modeAttemptsByDay[k][h.mode] || 0) + 1;

            if (!modeUsers[h.mode]) modeUsers[h.mode] = new Set();
            modeUsers[h.mode].add(h.user_id);

            if (!modeAttemptsList[h.mode]) modeAttemptsList[h.mode] = [];
            modeAttemptsList[h.mode].push(h);
        });

        let totalRevenue = 0;
        paidKeys.forEach(function(k) {
            totalRevenue += (k.price || 0);
            if (k.used_at) {
                const dk = dayKey(k.used_at);
                if (paymentsByDay[dk] !== undefined) paymentsByDay[dk] += (k.price || 0);
            }
        });
        paidKeys.sort(function(a, b) { return new Date(b.used_at) - new Date(a.used_at); });

        function avg(arr) { return arr.length ? Math.round(arr.reduce(function(a, b) { return a + b; }, 0) / arr.length) : 0; }
        const cbtScores = (cbtRes.data || []).map(function(r) { return r.score || 0; });
        const mockScores = (mockRes.data || []).map(function(r) { return r.score || 0; });
        const subjScores = (subjRes.data || []).map(function(r) { return r.score || 0; });
        const historyByModeAvg = {};
        Object.keys(modeAttemptsList).forEach(function(m) {
            const pcts = modeAttemptsList[m].map(function(h) { return h.max_score ? Math.round((h.total_score / h.max_score) * 100) : 0; });
            historyByModeAvg[m] = avg(pcts);
        });

        state.analyticsData = {
            totalUsers: totalUsers,
            activatedUsers: activatedUsers,
            inactiveUsers: totalUsers - activatedUsers,
            onlineNow: onlineNow,
            activeToday: activeToday.length,
            signupsByDay: days.map(function(d) { return { label: shortDay(d), value: signupsByDay[d] }; }),
            viewsByDay: days.map(function(d) { return { label: shortDay(d), value: viewsByDay[d] }; }),
            paymentsByDay: days.map(function(d) { return { label: shortDay(d), value: paymentsByDay[d] }; }),
            totalViews: Object.values(viewsByDay).reduce(function(a, b) { return a + b; }, 0),
            totalRevenue: totalRevenue,
            paidKeys: paidKeys,
            modeAttemptsByDay: modeAttemptsByDay,
            modeUsers: modeUsers,
            modeLabels: modeLabels,
            days: days,
            historyByModeAvg: historyByModeAvg,
            totalAttempts: history.length,
            cbtAvg: avg(cbtScores),
            mockAvg: avg(mockScores),
            subjAvg: avg(subjScores),
            _profiles: profiles,
            _logs: logs,
        };
        
        state.analyticsLoaded = true;
        state.analyticsLoading = false;
        render();

    } catch (e) {
        console.error('Analytics load error:', e);
        showNetworkAwareError('Error loading analytics: ' + (e.message || 'unknown'), e);
        state.analyticsLoaded = true;
        state.analyticsLoading = false;
        render();
    }
}
function trendOf(dataArr) {
    if (!dataArr || dataArr.length < 4) return null;
    const mid = Math.floor(dataArr.length / 2);
    const first = dataArr.slice(0, mid).reduce(function(a, b) { return a + b.value; }, 0);
    const second = dataArr.slice(mid).reduce(function(a, b) { return a + b.value; }, 0);
    if (first === 0 && second === 0) return null;
    if (first === 0) return { pct: 100, up: true };
    const pct = Math.round(((second - first) / first) * 100);
    return { pct: Math.abs(pct), up: pct >= 0 };
}

function renderTrendBadge(trend) {
    if (!trend) return '';
    const color = trend.up ? '#0F6B3F' : '#C0392B';
    const bg = trend.up ? '#e8f5e9' : '#fce4ec';
    const arrow = trend.up ? '↑' : '↓';
    return '<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:' + color + ';background:' + bg + ';padding:1px 6px;border-radius:999px;margin-top:4px">' + arrow + ' ' + trend.pct + '%</span>';
}

function renderStatCard(icon, value, label, color) {
    return (
        '<div class="card" style="text-align:center;padding:14px 6px;margin:0">' +
        '<div style="font-size:20px;margin-bottom:4px">' + icon + '</div>' +
        '<div style="font-size:20px;font-weight:800;color:' + (color || 'var(--green)') + ';line-height:1.1">' + value + '</div>' +
        '<div style="font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.04em">' + esc(label) + '</div>' +

function renderKpiCard(opts) {

    );
}

function renderStatCardClickable(icon, value, label, color, filterKey) {
    return renderKpiCard({ icon: icon, value: value, label: label, color: color, filterKey: filterKey });
}

function renderBarChart(data, opts) {
    opts = opts || {};
    const color = opts.color || GREEN;
    const prefix = opts.prefix || '';
    const max = Math.max(1, ...data.map(function(d) { return d.value; }));
    let bars = '';
    data.forEach(function(d) {
        const pct = Math.max(2, Math.round((d.value / max) * 100));
        bars += (
            '<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:22px">' +
            '<div style="font-size:9px;font-weight:700;color:var(--ink);margin-bottom:3px;white-space:nowrap">' + prefix + d.value + '</div>' +
            '<div style="width:100%;max-width:26px;height:90px;display:flex;align-items:flex-end;background:var(--bg);border-radius:5px;overflow:hidden">' +
            '<div style="width:100%;height:' + pct + '%;background:linear-gradient(180deg,' + color + ' 0%,' + color + 'cc 100%);border-radius:4px 4px 0 0;transition:height 0.3s"></div>' +
            '</div>' +
            '<div style="font-size:8px;color:var(--muted);margin-top:4px;text-align:center;white-space:nowrap">' + esc(d.label) + '</div>' +
            '</div>'
        );
    });
    return '<div style="display:flex;gap:5px;align-items:flex-end;overflow-x:auto;padding:4px 2px 0">' + bars + '</div>';
}

function renderAnalyticsUserList(filterKey) {
    if (!state.analyticsData) return '<div class="loading-spinner"><div class="spinner"></div><p>Loading users...</p></div>';
    
    const d = state.analyticsData;
    let users = [];
    let title = '';
    let icon = '';
    
    // Get all profiles from the analytics data
    const allProfiles = d._profiles || [];
    
    switch(filterKey) {
        case 'all-users':
            users = allProfiles;
            title = 'All Registered Users';
            icon = '👤';
            break;
        case 'activated-users':
            users = allProfiles.filter(function(p) {
                return p.is_active && (!p.activation_expiry || new Date(p.activation_expiry).getTime() > Date.now());
            });
            title = 'Activated Users';
            icon = '✅';
            break;
        case 'inactive-users':
            users = allProfiles.filter(function(p) {
                return !p.is_active || (p.activation_expiry && new Date(p.activation_expiry).getTime() <= Date.now());
            });
            title = 'Inactive Users';
            icon = '⛔';
            break;
        case 'online-now':
            users = allProfiles.filter(function(p) {
                return p.last_seen && (Date.now() - new Date(p.last_seen).getTime()) < 5 * 60 * 1000;
            });
            title = 'Online Now';
            icon = '🟢';
            break;
        case 'active-today':
            users = allProfiles.filter(function(p) {
                return p.last_seen && (Date.now() - new Date(p.last_seen).getTime()) < 24 * 60 * 60 * 1000;
            });
            title = 'Active Today';
            icon = '📅';
            break;
        case 'app-views':
            // Show app view logs instead of users
            const logs = d._logs || [];
            const viewLogs = logs.filter(function(l) { return l.action === 'page_view'; });
            return renderAnalyticsViewLogs(viewLogs);
        default:
            return '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No data for this filter.</p></div>';
    }
    
    if (users.length === 0) {
        return (
            '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No users found for this filter.</p></div>'
        );
    }
    
    let rows = '';
    users.forEach(function(user) {
        const isActive = user.is_active !== false;
        const expiry = user.activation_expiry ? new Date(user.activation_expiry) : null;
        const daysLeft = expiry ? Math.ceil((expiry - new Date()) / (1000 * 60 * 60 * 24)) : null;
        let statusLabel = isActive ? '✅ Active' : '⛔ Inactive';
        if (isActive && daysLeft !== null && daysLeft < 3) statusLabel = '⚠️ ' + daysLeft + 'd left';
        const lastSeen = user.last_seen ? formatTimeAgo(user.last_seen) : 'Never';
        
        rows += (

function renderAdminOverview() {
    if (!state.allQuestionsLoaded) {
        loadAllQuestionsForAdmin();
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading question counts...</p></div>';
    }
    const userCount = state.allUsers.length || 0;

    const modeCounts = {
        cbt: 0,
        exam: 0,
        mock: 0,
        topic: 0,
        literature: 0
    };
    
    // Subject breakdown per mode
    const subjectBreakdown = {};

    if (state.allQuestions && state.allQuestions.length > 0) {
        state.allQuestions.forEach(function(q) {
            const type = q.type || '';
            const subject = q.subject_id || '';
            
            if (!subjectBreakdown[type]) subjectBreakdown[type] = {};
            if (!subjectBreakdown[type][subject]) subjectBreakdown[type][subject] = 0;
            subjectBreakdown[type][subject] += 1;
            
            if (type === 'cbt') {
                modeCounts.cbt += 1;
            } else if (type === 'exam') {
                modeCounts.exam += 1;
            } else if (type === 'mock') {
                modeCounts.mock += 1;
            } else if (type === 'subject') {
                modeCounts.topic += 1;
            } else if (type === 'NOVEL (CBT)') {
                modeCounts.literature += 1;
            }
        });
    }

    function renderSubjectBreakdown(type) {
        const breakdown = subjectBreakdown[type] || {};
        const keys = Object.keys(breakdown);
        if (keys.length === 0) return '';
        let html = '<div class="admin-subject-breakdown">';
        keys.forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const name = subj ? subj.code : sid;
            html += '<span class="subj-tag">' + esc(name) + ' <span class="count">' + breakdown[sid] + '</span></span>';
        });
        html += '</div>';
        return html;
    }

    return (
        '<p class="section-label">Question Counts by Mode</p>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="cbt">' +
        '<div class="mode-info">' +
        '<span class="mode-name">📚 CBT Mode</span>' +
        '<span class="mode-count">' + modeCounts.cbt + ' questions</span>' +
        renderSubjectBreakdown('cbt') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.cbt + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="cbt">✏️</span>' +
        '</div>' +
        '</div>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="exam">' +
        '<div class="mode-info">' +
        '<span class="mode-name">📝 Exam Mode</span>' +
        '<span class="mode-count">' + modeCounts.exam + ' questions</span>' +
        renderSubjectBreakdown('exam') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.exam + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="exam">✏️</span>' +
        '</div>' +
        '</div>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="mock">' +
        '<div class="mode-info">' +
        '<span class="mode-name">🎯 Mock Exam</span>' +
        '<span class="mode-count">' + modeCounts.mock + ' questions</span>' +
        renderSubjectBreakdown('mock') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.mock + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="mock">✏️</span>' +
        '</div>' +
        '</div>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="topic">' +
        '<div class="mode-info">' +
        '<span class="mode-name">📋 Topic Practice</span>' +
        '<span class="mode-count">' + modeCounts.topic + ' questions</span>' +
        renderSubjectBreakdown('subject') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.topic + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="topic">✏️</span>' +

        '</div>' +
        '<div class="admin-mode-card" data-action="admin-view-questions" data-type="literature">' +
        '<div class="mode-info">' +
        '<span class="mode-name">📖 Novel (CBT)</span>' +
        '<span class="mode-count">' + modeCounts.literature + ' questions</span>' +
        renderSubjectBreakdown('NOVEL (CBT)') +
        '</div>' +
        '<div class="mode-actions">' +
        '<span class="count-badge">' + modeCounts.literature + '</span>' +
        '<span class="edit-icon" data-action="admin-edit-mode" data-mode="literature">✏️</span>' +
        '</div>' +
        '</div>' +
        '<div class="card" style="margin-top:10px">' +

// ============================================================
//  ADMIN VIEW MODE QUESTIONS
// ============================================================
function renderAdminViewModeQuestions() {
    const type = state.admin.viewModeType;
    if (type === 'topic') return renderAdminTopicManagement();

    // Novel (CBT) only has one subject — skip straight to it
    if (type === 'literature' && !state.admin.viewModeSubject) {
        state.admin.viewModeSubject = 'lhm';
    }

    const subject = state.admin.viewModeSubject;
    const year = state.admin.viewModeYear;

    if (!subject) return renderAdminSubjectPicker(type);
    if (type === 'exam' && !year) return renderAdminYearPicker(type, subject);
    return renderAdminSubjectQuestions(type, subject, year);
}

function renderAdminSubjectPicker(type) {
    let title = 'All Questions';
    if (type === 'cbt') title = 'CBT Mode Questions';
    else if (type === 'exam') title = 'Exam Mode Questions';
    else if (type === 'mock') title = 'Mock Exam Questions';
    else if (type === 'literature') title = 'Novel (CBT) Questions';

    const typeFilter = type === 'literature' ? 'NOVEL (CBT)' : type;
    const counts = {};
    (state.allQuestions || []).forEach(function(q) {
        if (q.type === typeFilter) counts[q.subject_id] = (counts[q.subject_id] || 0) + 1;
    });

    let cards = '';
    SUBJECTS.filter(function(s) { return s.id !== 'lhm'; }).forEach(function(s) {
        const count = counts[s.id] || 0;
        cards += (
            '<div class="admin-mode-card" data-action="admin-select-view-subject" data-subject="' + s.id + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name">' + esc(s.code) + ' — ' + esc(s.name) + '</span>' +
            '<span class="mode-count">' + count + ' question' + (count === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<div class="mode-actions"><span class="count-badge">' + count + '</span></div>' +
            '</div>'
        );
    });

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + title + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +
        '</div>' +
        '<p class="section-label">Select a subject to view or add questions</p>' +
        cards
    );
}

function renderAdminYearPicker(type, subject) {
    const subj = SUBJECTS.find(function(s) { return s.id === subject; });
    const counts = {};
    (state.allQuestions || []).forEach(function(q) {
        if (q.type === 'exam' && q.subject_id === subject) counts[q.year] = (counts[q.year] || 0) + 1;
    });

    let cards = '';
    for (let y = 2026; y >= 2021; y--) {
        const count = counts[y] || 0;
        cards += (
            '<div class="admin-mode-card" data-action="admin-select-view-year" data-year="' + y + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name">📅 ' + y + '</span>' +
            '<span class="mode-count">' + count + ' question' + (count === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<div class="mode-actions"><span class="count-badge">' + count + '</span></div>' +
            '</div>'
        );
    }

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + esc(subj ? subj.name : subject) + ' — Exam Mode</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-to-subject-picker">← Subjects</button>' +
        '</div>' +
        '<p class="section-label">Select a year</p>' +
        cards
    );
}

function renderAdminSubjectQuestions(type, subject, year) {
    const subj = SUBJECTS.find(function(s) { return s.id === subject; });
    const search = state.admin.searchQuery || '';
    const typeFilter = type === 'literature' ? 'NOVEL (CBT)' : type;

    let filtered = (state.allQuestions || []).filter(function(q) {
        return q.type === typeFilter && q.subject_id === subject && (type !== 'exam' || q.year === year);
    });

    if (search) {
        const s = search.toLowerCase();
        filtered = filtered.filter(function(q) {
            return q.text.toLowerCase().includes(s) ||
                (q.options && q.options.some(function(o) { return o.toLowerCase().includes(s); }));
        });
    }

    const backAction = type === 'exam' ? 'admin-back-to-year-picker' : 'admin-back-to-subject-picker';
    const backLabel = type === 'exam' ? '← Years' : '← Subjects';

    let rows = "";
    if (filtered.length === 0) {
        rows = '<p style="text-align:center;color:var(--faint);padding:20px 0;font-size:13px">No questions yet. Add one below!</p>';
    } else {
        filtered.forEach(function(q, i) {
            const isEditing = state.admin.editingQuestionId === q.id;
            if (isEditing) {
                let editOptsHtml = "";
                for (let oi = 0; oi < 4; oi++) {
                    editOptsHtml += (
                        '<div class="opt-row">' +
                        '<input type="radio" name="edit-correct" value="' + oi + '"' + (q.correct_answer === oi ? ' checked' : '') +
                        ' data-action="edit-correct" />' +
                        '<input class="field" data-action="edit-opt" data-idx="' + oi + '" placeholder="Option ' + (oi + 1) +
                        '" value="' + esc(q.options[oi] || '') + '" style="font-size:13px" />' +
                        '</div>'
                    );
                }
                rows += (
                    '<div class="edit-form">' +
                    '<p style="font-size:11px;font-weight:600;color:var(--gold);margin-bottom:6px">✏️ Editing Question ' + (i + 1) + '</p>' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:6px">' +
                    '<button class="btn btn-green" style="flex:1;padding:8px" data-action="save-edit" data-qid="' + q.id + '">Save Changes</button>' +
                    '<button class="btn btn-outline" style="flex:0.5;padding:8px" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'

            } else {
                let optsList = '<ul class="admin-list">';
                q.options.forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN + ';font-weight:600"' : '') +

                });
                optsList += '</ul>';
                rows += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">Q' + (i + 1) + '. ' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id + '">✏️</button>' +

                    '</div>'
                );
            }
        });
    }

    let optsHtml = "";
    for (let i = 0; i < 4; i++) {
        optsHtml += (

            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ? ' checked' : '') + ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) + '" value="' + esc(state.admin.qOpts[i]) + '" style="font-size:13px" />' +
            '</div>'
        );
    }

    const addForm = (
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add Question to ' + esc(subj ? subj.name : subject) + (year ? ' (' + year + ')' : '') + '</p>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:8px;font-size:13px" placeholder="Enter question...">' + esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +
        optsHtml +
        '<label class="field-label">Explanation (shown after answering)</label>' +
        '<textarea class="field" rows="2" data-action="qform-explanation" style="margin-bottom:8px;font-size:13px" placeholder="Explain why this answer is correct...">' + esc(state.admin.qExplanation) + '</textarea>' +

        '<p style="font-size:13px;font-weight:600;margin:0 0 6px">📋 Or Paste Questions as JSON</p>' +
