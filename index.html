async function startMockExam(mockExamId) {
    if (!state.authUser) { showToast('Please login first.', 'error'); return; }
    if (!isUserActive()) {
        showToast('Your account needs to be activated to access this feature. Contact admin or visit the Activate page.', 'error');
        state.view = 'activate';
        render();
        return;
    }
    
    state.isLoading = true;
    render();

    try {
        const reg = state.mockRegistrations.find(function(r) {
            return r.mock_exam_id === mockExamId && r.user_id === state.authUser.id;
        });

        if (!reg) { 
            state.isLoading = false;
            showToast('You are not registered for this mock.', 'error'); 
            render();
            return; 
        }

        const existing = state.mockAttempts.find(function(a) {
            return a.mock_exam_id === mockExamId && a.user_id === state.authUser.id;
        });

        if (existing && existing.is_submitted) {
            state.isLoading = false;
            showToast('You have already submitted this mock.', 'error');
            render();
            return;
        }

        let allQuestions = [];
        const subjects = reg.subjects;

        state.engMockPassage = null;
        state.engMockHasPassage = false;
        state.engMockPassageRead = false;
        state.engMockPassageId = null;

        if (existing && !existing.is_submitted) {
            const questionIds = existing.question_ids || [];
            if (questionIds.length > 0) {
                const { data: qData, error: qError } = await supabase
                    .from('questions')
                    .select('*')
                    .in('id', questionIds);

                if (!qError && qData && qData.length > 0) {
                    allQuestions = qData;
                    state.currentMockAttempt = existing;
                    
                    const answersObj = existing.answers || {};
                    state.mockAnswers = allQuestions.map(function(q) {
                        return answersObj[q.id] !== undefined ? answersObj[q.id] : null;
                    });

                    const engQuestion = allQuestions.find(function(q) {
                        return q.subject_id === 'eng' && q.batch_number;
                    });
                    if (engQuestion) {
                        const { data: passage } = await supabase
                            .from('passages')
                            .select('*')
                            .eq('batch_number', engQuestion.batch_number)
                            .eq('subject_id', 'eng')
                            .maybeSingle();
                        if (passage) {
                            state.engMockPassage = passage;
                            state.engMockHasPassage = true;
                            state.engMockPassageId = passage.id;
                            const anyEngAnswered = allQuestions.some(function(q, idx) {
                                return q.subject_id === 'eng' &&
                                    state.mockAnswers[idx] !== null &&
                                    state.mockAnswers[idx] !== undefined;
                            });
                            state.engMockPassageRead = anyEngAnswered;
                        }
                    } else {
                        state.engMockPassageRead = true;
                    }
                    
                    const settings = await loadSettings();
                    const timeLimit = settings.mockTimeLimit || 100;
                    state.mockTimeLeft = Math.max(0, (timeLimit * 60) - (existing.time_taken || 0));
                    state.mockQuestions = allQuestions;
                    state.mockIndex = 0;
                    state.mockExamId = mockExamId;
                    state.isLoading = false;
                    
                    buildMockSubjectGroups(allQuestions);

                    state.view = 'mock-exam';
                    render();

                    if (state.mockTimer) clearInterval(state.mockTimer);
                    state.mockTimer = setInterval(function() {
                        state.mockTimeLeft--;
                        if (state.mockTimeLeft <= 0) {
                            clearInterval(state.mockTimer);
                            state.mockTimer = null;
                            submitMockExam(true);
                        } else {
                            render();
                        }
                    }, 1000);

                    return;
                }
            }
        }

        const settings = await loadSettings();
        const perSubject = 40;
        
        for (const subjectId of subjects) {
            const { data: usedQuestions, error: usedError } = await supabase
                .from('mock_user_question_tracking')
                .select('question_id')
                .eq('user_id', state.authUser.id)
                .eq('subject_id', subjectId);

            if (usedError) throw usedError;
            const usedIds = (usedQuestions || []).map(function(u) { return u.question_id; });

            let query = supabase
                .from('questions')
                .select('*')
                .eq('subject_id', subjectId)
                .eq('type', 'mock');

            if (usedIds.length > 0) query = query.not('id', 'in', '(' + usedIds.join(',') + ')');

            if (subjectId === 'eng') {
                const { data: batches, error: batchError } = await supabase
                    .from('passages')
                    .select('batch_number')
                    .eq('subject_id', 'eng')
                    .order('batch_number');

                let engQuestionsLoaded = false;

                if (!batchError && batches && batches.length > 0) {
                    const completedKey = 'eng_mock_completed_' + state.authUser.id;
                    const completedBatches = JSON.parse(storage.get(completedKey) || '[]');

                    let availableBatches = batches
                        .map(function(b) { return b.batch_number; })
                        .filter(function(bn) { return completedBatches.indexOf(bn) === -1; });

                    if (availableBatches.length === 0) {
                        storage.set(completedKey, JSON.stringify([]));
                        availableBatches = batches.map(function(b) { return b.batch_number; });
                    }

                    const batchTryOrder = shuffleArray(availableBatches);

                    for (const selectedBatch of batchTryOrder) {
                        const { data: qData, error: qError } = await supabase
                            .from('questions')
                            .select('*')
                            .eq('subject_id', 'eng')
                            .eq('type', 'mock')
                            .eq('batch_number', selectedBatch)
                            .order('display_order', { ascending: true })
                            .limit(perSubject);

                        if (!qError && qData && qData.length > 0) {
                            const { data: passage, error: passageError } = await supabase
                                .from('passages')
                                .select('*')
                                .eq('batch_number', selectedBatch)
                                .eq('subject_id', 'eng')
                                .maybeSingle();

                            if (!passageError && passage) {
                                state.engMockPassage = passage;
                                state.engMockHasPassage = true;
                                state.engMockPassageRead = false;
                                state.engMockPassageId = passage.id;
                            } else {
                                state.engMockPassage = null;
                                state.engMockHasPassage = false;
                                state.engMockPassageRead = true;
                                state.engMockPassageId = null;
                            }

                            allQuestions = allQuestions.concat(qData);
                            engQuestionsLoaded = true;
                            break;
                        }
                    }
                }

                if (!engQuestionsLoaded) {
                    state.engMockPassage = null;
                    state.engMockHasPassage = false;
                    state.engMockPassageRead = true;
                    state.engMockPassageId = null;

                    const { data: usedEngQuestions } = await supabase
                        .from('mock_user_question_tracking')
                        .select('question_id')
                        .eq('user_id', state.authUser.id)
                        .eq('subject_id', 'eng');
                    const usedEngIds = (usedEngQuestions || []).map(function(u) { return u.question_id; });

                    let engQuery = supabase
                        .from('questions')
                        .select('*')
                        .eq('subject_id', 'eng')
                        .eq('type', 'mock')
                        .order('display_order', { ascending: true });
                    if (usedEngIds.length > 0) engQuery = engQuery.not('id', 'in', '(' + usedEngIds.join(',') + ')');

                    let { data: engData } = await engQuery.limit(perSubject);
                    if (!engData || engData.length < perSubject) {
                        const { data: resetEngData } = await supabase
                            .from('questions')
                            .select('*')
                            .eq('subject_id', 'eng')
                            .eq('type', 'mock')
                            .order('display_order', { ascending: true })
                            .limit(perSubject);
                        engData = resetEngData || [];
                    }

                    const selectedEng = engData.slice(0, perSubject);
                    if (selectedEng.length > 0) {
                        await supabase.from('mock_user_question_tracking').insert(
                            selectedEng.map(function(q) {
                                return { user_id: state.authUser.id, question_id: q.id, subject_id: 'eng' };
                            })
                        );
                    }
                    allQuestions = allQuestions.concat(selectedEng);
                }
            } else {
                const { data: availableQuestions, error: qError } = await query.limit(perSubject * 2);
                if (qError) throw qError;

                let selectedQuestions;
                if (availableQuestions.length < perSubject) {
                    await supabase
                        .from('mock_user_question_tracking')
                        .delete()
                        .eq('user_id', state.authUser.id)
                        .eq('subject_id', subjectId);

                    const { data: resetQuestions, error: resetError } = await supabase
                        .from('questions')
                        .select('*')
                        .eq('subject_id', subjectId)
                        .eq('type', 'mock')
                        .limit(perSubject * 2);

                    if (resetError) throw resetError;
                    const shuffled = shuffleArray(resetQuestions || []);
                    selectedQuestions = shuffled.slice(0, perSubject);
                } else {
                    const shuffled = shuffleArray(availableQuestions);
                    selectedQuestions = shuffled.slice(0, perSubject);
                }

                if (selectedQuestions.length > 0) {
                    await supabase
                        .from('mock_user_question_tracking')
                        .insert(selectedQuestions.map(function(q) {
                            return { user_id: state.authUser.id, question_id: q.id, subject_id: subjectId };
                        }));
                }
                allQuestions = allQuestions.concat(selectedQuestions);
            }
        }

        const { data: attempt, error: attemptError } = await supabase
            .from('mock_attempts')
            .insert([{
                user_id: state.authUser.id,
                mock_exam_id: mockExamId,
                question_ids: allQuestions.map(function(q) { return q.id; }),
                answers: {},
                total_questions: allQuestions.length,
                started_at: new Date().toISOString(),
                is_submitted: false,
                time_taken: 0,
            }])
            .select()
            .single();

        if (attemptError) {
            console.error('Attempt error:', attemptError);
            state.isLoading = false;
            throw new Error(attemptError.message || 'Failed to start mock exam');
        }

        state.currentMockAttempt = attempt;
        state.mockQuestions = allQuestions;
        state.mockAnswers = new Array(allQuestions.length).fill(null);
        state.mockIndex = 0;
        state.mockFinished = false;
        state.mockSubmitted = false;
        const timeLimit = settings.mockTimeLimit || 100;
        state.mockTimeLeft = timeLimit * 60;
        state.mockExamId = mockExamId;
        state.isLoading = false;
        
        buildMockSubjectGroups(allQuestions);

        state.view = 'mock-exam';
        render();

        if (state.mockTimer) clearInterval(state.mockTimer);
        state.mockTimer = setInterval(function() {
            state.mockTimeLeft--;
            if (state.mockTimeLeft <= 0) {
                clearInterval(state.mockTimer);
                state.mockTimer = null;
                submitMockExam(true);
            } else {
                render();
            }
        }, 1000);

    
    } catch (e) {
        console.warn('Start mock error:', e);
        state.isLoading = false;
        showToast('Error starting mock: ' + (e.message || 'unknown'), 'error');
        state.view = 'mockexam';
        render();
    }
}
function buildMockSubjectGroups(questions) {
    const groups = {};
    questions.forEach(function(q, i) {
        if (!groups[q.subject_id]) groups[q.subject_id] = [];
        groups[q.subject_id].push(i);
    });
    state.mockSubjectQuestions = groups;
    state.mockSubjectOrder = Object.keys(groups);
    state.mockCurrentSubject = state.mockSubjectOrder[0] || null;
}

function buildCbtSubjectGroups(questions) {
    const groups = {};
    questions.forEach(function(q, i) {
        if (!groups[q.subject_id]) groups[q.subject_id] = [];
        groups[q.subject_id].push(i);
    });
    state.cbtSubjectQuestions = groups;
    state.cbtSubjectOrder = Object.keys(groups);
    state.cbtCurrentSubject = state.cbtSubjectOrder[0] || null;
}

}

function submitMockExam(autoSubmit) {
    if (state.mockSubmitted) return;

    const subjectMap = {};
    state.mockQuestions.forEach(function(q, i) {
        if (!subjectMap[q.subject_id]) {
            const subj = SUBJECTS.find(function(s) { return s.id === q.subject_id; });
            subjectMap[q.subject_id] = {
                name: subj ? subj.name : q.subject_id,
                total: 0,
                answered: 0,
                unanswered: 0,
            };
        }
        subjectMap[q.subject_id].total++;
        const isAnswered = state.mockAnswers[i] !== null && state.mockAnswers[i] !== undefined;
        if (isAnswered) subjectMap[q.subject_id].answered++;
        else subjectMap[q.subject_id].unanswered++;
    });

    const subjectSummaries = Object.values(subjectMap);
    const totalAnswered = state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const totalQuestions = state.mockQuestions.length;

    state.showSubmitModal = true;
    state.submitModalData = {
        total: totalQuestions,
        answered: totalAnswered,
        subjects: subjectSummaries,
        isMock: true,
        onConfirm: function() {
            state.showSubmitModal = false;
            state.submitModalData = null;
            doSubmitMock(true);
        },
        onCancel: function() {
            state.showSubmitModal = false;
            state.submitModalData = null;
            render();
        }
    };
    render();
}

function doSubmitMock(autoSubmit) {
    state.mockSubmitted = true;
    if (state.mockTimer) {
        clearInterval(state.mockTimer);
        state.mockTimer = null;
    }

    const rawSubjectCounts = {};
    const weakQuestionsToSave = [];

    state.mockQuestions.forEach(function(q) {
        if (!(q.subject_id in rawSubjectCounts)) rawSubjectCounts[q.subject_id] = 0;
    });
     
    state.mockQuestions.forEach(function(q, i) {
        const isCorrect = state.mockAnswers[i] === q.correct_answer;
        if (isCorrect) {
            rawSubjectCounts[q.subject_id]++;
        } else {
            weakQuestionsToSave.push({ questionId: q.id, subjectId: q.subject_id, userAnswer: state.mockAnswers[i], correctAnswer: q.correct_answer });
        }
    });

    const subjectScores = {}; Object.keys(rawSubjectCounts).forEach(function(sid) {
        subjectScores[sid] = Math.round((rawSubjectCounts[sid] / 40) * 100);
    });
    
    const subjectCount = state.settingsCache.mockSubjectCount || 4;
    let totalScore = Object.values(subjectScores).reduce(function(a, b) { return a + b; }, 0);
    const maxPossible = subjectCount * 100;
    if (totalScore > maxPossible) totalScore = maxPossible;

    state.mockScore = totalScore;
    state.mockSubjectScores = subjectScores;
    state.mockTotal = subjectCount * 100;
    state.mockSubmittedAt = new Date().toISOString();
    const answersObj = {};
    state.mockQuestions.forEach(function(q, i) {
        answersObj[q.id] = state.mockAnswers[i];
    });

    if (state.authUser) {
        weakQuestionsToSave.forEach(function(wq) {
            saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'mock', wq.userAnswer, wq.correctAnswer);
        });
        
        const subjects = Object.keys(subjectScores);
        const subjectNames = subjects.map(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            return subj ? subj.name : sid;
        });
        const exam = state.mockExams.find(function(e) { return e.id === state.mockExamId; });
        saveHistoryEntry({
            mode: 'mock',
            subjects: subjectNames,
            subject_scores: subjectScores,
            total_score: totalScore,
            max_score: state.mockTotal,
            total_questions: state.mockQuestions.length,
            answered_count: state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            submitted_at: state.mockSubmittedAt,
            exam_title: exam ? exam.title : 'Mock Exam',
        });
    }
    supabase
        .from('mock_attempts')
        .update({
            answers: answersObj,
            score: totalScore,
            is_submitted: true,
            submitted_at: state.mockSubmittedAt,
            time_taken: state.settingsCache.mockTimeLimit * 60 - state.mockTimeLeft,
            subject_scores: subjectScores,
        })
        .eq('id', state.currentMockAttempt.id)
        .then(function() {
            if (state.authUser) {
                saveScore('mock', {
                    user_id: state.authUser.id,
                    username: state.profile.name,
                    score: totalScore,
                    total_questions: state.mockQuestions.length,
                    subject_count: state.settingsCache.mockSubjectCount || 4,
                    subject_scores: subjectScores,
                });
            }
            state.mockWaitingForResults = true;
            state.view = 'mock-result';
            render();
        })
        .catch(function(err) {
            console.warn('Submit error:', err);
            state.mockWaitingForResults = true;
            state.view = 'mock-result';
            render();
        });
}

function generateKeyString() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    function block() {
        let s = '';
        for (let i = 0; i < 4; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
        return s;
    }
    return block() + '-' + block() + '-' + block();
}

async function loadActivationKeys() {

        const { data, error } = await supabase

}

async function adminGenerateKey(planId) {
    const plan = state.activationPlans.find(function(p) { return p.id === planId; });
    if (!plan) { showToast('Select a plan first.', 'error'); return; }

    let key = generateKeyString();
    let attempts = 0;
    let inserted = null;

    while (attempts < 5 && !inserted) {
        const { data, error } = await supabase.from('activation_keys').insert([{
            key_code: key,
            plan_id: plan.id,
            plan_name: plan.name,
            days: plan.days,
            price: plan.price,
            is_used: false,
        }]).select().single();

        if (!error) { inserted = data; break; }
        if (error.code === '23505') {
            key = generateKeyString();
            attempts++;
            continue;
        }
        console.warn('Generate key error:', error);
        showToast('Error generating key: ' + error.message, 'error');
        return;
    }

    if (inserted) {
        showToast('Key generated: ' + key, 'success');
        loadActivationKeys();
    } else {
        showToast('Could not generate a unique key, try again.', 'error');
    }
}

async function verifyPaystackPayment(reference, planId) {
    state.activateStatus = 'checking';
    state.activateStatusMsg = 'Verifying your payment…';
    render();

    try {
        const res = await fetch(PAYSTACK_VERIFY_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            },
            body: JSON.stringify({
                reference: reference,
                planId: planId,
                userId: state.authUser.id,
            }),
        });
        const data = await res.json();

        if (!res.ok || data.error) {
            state.activateStatus = 'error';
            state.activateStatusMsg = data.error || 'Payment verification failed. Contact support with your reference: ' + reference;
            render();
            return;
        }

        state.profile.is_active = true;
        state.profile.activation_expiry = data.expiresAt;
        state.activateCode = data.keyCode;
        state.activateStatus = 'success';
        state.activateStatusMsg = '🎉 Payment confirmed! Your account is now active for ' + data.days + ' days. Your license key: ' + data.keyCode;
        showToast('Activated successfully!', 'success');
        state.view = 'activate';
        render();
    } catch (e) {
        state.activateStatus = 'error';
        state.activateStatusMsg = 'Could not verify payment. Contact support with your reference: ' + reference;
        render();
    }
}

async function redeemActivationKey(rawKey) {
    if (!state.authUser) { showToast('Please log in first.', 'error'); return; }
    const keyCode = (rawKey || '').trim().toUpperCase();
    if (!keyCode) {
        state.activateStatus = 'error';
        state.activateStatusMsg = 'Please enter a license key.';
        render();
        return;
    }

    state.activateStatus = 'checking';
    render();

    try {
        const { data: keyRow, error } = await supabase
            .from('activation_keys')
            .select('*')
            .eq('key_code', keyCode)
            .maybeSingle();

        if (error) {
            console.warn('Redeem key lookup error:', error);
            state.activateStatus = 'error';
            state.activateStatusMsg = 'Error checking key. Please try again.';
            render();
            return;
        }
        if (!keyRow) {
            state.activateStatus = 'error';
            state.activateStatusMsg = 'Invalid license key. Please check and try again.';
            render();
            return;
        }
        if (keyRow.is_used) {
            state.activateStatus = 'error';
            state.activateStatusMsg = 'This license key has already been used.';
            render();
            return;
        }

        const expiryDate = new Date();
        expiryDate.setDate(expiryDate.getDate() + (keyRow.days || 30));

        const { error: keyUpdateError } = await supabase
            .from('activation_keys')
            .update({
                is_used: true,
                used_by: state.authUser.id,
                used_by_username: state.profile.name,
                used_at: new Date().toISOString(),
            })
            .eq('id', keyRow.id)
            .eq('is_used', false);

        if (keyUpdateError) {
            console.warn('Redeem key update error:', keyUpdateError);
            state.activateStatus = 'error';
            state.activateStatusMsg = 'This key was just used by someone else. Try another key.';
            render();
            return;
        }

        await supabase.from('profiles').update({
            is_active: true,
            activation_expiry: expiryDate.toISOString(),
        }).eq('id', state.authUser.id);

        state.profile.is_active = true;
        state.profile.activation_expiry = expiryDate.toISOString();
        state.activateStatus = 'success';
        state.activateStatusMsg = '🎉 Activated! Your account is now active for ' + (keyRow.days || 30) + ' days.';
        state.activateCode = '';
        showToast('Account activated!', 'success');
        render();
    } catch (e) {
        console.warn('Redeem key exception:', e);
        state.activateStatus = 'error';
        state.activateStatusMsg = 'Something went wrong. Please try again.';
        render();
    }
}

function generateAiSupportReply(userText, issueKey) {
    if (issueKey && SUPPORT_QUICK_REPLIES[issueKey]) {
        return SUPPORT_QUICK_REPLIES[issueKey]();
    }

    const t = (userText || '').toLowerCase();
    const isActive = isUserActive();
    const expiry = state.profile.activation_expiry ? new Date(state.profile.activation_expiry) : null;

    if (t.includes('activat')) return SUPPORT_QUICK_REPLIES.not_active();
    if (t.includes('key') && (t.includes('invalid') || t.includes('wrong'))) return SUPPORT_QUICK_REPLIES.key_invalid();
    if (t.includes('key') && t.includes('used')) return SUPPORT_QUICK_REPLIES.key_used();
    if (t.includes('paystack') || t.includes('card')) return SUPPORT_QUICK_REPLIES.paystack_failed();
    if (t.includes('refund')) return SUPPORT_QUICK_REPLIES.refund();
    if (t.includes('login') || t.includes('log in')) return SUPPORT_QUICK_REPLIES.cant_login();
    if (t.includes('password')) return SUPPORT_QUICK_REPLIES.forgot_password();
    if (t.includes('slow') || t.includes('lag')) return SUPPORT_QUICK_REPLIES.app_slow();
    if (t.includes('crash') || t.includes('error')) return SUPPORT_QUICK_REPLIES.app_crash();
    if (t.includes('score')) return SUPPORT_QUICK_REPLIES.wrong_score();
    if (t.includes('offline')) return SUPPORT_QUICK_REPLIES.offline_issue();
    if (t.includes('pay') || t.includes('paid') || t.includes('transfer')) return SUPPORT_QUICK_REPLIES.manual_payment_pending();

    return { text: 'I\'m not fully sure what you mean — could you tap one of the quick options above, or describe it a bit more? If I still can\'t help, our team will step in shortly.', escalate: true };
}

async function startCbt() {
    if (!state.authUser) { showToast('Please log in to access this feature.', 'error'); state.showLogin = true; render(); return; }
    if (!isUserActive()) {
        showToast('Your account needs to be activated to access this feature. Contact admin or visit the Activate page.', 'error');
        state.view = 'activate';
        render();
        return;
    }
    
    const isFull = state.cbtMode === 'full';
    const selected = state.cbtSelected;
    const settings = await loadSettings();
    const requiredSubjects = isFull ? (settings.cbtSubjectCount || 3) : 1;
    
    if (isFull && selected.length !== requiredSubjects) {
        showToast("Please select " + requiredSubjects + " subjects.", "error");
        return;
    }
    if (!isFull && selected.length !== 1) {
        showToast("Please select 1 subject.", "error");
        return;
    }

    state.isLoading = true;
    render();

    state.currentEnglishPassage = null;
    state.hasPassage = false;
    state.passageRead = false;
    state.passageQuestionIds = [];

    if (state.authUser) {
        const savedBatch = storage.get('englishBatchTracker_' + state.authUser.id);
        if (savedBatch) {
            state.englishBatchTracker = parseInt(savedBatch, 10) || 1;
        }
    }

    let subjects = [];
    if (isFull) {
        const eng = SUBJECTS.find(function(s) { return s.compulsory; });
        subjects = [eng, ...selected.map(function(id) { return SUBJECTS.find(function(s) { return s.id === id; }); })];
    } else {
        subjects = selected.map(function(id) { return SUBJECTS.find(function(s) { return s.id === id; }); });
    }

    let allQuestions = [];
    const perSubject = settings.cbtQuestionsPerSubject || 40;
    
    for (const subject of subjects) {
        let qs = [];
        
        if (subject.id === 'eng') {
            const currentBatch = state.englishBatchTracker || 1;
            qs = await window.OfflineDB.loadQuestionsOffline('cbt', subject.id, null, perSubject);
             
            if (qs.length > 0) {
                qs.sort(function(a, b) {
                    const aHasPassage = a.passage_id === currentBatch ? 0 : 1;
                    const bHasPassage = b.passage_id === currentBatch ? 0 : 1;
                    if (aHasPassage !== bHasPassage) {
                        return aHasPassage - bHasPassage;
                    }
                    return a.id - b.id;
                });
            }
                
            const passage = await window.OfflineDB.getPassageOffline(currentBatch);
            if (passage) {
                state.currentEnglishPassage = passage;
                state.hasPassage = true;
                state.passageRead = false;
                state.passageQuestionIds = [];
                
                const passageQuestionIds = [];
                qs.forEach(function(q) {
                    if (q.passage_id === currentBatch) {
                        passageQuestionIds.push(q.id);
                    }
                });
                state.passageQuestionIds = passageQuestionIds;
            } else {
                state.currentEnglishPassage = null;
                state.hasPassage = false;
                state.passageRead = false;
                state.passageQuestionIds = [];
            }
            
            if (qs.length === 0 && currentBatch < 6) {
                state.englishBatchTracker = currentBatch + 1;
                qs = await window.OfflineDB.loadQuestionsOffline('cbt', subject.id, null, perSubject);
                
                if (qs.length > 0) {
                    const nextBatch = state.englishBatchTracker;
                    qs.sort(function(a, b) {
                        const aHasPassage = a.passage_id === nextBatch ? 0 : 1;
                        const bHasPassage = b.passage_id === nextBatch ? 0 : 1;
                        if (aHasPassage !== bHasPassage) {
                            return aHasPassage - bHasPassage;
                        }
                        return a.id - b.id;
                    });
                }
                
                const nextPassage = await window.OfflineDB.getPassageOffline(state.englishBatchTracker);
                if (nextPassage) {
                    state.currentEnglishPassage = nextPassage;
                    state.hasPassage = true;
                    state.passageRead = false;
                    
                    const passageQuestionIds = [];
                    qs.forEach(function(q) {
                        if (q.passage_id === state.englishBatchTracker) {
                            passageQuestionIds.push(q.id);
                        }
                    });
                    state.passageQuestionIds = passageQuestionIds;
                }
            }
        } else {
            qs = await window.OfflineDB.loadQuestionsOffline('cbt', subject.id);
            qs = shuffleArray(qs).slice(0, perSubject);
        }
        
        const qsWithSubject = qs.map(function(q) {
            return Object.assign({}, q, { subject_name: subject.name });
        });
        allQuestions = allQuestions.concat(qsWithSubject);
    }

    state.isLoading = false;
            
    if (allQuestions.length === 0) {
        showToast('No questions available for these subjects.', 'error');
        return;
    }

    state.cbtQuestions = allQuestions;
    state.cbtIndex = 0;
    state.cbtAnswers = new Array(state.cbtQuestions.length).fill(null);
    state.cbtFinished = false;
    state.cbtSubmitted = false;
    state.cbtHistorySaved = false;
    state.cbtShowExplanation = false;
    state.cbtReviewMode = false;
    const timeLimit = isFull ? settings.cbtTimeLimit : settings.subjectTimeLimit;
    state.cbtTimeLeft = timeLimit * 60 || (isFull ? 6000 : 1500);
    
    buildCbtSubjectGroups(state.cbtQuestions);

    state.view = 'cbt-exam';
    render();

    if (state.cbtTimer) clearInterval(state.cbtTimer);
    state.cbtTimer = setInterval(function() {
        state.cbtTimeLeft--;
        if (state.cbtTimeLeft <= 0) {
            clearInterval(state.cbtTimer);
            state.cbtTimer = null;
            if (!state.cbtSubmitted) {
                const hasAnswers = state.cbtAnswers.some(function(a) { return a !== null && a !== undefined; });
                if (hasAnswers) {
                    state.cbtSubmitted = true;
                    state.cbtFinished = true;
                    showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                } else {
                    state.cbtSubmitted = false;
                    state.cbtFinished = true;
                    showToast('⏰ Time\'s up! No answers recorded.', '');
                }
            }
            render();
        } else {
            render();
        }
    }, 1000);
    
    saveSessionSnapshot();
}

    state.litFinished = false;
    state.litSubmitted = false;
    state.litHistorySaved = false;
    state.litShowExplanation = false;
    state.litReviewMode = false;
    const timeLimit = settings.novelTimeLimit || 100;
    state.litTimeLeft = timeLimit * 60;

    state.view = 'lit-exam';
    render();

    if (state.litTimer) clearInterval(state.litTimer);
    state.litTimer = setInterval(function() {
        state.litTimeLeft--;
        if (state.litTimeLeft <= 0) {
            clearInterval(state.litTimer);
            state.litTimer = null;
            if (!state.litSubmitted) {
                const hasAnswers = state.litAnswers.some(function(a) { return a !== null && a !== undefined; });
                if (hasAnswers) {
                    state.litSubmitted = true;
                    state.litFinished = true;
                    showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                } else {
                    state.litSubmitted = false;
                    state.litFinished = true;
                    showToast('⏰ Time\'s up! No answers recorded.', '');
                }
            }
            render();
        } else {
            render();
        }
    }, 1000);
    
    saveSessionSnapshot();
}

function renderGotoModal() {
    if (!state.showGotoModal || !state.gotoModalData) return '';
    
    const data = state.gotoModalData;
    const total = data.total || 0;
    const current = data.current || 0;
    const answers = data.answers || [];
    const mode = data.mode || '';
    
    // Build subject-grouped grid if available
    let grid = '';
    if (data.bySubject && data.bySubject.length > 0) {
        data.bySubject.forEach(function(subjGroup) {
            grid += '<div style="font-size:9px;color:var(--muted);margin:6px 0 4px;font-weight:600">' + esc(subjGroup.subjectName) + ' (Q' + (subjGroup.startNum + 1) + '–' + (subjGroup.startNum + subjGroup.indices.length) + ')</div>';
            grid += '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px">';
            subjGroup.indices.forEach(function(globalIdx, localIdx) {
                const isAnswered = answers[globalIdx] !== null && answers[globalIdx] !== undefined;
                const isCurrent = globalIdx === current;
                const cls = 'goto-q' + 
                    (isAnswered ? ' answered' : ' unanswered') + 
                    (isCurrent ? ' current' : '');
                grid += '<button class="' + cls + '" data-action="goto-q-select" data-idx="' + globalIdx + '" data-mode="' + mode + '">' + (localIdx + 1) + (isAnswered ? ' ✓' : '') + '</button>';
            });
            grid += '</div>';
        });
    } else {
        for (let i = 0; i < total; i++) {
            const isAnswered = answers[i] !== null && answers[i] !== undefined;
            const isCurrent = i === current;
            const cls = 'goto-q' + 
                (isAnswered ? ' answered' : ' unanswered') + 
                (isCurrent ? ' current' : '');
            grid += '<button class="' + cls + '" data-action="goto-q-select" data-idx="' + i + '" data-mode="' + mode + '">' + (i + 1) + (isAnswered ? ' ✓' : '') + '</button>';
        }
    }
    
    return (
        '<div class="goto-overlay" data-action="goto-close">' +
        '<div class="goto-modal" data-action="prevent-close">' +
        '<h3>📋 Questions</h3>' +
        '<p class="sub">' + data.answered + ' of ' + total + ' answered · <span style="color:var(--green)">✓</span> attempted, <span style="color:var(--muted)">◻</span> unattempted</p>' +
        '<div>' + grid + '</div>' +
        '<button class="goto-close" data-action="goto-close">Close</button>' +
        '</div>' +

    );

//  RENDER ENGINE
// ============================================================
const root = document.getElementById("root");

function render() {
    if (state.phase === "splash") {
        root.innerHTML = renderSplash();
        return;
    }

    if (!state.authReady) {
        root.innerHTML =
            '<div id="app-shell"><div id="app-inner" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--card-bg)">' +
            '<div style="text-align:center">' +
            '<div style="margin-bottom:16px">' + logoSvg(56) + '</div>' +
            '<div class="spinner" style="width:28px;height:28px;border:3px solid var(--line);border-top:3px solid var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto"></div>' +
            '</div>' +
            '</div></div>';
        return;
    }

    const SCROLL_PRESERVE_SELECTORS = [
        '.view-content',
        '.admin-question-list',
        '.admin-tabs',
        '.admin-sub-tabs',
        '.subject-tabs',
        '.leaderboard-tabs',
        '.notif-tabs',
        '.result-mode-tabs',
        '.chat-window',
    ];
    const prevScrollPositions = {};
    SCROLL_PRESERVE_SELECTORS.forEach(function(sel) {
        const elx = document.querySelector(sel);
        if (elx) prevScrollPositions[sel] = { top: elx.scrollTop, left: elx.scrollLeft };
    });

    const activeEl = document.activeElement;
    const activeId = activeEl && activeEl.id ? activeEl.id : null;
    const activeSelStart = (activeEl && typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null;
    const activeSelEnd = (activeEl && typeof activeEl.selectionEnd === 'number') ? activeEl.selectionEnd : null;

    const settings = state.settingsCache;
    if (settings.underConstruction && !isAdmin()) {
        let html = renderUnderConstruction();
        
        if (state.showLogin) {
            const overlay = document.createElement('div');
            overlay.innerHTML = renderLoginModal();
            html += overlay.innerHTML;
        }
        
        root.innerHTML = html;
        return;
    }

    let html = renderApp();
    
    if (state.showSubmitModal && state.submitModalData) {
        html += renderSubmitModal();
    }
    if (state.showCalculator) {
        html += renderCalculator();
    }
    if (state.showReset) {
        html += renderResetModal();
    }
    if (state.showFlagModal) {
        html += renderFlagModal();
    }
    if (state.showPassageModal) {
        html += renderPassageModal();
    }
    if (state.showNotifyModal) {
        html += renderNotifyModal();
    }
    if (state.showGotoModal) {
        html += renderGotoModal();
    }
    if (state.showAvatarUpload) {
        html += renderAvatarUploadModal();
    }
    if (state.showFundWallet) {
        html += renderFundWalletModal();
    }
    
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('reset') && !state.resetSuccess) {
        html += renderPasswordResetForm();
    }
    
    root.innerHTML = html;

    if (state.showLogin) {
        const overlay = document.createElement('div');
        overlay.innerHTML = renderLoginModal();
        root.appendChild(overlay.firstElementChild);
    }
    if (state.showSignup) {
        const overlay = document.createElement('div');
        overlay.innerHTML = renderSignupModal();
        root.appendChild(overlay.firstElementChild);
    }

    SCROLL_PRESERVE_SELECTORS.forEach(function(sel) {
        const elx = document.querySelector(sel);
        const prev = prevScrollPositions[sel];
        if (elx && prev) {
            elx.scrollTop = prev.top;
            elx.scrollLeft = prev.left;
        }
    });
    if (activeId) {
        const newActiveEl = document.getElementById(activeId);
        if (newActiveEl) {
            newActiveEl.focus();
            if (activeSelStart !== null && typeof newActiveEl.setSelectionRange === 'function') {
                try { newActiveEl.setSelectionRange(activeSelStart, activeSelEnd); } catch (e) {}
            }
        }
    }
}

function renderUnderConstruction() {
    const settings = state.settingsCache;
    const reopenTime = settings.constructionReopenTime;
    let timeDisplay = '';
    if (reopenTime) {
        try {
            const date = new Date(reopenTime);
            timeDisplay = date.toLocaleString();

function renderCbtExam() {
    if (state.hasPassage && state.currentEnglishPassage && !state.passageRead) {
        return renderPassagePage();
    }

    if (state.cbtFinished || state.cbtSubmitted) {
        let score = 0;
        const rawSubjectCounts = {};
        const weakQuestionsToSave = [];
        state.cbtQuestions.forEach(function(item) {
            if (!(item.subject_id in rawSubjectCounts)) rawSubjectCounts[item.subject_id] = 0;
        });
        state.cbtQuestions.forEach(function(item, i) {
            const isCorrect = state.cbtAnswers[i] === item.correct_answer;
            if (isCorrect) {
                score++;
                rawSubjectCounts[item.subject_id]++;
            } else {
                weakQuestionsToSave.push({ questionId: item.id, subjectId: item.subject_id, userAnswer: state.cbtAnswers[i], correctAnswer: item.correct_answer });
            }
        });
        const isFullCbt = state.cbtMode === "full";
        const subjectScores = {};
        Object.keys(rawSubjectCounts).forEach(function(sid) {
            subjectScores[sid] = Math.round((rawSubjectCounts[sid] / 40) * 100);
        });
        const subjectCount = Object.keys(subjectScores).length;
        const maxScore = isFullCbt ? subjectCount * 100 : 100;
        const totalScore = isFullCbt
            ? Object.values(subjectScores).reduce(function(a, b) { return a + b; }, 0)
            : Math.round((score / 40) * 100);

        if (state.authUser && state.cbtSubmitted && !state.cbtHistorySaved) {
            state.cbtHistorySaved = true;
            const subjectId = isFullCbt ? null : state.cbtQuestions[0]?.subject_id;
            const subjectName = isFullCbt ? null : state.cbtQuestions[0]?.subject_name;
            
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'cbt', wq.userAnswer, wq.correctAnswer);
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            saveHistoryEntry({
                mode: isFullCbt ? 'cbt-full' : 'cbt-single',
                subjects: subjectNames,
                subject_scores: subjectScores,
                total_score: totalScore,
                max_score: maxScore,
                total_questions: state.cbtQuestions.length,
                answered_count: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),
                exam_title: isFullCbt ? 'Full CBT Practice' : (subjectName || 'Subject Practice'),
            });
            
            saveScore(isFullCbt ? 'cbt' : 'subject', {
                user_id: state.authUser.id,
                username: state.profile.name,
                score: totalScore,
                total_questions: state.cbtQuestions.length,
                subject_count: isFullCbt ? (state.settingsCache.cbtSubjectCount || 3) + 1 : 1,
                subject_id: subjectId,
                subject_name: subjectName,
                subject_scores: subjectScores,
            });
            
            addLog(state.authUser.id, state.profile.name, 'completed_cbt', 'Completed CBT ' + (isFullCbt ? 'Full' : 'Single') + ' with score ' + totalScore + '/' + maxScore);
        }

        let reviewItems = "";
        state.cbtQuestions.forEach(function(item, i) {
            const userAns = state.cbtAnswers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + item.correct_answer);
            const subj = SUBJECTS.find(function(s) { return s.id === item.subject_id; });
            reviewItems += (
                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="q-text">Q' + (i + 1) + ' (' + (subj ? subj.name : '') + '). ' + esc(item.text) +
                '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="cbt">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<h2 class="title">' + (isFullCbt ? 'CBT' : 'Subject') + ' — Result</h2>' +
            '<div class="card" style="text-align:center;padding:20px;margin-bottom:12px">' +
            '<p style="font-family:var(--font-mono);font-size:40px;margin:0;color:' + GREEN + '">' + totalScore +
            ' / ' + maxScore + '</p>' +
            '<p style="font-size:12px;color:var(--muted);margin:4px 0 0">Questions answered correctly</p>' +
            '<p style="font-size:11px;color:var(--faint);margin:10px 0 0">' + Math.round((totalScore / maxScore) *
                100) + '%</p>' +
            (state.cbtMode === "full" ?
                '<div style="margin-top:10px;text-align:left;border-top:1px solid var(--line);padding-top:10px">' +
                Object.keys(subjectScores).map(function(sid) {
                    const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                    const scaled = subjectScores[sid];
                    return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span>' +
                        (subj ? subj.name : sid) + '</span><span style="color:var(--green)">' + scaled +
                        '/100</span></div>';
                }).join('') +
                '</div>' : '') +
            '</div>' +
            '<button class="btn btn-green" style="margin-bottom:10px" data-action="cbt-exit">Back to Home</button>' +
            '<button class="btn btn-outline" data-action="cbt-toggle-review">' +
            (state.cbtReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.cbtReviewMode ? '<div style="margin-top:12px">' + reviewItems + '</div>' : '')
        );
    }

    const totalQ = state.cbtQuestions.length;
    const answeredCount = state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;

    let subjectTabs = '';
    if (state.cbtSubjectOrder.length > 1) {
        state.cbtSubjectOrder.forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const isActive = state.cbtCurrentSubject === sid;
            const questionsInSubject = getQuestionsForSubject(sid, state.cbtSubjectQuestions);
            const answeredInSubject = questionsInSubject.filter(function(idx) {
                return state.cbtAnswers[idx] !== null && state.cbtAnswers[idx] !== undefined;
            }).length;
            const totalInSubject = questionsInSubject.length;
            const allDone = answeredInSubject === totalInSubject;
            subjectTabs += (
                '<button class="subject-tab' + (isActive ? ' active' : '') + '" data-action="switch-cbt-subject" data-subject="' +
                sid + '">' +
                (subj ? subj.code : sid) +
                ' <span class="check-mark' + (allDone ? ' done' : '') + '">' + (allDone ? '✓' : answeredInSubject + '/' + totalInSubject) +
                '</span>' +
                '</button>'
            );
        });
    }

    const currentSubjectQuestions = getQuestionsForSubject(state.cbtCurrentSubject, state.cbtSubjectQuestions);
    const currentSubjectIndex = currentSubjectQuestions.indexOf(state.cbtIndex);
    const totalInCurrentSubject = currentSubjectQuestions.length;
    
    if (currentSubjectQuestions.length === 0) {
        for (const sid of state.cbtSubjectOrder) {
            const qs = getQuestionsForSubject(sid, state.cbtSubjectQuestions);
            if (qs.length > 0) {
                state.cbtCurrentSubject = sid;
                state.cbtIndex = firstUnansweredOrFirst(qs, state.cbtAnswers);
                break;
            }
        }
        render();
        return '';
    }
    
    if (currentSubjectIndex === -1 || currentSubjectIndex >= currentSubjectQuestions.length) {
        state.cbtIndex = firstUnansweredOrFirst(currentSubjectQuestions, state.cbtAnswers);
        render();
        return '';
    }
 
    const item = state.cbtQuestions[state.cbtIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            const chosen = state.cbtAnswers[state.cbtIndex] === i;
            opts += (
                '<button class="qa-option' + (chosen ? ' selected' : '') + '" data-action="cbt-answer" data-idx="' +
                i + '">' +
                '<span class="qa-letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span>' +
                '</button>'
            );
        });
    }

    const hasPrev = currentSubjectIndex > 0;
    const hasNext = currentSubjectIndex < totalInCurrentSubject - 1;
    const prevIdx = hasPrev ? currentSubjectQuestions[currentSubjectIndex - 1] : null;
    const nextIdx = hasNext ? currentSubjectQuestions[currentSubjectIndex + 1] : null;

    const hasPassage = state.hasPassage && state.currentEnglishPassage && state.passageRead;

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<button class="back-link" data-action="cbt-exit" style="margin:0;font-size:13px">' + svg("chevleft", 14) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" aria-label="Calculator" title="Calculator">' + svg("calculator", 18) + ' Calc</button>' :
            '<button class="calc-btn" data-action="toggle-calculator" aria-label="Calculator" title="Calculator disabled" style="opacity:0.3;cursor:not-allowed">' + svg("calculator", 18) + ' Calc</button>'
        ) + 
        (hasPassage ? '<button class="calc-btn" style="background:var(--gold);color:var(--ink);height:28px;padding:0 8px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600" data-action="show-passage" title="View Passage" aria-label="View Passage">📖 Passage</button>' : '') +
        '</div>' +
        '<div class="right-group">' +
        '<button class="submit-btn" data-action="cbt-submit">Submit</button>' +
        '</div>' +
        '</div>' +
        '<div class="timer-bar">' +
        '<span class="label">⏱️ Time left</span>' +
        '<span class="time' + (state.cbtTimeLeft < 300 ? ' warning' : '') + '">' +
        formatTime(state.cbtTimeLeft) +
        '</span>' +
        '</div>' +
        '<div class="subject-tabs">' + subjectTabs + '</div>' +
        '<div class="exam-nav">' +
        '<span class="q-counter">Question ' + (currentSubjectIndex + 1) + ' of ' + totalInCurrentSubject + ' in ' + (subj ? subj.name : '') + '</span>' +
        '<div class="goto-btn-wrap">' +
        '<button class="goto-btn" data-action="show-goto-cbt">📋 Questions (' + answeredCount + '/' + totalQ + ')</button>' +
        '</div>' +
        '</div>' +
        '<div class="exam-body">' +
        '<div class="card exam-question-card">' +
        '<button class="flag-inline" data-action="flag-review-question" data-qid="' + (item ? item.id : '') + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="cbt" title="Flag Question">⚠️</button>' +
        '<p style="font-weight:600;margin:0">' + esc(item?.text || '') + '</p>' +
        '</div>' +
        '<div class="exam-options-wrap">' + opts + '</div>' +
        '<div class="exam-nav-buttons">' +
        (hasPrev ? '<button class="btn btn-outline" style="flex:1" data-action="cbt-goto" data-idx="' + prevIdx + '">Previous</button>' : '') +
        (hasNext ? '<button class="btn btn-green" style="flex:1" data-action="cbt-goto" data-idx="' + nextIdx + '">Next</button>' : '') +
        '</div>' +
        '</div>'
    );
}

// ============================================================
//  EXAM EXAM
// ============================================================
function renderExamExam() {
    if (!state.examQuestions || state.examQuestions.length === 0) return renderHome();

    if (state.examFinished || state.examSubmitted) {
        let score = 0;
        const subjectScores = {};
        const weakQuestionsToSave = [];
        state.examQuestions.forEach(function(item, i) {
            const isCorrect = state.examAnswers[i] === item.correct_answer;
            if (isCorrect) {
                score++;
                if (!subjectScores[item.subject_id]) subjectScores[item.subject_id] = 0;
                subjectScores[item.subject_id]++;
            } else {
                weakQuestionsToSave.push({ questionId: item.id, subjectId: item.subject_id, userAnswer: state.examAnswers[i], correctAnswer: item.correct_answer });
            }
        });
        if (state.authUser && state.examSubmitted && !state.examHistorySaved) {
            state.examHistorySaved = true;
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'exam', wq.userAnswer, wq.correctAnswer);
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            const subjName = state.examQuestions[0]?.subject_name || 'Unknown Subject';
            saveHistoryEntry({
                mode: 'exam',
                subjects: subjectNames,
                subject_scores: subjectScores,
                total_score: score,
                max_score: state.examQuestions.length,
                total_questions: state.examQuestions.length,
                answered_count: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),
                exam_title: subjName + ' Exam ' + state.examYear,
            });
            
            addLog(state.authUser.id, state.profile.name, 'completed_exam', 'Completed Exam ' + subjName + ' ' + state.examYear + ' with score ' + score + '/' + state.examQuestions.length);
        }

        let reviewItems = "";
        state.examQuestions.forEach(function(item, i) {
            const userAns = state.examAnswers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + item.correct_answer);
            const subj = SUBJECTS.find(function(s) { return s.id === item.subject_id; });
            reviewItems += (
                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="q-text">Q' + (i + 1) + '. ' + esc(item.text) + '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="exam">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<h2 class="title">Exam — Result</h2>' +
            '<div class="card" style="text-align:center;padding:20px;margin-bottom:12px">' +
            '<p style="font-family:var(--font-mono);font-size:40px;margin:0;color:' + GREEN + '">' + score +
            ' / ' + state.examQuestions.length + '</p>' +
            '<p style="font-size:12px;color:var(--muted);margin:4px 0 0">Questions answered correctly</p>' +
            '</div>' +
            '<button class="btn btn-green" style="margin-bottom:10px" data-action="exam-exit">Back to Home</button>' +
            '<button class="btn btn-outline" data-action="exam-toggle-review">' +
            (state.examReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.examReviewMode ? '<div style="margin-top:12px">' + reviewItems + '</div>' : '')
        );
    }

    const totalQ = state.examQuestions.length;
    const item = state.examQuestions[state.examIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;
    
    const answeredCount = state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;
    const isInstant = state.examVariant === 'instant';
    const instantResult = state.examInstantResults[state.examIndex];

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            let cls = 'qa-option';
            let disabled = false;
            let letter = String.fromCharCode(65 + i);
            let label = esc(o);
            
            if (isInstant && instantResult !== undefined) {
                if (i === item.correct_answer) cls += ' correct';
                else if (i === state.examAnswers[state.examIndex]) cls += ' wrong';
                disabled = true;
            } else {
                const chosen = state.examAnswers[state.examIndex] === i;
                if (chosen) cls += ' selected';
            }
            
            opts += (
                '<button class="' + cls + '" data-action="exam-answer" data-idx="' + i + '"' + 
                (disabled ? ' disabled style="cursor:default"' : '') + '>' +
                '<span class="qa-letter">' + letter + '</span><span>' + label + '</span>' +
                '</button>'
            );
        });
    }

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<button class="back-link" data-action="exam-exit" style="margin:0;font-size:13px">' + svg("chevleft", 14) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" aria-label="Calculator" title="Calculator">' + svg("calculator", 18) + ' Calc</button>' :
            '<button class="calc-btn" data-action="toggle-calculator" aria-label="Calculator" title="Calculator disabled" style="opacity:0.3;cursor:not-allowed">' + svg("calculator", 18) + ' Calc</button>'
        ) +
        '</div>' +
        '<div class="right-group">' +
        '<button class="submit-btn" data-action="exam-submit">Submit</button>' +
        '</div>' +
        '</div>' +
        '<div class="exam-nav">' +
        '<span class="q-counter">Question ' + (state.examIndex + 1) + ' of ' + totalQ + '</span>' +
        '<div class="goto-btn-wrap">' +
        '<button class="goto-btn" data-action="show-goto-exam">📋 Questions (' + answeredCount + '/' + totalQ + ')</button>' +
        '</div>' +
        '</div>' +
        '<div class="exam-body">' +
        '<div class="card exam-question-card">' +
        '<button class="flag-inline" data-action="flag-review-question" data-qid="' + (item ? item.id : '') + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="exam" title="Flag Question">⚠️</button>' +
        '<p style="font-weight:600;margin:0">' + esc(item?.text || '') + '</p>' +
        '</div>' +
        '<div class="exam-options-wrap">' + opts + '</div>' +
        (isInstant && instantResult !== undefined && item ? 
            '<div class="explanation-box"><span class="label">' + (instantResult ? '✅ Correct!' : '❌ Wrong') + '</span><p>' + esc(item.explanation || 'No explanation provided.') + '</p></div>' :
            '') +
        '<div class="exam-nav-buttons">' +
        (state.examIndex > 0 ? '<button class="btn btn-outline" style="flex:1" data-action="exam-prev">Previous</button>' :
            '') +
        (state.examIndex < totalQ - 1 ?
            '<button class="btn btn-green" style="flex:1" data-action="exam-next">Next</button>' : '') +
        '</div>' +
        '</div>'
    );
}

// ============================================================
//  TOPIC EXAM
// ============================================================
function renderTopicExam() {
    if (!state.topicQuestions || state.topicQuestions.length === 0) return renderHome();

    if (state.topicFinished || state.topicSubmitted) {
        let score = 0;
        const subjectScores = {};
        const weakQuestionsToSave = []; 
        state.topicQuestions.forEach(function(item, i) {
            const isCorrect = state.topicAnswers[i] === item.correct_answer;
            if (isCorrect) {
                score++;
                if (!subjectScores[item.subject_id]) subjectScores[item.subject_id] = 0;
                subjectScores[item.subject_id]++;
            } else {
                weakQuestionsToSave.push({ questionId: item.id, subjectId: item.subject_id, userAnswer: state.topicAnswers[i], correctAnswer: item.correct_answer });
            }
        });

        if (state.authUser && state.topicSubmitted && !state.topicHistorySaved) {
            state.topicHistorySaved = true;
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'topic', wq.userAnswer, wq.correctAnswer);
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            const topicName = state.topicsList.find(function(t) { return t.id === state.topicId; })?.name || 'Topic Practice';
            saveHistoryEntry({
                mode: 'topic',
                subjects: subjectNames,
                subject_scores: subjectScores,
                total_score: score,
                max_score: state.topicQuestions.length,
                total_questions: state.topicQuestions.length,
                answered_count: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),

function renderFileActions(fileUrl, fileName, fileType) {

    const isImage = fileType && fileType.startsWith('image/');

        html += '<img src="' + fileUrl + '" style="width:100%;border-radius:6px;margin-bottom:6px" alt="' + esc(fileName || 'Image') + '" />';
    }
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';

// ============================================================
//  REVISE WEAK QUESTIONS - Rebuilt as sequential exam flow
// ============================================================
async function loadWeakQuestions() {
    if (!state.authUser) {
        state.weakQuestionsLoaded = true;
        state.weakQuestions = [];
        render();
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('weak_questions')
            .select('*')
            .eq('user_id', state.authUser.id)
            .order('created_at', { ascending: false });
            
        if (error) {
            console.warn("Load weak questions error:", error.message, error.code);
            showToast("Weak questions error: " + (error.message || "unknown"), "error");
            state.weakQuestions = [];
            state.weakQuestionsLoaded = true;
            render();
            return;
        }

        const rows = data || [];
        const withQuestions = await Promise.all(rows.map(async function(row) {
            let q = null;
            try {
                q = await dbGet('questions', row.question_id);
            } catch (e) {
                q = null;
            }
            return Object.assign({}, row, { questions: q });
        }));

        state.weakQuestions = withQuestions.filter(function(w) { return w.questions; });
        state.weakQuestionsLoaded = true;
        render();
    } catch (e) {
        console.warn("Load weak questions exception:", e.message || e);
        showToast("Weak questions error: " + (e.message || "unknown"), "error");
        state.weakQuestions = [];
        state.weakQuestionsLoaded = true;
        render();
    }
}

            '<div class="mode-actions"><span class="count-badge">' + counts[m] + '</span></div>' +
            '</div>'

        '<p style="font-size:12px;color:var(--muted);margin-bottom:10px">Total: ' + state.weakQuestions.length + ' weak question(s)</p>' +
        cards
    );
}

function renderReviseModeSubjects() {
    const mode = state.reviseMode;
    const meta = REVISE_MODE_META[mode] || REVISE_MODE_META.unknown;
    const inMode = state.weakQuestions.filter(function(wq) { return (wq.mode || 'unknown') === mode; });

    const counts = {};
    inMode.forEach(function(wq) { counts[wq.subject_id] = (counts[wq.subject_id] || 0) + 1; });
    const subjIds = Object.keys(counts);

    let cards = "";
    subjIds.forEach(function(sid) {
        const subj = SUBJECTS.find(function(s) { return s.id === sid; });
        const name = subj ? subj.name : (sid || 'Unknown');
        cards += (
            '<div class="admin-mode-card" data-action="revise-select-subject" data-subject="' + sid + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name" style="font-size:12px">' + esc(name) + '</span>' +
            '<span class="mode-count" style="font-size:10px">' + counts[sid] + ' missed question' + (counts[sid] === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<div class="mode-actions"><span class="count-badge">' + counts[sid] + '</span></div>' +
            '</div>'
        );
    });

    return (
        '<button class="back-link" data-action="revise-back-to-modes">' + svg("chevleft", 14) + ' All modes</button>' +
        '<h2 class="title" style="margin-bottom:2px;font-size:18px">' + esc(meta.label) + '</h2>' +
        '<p class="sub" style="font-size:12px">Choose a subject</p>' +
        cards
    );
}

function renderReviseModeQuestions() {
    const mode = state.reviseMode;
    const subjectId = state.reviseSubject;
    const meta = REVISE_MODE_META[mode] || REVISE_MODE_META.unknown;
    const subj = SUBJECTS.find(function(s) { return s.id === subjectId; });
    const subjName = subj ? subj.name : (subjectId || 'Unknown');

    let list = state.weakQuestions.filter(function(wq) {
        return (wq.mode || 'unknown') === mode && wq.subject_id === subjectId;
    });
    list.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });

    if (list.length === 0) {
        return (
            '<button class="back-link" data-action="revise-back-to-subjects">' + svg("chevleft", 14) + ' ' + esc(meta.label) + '</button>' +
            '<h2 class="title" style="margin-bottom:2px;font-size:18px">' + esc(subjName) + '</h2>' +
            '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">No more weak questions here. Great job!</p></div>'
        );
    }

    if (state.reviseIndex >= list.length) state.reviseIndex = 0;
    const wq = list[state.reviseIndex];
    const q = wq.questions;
    if (!q) {
        return (
            '<button class="back-link" data-action="revise-back-to-subjects">' + svg("chevleft", 14) + ' ' + esc(meta.label) + '</button>' +
            '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">Question data not found.</p></div>'
        );
    }

    const isAnswered = state.weakQuestionStates['answer_' + wq.id] !== undefined;
    const userAnswer = state.weakQuestionStates['answer_' + wq.id];
    const resultCorrect = state.weakQuestionStates['result_' + wq.id];

    let optsHtml = "";
    (q.options || []).forEach(function(o, i) {
        let cls = 'qa-option';
        if (isAnswered) {
            if (i === q.correct_answer) cls += ' correct';
            else if (i === userAnswer) cls += ' wrong';
            cls += ' disabled';
        } else if (userAnswer === i) {
            cls += ' selected';
        }
        optsHtml += (
            '<button class="' + cls + '" ' + (isAnswered ? '' :
                'data-action="weak-reattempt-answer" data-wid="' + wq.id + '" data-idx="' + i + '"') + '>' +
            '<span class="qa-letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span>' +
            '</button>'
        );
    });

    let explanationHtml = "";
    if (isAnswered) {
        explanationHtml = (
            '<div class="explanation-box" style="margin-top:6px">' +
            '<span class="label">' + (resultCorrect ? '✅ Correct!' : '❌ Wrong') + '</span>' +
            (q.explanation ? '<p>' + esc(q.explanation) + '</p>' : '<p>No explanation provided.</p>') +
            '</div>'
        );
        // Don't write to history for revise attempts
        // Score is handled in the click handler
    }

    const total = list.length;

    return (
        '<button class="back-link" data-action="revise-back-to-subjects">' + svg("chevleft", 14) + ' ' + esc(meta.label) + '</button>' +
        '<h2 class="title" style="margin-bottom:2px;font-size:18px">' + esc(subjName) + '</h2>' +
        '<p class="sub" style="font-size:12px">' + esc(meta.label) + ' · ' + total + ' missed question' + (total === 1 ? '' : 's') + '</p>' +
        
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
        '<span style="font-size:13px;font-weight:600">Question ' + (state.reviseIndex + 1) + ' of ' + total + '</span>' +
        '<div style="display:flex;gap:4px">' +
        '<button class="mini-btn flag" data-action="flag-review-question" data-qid="' + q.id + '" data-subject="' + subjectId + '" data-mode="' + mode + '" style="font-size:9px">⚠️</button>' +
        '<button class="mini-btn danger" data-action="weak-remove-question" data-wid="' + wq.id + '" data-qid="' + q.id + '" style="font-size:9px">✕</button>' +
        '</div>' +
        '</div>' +

        '<div class="card exam-question-card">' +
        '<p style="font-weight:600;margin:0;font-size:16px">' + esc(q.text) + '</p>' +
        '</div>' +
        '<div class="exam-options-wrap">' + optsHtml + '</div>' +
        explanationHtml +
        
        '<div style="display:flex;gap:6px;margin-top:12px">' +
        (state.reviseIndex > 0 ? '<button class="btn btn-outline" style="flex:1" data-action="revise-prev">Previous</button>' : '') +
        (state.reviseIndex < total - 1 ? '<button class="btn btn-green" style="flex:1" data-action="revise-next">Next</button>' : 
            (isAnswered ? '<button class="btn btn-green" style="flex:1" data-action="revise-done">Done</button>' : '')) +
        '</div>'
    );
}
