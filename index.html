function renderHistory() {
    if (!state.authUser) {
        return (
            '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
            '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
            '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
            '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">Please log in to view your results.</p></div>'
        );
    }

    if (!state.historyLoaded) {
        loadHistory();
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading results...</p></div>';
    }

    // Filter modes - removed 'revise'
    const modeFilters = [
        { key: 'all', label: 'All' },
        { key: 'cbt-full', label: 'CBT Full' },
        { key: 'cbt-single', label: 'CBT Single' },
        { key: 'exam', label: 'Exam' },
        { key: 'mock', label: 'Mock' },
        { key: 'novel', label: 'Novel CBT' },
        { key: 'topic', label: 'Topic' },
    ];

    let filterHtml = '<div class="result-mode-tabs">';
    modeFilters.forEach(function(f) {
        filterHtml += '<button class="result-mode-tab' + (state.historyFilter === f.key ? ' active' : '') + '" data-action="history-filter" data-filter="' + f.key + '">' + esc(f.label) + '</button>';
    });
    filterHtml += '</div>';

    let filtered = state.historyEntries;
    if (state.historyFilter !== 'all') {
        filtered = filtered.filter(function(e) { return e.mode === state.historyFilter; });
    }

    if (filtered.length === 0) {
        return (
            '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
            '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
            '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
            filterHtml +
            '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No results yet for this filter. Complete an exam to see it here.</p></div>'
        );
    }

    // Calculate stats - only 2 cards now
    let totalExams = filtered.length;
    let totalQuestions = 0;
    let totalCorrect = 0;
    let totalMaxScore = 0;
    filtered.forEach(function(entry) {
        totalQuestions += entry.total_questions || 0;
        totalCorrect += entry.total_score || 0;
        totalMaxScore += entry.max_score || 0;
    });
    const overallPercentage = totalMaxScore > 0 ? Math.round((totalCorrect / totalMaxScore) * 100) : 0;

    let statsHtml = (
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">' +
        '<div class="card" style="text-align:center;padding:10px;margin:0">' +
        '<p style="font-size:20px;font-weight:700;color:var(--green);margin:0">' + totalExams + '</p>' +
        '<p style="font-size:9px;color:var(--muted);margin:2px 0 0">Exams</p>' +
        '</div>' +
        '<div class="card" style="text-align:center;padding:10px;margin:0">' +
        '<p style="font-size:20px;font-weight:700;color:' + (overallPercentage >= 70 ? 'var(--green)' : overallPercentage >= 50 ? 'var(--gold)' : 'var(--danger)') + ';margin:0">' + overallPercentage + '%</p>' +
        '<p style="font-size:9px;color:var(--muted);margin:2px 0 0">Avg Score</p>' +
        '</div>' +
        '</div>'
    );

    let html = (
        '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
        '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
        '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
        statsHtml +
        filterHtml
    );

    filtered.forEach(function(entry) {
        const subjectScores = entry.subject_scores || {};
        let subjectScoreHtml = '';
        Object.keys(subjectScores).forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const name = subj ? subj.name : sid;
            subjectScoreHtml += '<span>' + esc(name) + ': ' + subjectScores[sid] + '</span>';
        });

        const pct = entry.max_score > 0 ? Math.round((entry.total_score / entry.max_score) * 100) : 0;
        const modeLabel = entry.mode === 'cbt-full' ? 'CBT Full' :
                         entry.mode === 'cbt-single' ? 'CBT Single' :
                         entry.mode === 'novel' ? 'Novel CBT' :
                         entry.mode === 'mock' ? 'Mock Exam' :
                         entry.mode === 'exam' ? 'Exam' :
                         entry.mode === 'topic' ? 'Topic Practice' :
                         entry.mode || 'Unknown';

        html += (
            '<div class="history-card">' +
            '<p class="h-title">' + esc(entry.exam_title || modeLabel) + '</p>' +
            '<p class="h-date">📅 ' + formatDate(entry.submitted_at) + ' · ' + esc(modeLabel) + '</p>' +
            '<p class="h-score" style="color:' + (pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--danger)') + '">' + 
            entry.total_score + ' / ' + entry.max_score + ' (' + pct + '%)</p>' +
            '<p style="font-size:11px;color:var(--muted);margin:0 0 4px">' + entry.answered_count + ' of ' + entry.total_questions + ' answered</p>' +
            '<div class="h-subject-scores">' + subjectScoreHtml + '</div>' +
            '<div class="h-actions">' +
            '<button class="btn btn-outline btn-sm" data-action="history-print" data-id="' + entry.id + '" aria-label="Print result" style="flex:1;font-size:10px;padding:4px 8px">' + svg("print", 12) + ' Print</button>' +
            '<button class="btn btn-outline btn-sm" data-action="history-share" data-id="' + entry.id + '" aria-label="Share result" style="flex:1;font-size:10px;padding:4px 8px">' + svg("share", 12) + ' Share</button>' +
            '</div>' +
            '</div>'
        );
    });

    return html;
}

function renderTransactionHistory() {

            '<h2 class="title" style="font-size:18px">💳 Transaction History</h2>' +

            '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">Please log in to view transactions.</p></div>'
        );
    }
    
    if (!state.walletTransactionsLoaded) {
        loadWalletTransactions();
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading transactions...</p></div>';
    }
    
    const txs = state.walletTransactions || [];
    const balance = state.profile.walletBalance || 0;
    
    let rows = '';
    if (txs.length === 0) {
        rows = '<p style="text-align:center;color:var(--faint);padding:24px 0;font-size:13px">No transactions yet.</p>';
    } else {
        txs.forEach(function(tx) {
            const isPositive = tx.amount >= 0;
            const icon = tx.type === 'fund' ? '+' : tx.type === 'purchase' ? '−' : '↻';
            const iconClass = tx.type === 'fund' ? 'fund' : tx.type === 'purchase' ? 'purchase' : 'refund';
            const amountClass = isPositive ? 'pos' : 'neg';
            const sign = isPositive ? '+' : '';
            
            rows += (
                '<div class="tx-row">' +
                '<span class="tx-icon ' + iconClass + '">' + icon + '</span>' +
                '<div class="tx-info">' +
                '<p class="tx-desc">' + esc(tx.description || tx.type) + '</p>' +
                '<p class="tx-date">' + formatDate(tx.created_at) + '</p>' +
                '</div>' +
                '<span class="tx-amount ' + amountClass + '">' + sign + '₦' + Math.abs(tx.amount).toLocaleString() + '</span>' +
                '</div>'
            );
        });
    }
    
    return (
        '<button class="back-link" data-action="set-view" data-view="profile">' + svg("chevleft", 14) + ' Back</button>' +
        '<h2 class="title" style="font-size:18px">💳 Transaction History</h2>' +
        '<p class="sub" style="font-size:12px">Wallet balance: <strong style="color:var(--green)">₦' + balance.toLocaleString() + '</strong></p>' +

// ============================================================
//  WALLET FUNCTIONS
// ============================================================
async function loadWalletTransactions() {
    if (!state.authUser) {
        state.walletTransactionsLoaded = true;
        state.walletTransactions = [];
        render();
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('wallet_transactions')
            .select('*')
            .eq('user_id', state.authUser.id)
            .order('created_at', { ascending: false });
            
        if (error) {
            console.warn("Load wallet transactions error:", error.message, error.code);
            showToast("Could not load transactions.", "error");
            state.walletTransactions = [];
            state.walletTransactionsLoaded = true;
            render();
            return;
        }
        
        state.walletTransactions = data || [];
        state.walletTransactionsLoaded = true;
        render();
    } catch (e) {
        console.warn("Load wallet transactions exception:", e);
        state.walletTransactions = [];
        state.walletTransactionsLoaded = true;
        render();
    }
}

// ============================================================
//  STUDY REMINDER FUNCTIONS
// ============================================================
async function loadStudyReminder() {
    if (!state.authUser) {
        state.studyReminderLoaded = true;
        state.studyReminder = null;
        render();
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('study_reminders')
            .select('*')
            .eq('user_id', state.authUser.id)
            .maybeSingle();
            
        if (error) {
            console.warn("Load study reminder error:", error.message, error.code);
            state.studyReminder = null;
            state.studyReminderLoaded = true;
            render();
            return;
        }
        
        if (data) {
            state.studyReminder = data;
            state.studyReminderHour = data.hour || 19;
            state.studyReminderMinute = data.minute || 0;
            state.studyReminderDays = data.days || [1,2,3,4,5,6,0];
        } else {
            state.studyReminder = null;
            state.studyReminderHour = 19;
            state.studyReminderMinute = 0;
            state.studyReminderDays = [1,2,3,4,5,6,0];
        }
        state.studyReminderLoaded = true;
        render();
    } catch (e) {
        console.warn("Load study reminder exception:", e);
        state.studyReminder = null;
        state.studyReminderLoaded = true;
        render();
    }
}

async function saveStudyReminder(enabled) {
    if (!state.authUser) {
        showToast("Please log in first.", "error");
        return;
    }
    
    const hour = state.studyReminderHour;
    const minute = state.studyReminderMinute;
    const days = state.studyReminderDays;
    const payload = {
        user_id: state.authUser.id,
        hour: hour,
        minute: minute,
        days: days,
        enabled: enabled !== undefined ? enabled : (state.studyReminder ? state.studyReminder.enabled : false),
        updated_at: new Date().toISOString(),
    };
    
    try {
        await supabase
            .from('study_reminders')
            .upsert(payload, { onConflict: 'user_id' });
            
        state.studyReminder = payload;
        showToast(enabled ? 'Reminder set! We\'ll nudge you while the app is open.' : 'Reminder turned off.', 'success');
        render();
    } catch (e) {
        console.warn("Save study reminder error:", e);
        showToast("Error saving reminder.", "error");
    }
}

// ============================================================
//  STUDY REMINDER TICK (foreground-only)
//  NOTE: this only fires while the app/tab is open in the foreground.
//  True background push reminders require a server-side scheduled job.
// ============================================================
function checkStudyReminderTick() {
    if (!state.studyReminder || !state.studyReminder.enabled) return;
    const now = new Date();
    const day = now.getDay();
    
    if ((state.studyReminder.days || []).indexOf(day) === -1) return;
    if (now.getHours() !== state.studyReminder.hour || now.getMinutes() !== state.studyReminder.minute) return;
    
    const todayKey = 'reminderFired_' + now.toISOString().slice(0,10);
    if (storage.get(todayKey)) return; // already fired today
    
    storage.set(todayKey, 'true');
    
    if (Notification.permission === 'granted') {
        new Notification('📚 Study time!', {
            body: 'Your scheduled MyUTME practice session is starting now.',
        });
    } else {
        showInAppNotificationBanner({ title: '📚 Study time!', body: 'Time for your scheduled practice session.' });
    }
}

// ============================================================
//  ACTIVATE WITH WALLET
// ============================================================
async function activateWithWallet(plan) {
    if (!state.authUser) {
        showToast("Please log in first.", "error");
        return;
    }
    
    const balance = state.profile.walletBalance || 0;
    if (balance < plan.price) {
        showToast('Insufficient wallet balance. Please fund your wallet first.', 'error');
        state.view = 'profile';
        state.showFundWallet = true;
        render();
        return;
    }
    
    const newBalance = balance - plan.price;
    const expiryDate = new Date();
    expiryDate.setDate(expiryDate.getDate() + plan.days);
    
    try {
        await supabase
            .from('profiles')
            .update({
                wallet_balance: newBalance,
                is_active: true,
                activation_expiry: expiryDate.toISOString(),
            })
            .eq('id', state.authUser.id);
            
        await supabase
            .from('wallet_transactions')
            .insert([{
                user_id: state.authUser.id,
                type: 'purchase',
                amount: -plan.price,
                balance_after: newBalance,
                description: 'Activation: ' + plan.name,
            }]);
            
        state.profile.walletBalance = newBalance;
        state.profile.is_active = true;
        state.profile.activation_expiry = expiryDate.toISOString();
        showToast('🎉 Activated! ' + plan.days + ' days added.', 'success');
        state.view = 'activate';
        render();
    } catch (e) {
        console.warn("Activate with wallet error:", e);
        showToast("Error activating with wallet. Please try again.", "error");
    }
}

// ============================================================
//  VERIFY WALLET FUNDING (client-side fallback)
//  For production, verify server-side to prevent tampering.
// ============================================================
async function verifyWalletFunding(reference, amount) {
    // client-side fallback (see comment above)
    const newBalance = (state.profile.walletBalance || 0) + amount;
    
    try {
        await supabase
            .from('profiles')
            .update({ wallet_balance: newBalance })
            .eq('id', state.authUser.id);
            
        await supabase
            .from('wallet_transactions')
            .insert([{
                user_id: state.authUser.id,
                type: 'fund',
                amount: amount,
                balance_after: newBalance,
                description: 'Wallet funding via Paystack',
                reference: reference,
            }]);
            
        state.profile.walletBalance = newBalance;
        state.showFundWallet = false;
        state.fundWalletAmount = '';
        showToast('✅ Wallet funded! New balance: ₦' + newBalance.toLocaleString(), 'success');
        state.walletTransactionsLoaded = false;
        loadWalletTransactions();
        render();
    } catch (e) {
        console.warn("Verify wallet funding error:", e);
        showToast("Error processing funding. Please check your transactions.", "error");
    }
}

function renderMockExam() {
    if (state.engMockHasPassage && state.engMockPassage && !state.engMockPassageRead) {
        return renderMockPassagePage();
    }
    
    if (!state.mockQuestions || state.mockQuestions.length === 0) return renderHome();

    const totalQ = state.mockQuestions.length;
    const answeredCount = state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;
   
    let subjectTabs = '';
    state.mockSubjectOrder.forEach(function(sid) {
        const subj = SUBJECTS.find(function(s) { return s.id === sid; });
        const isActive = state.mockCurrentSubject === sid;
        const questionsInSubject = getQuestionsForSubject(sid, state.mockSubjectQuestions);
        const answeredInSubject = questionsInSubject.filter(function(idx) {
            return state.mockAnswers[idx] !== null && state.mockAnswers[idx] !== undefined;
        }).length;
        const totalInSubject = questionsInSubject.length;
        const allDone = answeredInSubject === totalInSubject;
        subjectTabs += (
            '<button class="subject-tab' + (isActive ? ' active' : '') + '" data-action="switch-mock-subject" data-subject="' +
            sid + '">' +
            (subj ? subj.code : sid) +
            ' <span class="check-mark' + (allDone ? ' done' : '') + '">' + (allDone ? '✓' : answeredInSubject + '/' + totalInSubject) +
            '</span>' +
            '</button>'
        );
    });

    const currentSubjectQuestions = getQuestionsForSubject(state.mockCurrentSubject, state.mockSubjectQuestions);
    const currentSubjectIndex = currentSubjectQuestions.indexOf(state.mockIndex);
    const totalInCurrentSubject = currentSubjectQuestions.length;
    
    if (currentSubjectQuestions.length === 0) {
        for (const sid of state.mockSubjectOrder) {
            const qs = getQuestionsForSubject(sid, state.mockSubjectQuestions);
            if (qs.length > 0) {
                state.mockCurrentSubject = sid;
                state.mockIndex = firstUnansweredOrFirst(qs, state.mockAnswers);
                break;
            }
        }
        render();
        return '';
    }
    
    if (currentSubjectIndex === -1 || currentSubjectIndex >= currentSubjectQuestions.length) {
        state.mockIndex = firstUnansweredOrFirst(currentSubjectQuestions, state.mockAnswers);
        render();
        return '';
    }

    const item = state.mockQuestions[state.mockIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            const chosen = state.mockAnswers[state.mockIndex] === i;
            opts += (
                '<button class="qa-option' + (chosen ? ' selected' : '') + '" data-action="mock-answer" data-idx="' +
                i + '">' +
                '<span class="qa-letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span>' +
                '</button>'
            );
        });
    }

    const hasPrev = currentSubjectIndex > 0;
    const hasNext = currentSubjectIndex < totalInCurrentSubject - 1;
    const prevIdx = hasPrev ? currentSubjectQuestions[currentSubjectIndex - 1] : null;
    const nextIdx = hasNext ? currentSubjectQuestions[currentSubjectIndex + 1] : null;

    const hasPassage = state.engMockHasPassage && state.engMockPassage;

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<button class="back-link" data-action="mock-exit" style="margin:0;font-size:13px">' + svg("chevleft", 14) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" aria-label="Calculator" title="Calculator">' + svg("calculator", 18) + ' Calc</button>' :
            '<button class="calc-btn" data-action="toggle-calculator" aria-label="Calculator" title="Calculator disabled" style="opacity:0.3;cursor:not-allowed">' + svg("calculator", 18) + ' Calc</button>'
        ) +
        (hasPassage ? 
            '<button class="calc-btn" style="background:var(--gold);color:var(--ink);height:28px;padding:0 8px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600" data-action="show-mock-passage" title="View Passage" aria-label="View Passage">📖 Passage</button>' : 
            ''
        ) +
        '</div>' +
        '<div class="right-group">' +
        '<button class="submit-btn" data-action="mock-submit">Submit</button>' +
        '</div>' +
        '</div>' +
        '<div class="timer-bar">' +
        '<span class="label">⏱️ Time left</span>' +
        '<span class="time' + (state.mockTimeLeft < 300 ? ' warning' : '') + '">' +
        formatTime(state.mockTimeLeft) +
        '</span>' +
        '</div>' +
        '<div class="subject-tabs">' + subjectTabs + '</div>' +
        '<div class="exam-nav">' +
        '<span class="q-counter">Question ' + (currentSubjectIndex + 1) + ' of ' + totalInCurrentSubject + ' in ' + (subj ? subj.name : '') + '</span>' +
        '<div class="goto-btn-wrap">' +
        '<button class="goto-btn" data-action="show-goto-mock">📋 Questions (' + answeredCount + '/' + totalQ + ')</button>' +
        '</div>' +
        '</div>' +
        '<div class="exam-body">' +
        '<div class="card exam-question-card">' +
        renderFlagButton(item ? item.id : '', subj ? subj.id : '', 'cbt') +
        '<p style="font-weight:600;margin:0">' + esc(item?.text || '') + '</p>' +
        '</div>' +
        '<div class="exam-options-wrap">' + opts + '</div>' +
        '<div class="exam-nav-buttons">' +
        (hasPrev ? '<button class="btn btn-outline" style="flex:1" data-action="mock-goto" data-idx="' + prevIdx + '">Previous</button>' : '') +
        (hasNext ? '<button class="btn btn-green" style="flex:1" data-action="mock-goto" data-idx="' + nextIdx + '">Next</button>' : '') +
        '</div>' +
        '</div>'
    );
}

    if (state.mockResultReleased) {

                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +

                        .explanation) + '</p></div>' : '') +

            '<div class="result-card">' +

                .toLocaleString() : '') + '</p>' +

                .toLocaleString() + '</p>' : '') +

            '<p style="font-size:12px;color:var(--muted);margin:0 0 10px">' + Math.round((score / maxScore) * 100) +

function dayKey(d) {
    const dt = new Date(d);
    return dt.toISOString().slice(0, 10);
}
function lastNDays(n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        out.push(d.toISOString().slice(0, 10));
    }
    return out;
}
function shortDay(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 3) + ' ' + d.getDate();
}

async function loadAnalyticsData() {
    if (state.analyticsLoading) return; // prevent overlapping fetches
    state.analyticsLoading = true;
    render();

    const rangeDays = state.analyticsRange || 14;
    const sinceDate = new Date();
    sinceDate.setDate(sinceDate.getDate() - rangeDays);
    const sinceISO = sinceDate.toISOString();

    try {
        // Use the working loadAllUsers function
        await loadAllUsers();
        const profiles = state.allUsers || [];
        
        const historyRes = await supabase.from('exam_history').select('id, user_id, mode, total_score, max_score, submitted_at').gte('submitted_at', sinceISO);
        const keysRes = await supabase.from('activation_keys').select('*').eq('is_used', true);
        const logsRes = await supabase.from('activity_logs').select('action, created_at, username').gte('created_at', sinceISO);
        const cbtRes = await supabase.from('cbt_scores').select('score, username');
        const mockRes = await supabase.from('mock_scores').select('score, username');
        const subjRes = await supabase.from('subject_scores').select('score, subject_id, username');

        const history = historyRes.data || [];
        const paidKeys = keysRes.data || [];
        const logs = logsRes.data || [];

        const now = Date.now();
        const totalUsers = profiles.length;
        const activatedUsers = profiles.filter(function(p) {
            return p.is_active && (!p.activation_expiry || new Date(p.activation_expiry).getTime() > now);
        }).length;
        const onlineNow = profiles.filter(function(p) {
            return p.last_seen && (now - new Date(p.last_seen).getTime()) < 5 * 60 * 1000;
        });
        const activeToday = profiles.filter(function(p) {
            return p.last_seen && (now - new Date(p.last_seen).getTime()) < 24 * 60 * 60 * 1000;
        });

        const days = lastNDays(rangeDays);
        const signupsByDay = {};
        const viewsByDay = {};
        const modeAttemptsByDay = {};
        const modeUsers = {};
        const paymentsByDay = {};

        days.forEach(function(d) { signupsByDay[d] = 0; viewsByDay[d] = 0; paymentsByDay[d] = 0; modeAttemptsByDay[d] = {}; });

        profiles.forEach(function(p) {
            if (!p.created_at) return;
            const k = dayKey(p.created_at);
            if (signupsByDay[k] !== undefined) signupsByDay[k]++;
        });

        logs.forEach(function(l) {
            if (l.action !== 'page_view') return;
            const k = dayKey(l.created_at);
            if (viewsByDay[k] !== undefined) viewsByDay[k]++;
        });

        const modeLabels = { 'cbt-full': 'CBT Full', 'cbt-single': 'CBT Single', 'exam': 'Exam', 'mock': 'Mock', 'novel': 'Novel', 'topic': 'Topic' };
        const modeAttemptsList = {};

        history.forEach(function(h) {
            const k = dayKey(h.submitted_at);
            if (!modeAttemptsByDay[k]) modeAttemptsByDay[k] = {};
            modeAttemptsByDay[k][h.mode] = (modeAttemptsByDay[k][h.mode] || 0) + 1;

            if (!modeUsers[h.mode]) modeUsers[h.mode] = new Set();
            modeUsers[h.mode].add(h.user_id);

            if (!modeAttemptsList[h.mode]) modeAttemptsList[h.mode] = [];
            modeAttemptsList[h.mode].push(h);
        });

        let totalRevenue = 0;
        paidKeys.forEach(function(k) {
            totalRevenue += (k.price || 0);
            if (k.used_at) {
                const dk = dayKey(k.used_at);
                if (paymentsByDay[dk] !== undefined) paymentsByDay[dk] += (k.price || 0);
            }
        });
        paidKeys.sort(function(a, b) { return new Date(b.used_at) - new Date(a.used_at); });

        function avg(arr) { return arr.length ? Math.round(arr.reduce(function(a, b) { return a + b; }, 0) / arr.length) : 0; }
        const cbtScores = (cbtRes.data || []).map(function(r) { return r.score || 0; });
        const mockScores = (mockRes.data || []).map(function(r) { return r.score || 0; });
        const subjScores = (subjRes.data || []).map(function(r) { return r.score || 0; });
        const historyByModeAvg = {};
        Object.keys(modeAttemptsList).forEach(function(m) {
            const pcts = modeAttemptsList[m].map(function(h) { return h.max_score ? Math.round((h.total_score / h.max_score) * 100) : 0; });
            historyByModeAvg[m] = avg(pcts);
        });

        state.analyticsData = {
            totalUsers: totalUsers,
            activatedUsers: activatedUsers,
            inactiveUsers: totalUsers - activatedUsers,
            onlineNow: onlineNow,
            activeToday: activeToday.length,
            signupsByDay: days.map(function(d) { return { label: shortDay(d), value: signupsByDay[d] }; }),
            viewsByDay: days.map(function(d) { return { label: shortDay(d), value: viewsByDay[d] }; }),
            paymentsByDay: days.map(function(d) { return { label: shortDay(d), value: paymentsByDay[d] }; }),
            totalViews: Object.values(viewsByDay).reduce(function(a, b) { return a + b; }, 0),
            totalRevenue: totalRevenue,
            paidKeys: paidKeys,
            modeAttemptsByDay: modeAttemptsByDay,
            modeUsers: modeUsers,
            modeLabels: modeLabels,
            days: days,
            historyByModeAvg: historyByModeAvg,
            totalAttempts: history.length,
            cbtAvg: avg(cbtScores),
            mockAvg: avg(mockScores),
            subjAvg: avg(subjScores),
            _profiles: profiles,
            _logs: logs,
        };
        
        state.analyticsLoaded = true;
        state.analyticsLoading = false;
        render();

    } catch (e) {
        console.error('Analytics load error:', e);
        showToast('Error loading analytics: ' + (e.message || 'unknown'), 'error');
        state.analyticsLoaded = true;
        state.analyticsLoading = false;
        render();
    }
}
function trendOf(dataArr) {
    if (!dataArr || dataArr.length < 4) return null;
    const mid = Math.floor(dataArr.length / 2);
    const first = dataArr.slice(0, mid).reduce(function(a, b) { return a + b.value; }, 0);
    const second = dataArr.slice(mid).reduce(function(a, b) { return a + b.value; }, 0);
    if (first === 0 && second === 0) return null;
    if (first === 0) return { pct: 100, up: true };
    const pct = Math.round(((second - first) / first) * 100);
    return { pct: Math.abs(pct), up: pct >= 0 };
}

function renderTrendBadge(trend) {
    if (!trend) return '';

    const arrow = trend.up ? '↑' : '↓';
    return '<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:' + color + ';background:' + bg + ';padding:1px 6px;border-radius:999px;margin-top:4px">' + arrow + ' ' + trend.pct + '%</span>';
}

function renderBarChart(data, opts) {
    opts = opts || {};
    const color = opts.color || GREEN;
    const prefix = opts.prefix || '';
    const max = Math.max(1, ...data.map(function(d) { return d.value; }));
    let bars = '';
    data.forEach(function(d) {
        const pct = Math.max(2, Math.round((d.value / max) * 100));
        bars += (
            '<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:22px">' +
            '<div style="font-size:9px;font-weight:700;color:var(--ink);margin-bottom:3px;white-space:nowrap">' + prefix + d.value + '</div>' +
            '<div style="width:100%;max-width:26px;height:90px;display:flex;align-items:flex-end;background:var(--bg);border-radius:5px;overflow:hidden">' +
            '<div style="width:100%;height:' + pct + '%;background:linear-gradient(180deg,' + color + ' 0%,' + color + 'cc 100%);border-radius:4px 4px 0 0;transition:height 0.3s"></div>' +
            '</div>' +
            '<div style="font-size:8px;color:var(--muted);margin-top:4px;text-align:center;white-space:nowrap">' + esc(d.label) + '</div>' +
            '</div>'
        );
    });
    return '<div style="display:flex;gap:5px;align-items:flex-end;overflow-x:auto;padding:4px 2px 0">' + bars + '</div>';
}

function renderAnalyticsUserList(filterKey) {
    if (!state.analyticsData) return '<div class="loading-spinner"><div class="spinner"></div><p>Loading users...</p></div>';
    
    const d = state.analyticsData;
    let users = [];
    let title = '';
    let icon = '';
    
    // Get all profiles from the analytics data
    const allProfiles = d._profiles || [];
    
    switch(filterKey) {
        case 'all-users':
            users = allProfiles;
            title = 'All Registered Users';
            icon = '👤';
            break;
        case 'activated-users':
            users = allProfiles.filter(function(p) {
                return p.is_active && (!p.activation_expiry || new Date(p.activation_expiry).getTime() > Date.now());
            });
            title = 'Activated Users';
            icon = '✅';
            break;
        case 'inactive-users':
            users = allProfiles.filter(function(p) {
                return !p.is_active || (p.activation_expiry && new Date(p.activation_expiry).getTime() <= Date.now());
            });
            title = 'Inactive Users';
            icon = '⛔';
            break;
        case 'online-now':
            users = allProfiles.filter(function(p) {
                return p.last_seen && (Date.now() - new Date(p.last_seen).getTime()) < 5 * 60 * 1000;
            });
            title = 'Online Now';
            icon = '🟢';
            break;
        case 'active-today':
            users = allProfiles.filter(function(p) {
                return p.last_seen && (Date.now() - new Date(p.last_seen).getTime()) < 24 * 60 * 60 * 1000;
            });
            title = 'Active Today';
            icon = '📅';
            break;
        case 'app-views':
            // Show app view logs instead of users
            const logs = d._logs || [];
            const viewLogs = logs.filter(function(l) { return l.action === 'page_view'; });
            return renderAnalyticsViewLogs(viewLogs);
        default:
            return '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No data for this filter.</p></div>';
    }
    
    if (users.length === 0) {
        return (
            '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No users found for this filter.</p></div>'
        );
    }
    
    let rows = '';
    users.forEach(function(user) {
        const isActive = user.is_active !== false;
        const expiry = user.activation_expiry ? new Date(user.activation_expiry) : null;
        const daysLeft = expiry ? Math.ceil((expiry - new Date()) / (1000 * 60 * 60 * 24)) : null;
        let statusLabel = isActive ? '✅ Active' : '⛔ Inactive';
        if (isActive && daysLeft !== null && daysLeft < 3) statusLabel = '⚠️ ' + daysLeft + 'd left';
        const lastSeen = user.last_seen ? formatTimeAgo(user.last_seen) : 'Never';
        
        rows += (
            '<div class="admin-user-row" style="cursor:default">' +
            '<div class="user-info">' +
            '<span class="user-name">' + esc(user.username || 'Unknown') + '</span>' +
            '<span class="user-email">' + esc(user.email || '') + (expiry ? ' · Expires: ' + expiry.toLocaleDateString() : '') + ' · Last seen: ' + lastSeen + '</span>' +
            '</div>' +
            '<span class="user-status ' + (isActive ? 'active' : 'inactive') + '">' + statusLabel + '</span>' +
            '</div>'
        );
    });
    
    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + icon + ' ' + title + ' (' + users.length + ')</span>' +
        '<button class="btn btn-outline btn-sm" data-action="analytics-close-user-list">← Back to Analytics</button>' +
        '</div>' +
        '<div style="max-height:400px;overflow-y:auto">' + rows + '</div>'
    );
}

// ============================================================
function renderAdminViewModeQuestions() {
    const type = state.admin.viewModeType;
    if (type === 'topic') return renderAdminTopicManagement();

    // Novel (CBT) only has one subject — skip straight to it
    if (type === 'literature' && !state.admin.viewModeSubject) {
        state.admin.viewModeSubject = 'lhm';
    }

    const subject = state.admin.viewModeSubject;
    const year = state.admin.viewModeYear;

    if (!subject) return renderAdminSubjectPicker(type);
    if (type === 'exam' && !year) return renderAdminYearPicker(type, subject);
    return renderAdminSubjectQuestions(type, subject, year);
}

function renderAdminSubjectPicker(type) {
    let title = 'All Questions';
    if (type === 'cbt') title = 'CBT Mode Questions';
    else if (type === 'exam') title = 'Exam Mode Questions';
    else if (type === 'mock') title = 'Mock Exam Questions';
    else if (type === 'literature') title = 'Novel (CBT) Questions';

    const typeFilter = type === 'literature' ? 'NOVEL (CBT)' : type;
    const counts = {};
    (state.allQuestions || []).forEach(function(q) {
        if (q.type === typeFilter) counts[q.subject_id] = (counts[q.subject_id] || 0) + 1;
    });

    let cards = '';
    SUBJECTS.filter(function(s) { return s.id !== 'lhm'; }).forEach(function(s) {
        const count = counts[s.id] || 0;
        cards += (
            '<div class="admin-mode-card" data-action="admin-select-view-subject" data-subject="' + s.id + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name">' + esc(s.code) + ' — ' + esc(s.name) + '</span>' +
            '<span class="mode-count">' + count + ' question' + (count === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<div class="mode-actions"><span class="count-badge">' + count + '</span></div>' +
            '</div>'
        );
    });

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + title + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +
        '</div>' +
        '<p class="section-label">Select a subject to view or add questions</p>' +
        cards
    );
}

function renderAdminYearPicker(type, subject) {
    const subj = SUBJECTS.find(function(s) { return s.id === subject; });
    const counts = {};
    (state.allQuestions || []).forEach(function(q) {
        if (q.type === 'exam' && q.subject_id === subject) counts[q.year] = (counts[q.year] || 0) + 1;
    });

    let cards = '';
    for (let y = 2026; y >= 2021; y--) {
        const count = counts[y] || 0;
        cards += (
            '<div class="admin-mode-card" data-action="admin-select-view-year" data-year="' + y + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name">📅 ' + y + '</span>' +
            '<span class="mode-count">' + count + ' question' + (count === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<div class="mode-actions"><span class="count-badge">' + count + '</span></div>' +
            '</div>'
        );
    }

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + esc(subj ? subj.name : subject) + ' — Exam Mode</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-to-subject-picker">← Subjects</button>' +
        '</div>' +
        '<p class="section-label">Select a year</p>' +
        cards
    );

function renderAdminSubjectQuestions(type, subject, year) {
    const subj = SUBJECTS.find(function(s) { return s.id === subject; });
    const search = state.admin.searchQuery || '';
    const typeFilter = type === 'literature' ? 'NOVEL (CBT)' : type;

    let filtered = (state.allQuestions || []).filter(function(q) {
        return q.type === typeFilter && q.subject_id === subject && (type !== 'exam' || q.year === year);
    });

    if (search) {
        const s = search.toLowerCase();
        filtered = filtered.filter(function(q) {
            return q.text.toLowerCase().includes(s) ||
                (q.options && q.options.some(function(o) { return o.toLowerCase().includes(s); }));
        });
    }

    const backAction = type === 'exam' ? 'admin-back-to-year-picker' : 'admin-back-to-subject-picker';
    const backLabel = type === 'exam' ? '← Years' : '← Subjects';

    let rows = "";
    if (filtered.length === 0) {
        rows = '<p style="text-align:center;color:var(--faint);padding:20px 0;font-size:13px">No questions yet. Add one below!</p>';
    } else {
        filtered.forEach(function(q, i) {
            const isEditing = state.admin.editingQuestionId === q.id;
            if (isEditing) {
                let editOptsHtml = "";
                for (let oi = 0; oi < 4; oi++) {
                    editOptsHtml += (
                        '<div class="opt-row">' +
                        '<input type="radio" name="edit-correct" value="' + oi + '"' + (q.correct_answer === oi ? ' checked' : '') +
                        ' data-action="edit-correct" />' +
                        '<input class="field" data-action="edit-opt" data-idx="' + oi + '" placeholder="Option ' + (oi + 1) +
                        '" value="' + esc(q.options[oi] || '') + '" style="font-size:13px" />' +
                        '</div>'
                    );
                }
                rows += (
                    '<div class="edit-form">' +
                    '<p style="font-size:11px;font-weight:600;color:var(--gold);margin-bottom:6px">✏️ Editing Question ' + (i + 1) + '</p>' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:6px">' +
                    '<button class="btn btn-green" style="flex:1;padding:8px" data-action="save-edit" data-qid="' + q.id + '">Save Changes</button>' +
                    '<button class="btn btn-outline" style="flex:0.5;padding:8px" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'
                );
            } else {
                let optsList = '<ul class="admin-list">';
                q.options.forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN + ';font-weight:600"' : '') +
                        '>' + esc(o) + (oi === q.correct_answer ? ' ✓' : '') + '</li>';
                });
                optsList += '</ul>';
                rows += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">Q' + (i + 1) + '. ' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id + '">✏️</button>' +
                    '<button class="mini-btn danger" data-action="delete-question-immediate" data-qid="' + q.id + '">🗑️</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="q-options">' + optsList + '</div>' +
                    (q.explanation ? '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' + esc(q.explanation) + '</div>' : '') +
                    '</div>'
                );
            }
        });
    }

    let optsHtml = "";
    for (let i = 0; i < 4; i++) {
        optsHtml += (
            '<div class="opt-row">' +
            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ? ' checked' : '') + ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) + '" value="' + esc(state.admin.qOpts[i]) + '" style="font-size:13px" />' +
            '</div>'
        );
    }

    const addForm = (
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add Question to ' + esc(subj ? subj.name : subject) + (year ? ' (' + year + ')' : '') + '</p>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:8px;font-size:13px" placeholder="Enter question...">' + esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +
        optsHtml +
        '<label class="field-label">Explanation (shown after answering)</label>' +
        '<textarea class="field" rows="2" data-action="qform-explanation" style="margin-bottom:8px;font-size:13px" placeholder="Explain why this answer is correct...">' + esc(state.admin.qExplanation) + '</textarea>' +
        '<button class="btn btn-green" data-action="qform-add-admin" style="padding:10px">Save Question</button>' +
        '</div>' +
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 6px">📋 Or Paste Questions as JSON</p>' +
        '<p style="font-size:10px;color:var(--muted);margin:0 0 8px">Adds to ' + esc(subj ? subj.name : subject) + (year ? ' (' + year + ')' : '') + ' unless a question specifies its own subject_id' + (type === 'exam' ? '/year' : '') + '.</p>' +
        '<textarea class="field" id="admin-json-import" rows="6" placeholder=\'[\n  {\n    "text": "What is 2+2?",\n    "options": ["3","4","5","6"],\n    "correct_answer": 1,\n    "explanation": "2+2 equals 4."\n  }\n]\' style="margin-bottom:8px;font-family:var(--font-mono);font-size:11px">' + esc(state.admin.jsonImportText || '') + '</textarea>' +
        '<button class="btn btn-gold" data-action="qform-import-json" style="padding:10px">Import Questions</button>' +
        '</div>'
    );

    return (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">' + esc(subj ? subj.name : subject) + (year ? ' — ' + year : '') + '</span>' +
        '<button class="btn btn-outline btn-sm" data-action="' + backAction + '">' + backLabel + '</button>' +
        '</div>' +
        '<input class="search-box" id="admin-view-search" placeholder="🔍 Search questions..." value="' + esc(search) + '" />' +
        '<p style="font-size:11px;color:var(--muted);margin-bottom:8px">' + filtered.length + ' question(s)</p>' +
        '<div class="admin-question-list" style="max-height:400px">' + rows + '</div>' +
        addForm
    );

function renderAdminTopicManagement() {
    const subjectId = state.admin.adminTopicSubject;

    let subjOpts = '<option value="">Select subject</option>';
    SUBJECTS.filter(function(s) { return s.id !== 'lhm'; }).forEach(function(s) {
        subjOpts += '<option value="' + s.id + '"' + (subjectId === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    });

    let body = '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">Topic Practice Questions</span>' +
        '<button class="btn btn-outline btn-sm" data-action="admin-back-from-view">← Back</button>' +
        '</div>' +
        '<label class="field-label">Subject</label>' +
        '<select class="field" id="admin-topic-subject-select" style="margin-bottom:12px;font-size:13px">' + subjOpts + '</select>';

    if (!subjectId) {
        return body + '<p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">Select a subject to manage its topics.</p>';
    }

    if (!state.admin.adminTopicsLoaded) {
        loadAdminTopics(subjectId);
        return body + '<div class="loading-spinner"><div class="spinner"></div><p>Loading topics...</p></div>';
    }

    body += '<div class="card" style="margin-bottom:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add New Topic</p>' +
        '<input class="field" id="admin-new-topic-name" placeholder="Topic name e.g. Algebra" value="' + esc(state.admin.newTopicName || '') + '" style="margin-bottom:6px;font-size:13px" />' +
        '<button class="btn btn-green" data-action="admin-create-topic" data-subject="' + subjectId + '" style="padding:10px">Create Topic</button>' +
        '</div>';

    const topics = state.admin.adminTopicsList || [];
    if (topics.length === 0) {
        body += '<p style="text-align:center;color:var(--faint);padding:12px 0;font-size:13px">No topics yet for this subject.</p>';
        return body;
    }

    body += '<p class="section-label">Topics</p>';
    topics.forEach(function(t) {
        const isSelected = state.admin.adminSelectedTopicId === t.id;
        body += '<div class="admin-mode-card" data-action="admin-select-topic" data-topicid="' + t.id + '">' +
            '<div class="mode-info">' +
            '<span class="mode-name" style="font-size:12px">' + esc(t.name) + (isSelected ? ' (viewing)' : '') + '</span>' +
            '<span class="mode-count" style="font-size:10px">' + (t.question_count || 0) + ' questions</span>' +
            '</div>' +
            '<div class="mode-actions">' +
            '<span class="edit-icon" style="background:var(--danger)" data-action="admin-delete-topic" data-topicid="' + t.id + '" style="font-size:11px;width:24px;height:24px">🗑️</span>' +
            '</div>' +
            '</div>';
    });

    if (!state.admin.adminSelectedTopicId) return body;

    if (!state.admin.adminTopicQuestionsLoaded) {
        loadAdminTopicQuestions(state.admin.adminSelectedTopicId);
        return body + '<div class="loading-spinner"><div class="spinner"></div><p>Loading questions...</p></div>';
    }

    body += '<p class="section-label" style="margin-top:12px">Questions in this topic</p>';
    const tqs = state.admin.adminTopicQuestions || [];
    if (tqs.length === 0) {
        body += '<p style="text-align:center;color:var(--faint);padding:12px 0;font-size:13px">No questions in this topic yet.</p>';
    } else {
        tqs.forEach(function(q) {
            const isEditing = state.admin.editingQuestionId === q.id;
            if (isEditing) {
                let editOptsHtml = "";
                for (let i = 0; i < 4; i++) {
                    editOptsHtml += (
                        '<div class="opt-row">' +
                        '<input type="radio" name="edit-correct" value="' + i + '"' + (q.correct_answer === i ? ' checked' : '') +
                        ' data-action="edit-correct" />' +
                        '<input class="field" data-action="edit-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) +
                        '" value="' + esc(q.options[i] || '') + '" style="font-size:13px" />' +
                        '</div>'
                    );
                }
                body += (
                    '<div class="edit-form">' +
                    '<label class="field-label">Question text</label>' +
                    '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.text) + '</textarea>' +
                    '<label class="field-label">Options</label>' +
                    editOptsHtml +
                    '<label class="field-label">Explanation</label>' +
                    '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q.explanation || '') + '</textarea>' +
                    '<div style="display:flex;gap:6px">' +
                    '<button class="btn btn-green" style="flex:1;padding:8px" data-action="admin-save-topic-question-edit" data-qid="' + q.id + '">Save</button>' +
                    '<button class="btn btn-outline" style="flex:0.5;padding:8px" data-action="cancel-edit">Cancel</button>' +
                    '</div>' +
                    '</div>'
                );
            } else {
                let optsList = '<ul class="admin-list">';
                (q.options || []).forEach(function(o, oi) {
                    optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN + ';font-weight:600"' : '') + '>' + esc(o) + (oi === q.correct_answer ? ' ✓' : '') + '</li>';
                });
                optsList += '</ul>';
                body += (
                    '<div class="saved-question-item">' +
                    '<div class="q-header">' +
                    '<p class="q-text">' + esc(q.text) + '</p>' +
                    '<div class="q-actions">' +
                    '<button class="mini-btn edit" data-action="edit-question" data-qid="' + q.id + '">✏️</button>' +
                    '<button class="mini-btn danger" data-action="admin-delete-topic-question" data-qid="' + q.id + '">×</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="q-options">' + optsList + '</div>' +
                    (q.explanation ? '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' + esc(q.explanation) + '</div>' : '') +
                    '</div>'
                );
            }
        });
    }

    let optsHtml = "";
    for (let i = 0; i < 4; i++) {
        optsHtml += (
            '<div class="opt-row">' +
            '<input type="radio" name="qform-correct" value="' + i + '"' + (state.admin.qCorrect === i ? ' checked' : '') +
            ' data-action="qform-correct" />' +
            '<input class="field" data-action="qform-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) +
            '" value="' + esc(state.admin.qOpts[i]) + '" style="font-size:13px" />' +
            '</div>'
        );
    }

    body += (
        '<div class="card" style="margin-top:12px">' +
        '<p style="font-size:13px;font-weight:600;margin:0 0 10px">➕ Add Question to This Topic</p>' +
        '<textarea class="field" rows="3" data-action="qform-text" style="margin-bottom:8px;font-size:13px" placeholder="Enter question...">' +
        esc(state.admin.qText) + '</textarea>' +
        '<label class="field-label">Options (tick the correct one)</label>' +
        optsHtml +
        '<label class="field-label">Explanation (shown after answering)</label>' +
        '<textarea class="field" rows="2" data-action="qform-explanation" style="margin-bottom:8px;font-size:13px" placeholder="Explain why this answer is correct...">' +
        esc(state.admin.qExplanation) + '</textarea>' +
        '<button class="btn btn-green" data-action="admin-add-topic-question" data-topicid="' + state.admin.adminSelectedTopicId + '" style="padding:10px">Save Question</button>' +
        '</div>'
    );

    return body;
}

// ============================================================
//  ADMIN USERS - Updated with full_name and avatar
// ============================================================
function renderAdminUsers() {
    const users = state.allUsers || [];

    if (users.length === 0) {
        return '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No registered users yet.</p></div>';
    }

    let rows = "";
    users.forEach(function(user) {
        const isActive = user.is_active !== false;
        const expiry = user.activation_expiry ? new Date(user.activation_expiry) : null;
        const daysLeft = expiry ? Math.ceil((expiry - new Date()) / (1000 * 60 * 60 * 24)) : null;
        let statusLabel = isActive ? '✅ Active' : '⛔ Inactive';
        if (isActive && daysLeft !== null && daysLeft < 3) statusLabel = '⚠️ ' + daysLeft + 'd left';
        
        const displayName = user.full_name || user.username || 'User';
        const avatarLetter = displayName.trim().charAt(0).toUpperCase();
        const avatarHtml = user.profile_image_url 
            ? '<img src="' + esc(user.profile_image_url) + '" style="width:32px;height:32px;border-radius:999px;object-fit:cover" />' 
            : '<div style="width:32px;height:32px;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">' + esc(avatarLetter) + '</div>';
        const wallet = user.wallet_balance || 0;
        
        rows += (
            '<div class="admin-user-row">' +
            '<div style="display:flex;align-items:center;gap:8px">' +
            avatarHtml +
            '<div class="user-info">' +
            '<span class="user-name">' + esc(displayName) + '</span>' +
            '<span class="user-email">@' + esc(user.username) + ' · ' + esc(user.email || '') + ' · ₦' + wallet.toLocaleString() + '</span>' +
            '</div>' +
            '</div>' +
            '<span class="user-status ' + (isActive ? 'active' : 'inactive') + '">' +
            statusLabel +
            '</span>' +
            '<div class="user-actions">' +
            '<button class="mini-btn" data-action="admin-notify-user-btn" data-userid="' + user.id + '" data-username="' + esc(user.username) + '" style="font-size:9px">🔔</button>' +
            (isActive ?
                '<button class="mini-btn danger" data-action="admin-deactivate-user" data-userid="' + user
                .id + '" style="font-size:9px">Deactivate</button>' :
                '<button class="mini-btn primary" data-action="admin-activate-user" data-userid="' + user

            ) +
            '</div>' +
            '</div>'

    });

    return (
        '<div style="font-weight:700;font-size:14px;margin-bottom:10px;color:var(--ink)">👥 Total registered users: ' + users.length + '</div>' +
        rows
    );

// ============================================================
//  ADMIN FLAGGED
// ============================================================
function renderAdminFlagged() {
    if (state.admin.flaggedLoading) {
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }

    if (!state.admin.flaggedLoaded) {
        state.admin.flaggedLoading = true;
        loadFlaggedQuestions(state.admin.flaggedFilter || 'unresolved').then(function(data) {
            state.admin.flaggedData = data || [];
            state.admin.flaggedLoaded = true;
            state.admin.flaggedLoading = false;
            render();
        });
        
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading flagged questions...</p></div>';
    }
    const data = state.admin.flaggedData || [];
    const filter = state.admin.flaggedFilter || 'unresolved';
    
    const grouped = {};
    data.forEach(function(f) {
        if (!grouped[f.question_id]) grouped[f.question_id] = [];
        grouped[f.question_id].push(f);
    });

    let html = (
        '<div class="admin-view-mode-header">' +
        '<span class="mode-title" style="font-size:14px">🚩 Flagged Questions</span>' +
        '<div style="display:flex;gap:4px">' +
        '<button class="btn btn-sm ' + (filter === 'unresolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="unresolved" style="font-size:9px;padding:3px 8px">Unresolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'resolved' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="resolved" style="font-size:9px;padding:3px 8px">Resolved</button>' +
        '<button class="btn btn-sm ' + (filter === 'all' ? 'btn-green' : 'btn-outline') + '" data-action="admin-flagged-filter" data-filter="all" style="font-size:9px;padding:3px 8px">All</button>' +
        '</div>' +
        '</div>'
    );

    if (Object.keys(grouped).length === 0) {
        html += '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">' + 
            (filter === 'unresolved' ? 'No unresolved flagged questions.' : 'No flagged questions in this filter.') + 
            '</p></div>';
        return html;
    }

    Object.keys(grouped).forEach(function(qid) {
        const flags = grouped[qid];
        const q = flags[0].questions;
        const subj = SUBJECTS.find(function(s) { return s.id === q?.subject_id; });
        const isEditing = state.admin.editingQuestionId === qid;
        
        html += '<div class="saved-question-item">';
        html += '<div class="q-header">';
        html += '<p class="q-text">' + esc(q?.text || 'Question not found') + '</p>';
        html += '<div class="q-actions">';
        if (isEditing) {
            html += '<button class="mini-btn" data-action="cancel-edit" style="font-size:9px">Cancel</button>';
        } else {
            html += '<button class="mini-btn edit" data-action="admin-flagged-edit" data-qid="' + qid + '" style="font-size:9px">✏️</button>';
            if (filter !== 'resolved') {
                html += '<button class="mini-btn primary" data-action="admin-flagged-resolve" data-qid="' + qid + '" style="font-size:9px">✅ Resolve</button>';
            }
        }
        html += '</div>';
        html += '</div>';
        
        html += '<div style="font-size:10px;color:var(--muted);margin:3px 0">';
        html += 'Flagged ' + flags.length + ' time' + (flags.length > 1 ? 's' : '') + ' · ';
        flags.slice(0, 3).forEach(function(f, i) {
            if (i > 0) html += ', ';
            html += esc(f.username || 'Unknown') + (f.reason ? ' ("' + esc(f.reason) + '")' : '');
        });
        if (flags.length > 3) html += ' and ' + (flags.length - 3) + ' more';
        html += '</div>';
        
        if (isEditing) {
            html += '<div class="edit-form" style="margin-top:6px">';
            html += '<label class="field-label">Question text</label>';
            html += '<textarea class="field" id="edit-text" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q?.text || '') + '</textarea>';
            html += '<label class="field-label">Options</label>';
            for (let i = 0; i < 4; i++) {
                html += '<div class="opt-row">';
                html += '<input type="radio" name="edit-correct" value="' + i + '"' + (q?.correct_answer === i ? ' checked' : '') + ' data-action="edit-correct" />';
                html += '<input class="field" data-action="edit-opt" data-idx="' + i + '" placeholder="Option ' + (i + 1) + '" value="' + esc(q?.options?.[i] || '') + '" style="font-size:13px" />';
                html += '</div>';
            }
            html += '<label class="field-label">Explanation</label>';
            html += '<textarea class="field" id="edit-explanation" rows="2" style="margin-bottom:6px;font-size:13px">' + esc(q?.explanation || '') + '</textarea>';
            html += '<button class="btn btn-green" data-action="save-edit-flagged" data-qid="' + qid + '" style="padding:8px">Save & Resolve</button>';
            html += '</div>';
        }
        
        html += '</div>';
    });

    return html;
}

// ============================================================
//  EVENT HANDLING
// ============================================================
document.addEventListener('click', function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');

    if (action === 'skip-splash') {
        state.phase = 'app';
        render();
        return;
    }

    if (action === 'open-drawer') {
        state.drawerOpen = true;
        render();
        return;
    }
    if (action === 'close-drawer') {
        state.drawerOpen = false;
        render();
        return;
    }

    if (action === 'set-view') {
        setView(el.getAttribute('data-view'));
        return;
    }

    if (action === 'dismiss-inapp-banner') {
        dismissInAppBanner();
        return;
    }

    if (action === 'dismiss-activate-icon') {
        state.activateIconDismissed = true;
        render();
        return;
    }

    // NOTIFICATION TAB
    if (action === 'notif-tab') {
        state.notifTab = el.getAttribute('data-tab');
        render();
        return;
    }

    // SUBMIT MODAL
    if (action === 'submit-confirm') {
        if (state.submitModalData && state.submitModalData.onConfirm) {
            state.submitModalData.onConfirm();
        }
        return;
    }
    if (action === 'submit-cancel') {
        if (state.submitModalData && state.submitModalData.onCancel) {
            state.submitModalData.onCancel();
        } else {
            state.showSubmitModal = false;
            state.submitModalData = null;
            render();
        }
        return;
    }

    // GOTO QUESTION (replaces attempt modal)
    if (action === 'show-goto-cbt') {
        const bySubject = state.cbtSubjectOrder.map(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const indices = state.cbtSubjectQuestions[sid] || [];
            const startNum = Math.min(...indices);
            return {
                subjectName: subj ? subj.name : sid,
                subjectCode: subj ? subj.code : sid,
                indices: indices,
                startNum: startNum,
            };
        });
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'cbt',
            total: state.cbtQuestions.length,
            current: state.cbtIndex,
            answers: state.cbtAnswers,
            answered: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: bySubject.length > 1 ? bySubject : null,
        };
        render();
        return;
    }
    if (action === 'show-goto-exam') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'exam',
            total: state.examQuestions.length,
            current: state.examIndex,
            answers: state.examAnswers,
            answered: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: null,
        };
        render();
        return;
    }
    if (action === 'show-goto-topic') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'topic',
            total: state.topicQuestions.length,
            current: state.topicIndex,
            answers: state.topicAnswers,
            answered: state.topicAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: null,
        };
        render();
        return;
    }
    if (action === 'show-goto-lit') {
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'lit',
            total: state.litQuestions.length,
            current: state.litIndex,
            answers: state.litAnswers,
            answered: state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: null,
        };
        render();
        return;
    }
    if (action === 'show-goto-mock') {
        const bySubject = state.mockSubjectOrder.map(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const indices = state.mockSubjectQuestions[sid] || [];
            const startNum = Math.min(...indices);
            return {
                subjectName: subj ? subj.name : sid,
                subjectCode: subj ? subj.code : sid,
                indices: indices,
                startNum: startNum,
            };
        });
        state.showGotoModal = true;
        state.gotoModalData = {
            mode: 'mock',
            total: state.mockQuestions.length,
            current: state.mockIndex,
            answers: state.mockAnswers,
            answered: state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
            bySubject: bySubject.length > 1 ? bySubject : null,
        };
        render();
        return;
    }
    if (action === 'goto-close') {
        state.showGotoModal = false;
        state.gotoModalData = null;
        render();
        return;
    }
    if (action === 'goto-q-select') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const mode = el.getAttribute('data-mode');
        state.showGotoModal = false;
        state.gotoModalData = null;
        if (mode === 'cbt') {
            state.cbtIndex = idx;
            const q = state.cbtQuestions[idx];
            if (q) state.cbtCurrentSubject = q.subject_id;
        } else if (mode === 'exam') {
            state.examIndex = idx;
        } else if (mode === 'topic') {
            state.topicIndex = idx;
        } else if (mode === 'lit') {
            state.litIndex = idx;
        } else if (mode === 'mock') {
            state.mockIndex = idx;
            const q = state.mockQuestions[idx];
            if (q) state.mockCurrentSubject = q.subject_id;
        }
        render();
        return;
    }
    if (action === 'prevent-close') return;

    // CALCULATOR
    if (action === 'toggle-calculator') {
        if (state.settingsCache.calculatorEnabled !== false) {
            state.showCalculator = !state.showCalculator;
            if (state.showCalculator) {
                state.calcDisplay = "0";
                state.calcExpression = "";
                state.calcJustEvaluated = false;
                const appInner = document.getElementById('app-inner');
                if (appInner) {
                    const rect = appInner.getBoundingClientRect();
                    state.calcPosition = {
                        x: Math.max(8, rect.right - 296),
                        y: Math.max(8, rect.bottom - 380)
                    };
                } else {
                    state.calcPosition = { x: null, y: null };
                }
            }
            render();
        }
        return;
    }
    if (action === 'calc-close') {
        state.showCalculator = false;
        render();
        return;
    }
    
    // Calculator drag
    if (action === 'calc-drag-start') {
        const modal = el.closest('.calc-modal');
        if (!modal) return;
        const rect = modal.getBoundingClientRect();
        const startX = rect.left;
        const startY = rect.top;
        const offsetX = rect.width / 2;
        const offsetY = 20;
        
        function onMove(ev) {
            const x = (ev.clientX || ev.touches?.[0]?.clientX || 0) - offsetX;
            const y = (ev.clientY || ev.touches?.[0]?.clientY || 0) - offsetY;
            const clampedX = Math.max(0, Math.min(window.innerWidth - rect.width, x));
            const clampedY = Math.max(0, Math.min(window.innerHeight - rect.height - 20, y));
            state.calcPosition = { x: clampedX, y: clampedY };
            modal.style.left = clampedX + 'px';
            modal.style.top = clampedY + 'px';
            render();
        }
        function onEnd() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: true });
        document.addEventListener('touchend', onEnd, { passive: true });
        return;
    }
    
    if (action === 'calc-number') {
        const val = el.getAttribute('data-value');
        if (state.calcJustEvaluated) {
            state.calcDisplay = val;
            state.calcExpression = val;
            state.calcJustEvaluated = false;
        } else {
            if (state.calcDisplay === "0" && val !== ".") {
                state.calcDisplay = val;
            } else {
                state.calcDisplay += val;
            }
            state.calcExpression += val;
        }
        render();
        return;
    }
    if (action === 'calc-operator') {
        const val = el.getAttribute('data-value');
        const lastChar = state.calcExpression.slice(-1);
        if (['+', '-', '×', '÷'].includes(lastChar)) {
            state.calcExpression = state.calcExpression.slice(0, -1) + val;
            state.calcDisplay = state.calcDisplay.slice(0, -1) + val;
        } else {
            state.calcExpression += val;
            state.calcDisplay += val;
        }
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-equals') {
        try {
            let expr = state.calcExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/');
            const result = Function('"use strict"; return (' + expr + ')')();
            state.calcDisplay = String(result);
            state.calcExpression = String(result);
            state.calcJustEvaluated = true;
        } catch (e) {
            state.calcDisplay = 'Error';
        }
        render();
        return;
    }
    if (action === 'calc-clear') {
        state.calcDisplay = "0";
        state.calcExpression = "";
        state.calcJustEvaluated = false;
        render();
        return;
    }
    if (action === 'calc-delete') {
        if (state.calcDisplay.length > 1) {
            state.calcDisplay = state.calcDisplay.slice(0, -1);
            state.calcExpression = state.calcExpression.slice(0, -1);
        } else {
            state.calcDisplay = "0";
            state.calcExpression = "";
        }
        render();
        return;
    }

    // AUTH
    if (action === 'show-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'show-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        state.drawerOpen = false;
        render();
        return;
    }
    if (action === 'switch-to-reset') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = true;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'close-auth') {
        state.showLogin = false;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        state.resetError = null;
        render();
        return;
    }
    if (action === 'switch-to-login') {
        state.showLogin = true;
        state.showSignup = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'switch-to-signup') {
        state.showSignup = true;
        state.showLogin = false;
        state.showReset = false;
        state.authError = null;
        render();
        return;
    }
    if (action === 'do-login') {
        const email = document.getElementById('login-email')?.value?.trim() || '';
        const password = document.getElementById('login-password')?.value || '';
        state.loginEmail = email;
        state.loginPassword = password;
        if (!email || !password) { state.authError = 'Please enter both email/username and password.';
            render(); return; }
        signIn(email, password);
        return;
    }
    if (action === 'do-signup') {
        const fullName = document.getElementById('signup-fullname')?.value?.trim() || '';
        const username = document.getElementById('signup-username')?.value?.trim() || '';
        const email = document.getElementById('signup-email')?.value?.trim() || '';
        const password = document.getElementById('signup-password')?.value || '';
        const confirm = document.getElementById('signup-confirm')?.value || '';
        
        state.signupFullName = fullName;
        state.signupUsername = username;
        state.signupEmail = email;
        state.signupPassword = password;
        state.signupConfirm = confirm;
        
        if (!fullName) { state.authError = 'Please enter your full name.'; render(); return; }
        if (!username) { state.authError = 'Please choose a username.'; render(); return; }
        if (!email) { state.authError = 'Please enter your email address.'; render(); return; }
        if (password.length < 6) { state.authError = 'Password must be at least 6 characters.'; render(); return; }
        if (password !== confirm) { state.authError = 'Passwords do not match.'; render(); return; }

                if (newUsername !== state.profile.name) {
                    const { data: existing, error: checkErr } = await supabase
                        .from('profiles')
                        .select('id')
                        .eq('username', newUsername)
                        .neq('id', state.authUser.id)
                        .maybeSingle();

                        state.profileEditLoading = false;

                        return;

            { setting_key: 'topic_settings', setting_value: { questions_per_subject: topicQs, time_limit_minutes: Math.max(1, topicTime) } },
            { setting_key: 'revise_settings', setting_value: { time_limit_minutes: Math.max(1, reviseTime) } },

            { setting_key: 'under_construction', setting_value: underConstruction },
            { setting_key: 'construction_reopen_time', setting_value: reopenTime },
        ];

        Promise.all(updates.map(function(u) {
            return supabase.from('admin_settings').upsert(u, { onConflict: 'setting_key' });

            state.settingsCache = {
                cbtQuestionsPerSubject: cbtQs,
                cbtTimeLimit: Math.max(1, cbtTime),
                subjectQuestionsPerSubject: subjQs,
                subjectTimeLimit: Math.max(1, subjTime),
                mockQuestionsPerSubject: mockQs,
                mockTimeLimit: Math.max(1, mockTime),
                calculatorEnabled: calcEnabled,
                examTimeLimit: 0,
                novelTimeLimit: Math.max(1, novelTime),
                novelQuestionsPerSubject: Math.max(1, novelQs),
                topicTimeLimit: Math.max(1, topicTime),
                reviseTimeLimit: Math.max(1, reviseTime),
                cbtSubjectCount: cbtSubjectCount,
                mockSubjectCount: mockSubjectCount,
                underConstruction: underConstruction,
                constructionReopenTime: reopenTime,
            };
            showToast('Settings saved!', 'success');
            render();

            console.error('Save settings error:', err);

    if (action === 'admin-upload-doc') {

            state.admin.docName = '';

            loadDocuments().then(function() { render(); });

            console.error('Upload doc error:', err);

                render();

            console.error('Delete doc error:', err);
            showToast('Error deleting document: ' + (err.message || 'unknown'), 'error'); 
        });
        return;
    }

    if (action === 'admin-schedule-mock') {
