}

async function adminGenerateKey(planId) {
    const plan = state.activationPlans.find(function(p) { return p.id === planId; });
    if (!plan) { showToast('Select a plan first.', 'error'); return; }

    let key = generateKeyString();
    let attempts = 0;
    let inserted = null;

    while (attempts < 5 && !inserted) {
        const { data, error } = await supabase.from('activation_keys').insert([{
            key_code: key,
            plan_id: plan.id,
            plan_name: plan.name,
            days: plan.days,
            price: plan.price,
            is_used: false,
        }]).select().single();

        if (!error) { inserted = data; break; }
        if (error.code === '23505') {
            key = generateKeyString();
            attempts++;
            continue;
        }
        console.warn('Generate key error:', error);
        showToast('Error generating key: ' + error.message, 'error');
        return;
    }

    if (inserted) {
        showToast('Key generated: ' + key, 'success');
        loadActivationKeys();
    } else {
        showToast('Could not generate a unique key, try again.', 'error');
    }
}

function payWithPaystack(plan) {
    if (!state.authUser) { showToast('Please log in first.', 'error'); return; }
    if (typeof PaystackPop === 'undefined') {
        showToast('Payment system not loaded. Check your connection and try again.', 'error');
        return;
    }

    const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: state.profile.email || (state.authUser.email || 'noemail@example.com'),
        amount: plan.price * 100,
        currency: 'NGN',
        ref: 'MYUTME-' + Date.now() + '-' + Math.floor(Math.random() * 100000),
        metadata: {
            custom_fields: [
                { display_name: "Plan", variable_name: "plan", value: plan.name },
                { display_name: "Username", variable_name: "username", value: state.profile.name || 'Guest' },
            ]
        },
        callback: function(response) {
            showToast('Payment received! Verifying...', '');
            verifyPaystackPayment(response.reference, plan.id);
        },
        onClose: function() {
            showToast('Payment window closed.', '');
        }
    });
    handler.openIframe();
}

async function verifyPaystackPayment(reference, planId) {
    state.activateStatus = 'checking';
    state.activateStatusMsg = 'Verifying your payment…';
    render();

    try {
        const res = await fetch(PAYSTACK_VERIFY_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            },
            body: JSON.stringify({
                reference: reference,
                planId: planId,
                userId: state.authUser.id,
            }),
        });
        const data = await res.json();

        if (!res.ok || data.error) {
            state.activateStatus = 'error';
            state.activateStatusMsg = data.error || 'Payment verification failed. Contact support with your reference: ' + reference;
            render();
            return;
        }

        state.profile.is_active = true;
        state.profile.activation_expiry = data.expiresAt;
        state.activateCode = data.keyCode;
        state.activateStatus = 'success';
        state.activateStatusMsg = '🎉 Payment confirmed! Your account is now active for ' + data.days + ' days. Your license key: ' + data.keyCode;
        showToast('Activated successfully!', 'success');
        state.view = 'activate';
        render();
    } catch (e) {
        state.activateStatus = 'error';
        state.activateStatusMsg = 'Could not verify payment. Contact support with your reference: ' + reference;
        render();
    }
}

async function redeemActivationKey(rawKey) {
    if (!state.authUser) { showToast('Please log in first.', 'error'); return; }
    const keyCode = (rawKey || '').trim().toUpperCase();
    if (!keyCode) {
        state.activateStatus = 'error';
        state.activateStatusMsg = 'Please enter a license key.';
        render();
        return;
    }

    state.activateStatus = 'checking';
    render();

    try {
        const { data: keyRow, error } = await supabase
            .from('activation_keys')
            .select('*')
            .eq('key_code', keyCode)
            .maybeSingle();

        if (error) {
            console.warn('Redeem key lookup error:', error);
            state.activateStatus = 'error';
            state.activateStatusMsg = 'Error checking key. Please try again.';
            render();
            return;
        }
        if (!keyRow) {
            state.activateStatus = 'error';
            state.activateStatusMsg = 'Invalid license key. Please check and try again.';
            render();
            return;
        }
        if (keyRow.is_used) {
            state.activateStatus = 'error';
            state.activateStatusMsg = 'This license key has already been used.';
            render();
            return;
        }

        const expiryDate = new Date();
        expiryDate.setDate(expiryDate.getDate() + (keyRow.days || 30));

        const { error: keyUpdateError } = await supabase
            .from('activation_keys')
            .update({
                is_used: true,
                used_by: state.authUser.id,
                used_by_username: state.profile.name,
                used_at: new Date().toISOString(),
            })
            .eq('id', keyRow.id)
            .eq('is_used', false);

        if (keyUpdateError) {
            console.warn('Redeem key update error:', keyUpdateError);
            state.activateStatus = 'error';
            state.activateStatusMsg = 'This key was just used by someone else. Try another key.';
            render();
            return;
        }

        await supabase.from('profiles').update({
            is_active: true,
            activation_expiry: expiryDate.toISOString(),
        }).eq('id', state.authUser.id);

        state.profile.is_active = true;
        state.profile.activation_expiry = expiryDate.toISOString();
        state.activateStatus = 'success';

function generateAiSupportReply(userText, issueKey) {
    if (issueKey && SUPPORT_QUICK_REPLIES[issueKey]) {
        return SUPPORT_QUICK_REPLIES[issueKey]();
    }

    const t = (userText || '').toLowerCase();
    const isActive = isUserActive();
    const expiry = state.profile.activation_expiry ? new Date(state.profile.activation_expiry) : null;

    if (t.includes('activat')) return SUPPORT_QUICK_REPLIES.not_active();
    if (t.includes('key') && (t.includes('invalid') || t.includes('wrong'))) return SUPPORT_QUICK_REPLIES.key_invalid();
    if (t.includes('key') && t.includes('used')) return SUPPORT_QUICK_REPLIES.key_used();
    if (t.includes('paystack') || t.includes('card')) return SUPPORT_QUICK_REPLIES.paystack_failed();
    if (t.includes('refund')) return SUPPORT_QUICK_REPLIES.refund();
    if (t.includes('login') || t.includes('log in')) return SUPPORT_QUICK_REPLIES.cant_login();
    if (t.includes('password')) return SUPPORT_QUICK_REPLIES.forgot_password();
    if (t.includes('slow') || t.includes('lag')) return SUPPORT_QUICK_REPLIES.app_slow();
    if (t.includes('crash') || t.includes('error')) return SUPPORT_QUICK_REPLIES.app_crash();
    if (t.includes('score')) return SUPPORT_QUICK_REPLIES.wrong_score();
    if (t.includes('offline')) return SUPPORT_QUICK_REPLIES.offline_issue();
    if (t.includes('pay') || t.includes('paid') || t.includes('transfer')) return SUPPORT_QUICK_REPLIES.manual_payment_pending();

    return { text: 'I\'m not fully sure what you mean — could you tap one of the quick options above, or describe it a bit more? If I still can\'t help, our team will step in shortly.', escalate: true };
}

async function startCbt() {
    if (!state.authUser) { showToast('Please log in to access this feature.', 'error'); state.showLogin = true; render(); return; }
    if (!isUserActive()) {
        showToast('Your account needs to be activated to access this feature. Contact admin or visit the Activate page.', 'error');
        state.view = 'activate';
        render();
        return;
    }
    
    const isFull = state.cbtMode === 'full';
    const selected = state.cbtSelected;
    const settings = await loadSettings();
    const requiredSubjects = isFull ? (settings.cbtSubjectCount || 3) : 1;
    
    if (isFull && selected.length !== requiredSubjects) {
        showToast("Please select " + requiredSubjects + " subjects.", "error");
        return;
    }
    if (!isFull && selected.length !== 1) {
        showToast("Please select 1 subject.", "error");
        return;
    }

    state.isLoading = true;
    render();

    state.currentEnglishPassage = null;
    state.hasPassage = false;
    state.passageRead = false;
    state.passageQuestionIds = [];

    if (state.authUser) {
        const savedBatch = storage.get('englishBatchTracker_' + state.authUser.id);
        if (savedBatch) {
            state.englishBatchTracker = parseInt(savedBatch, 10) || 1;
        }
    }

    let subjects = [];
    if (isFull) {
        const eng = SUBJECTS.find(function(s) { return s.compulsory; });
        subjects = [eng, ...selected.map(function(id) { return SUBJECTS.find(function(s) { return s.id === id; }); })];
    } else {
        subjects = selected.map(function(id) { return SUBJECTS.find(function(s) { return s.id === id; }); });
    }

    let allQuestions = [];
    const perSubject = state.selectedQuestionCount || 40;
    
    for (const subject of subjects) {
        let qs = [];
        
        if (subject.id === 'eng') {
            const currentBatch = state.englishBatchTracker || 1;
            qs = await window.OfflineDB.loadQuestionsOffline('cbt', subject.id, null, state.selectedQuestionCount || 40);
             
            if (qs.length > 0) {
                qs.sort(function(a, b) {
                    const aHasPassage = a.passage_id === currentBatch ? 0 : 1;
                    const bHasPassage = b.passage_id === currentBatch ? 0 : 1;
                    if (aHasPassage !== bHasPassage) {
                        return aHasPassage - bHasPassage;
                    }
                    return a.id - b.id;
                });
            }
                
            const passage = await window.OfflineDB.getPassageOffline(currentBatch);
            if (passage) {
                state.currentEnglishPassage = passage;
                state.hasPassage = true;
                state.passageRead = false;
                state.passageQuestionIds = [];
                
                const passageQuestionIds = [];
                qs.forEach(function(q) {
                    if (q.passage_id === currentBatch) {
                        passageQuestionIds.push(q.id);
                    }
                });
                state.passageQuestionIds = passageQuestionIds;
            } else {
                state.currentEnglishPassage = null;
                state.hasPassage = false;
                state.passageRead = false;
                state.passageQuestionIds = [];
            }
            
            if (qs.length === 0 && currentBatch < 6) {
                state.englishBatchTracker = currentBatch + 1;
                qs = await window.OfflineDB.loadQuestionsOffline('cbt', subject.id, null, state.selectedQuestionCount || 40);
                
                if (qs.length > 0) {
                    const nextBatch = state.englishBatchTracker;
                    qs.sort(function(a, b) {
                        const aHasPassage = a.passage_id === nextBatch ? 0 : 1;
                        const bHasPassage = b.passage_id === nextBatch ? 0 : 1;
                        if (aHasPassage !== bHasPassage) {
                            return aHasPassage - bHasPassage;
                        }
                        return a.id - b.id;
                    });
                }
                
                const nextPassage = await window.OfflineDB.getPassageOffline(state.englishBatchTracker);
                if (nextPassage) {
                    state.currentEnglishPassage = nextPassage;
                    state.hasPassage = true;
                    state.passageRead = false;
                    
                    const passageQuestionIds = [];
                    qs.forEach(function(q) {
                        if (q.passage_id === state.englishBatchTracker) {
                            passageQuestionIds.push(q.id);
                        }
                    });
                    state.passageQuestionIds = passageQuestionIds;
                }
            }
        } else {
            qs = await window.OfflineDB.loadQuestionsOffline('cbt', subject.id);
            qs = shuffleArray(qs).slice(0, state.selectedQuestionCount || 40);
        }
        
        const qsWithSubject = qs.map(function(q) {
            return Object.assign({}, q, { subject_name: subject.name });
        });
        allQuestions = allQuestions.concat(qsWithSubject);
    }

    state.isLoading = false;
            
    if (allQuestions.length === 0) {
        showToast('No questions available for these subjects.', 'error');
        return;
    }

    state.cbtQuestions = allQuestions;
    state.cbtIndex = 0;
    state.cbtAnswers = new Array(state.cbtQuestions.length).fill(null);
    state.cbtFinished = false;
    state.cbtSubmitted = false;
    state.cbtHistorySaved = false;
    state.cbtShowExplanation = false;
    state.cbtReviewMode = false;
    const timeLimit = isFull ? settings.cbtTimeLimit : settings.subjectTimeLimit;
    state.cbtTimeLeft = timeLimit * 60 || (isFull ? 6000 : 1500);
    
    buildCbtSubjectGroups(state.cbtQuestions);

    state.view = 'cbt-exam';
    render();

    if (state.cbtTimer) clearInterval(state.cbtTimer);
    state.cbtTimer = setInterval(function() {
        state.cbtTimeLeft--;
        if (state.cbtTimeLeft <= 0) {
            clearInterval(state.cbtTimer);
            state.cbtTimer = null;
            if (!state.cbtSubmitted) {
                const hasAnswers = state.cbtAnswers.some(function(a) { return a !== null && a !== undefined; });
                if (hasAnswers) {
                    state.cbtSubmitted = true;
                    state.cbtFinished = true;
                    showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                } else {
                    state.cbtSubmitted = false;
                    state.cbtFinished = true;
                    showToast('⏰ Time\'s up! No answers recorded.', '');
                }
            }
            render();
        } else {
            render();
        }
    }, 1000);
}

    state.topicShowExplanation = false;
    state.topicReviewMode = false;
    
    const settings = await loadSettings();
    const timeLimit = settings.topicTimeLimit || 60;
    state.topicTimeLeft = timeLimit * 60;

    state.view = 'topic-exam';
    render();
    
    if (state.topicTimer) clearInterval(state.topicTimer);
    state.topicTimer = setInterval(function() {
        state.topicTimeLeft--;
        if (state.topicTimeLeft <= 0) {
            clearInterval(state.topicTimer);
            state.topicTimer = null;
            if (!state.topicSubmitted) {
                const hasAnswers = state.topicAnswers.some(function(a) { return a !== null && a !== undefined; });
                if (hasAnswers) {
                    state.topicSubmitted = true;
                    state.topicFinished = true;
                    showToast('⏰ Time\'s up! Your answers have been submitted.', '');
                } else {
                    state.topicSubmitted = false;
                    state.topicFinished = true;
                    showToast('⏰ Time\'s up! No answers recorded.', '');
                }
            }
            render();
        } else {
            render();
        }
    }, 1000);
}

    state.attemptModalData = null;

        loadLeaderboard(state.leaderboardTab);
    }
    if (v === "admin") {
        loadAllUsers();
        loadAllQuestionsCountOffline();
        loadAllQuestionsForAdmin();
        if (!state.docsLoaded) loadDocuments();
        if (!state.notifsLoaded) loadNotifications();
        if (!state.mockLoaded) loadMockExams();
        if (!state.activationPlansLoaded) loadActivationPlans();
        loadFlaggedCount();
        if (!state.admin.logsLoaded) loadLogs();
        checkAndDeactivateExpiredUsers();
    }
    if (v === "notifications") loadNotifications();
    if (v === "mockexam") {
        if (!state.mockLoaded) loadMockExams();
        if (state.authUser) {
            loadMockRegistrations();
            loadMockAttempts();
        }
    }
    if (v === "documents" && !state.docsLoaded) loadDocuments();
    if (v === "history") loadHistory();
    if (v === "support") {
        state.supportMessagesLoaded = false;
        loadSupportMessages();
    }
    if (v === "revise") {
        state.weakQuestionsLoaded = false;
        state.reviseView = 'modes';
        state.reviseMode = null;
        state.reviseSubject = null;
        state.weakQuestionStates = {};
        loadWeakQuestions();
    }
    render();
}

// ============================================================
//  RENDER ENGINE
// ============================================================
const root = document.getElementById("root");

function render() {
    if (state.phase === "splash") {
        root.innerHTML = renderSplash();
        return;
    }

    const prevScrollEl = document.querySelector('.view-content');
    const prevScrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;

    const settings = state.settingsCache;
    if (settings.underConstruction && !isAdmin()) {
        let html = renderUnderConstruction();
        
        if (state.showLogin) {
            const overlay = document.createElement('div');
            overlay.innerHTML = renderLoginModal();
            html += overlay.innerHTML;
        }
        
        root.innerHTML = html;
        return;
    }

    let html = renderApp();
    
    if (state.showSubmitModal && state.submitModalData) {
        html += renderSubmitModal();
    }
    if (state.showAttemptModal && state.attemptModalData) {
        html += renderAttemptModal();
    }
    if (state.showCalculator) {
        html += renderCalculator();
    }
    if (state.showReset) {
        html += renderResetModal();
    }
    if (state.showFlagModal) {
        html += renderFlagModal();
    }
    if (state.showPassageModal) {
        html += renderPassageModal();
    }
    if (state.showNotifyModal) {
        html += renderNotifyModal();
    }
    if (state.showGotoModal) {
        html += renderGotoModal();
    }
    
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('reset') && !state.resetSuccess) {
        html += renderPasswordResetForm();
    }
    
    root.innerHTML = html;

    if (state.showLogin) {
        const overlay = document.createElement('div');
        overlay.innerHTML = renderLoginModal();
        root.appendChild(overlay.firstElementChild);
    }
    if (state.showSignup) {
        const overlay = document.createElement('div');
        overlay.innerHTML = renderSignupModal();
        root.appendChild(overlay.firstElementChild);
    }

    const newScrollEl = document.querySelector('.view-content');
    if (newScrollEl) newScrollEl.scrollTop = prevScrollTop;
}

    if (v === "cbt-exam") return renderCbtExam();
    if (v === "exam-exam") return renderExamExam();
    if (v === "topic-exam") return renderTopicExam();
    if (v === "lit-exam") return renderLitExam();

    if (v === "home") return renderHome();
    if (v === "notifications") return renderNotifications();
    if (v === "profile") return renderProfile();
    if (v === "leaderboard") return renderLeaderboard();
    if (v === "activate") return renderActivate();
    if (v === "license-plans") return renderLicensePlans();
    if (v === "support") return renderSupportChat();
    if (v === "admin" && isAdmin()) return renderAdmin();
    if (v === "cbt") return renderCbtMode();
    if (v === "exam") return renderExamMode();
    if (v === "mockexam") return renderMockExamPicker();
    if (v === "topics") return renderTopicsPicker();
    if (v === "documents") return renderDocumentsUser();
    if (v === "literature") return renderLiteratureHome();
    if (v === "literature-cbt") return renderLiteratureCbt();
    if (v === "revise") return renderReviseWeak();
    if (v === "history") return renderHistory();
    if (v === "privacy") return renderPrivacyPolicy();
    if (v === "terms") return renderTermsOfService();

    const tile = HOME_TILES.find(function(t) { return t.key === v; });
    if (tile) return renderFeature(tile);
    return renderHome();
}

function renderCbtMode() {
    const others = SUBJECTS.filter(function(s) { return !s.compulsory && s.id !== 'lhm'; });

    let chips = "";

            s.id + '">' +
            subjectBadge(s) +
            '<span class="sname">' + esc(s.name) + '</span>' +
            '</button>'
        );
    });

    const count = state.cbtSelected.length;
    const isFull = state.cbtMode === "full";
    const isSingle = state.cbtMode === "single";
    const settings = state.settingsCache;
    const requiredSubjects = isFull ? (settings.cbtSubjectCount || 3) : 1;

    let modeHtml = (
        '<div class="cbt-mode-select">' +
        '<button class="cbt-mode-btn' + (isFull ? ' active' : '') + '" data-action="cbt-mode" data-mode="full">' +
        '<span class="icon">📚</span>' +
        '<span class="label">Full CBT</span>' +
        '<span class="desc">' + (requiredSubjects + 1) + ' subjects (English + ' + requiredSubjects + ')</span>' +
        '</button>' +
        '<button class="cbt-mode-btn' + (isSingle ? ' active' : '') + '" data-action="cbt-mode" data-mode="single">' +
        '<span class="icon">📝</span>' +
        '<span class="label">Single Subject</span>' +
        '<span class="desc">1 subject of your choice</span>' +
        '</button>' +
        '</div>'
    );

    let ready = false;
    if (isFull) ready = count === requiredSubjects;
    else ready = count === 1;

    let label = isFull ? 'Start CBT Practice (' + (requiredSubjects + 1) + ' subjects)' : 'Start Subject Practice (1 subject)';

    // Question count selector
    const qCounts = [25, 30, 35, 40];
    let qCountHtml = '<div class="q-count-selector">';
    qCounts.forEach(function(q) {
        qCountHtml += '<button class="q-count-btn' + (state.selectedQuestionCount === q ? ' active' : '') + '" data-action="select-q-count" data-count="' + q + '">' + q + '</button>';
    });
    qCountHtml += '</div>';

    // Time selector
    const timeLimit = isFull ? settings.cbtTimeLimit : settings.subjectTimeLimit;

    const minutes = timeLimit % 60;
    let timeHtml = (
        '<div class="time-selector">' +
        '<div class="time-input-group">' +
        '<input type="number" id="cbt-hours" min="0" max="6" value="' + hours + '" />' +
        '<label>h</label>' +
        '</div>' +
        '<div class="time-input-group">' +
        '<input type="number" id="cbt-minutes" min="0" max="59" value="' + minutes + '" />' +
        '<label>m</label>' +
        '</div>' +
        '</div>'
    );

    return (
        '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
        '<div class="feature-icon" style="background:#2E6FF2">' + svg("monitor", 30) + '</div>' +
        '<h2 class="title">CBT Mode</h2>' +
        '<p class="sub">Real JAMB-style practice screen</p>' +
        modeHtml +
        '<div class="mode-note">' + (isFull ?
            'JAMB CBT covers <b>' + (requiredSubjects + 1) + ' subjects</b>: English is compulsory, plus <b>' + requiredSubjects + '</b> more of your choice.' :
            'Choose <b>1 subject</b> to practice.') +
        '</div>' +
        '<p class="section-label">Questions per subject</p>' +
        qCountHtml +
        '<p class="section-label">Time limit</p>' +
        timeHtml +
        '<p class="section-label">' + (isFull ? 'Compulsory' : 'Select a subject') + '</p>' +
        (isFull ?
            '<div class="compulsory-row">' + subjectBadge(eng) + '<span style="font-size:12px;font-weight:600">' +
            esc(eng.name) + '</span><span class="tag">Compulsory</span></div>' :

        '<div class="subject-grid">' + chips + '</div>' +

        '<button class="btn ' + (ready ? "btn-green" : "btn-outline") + '" data-action="start-cbt"' + (ready ? '' :
            ' disabled style="opacity:0.5;pointer-events:none"') + '>' + label + '</button>' +

function renderCbtExam() {
    if (state.hasPassage && state.currentEnglishPassage && !state.passageRead) {
        return renderPassagePage();
    }

    if (state.cbtFinished || state.cbtSubmitted) {
        let score = 0;
        const rawSubjectCounts = {};
        const weakQuestionsToSave = [];
        state.cbtQuestions.forEach(function(item) {
            if (!(item.subject_id in rawSubjectCounts)) rawSubjectCounts[item.subject_id] = 0;
        });
        state.cbtQuestions.forEach(function(item, i) {
            const isCorrect = state.cbtAnswers[i] === item.correct_answer;
            if (isCorrect) {
                score++;
                rawSubjectCounts[item.subject_id]++;
            } else {
                weakQuestionsToSave.push({ questionId: item.id, subjectId: item.subject_id, userAnswer: state.cbtAnswers[i], correctAnswer: item.correct_answer });
            }
        });
        const isFullCbt = state.cbtMode === "full";
        const subjectScores = {};
        Object.keys(rawSubjectCounts).forEach(function(sid) {
            subjectScores[sid] = Math.round((rawSubjectCounts[sid] / 40) * 100);
        });
        const subjectCount = Object.keys(subjectScores).length;
        const maxScore = isFullCbt ? subjectCount * 100 : 100;
        const totalScore = isFullCbt
            ? Object.values(subjectScores).reduce(function(a, b) { return a + b; }, 0)
            : Math.round((score / 40) * 100);

        if (state.authUser && state.cbtSubmitted && !state.cbtHistorySaved) {
            state.cbtHistorySaved = true;
            const subjectId = isFullCbt ? null : state.cbtQuestions[0]?.subject_id;
            const subjectName = isFullCbt ? null : state.cbtQuestions[0]?.subject_name;
            
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'cbt', wq.userAnswer, wq.correctAnswer);
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            saveHistoryEntry({
                mode: isFullCbt ? 'cbt-full' : 'cbt-single',
                subjects: subjectNames,
                subject_scores: subjectScores,
                total_score: totalScore,
                max_score: maxScore,
                total_questions: state.cbtQuestions.length,
                answered_count: state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),
                exam_title: isFullCbt ? 'Full CBT Practice' : (subjectName || 'Subject Practice'),
            });
            
            saveScore(isFullCbt ? 'cbt' : 'subject', {
                user_id: state.authUser.id,
                username: state.profile.name,
                score: totalScore,
                total_questions: state.cbtQuestions.length,
                subject_count: isFullCbt ? (state.settingsCache.cbtSubjectCount || 3) + 1 : 1,
                subject_id: subjectId,
                subject_name: subjectName,
                subject_scores: subjectScores,
            });
            
            addLog(state.authUser.id, state.profile.name, 'completed_cbt', 'Completed CBT ' + (isFullCbt ? 'Full' : 'Single') + ' with score ' + totalScore + '/' + maxScore);
        }

        let reviewItems = "";
        state.cbtQuestions.forEach(function(item, i) {
            const userAns = state.cbtAnswers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + item.correct_answer);
            const subj = SUBJECTS.find(function(s) { return s.id === item.subject_id; });
            reviewItems += (
                '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="q-text">Q' + (i + 1) + ' (' + (subj ? subj.name : '') + '). ' + esc(item.text) +
                '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="cbt">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<h2 class="title">' + (isFullCbt ? 'CBT' : 'Subject') + ' — Result</h2>' +
            '<div class="card" style="text-align:center;padding:20px;margin-bottom:12px">' +
            '<p style="font-family:var(--font-mono);font-size:40px;margin:0;color:' + GREEN + '">' + totalScore +
            ' / ' + maxScore + '</p>' +
            '<p style="font-size:12px;color:var(--muted);margin:4px 0 0">Questions answered correctly</p>' +
            '<p style="font-size:11px;color:var(--faint);margin:10px 0 0">' + Math.round((totalScore / maxScore) *
                100) + '%</p>' +
            (state.cbtMode === "full" ?
                '<div style="margin-top:10px;text-align:left;border-top:1px solid var(--line);padding-top:10px">' +
                Object.keys(subjectScores).map(function(sid) {
                    const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                    const scaled = subjectScores[sid];
                    return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span>' +
                        (subj ? subj.name : sid) + '</span><span style="color:var(--green)">' + scaled +
                        '/100</span></div>';
                }).join('') +
                '</div>' : '') +
            '</div>' +
            '<button class="btn btn-green" style="margin-bottom:10px" data-action="cbt-exit">Back to Home</button>' +
            '<button class="btn btn-outline" data-action="cbt-toggle-review">' +
            (state.cbtReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.cbtReviewMode ? '<div style="margin-top:12px">' + reviewItems + '</div>' : '')
        );
    }

    const totalQ = state.cbtQuestions.length;
    const answeredCount = state.cbtAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;

    let subjectTabs = '';
    if (state.cbtSubjectOrder.length > 1) {
        state.cbtSubjectOrder.forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const isActive = state.cbtCurrentSubject === sid;
            const questionsInSubject = getQuestionsForSubject(sid, state.cbtSubjectQuestions);
            const answeredInSubject = questionsInSubject.filter(function(idx) {
                return state.cbtAnswers[idx] !== null && state.cbtAnswers[idx] !== undefined;
            }).length;
            const totalInSubject = questionsInSubject.length;
            const allDone = answeredInSubject === totalInSubject;
            subjectTabs += (
                '<button class="subject-tab' + (isActive ? ' active' : '') + '" data-action="switch-cbt-subject" data-subject="' +
                sid + '">' +
                (subj ? subj.code : sid) +
                ' <span class="check-mark' + (allDone ? ' done' : '') + '">' + (allDone ? '✓' : answeredInSubject + '/' + totalInSubject) +
                '</span>' +
                '</button>'
            );
        });
    }

    const currentSubjectQuestions = getQuestionsForSubject(state.cbtCurrentSubject, state.cbtSubjectQuestions);
    const currentSubjectIndex = currentSubjectQuestions.indexOf(state.cbtIndex);
    const totalInCurrentSubject = currentSubjectQuestions.length;
    
    if (currentSubjectQuestions.length === 0) {
        for (const sid of state.cbtSubjectOrder) {
            const qs = getQuestionsForSubject(sid, state.cbtSubjectQuestions);
            if (qs.length > 0) {
                state.cbtCurrentSubject = sid;
                state.cbtIndex = qs[0];
                break;
            }
        }
        render();
        return '';
    }
    
    if (currentSubjectIndex === -1 || currentSubjectIndex >= currentSubjectQuestions.length) {
        state.cbtIndex = currentSubjectQuestions[0] || 0;
        render();
        return '';
    }
 
    const item = state.cbtQuestions[state.cbtIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            const chosen = state.cbtAnswers[state.cbtIndex] === i;
            opts += (
                '<button class="qa-option' + (chosen ? ' selected' : '') + '" data-action="cbt-answer" data-idx="' +
                i + '">' +
                '<span class="qa-letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span>' +
                '</button>'
            );
        });
    }

    const hasPrev = currentSubjectIndex > 0;
    const hasNext = currentSubjectIndex < totalInCurrentSubject - 1;
    const prevIdx = hasPrev ? currentSubjectQuestions[currentSubjectIndex - 1] : null;
    const nextIdx = hasNext ? currentSubjectQuestions[currentSubjectIndex + 1] : null;

    const hasPassage = state.hasPassage && state.currentEnglishPassage && state.passageRead;

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<button class="back-link" data-action="cbt-exit" style="margin:0;font-size:13px">' + svg("chevleft", 14) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" aria-label="Calculator" title="Calculator">' + svg("calculator", 16) + '</button>' :
            '<button class="calc-btn" data-action="toggle-calculator" aria-label="Calculator" title="Calculator disabled" style="opacity:0.3;cursor:not-allowed">' + svg("calculator", 16) + '</button>'
        ) + 
        (hasPassage ? '<button class="calc-btn" style="background:var(--gold);color:var(--ink);height:28px;padding:0 8px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600" data-action="show-passage" title="View Passage" aria-label="View Passage">📖 Passage</button>' : '') +
        '</div>' +
        '<div class="right-group">' +
        '<button class="attempt-btn" data-action="show-attempted-cbt">' +

function renderExamExam() {
    if (!state.examQuestions || state.examQuestions.length === 0) return renderHome();

    if (state.examFinished || state.examSubmitted) {
        let score = 0;
        const subjectScores = {};
        const weakQuestionsToSave = [];
        state.examQuestions.forEach(function(item, i) {
            const isCorrect = state.examAnswers[i] === item.correct_answer;
            if (isCorrect) {
                score++;
                if (!subjectScores[item.subject_id]) subjectScores[item.subject_id] = 0;
                subjectScores[item.subject_id]++;
            } else {
                weakQuestionsToSave.push({ questionId: item.id, subjectId: item.subject_id, userAnswer: state.examAnswers[i], correctAnswer: item.correct_answer });
            }
        });
        if (state.authUser && state.examSubmitted && !state.examHistorySaved) {
            state.examHistorySaved = true;
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'exam', wq.userAnswer, wq.correctAnswer);
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            const subjName = state.examQuestions[0]?.subject_name || 'Unknown Subject';
            saveHistoryEntry({
                mode: 'exam',

                subject_scores: subjectScores,
                total_score: score,
                max_score: state.examQuestions.length,
                total_questions: state.examQuestions.length,
                answered_count: state.examAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),

            addLog(state.authUser.id, state.profile.name, 'completed_exam', 'Completed Exam ' + subjName + ' ' + state.examYear + ' with score ' + score + '/' + state.examQuestions.length);

                        .explanation) + '</p></div>' : '') +

        );
    }

        if (state.authUser && state.litSubmitted && !state.litHistorySaved) {
            state.litHistorySaved = true;
            weakQuestionsToSave.forEach(function(wq) {
                saveWeakQuestion(state.authUser.id, wq.questionId, wq.subjectId, 'novel');
            });
            
            const subjects = Object.keys(subjectScores);
            const subjectNames = subjects.map(function(sid) {
                const subj = SUBJECTS.find(function(s) { return s.id === sid; });
                return subj ? subj.name : sid;
            });
            saveHistoryEntry({
                mode: 'novel',
                subjects: subjectNames,
                subject_scores: subjectScores,
                total_score: score,
                max_score: state.litQuestions.length,
                total_questions: state.litQuestions.length,
                answered_count: state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length,
                submitted_at: new Date().toISOString(),
                exam_title: 'Novel (CBT) Practice',
            });
            
            addLog(state.authUser.id, state.profile.name, 'completed_novel', 'Completed Novel CBT with score ' + score + '/' + state.litQuestions.length);
        }

        let reviewItems = "";
        state.litQuestions.forEach(function(item, i) {
            const userAns = state.litAnswers[i];
            const isCorrect = userAns === item.correct_answer;
            const userLetter = userAns !== null && userAns !== undefined ? String.fromCharCode(65 + userAns) : '—';

                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="novel">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<h2 class="title">Novel (CBT) — Result</h2>' +
            '<div class="card" style="text-align:center;padding:20px;margin-bottom:12px">' +
            '<p style="font-family:var(--font-mono);font-size:40px;margin:0;color:' + GREEN + '">' + score +
            ' / ' + state.litQuestions.length + '</p>' +
            '<p style="font-size:12px;color:var(--muted);margin:4px 0 0">Questions answered correctly</p>' +
            '</div>' +
            '<button class="btn btn-green" style="margin-bottom:10px" data-action="lit-exit">Back to Home</button>' +
            '<button class="btn btn-outline" data-action="lit-toggle-review">' +
            (state.litReviewMode ? 'Hide Review' : 'Show Review') +
            '</button>' +
            (state.litReviewMode ? '<div style="margin-top:12px">' + reviewItems + '</div>' : '')
        );
    }

    const totalQ = state.litQuestions.length;
    const item = state.litQuestions[state.litIndex];
    
    const answeredCount = state.litAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;
    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            const chosen = state.litAnswers[state.litIndex] === i;
            opts += (

        });

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<button class="back-link" data-action="lit-exit" style="margin:0;font-size:13px">' + svg("chevleft", 14) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" aria-label="Calculator" title="Calculator">' + svg("calculator", 16) + '</button>' :

function renderFileActions(fileUrl, fileName, fileType) {
    if (!fileUrl) return '';
    const isImage = fileType && fileType.startsWith('image/');
    let html = '';
    if (isImage) {
        html += '<img src="' + fileUrl + '" style="width:100%;border-radius:6px;margin-bottom:6px" alt="' + esc(fileName || 'Image') + '" />';
    }
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    if (isImage) {
        html += '<a class="btn btn-outline btn-sm" href="' + fileUrl + '" target="_blank" style="flex:1">View Image</a>';
        html += '<a class="btn btn-green btn-sm" href="' + fileUrl + '" download="' + esc(fileName || 'image') + '" style="flex:1">Download</a>';
    } else {
        html += '<a class="btn btn-outline btn-sm" href="' + fileUrl + '" target="_blank" style="flex:1">View</a>';
        html += '<a class="btn btn-green btn-sm" href="' + fileUrl + '" download="' + esc(fileName || 'document') + '" style="flex:1">Download</a>';
    }
    html += '</div>';
    return html;
}

async function loadWeakQuestions() {
    if (!state.authUser) {
        state.weakQuestionsLoaded = true;
        state.weakQuestions = [];
        render();
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('weak_questions')
            .select('*')
            .eq('user_id', state.authUser.id)
            .order('created_at', { ascending: false });
            
        if (error) {
            console.warn("Load weak questions error:", error.message, error.code);
            showToast("Weak questions error: " + (error.message || "unknown"), "error");
            state.weakQuestions = [];
            state.weakQuestionsLoaded = true;
            render();
            return;
        }

        const rows = data || [];
        const withQuestions = await Promise.all(rows.map(async function(row) {
            let q = null;
            try {
                q = await dbGet('questions', row.question_id);
            } catch (e) {
                q = null;
            }
            return Object.assign({}, row, { questions: q });
        }));

        state.weakQuestions = withQuestions.filter(function(w) { return w.questions; });
        state.weakQuestionsLoaded = true;
        render();
    } catch (e) {
        console.warn("Load weak questions exception:", e.message || e);
        showToast("Weak questions error: " + (e.message || "unknown"), "error");
        state.weakQuestions = [];
        state.weakQuestionsLoaded = true;
        render();
    }
}

function renderReviseModeQuestions() {
    const mode = state.reviseMode;
    const subjectId = state.reviseSubject;
    const meta = REVISE_MODE_META[mode] || REVISE_MODE_META.unknown;
    const subj = SUBJECTS.find(function(s) { return s.id === subjectId; });
    const subjName = subj ? subj.name : (subjectId || 'Unknown');

    let list = state.weakQuestions.filter(function(wq) {
        return (wq.mode || 'unknown') === mode && wq.subject_id === subjectId;
    });
    list.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });

    let html = (
        '<button class="back-link" data-action="revise-back-to-subjects">' + svg("chevleft", 14) + ' ' + esc(meta.label) + '</button>' +
        '<h2 class="title" style="margin-bottom:2px;font-size:18px">' + esc(subjName) + '</h2>' +
        '<p class="sub" style="font-size:12px">' + esc(meta.label) + ' · ' + list.length + ' missed question' + (list.length === 1 ? '' : 's') + '</p>'
    );

    if (list.length === 0) {
        html += '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">No more weak questions here. Great job!</p></div>';
        return html;
    }

    list.forEach(function(wq) {
        const q = wq.questions;
        if (!q) return;

        const isExpanded = state.weakQuestionStates['view_' + wq.id] || false;
        const isReattempting = state.weakQuestionStates['reattempt_' + wq.id] || false;
        const userAnswer = state.weakQuestionStates['answer_' + wq.id];
        const hasResult = state.weakQuestionStates['result_' + wq.id] !== undefined;
        const resultCorrect = state.weakQuestionStates['result_' + wq.id];

        html += '<div class="weak-question-item" style="margin-bottom:8px">';
        html += '<div class="q-header">';
        html += '<p class="q-text">' + esc(q.text) + '</p>';
        html += '<div class="q-actions">';
        if (!isReattempting) {
            html += '<button class="mini-btn" style="font-size:9px" data-action="weak-toggle-view" data-wid="' + wq.id + '">' + (isExpanded ? 'Hide Answer' : 'Check Revision') + '</button>';
            html += '<button class="mini-btn primary" style="font-size:9px" data-action="weak-toggle-reattempt" data-wid="' + wq.id + '">Reattempt</button>';
        } else {
            html += '<button class="mini-btn" style="font-size:9px" data-action="weak-toggle-reattempt" data-wid="' + wq.id + '">Close</button>';
        }
        html += '<button class="mini-btn flag" style="font-size:9px" data-action="flag-weak-question" data-qid="' + wq.question_id + '" data-subject="' + subjectId + '" data-mode="' + wq.mode + '">⚠️</button>';
        html += '<button class="mini-btn danger" style="font-size:9px" data-action="weak-remove-question" data-wid="' + wq.id + '" data-qid="' + wq.question_id + '">Remove</button>';
        html += '</div></div>';

        html += '<div class="q-meta">Attempts: ' + (wq.attempts || 1) + ' · Last missed ' + formatTimeAgo(wq.created_at) + '</div>';

        if (isExpanded && !isReattempting) {
            let optsList = '<ul class="admin-list">';
            (q.options || []).forEach(function(o, oi) {
                optsList += '<li' + (oi === q.correct_answer ? ' style="color:' + GREEN + ';font-weight:600"' : '') + '>' + esc(o) + (oi === q.correct_answer ? ' ✓' : '') + '</li>';
            });
            optsList += '</ul>';
            html += '<div class="q-options">' + optsList + '</div>';
            if (q.explanation) {
                html += '<div class="q-explanation"><span style="font-weight:600">💡 Explanation:</span> ' + esc(q.explanation) + '</div>';
            }
        }

        if (isReattempting) {
            html += '<div class="reattempt-area">';
            (q.options || []).forEach(function(o, oi) {
                let cls = 'qa-option';
                if (hasResult) {
                    if (oi === q.correct_answer) cls += ' correct';
                    else if (oi === userAnswer) cls += ' wrong';
                    cls += ' disabled';
                } else if (userAnswer === oi) {
                    cls += ' selected';
                }
                html += '<button class="' + cls + '" ' + (hasResult ? '' :
                    'data-action="weak-reattempt-answer" data-wid="' + wq.id + '" data-idx="' + oi + '"') + '>' +
                    '<span class="qa-letter">' + String.fromCharCode(65 + oi) + '</span><span>' + esc(o) + '</span>' +
                    '</button>';
            });
            if (hasResult) {
                html += '<div class="explanation-box" style="margin-top:6px">' +
                    '<span class="label">' + (resultCorrect ? '✅ Correct!' : '❌ Wrong') + '</span>' +
                    (q.explanation ? '<p>' + esc(q.explanation) + '</p>' : '<p>No explanation provided.</p>') +
                    '</div>';
                html += '<button class="btn btn-green" style="margin-top:6px;padding:8px" data-action="weak-next-question" data-wid="' + wq.id + '">Next Question →</button>';
            }
            html += '</div>';
        }

        html += '</div>';
    });

    return html;
}

function renderHistory() {
    if (!state.authUser) {
        return (
            '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
            '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
            '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
            '<div class="card"><p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px">Please log in to view your results.</p></div>'
        );
    }

    if (!state.historyLoaded) {
        loadHistory();
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading results...</p></div>';
    }

    // Filter modes
    const modeFilters = [
        { key: 'all', label: 'All' },
        { key: 'cbt-full', label: 'CBT Full' },
        { key: 'cbt-single', label: 'CBT Single' },
        { key: 'exam', label: 'Exam' },
        { key: 'mock', label: 'Mock' },
        { key: 'novel', label: 'Novel CBT' },
        { key: 'topic', label: 'Topic' },
        { key: 'revise', label: 'Revise' },
    ];

    let filterHtml = '<div class="result-mode-tabs">';
    modeFilters.forEach(function(f) {
        filterHtml += '<button class="result-mode-tab' + (state.historyFilter === f.key ? ' active' : '') + '" data-action="history-filter" data-filter="' + f.key + '">' + esc(f.label) + '</button>';
    });
    filterHtml += '</div>';

    let filtered = state.historyEntries;
    if (state.historyFilter !== 'all') {
        filtered = filtered.filter(function(e) { return e.mode === state.historyFilter; });
    }

    if (filtered.length === 0) {
        return (
            '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
            '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
            '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
            filterHtml +
            '<div class="card"><p style="text-align:center;color:var(--faint);padding:16px 0;font-size:13px">No results yet for this filter. Complete an exam to see it here.</p></div>'
        );
    }

    // Calculate stats
    let totalExams = filtered.length;
    let totalQuestions = 0;
    let totalCorrect = 0;
    let totalMaxScore = 0;
    filtered.forEach(function(entry) {
        totalQuestions += entry.total_questions || 0;
        totalCorrect += entry.total_score || 0;
        totalMaxScore += entry.max_score || 0;
    });
    const overallPercentage = totalMaxScore > 0 ? Math.round((totalCorrect / totalMaxScore) * 100) : 0;

    let statsHtml = (
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px">' +
        '<div class="card" style="text-align:center;padding:10px;margin:0">' +
        '<p style="font-size:20px;font-weight:700;color:var(--green);margin:0">' + totalExams + '</p>' +
        '<p style="font-size:9px;color:var(--muted);margin:2px 0 0">Exams</p>' +
        '</div>' +
        '<div class="card" style="text-align:center;padding:10px;margin:0">' +
        '<p style="font-size:20px;font-weight:700;color:var(--green);margin:0">' + totalCorrect + '/' + totalQuestions + '</p>' +
        '<p style="font-size:9px;color:var(--muted);margin:2px 0 0">Correct</p>' +
        '</div>' +
        '<div class="card" style="text-align:center;padding:10px;margin:0">' +
        '<p style="font-size:20px;font-weight:700;color:' + (overallPercentage >= 70 ? 'var(--green)' : overallPercentage >= 50 ? 'var(--gold)' : 'var(--danger)') + ';margin:0">' + overallPercentage + '%</p>' +
        '<p style="font-size:9px;color:var(--muted);margin:2px 0 0">Avg Score</p>' +
        '</div>' +
        '</div>'
    );

    let html = (
        '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
        '<h2 class="title" style="font-size:18px">📊 Result Analysis</h2>' +
        '<p class="sub" style="font-size:12px">View all your exam results and performance</p>' +
        statsHtml +
        filterHtml
    );

    filtered.forEach(function(entry) {
        const subjectScores = entry.subject_scores || {};
        let subjectScoreHtml = '';
        Object.keys(subjectScores).forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const name = subj ? subj.name : sid;
            subjectScoreHtml += '<span>' + esc(name) + ': ' + subjectScores[sid] + '</span>';
        });

        const pct = entry.max_score > 0 ? Math.round((entry.total_score / entry.max_score) * 100) : 0;
        const modeLabel = entry.mode === 'cbt-full' ? 'CBT Full' :
                         entry.mode === 'cbt-single' ? 'CBT Single' :
                         entry.mode === 'novel' ? 'Novel CBT' :
                         entry.mode === 'revise' ? 'Revision' :
                         entry.mode === 'mock' ? 'Mock Exam' :
                         entry.mode === 'exam' ? 'Exam' :
                         entry.mode === 'topic' ? 'Topic Practice' :
                         entry.mode || 'Unknown';

        html += (
            '<div class="history-card">' +
            '<p class="h-title">' + esc(entry.exam_title || modeLabel) + '</p>' +
            '<p class="h-date">📅 ' + formatDate(entry.submitted_at) + ' · ' + esc(modeLabel) + '</p>' +
            '<p class="h-score" style="color:' + (pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--danger)') + '">' + 
            entry.total_score + ' / ' + entry.max_score + ' (' + pct + '%)</p>' +
            '<p style="font-size:11px;color:var(--muted);margin:0 0 4px">' + entry.answered_count + ' of ' + entry.total_questions + ' answered</p>' +
            '<div class="h-subject-scores">' + subjectScoreHtml + '</div>' +
            '<div class="h-actions">' +
            '<button class="btn btn-outline btn-sm" data-action="history-print" data-id="' + entry.id + '" aria-label="Print result" style="flex:1;font-size:10px;padding:4px 8px">' + svg("print", 12) + ' Print</button>' +
            '<button class="btn btn-outline btn-sm" data-action="history-share" data-id="' + entry.id + '" aria-label="Share result" style="flex:1;font-size:10px;padding:4px 8px">' + svg("share", 12) + ' Share</button>' +
            '</div>' +
            '</div>'
        );
    });

    return html;
}

// ============================================================
//  MOCK EXAM PICKER
// ============================================================
function renderMockExamPicker() {
    if (!state.mockLoaded) {
        loadMockExams();
        return '<div class="loading-spinner"><div class="spinner"></div><p>Loading mock exams...</p></div>';
    }

    let html = (
        '<button class="back-link" data-action="set-view" data-view="home">' + svg("chevleft", 14) + ' Home</button>' +
        '<div class="feature-icon" style="background:#8E44AD">' + svg("target", 30) + '</div>' +
        '<h2 class="title" style="font-size:18px">Mock Exam</h2>' +
        '<p class="sub" style="font-size:12px">Full JAMB-style mock test</p>'
    );

    if (state.admin.viewingMockAttempts) {
        return renderMockAttemptsView();
    }

    const now = new Date();
    const activeExams = state.mockExams.filter(function(exam) {
        const scheduled = new Date(exam.scheduled_date);
        const end = new Date(exam.end_date);
        return scheduled <= now && end > now && exam.is_active;
    });

    const upcomingExams = state.mockExams.filter(function(exam) {
        const scheduled = new Date(exam.scheduled_date);
        return scheduled > now && exam.is_active;
    });

    const pastExams = state.mockExams.filter(function(exam) {
        const end = new Date(exam.end_date);
        return end <= now || !exam.is_active;
    });

    if (state.mockExams.length === 0) {
        html += '<div class="card"><p style="text-align:center;color:var(--muted);font-size:13px">No mock exams scheduled yet.</p></div>';
        return html;
    }

    const userReg = state.mockRegistrations.find(function(r) {
        const exam = state.mockExams.find(function(e) { return e.id === r.mock_exam_id; });
        if (!exam) return false;
        const end = new Date(exam.end_date);
        return end > now && exam.is_active && r.user_id === state.authUser?.id;
    });

    if (userReg && state.authUser) {
        const exam = state.mockExams.find(function(e) { return e.id === userReg.mock_exam_id; });
        if (exam) {
            const scheduled = new Date(exam.scheduled_date);
            const isTime = scheduled <= now;

            const attempt = state.mockAttempts.find(function(a) {
                return a.mock_exam_id === exam.id && a.user_id === state.authUser.id && a.is_submitted;
            });

            if (attempt) {
                if (exam.results_released) {
                    return renderMockResultForUser(exam, attempt);
                } else {
                    html += (
                        '<div class="mock-card active">' +
                        '<p class="mock-title">' + esc(exam.title) + '</p>' +
                        '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                        '<span class="mock-status waiting">⏳ Waiting for results</span>' +
                        '<p style="font-size:12px;color:var(--muted);margin-top:6px">You have submitted this mock. Results will be released by the admin.</p>' +
                        '</div>'
                    );
                }
            } else if (isTime) {
                const end = new Date(exam.end_date);
                if (end > now) {
                    html += (
                        '<div class="mock-card active">' +
                        '<p class="mock-title">' + esc(exam.title) + '</p>' +
                        '<p class="mock-date">⏱️ Ends: ' + end.toLocaleString() + '</p>' +
                        '<span class="mock-status ongoing">🟢 Ongoing</span>' +
                        '<p style="font-size:12px;color:var(--muted);margin-top:6px">Subjects: ' +
                        userReg.subjects.map(function(s) {
                            const subj = SUBJECTS.find(function(x) { return x.id === s; });
                            return subj ? subj.name : s;
                        }).join(', ') +
                        '</p>' +
                        '<button class="btn btn-green" style="margin-top:10px" data-action="start-mock" data-examid="' +
                        exam.id + '">Start Mock Exam</button>' +
                        '</div>'
                    );
                } else {
                    html += (
                        '<div class="mock-card">' +
                        '<p class="mock-title">' + esc(exam.title) + '</p>' +
                        '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                        '<span class="mock-status ended">⏰ Expired</span>' +
                        '<p style="font-size:12px;color:var(--muted);margin-top:6px">This mock has ended.</p>' +
                        '</div>'
                    );
                }
            } else {
                const timeLeft = scheduled - now;
                const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                const mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                html += (
                    '<div class="mock-card active">' +
                    '<p class="mock-title">' + esc(exam.title) + '</p>' +
                    '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                    '<span class="mock-status registered">✅ Registered</span>' +
                    '<p style="font-size:12px;color:var(--muted);margin-top:6px">Starts in: <b>' + hours +
                    'h ' + mins + 'm</b></p>' +
                    '<p style="font-size:11px;color:var(--muted)">Subjects: ' +
                    userReg.subjects.map(function(s) {
                        const subj = SUBJECTS.find(function(x) { return x.id === s; });
                        return subj ? subj.name : s;
                    }).join(', ') +
                    '</p>' +
                    '</div>'
                );
            }
        }
    }

    if (upcomingExams.length > 0 || activeExams.length > 0) {
        const allDisplay = [...activeExams, ...upcomingExams];
        allDisplay.forEach(function(exam) {
            const isRegistered = state.mockRegistrations.some(function(r) {
                return r.mock_exam_id === exam.id && r.user_id === state.authUser?.id;
            });

            if (isRegistered) return;

            const scheduled = new Date(exam.scheduled_date);
            const isPastRegistration = scheduled <= now;

            const regDeadline = exam.registration_deadline ? new Date(exam.registration_deadline) : scheduled;
            const isRegClosed = regDeadline <= now;

            if (isRegClosed || isPastRegistration) {
                html += (
                    '<div class="mock-card">' +
                    '<p class="mock-title">' + esc(exam.title) + '</p>' +
                    '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                    '<span class="mock-status ended">🔒 Registration Closed</span>' +
                    '</div>'
                );
                return;
            }

            html += renderMockRegistrationForm(exam);
        });
    }

    if (pastExams.length > 0) {
        html += '<p class="section-label" style="margin-top:14px">Past Mocks</p>';
        pastExams.forEach(function(exam) {
            const attempt = state.mockAttempts.find(function(a) {
                return a.mock_exam_id === exam.id && a.user_id === state.authUser?.id && a.is_submitted;
            });

            let statusText = 'Ended';
            if (attempt && exam.results_released) statusText = 'Results Available';
            else if (attempt) statusText = 'Submitted';

            html += (
                '<div class="mock-card">' +
                '<p class="mock-title">' + esc(exam.title) + '</p>' +
                '<p class="mock-date">📅 ' + new Date(exam.scheduled_date).toLocaleString() + '</p>' +
                '<span class="mock-status ended">' + statusText + '</span>' +
                (attempt && exam.results_released ?
                    '<button class="btn btn-outline" style="margin-top:6px;padding:6px" data-action="view-mock-result" data-examid="' +
                    exam.id + '">View Results</button>' : '') +
                '</div>'
            );
        });
    }

    return html;
}

// ============================================================
function renderMockExam() {
    if (state.engMockHasPassage && state.engMockPassage && !state.engMockPassageRead) {
        return renderMockPassagePage();
    }
    
    if (!state.mockQuestions || state.mockQuestions.length === 0) return renderHome();

    const totalQ = state.mockQuestions.length;
    const answeredCount = state.mockAnswers.filter(function(a) { return a !== null && a !== undefined; }).length;
    const settings = state.settingsCache;
    const calcEnabled = settings.calculatorEnabled !== false;
   
    let subjectTabs = '';
    state.mockSubjectOrder.forEach(function(sid) {
        const subj = SUBJECTS.find(function(s) { return s.id === sid; });
        const isActive = state.mockCurrentSubject === sid;
        const questionsInSubject = getQuestionsForSubject(sid, state.mockSubjectQuestions);
        const answeredInSubject = questionsInSubject.filter(function(idx) {
            return state.mockAnswers[idx] !== null && state.mockAnswers[idx] !== undefined;
        }).length;
        const totalInSubject = questionsInSubject.length;
        const allDone = answeredInSubject === totalInSubject;
        subjectTabs += (
            '<button class="subject-tab' + (isActive ? ' active' : '') + '" data-action="switch-mock-subject" data-subject="' +
            sid + '">' +
            (subj ? subj.code : sid) +
            ' <span class="check-mark' + (allDone ? ' done' : '') + '">' + (allDone ? '✓' : answeredInSubject + '/' + totalInSubject) +
            '</span>' +
            '</button>'
        );
    });

    const currentSubjectQuestions = getQuestionsForSubject(state.mockCurrentSubject, state.mockSubjectQuestions);
    const currentSubjectIndex = currentSubjectQuestions.indexOf(state.mockIndex);
    const totalInCurrentSubject = currentSubjectQuestions.length;
    
    if (currentSubjectQuestions.length === 0) {
        for (const sid of state.mockSubjectOrder) {
            const qs = getQuestionsForSubject(sid, state.mockSubjectQuestions);
            if (qs.length > 0) {
                state.mockCurrentSubject = sid;
                state.mockIndex = qs[0];
                break;
            }
        }
        render();
        return '';
    }
    
    if (currentSubjectIndex === -1 || currentSubjectIndex >= currentSubjectQuestions.length) {
        state.mockIndex = currentSubjectQuestions[0] || 0;
        render();
        return '';
    }

    const item = state.mockQuestions[state.mockIndex];
    const subj = item ? SUBJECTS.find(function(s) { return s.id === item.subject_id; }) : null;

    let opts = "";
    if (item && item.options) {
        item.options.forEach(function(o, i) {
            const chosen = state.mockAnswers[state.mockIndex] === i;
            opts += (
                '<button class="qa-option' + (chosen ? ' selected' : '') + '" data-action="mock-answer" data-idx="' +
                i + '">' +
                '<span class="qa-letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span>' +
                '</button>'
            );
        });
    }

    const hasPrev = currentSubjectIndex > 0;
    const hasNext = currentSubjectIndex < totalInCurrentSubject - 1;
    const prevIdx = hasPrev ? currentSubjectQuestions[currentSubjectIndex - 1] : null;
    const nextIdx = hasNext ? currentSubjectQuestions[currentSubjectIndex + 1] : null;

    const hasPassage = state.engMockHasPassage && state.engMockPassage;

    return (
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<button class="back-link" data-action="mock-exit" style="margin:0;font-size:13px">' + svg("chevleft", 14) + ' Exit</button>' +
        '</div>' +
        '<div class="exam-top-bar">' +
        '<div class="left-group">' +
        (calcEnabled ? 
            '<button class="calc-btn enabled" data-action="toggle-calculator" aria-label="Calculator" title="Calculator">' + svg("calculator", 16) + '</button>' :
            '<button class="calc-btn" data-action="toggle-calculator" aria-label="Calculator" title="Calculator disabled" style="opacity:0.3;cursor:not-allowed">' + svg("calculator", 16) + '</button>'
        ) +
        (hasPassage ? 
            '<button class="calc-btn" style="background:var(--gold);color:var(--ink);height:28px;padding:0 8px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600" data-action="show-mock-passage" title="View Passage" aria-label="View Passage">📖 Passage</button>' : 
            ''
        ) +
        '</div>' +
        '<div class="right-group">' +
        '<button class="attempt-btn" data-action="show-attempted-mock">' +
        '📋 <span style="font-weight:600">' + answeredCount + '/' + totalQ + '</span>' +
        '<span class="dot-indicator"></span>' +
        '</button>' +
        '<button class="submit-btn" data-action="mock-submit">Submit</button>' +
        '</div>' +
        '</div>' +
        '<div class="timer-bar">' +
        '<span class="label">⏱️ Time left</span>' +
        '<span class="time' + (state.mockTimeLeft < 300 ? ' warning' : '') + '">' +
        formatTime(state.mockTimeLeft) +
        '</span>' +
        '</div>' +
        '<div class="subject-tabs">' + subjectTabs + '</div>' +
        '<div class="exam-nav">' +
        '<span class="q-counter">Question ' + (currentSubjectIndex + 1) + ' of ' + totalInCurrentSubject + ' in ' + (subj ? subj.name : '') + '</span>' +
        '<div class="goto-btn-wrap">' +
        '<button class="goto-btn" data-action="show-goto-mock">📋 Go</button>' +
        '</div>' +
        '</div>' +
        '<div class="exam-body">' +
        '<div class="card exam-question-card"><p style="font-weight:600;margin:0">' + esc(item
            ?.text || '') + '</p></div>' +
        '<div class="exam-options-wrap">' + opts + '</div>' +
        '<div class="exam-nav-buttons">' +
        (hasPrev ? '<button class="btn btn-outline" style="flex:1" data-action="mock-goto" data-idx="' + prevIdx + '">Previous</button>' : '') +
        (hasNext ? '<button class="btn btn-green" style="flex:1" data-action="mock-goto" data-idx="' + nextIdx + '">Next</button>' : '') +
        '</div>' +
        '</div>'
    );
}

function renderMockResult() {
    if (state.mockWaitingForResults) {
        return (
            '<div class="card" style="text-align:center;padding:24px">' +
            '<p style="font-size:40px;margin:0 0 12px">⏳</p>' +
            '<h2 class="title" style="font-size:18px">Waiting for Results</h2>' +
            '<p style="font-size:13px;color:var(--muted);margin:0">Your mock has been submitted. Results will be released by the admin.</p>' +
            '<button class="btn btn-green" style="margin-top:16px;padding:10px" data-action="mock-exit">Back to Home</button>' +
            '</div>'
        );
    }

    if (state.mockResultReleased) {
        const score = state.mockScore;
        const maxScore = (state.settingsCache.mockSubjectCount || 4) * 100;
        const questions = state.mockQuestions || [];
        const answers = state.mockAnswers || [];
        const subjectScores = state.mockSubjectScores || {};
        const submittedAt = state.mockSubmittedAt ? new Date(state.mockSubmittedAt) : null;
        const exam = state.mockExams.find(function(e) { return e.id === state.mockExamId; });

        let subjRows = "";
        Object.keys(subjectScores).forEach(function(sid) {
            const subj = SUBJECTS.find(function(s) { return s.id === sid; });
            const sScore = subjectScores[sid] || 0;
            subjRows += (
                '<div class="subj-score">' +
                '<span>' + (subj ? subj.name : sid) + '</span>' +
                '<span style="color:var(--green)">' + sScore + '/100</span>' +
                '</div>'
            );
        });

        let reviewItems = "";
        questions.forEach(function(item, i) {

                '<div class="q-text">Q' + (i + 1) + ' (' + (subj ? subj.name : '') + '). ' + esc(item.text) +
                '</div>' +
                '<div class="answer-row">' +
                '<span>Your answer: <span class="' + (isCorrect ? 'correct-answer' : 'wrong-answer') + '">' +
                userLetter + '</span></span>' +
                '<span>Correct answer: <span class="correct-answer">' + correctLetter + '</span></span>' +
                '</div>' +
                (item.explanation ?
                    '<div class="explanation-box"><span class="label">💡 Explanation</span><p>' + esc(item
                        .explanation) + '</p></div>' : '') +
                '<div class="flag-btn"><button class="mini-btn flag" data-action="flag-review-question" data-qid="' + item.id + '" data-subject="' + (subj ? subj.id : '') + '" data-mode="mock">⚠️ Flag Question</button></div>' +
                '</div>'
            );
        });

        return (
            '<div class="result-card">' +
            '<p style="font-size:14px;font-weight:600;margin:0 0 2px">' + (exam ? esc(exam.title) : 'Mock Exam') +
            '</p>' +
            '<p style="font-size:11px;color:var(--muted);margin:0 0 6px">📅 ' + (exam ? new Date(exam.scheduled_date)
                .toLocaleString() : '') + '</p>' +
            (submittedAt ? '<p style="font-size:11px;color:var(--muted);margin:0 0 6px">⏱️ Submitted: ' + submittedAt
                .toLocaleString() + '</p>' : '') +
            '<div class="score-big" style="font-size:36px">' + score + ' / ' + maxScore + '</div>' +
            '<p style="font-size:12px;color:var(--muted);margin:0 0 10px">' + Math.round((score / maxScore) * 100) +
            '%</p>' +
            '<div style="text-align:left;border-top:1px solid var(--line);padding-top:10px">' +
            subjRows +
            '</div>' +
            '<button class="btn btn-green" style="margin-top:10px;padding:10px" data-action="mock-exit">Back to Home</button>' +
            '<button class="btn btn-outline" style="margin-top:6px;padding:8px" data-action="mock-toggle-review">' +

            '</button>' +
            (state.mockReviewMode ? '<div style="margin-top:10px;text-align:left">' + reviewItems + '</div>' : '') +
            '</div>'
        );
    }

    return renderHome();
}

function renderLeaderboard() {
    const tabs = [
        { key: "cbt", label: "CBT" },
        { key: "subject", label: "Subject" },
        { key: "mock", label: "Mock" },
    ];

    let tabHtml = "";
    tabs.forEach(function(t) {
        tabHtml += '<button class="leaderboard-tab' + (state.leaderboardTab === t.key ? ' active' : '') +
            '" data-action="lb-tab" data-tab="' + t.key + '">' + esc(t.label) + '</button>';
    });

    let subjectSelector = "";
    if (state.leaderboardTab === "subject") {
        let subjOpts = '<option value="">Select subject</option>';
        SUBJECTS.forEach(function(s) {
            subjOpts += '<option value="' + s.id + '"' + (state.subjectLeaderboardSubject === s.id ?
                ' selected' : '') + '>' + esc(s.name) + '</option>';
        });
        subjectSelector = (
            '<div style="margin-bottom:10px">' +
            '<select class="field" id="subject-lb-select">' + subjOpts + '</select>' +
            '</div>'
        );
    }

    if (state.loadingLeaderboard) {
        return (
            '<h2 class="title" style="margin-bottom:2px;font-size:18px">🏆 Leaderboard</h2>' +
            '<p class="sub" style="font-size:12px;margin-bottom:10px">See how you rank against other students</p>' +
            '<div class="leaderboard-tabs">' + tabHtml + '</div>' +
            subjectSelector +
            '<div class="loading-spinner"><div class="spinner"></div><p>Loading leaderboard...</p></div>'
        );
    }

    let displayData = state.leaderboardTab === "subject" ? state.subjectLeaderboardData : state.leaderboardData;

    let rows = "";
    if (displayData.length === 0) {
        rows = '<div class="lb-empty">No scores yet. Complete a test to appear on the leaderboard!</div>';
    } else {
        displayData.forEach(function(entry, i) {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
            const isCurrentUser = entry.user_id === state.profile.id;
            rows += (
                '<div class="lb-row" style="' + (isCurrentUser ? 'border-color:var(--gold);' : '') + '">' +
                '<div class="left">' +
                '<span class="rank">' + medal + '</span>' +
                '<span style="font-size:12px">' + esc(entry.username) + (isCurrentUser ? ' (you)' : '') + '</span>' +
                '</div>' +
                '<span class="score" style="font-size:13px">' + entry.score + '</span>' +
                '</div>'
            );
        });
    }

    return (
        '<h2 class="title" style="margin-bottom:2px;font-size:18px">🏆 Leaderboard</h2>' +
        '<p class="sub" style="font-size:12px;margin-bottom:10px">See how you rank against other students</p>' +
        '<div class="leaderboard-tabs">' + tabHtml + '</div>' +
        subjectSelector +
        '<div style="margin-bottom:10px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">' +
        '<span>Rank</span><span>User</span><span>Score</span>' +
        '</div>' +
        rows +
        '<button class="btn btn-outline" style="margin-top:12px;padding:10px" data-action="refresh-leaderboard">🔄 Refresh</button>'
    );
}
