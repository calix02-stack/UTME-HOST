<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Install MyUTME</title>
<meta name="theme-color" content="#0F6B3F">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#F4F1EA; --card:#fff; --ink:#14201a; --muted:#5d6b63; --green:#0F6B3F; --line:#e3ded2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101512; --card:#1a211d; --ink:#eef3ef; --muted:#9baba1; --line:#2a332e; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:24px;
    padding-top:max(24px, env(safe-area-inset-top)); padding-bottom:max(24px, env(safe-area-inset-bottom)); }
  .box { width:100%; max-width:380px; text-align:center; }
  .logo { width:104px; height:104px; border-radius:26px; box-shadow:0 8px 26px rgba(15,107,63,.25); }
  h1 { font-size:26px; margin:18px 0 4px; }
  p.tag { margin:0 0 26px; color:var(--muted); font-size:14px; line-height:1.5; }
  button.install { width:100%; border:0; border-radius:16px; background:var(--green); color:#fff;
    font-size:18px; font-weight:700; padding:17px 12px; cursor:pointer; }
  button.install:disabled { opacity:.6; }
  a.open { display:block; width:100%; border-radius:16px; background:var(--green); color:#fff;
    font-size:18px; font-weight:700; padding:17px 12px; text-decoration:none; }
  .note { margin-top:18px; font-size:13px; color:var(--muted); line-height:1.6; }
  .steps { margin-top:18px; text-align:left; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; font-size:14px; line-height:1.7; display:none; }
  .steps b { color:var(--green); }
  .ok { color:var(--green); font-weight:700; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="icon-192.png" alt="MyUTME">
  <h1>MyUTME</h1>
  <p class="tag">Free JAMB CBT practice. Works offline.</p>

  <button class="install" id="btn" disabled>Install MyUTME</button>
  <a class="open hide" id="open" href="index.html">Open MyUTME</a>

  <div class="note" id="note">Getting ready…</div>
  <div class="steps" id="steps"></div>
</div>

<script>
(function () {
  var btn = document.getElementById('btn'), openLink = document.getElementById('open');
  var note = document.getElementById('note'), steps = document.getElementById('steps');
  var ua = navigator.userAgent || '';
  var deferred = null, finished = false;

  function standalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function showSteps(html) { steps.innerHTML = html; steps.style.display = 'block'; }
  function installedUi() {
    finished = true;
    btn.classList.add('hide');
    openLink.classList.remove('hide');
    steps.style.display = 'none';
    note.innerHTML = '<span class="ok">✓ MyUTME is on your phone.</span><br>Open it from your home screen or app list.';
  }

  // Register the service worker so the browser allows installing.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
  }

  if (standalone()) {
    finished = true;
    btn.classList.add('hide');
    openLink.classList.remove('hide');
    note.textContent = 'MyUTME is already installed.';
    return;
  }

  var isIOS = /iphone|ipad|ipod/i.test(ua);
  var isSafari = /safari/i.test(ua) && !/crios|fxios|edgios|chrome|android/i.test(ua);
  var inApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|Snapchat|TikTok|MicroMessenger|; wv\)/i.test(ua);

  // Facebook / WhatsApp / in-app browsers cannot install apps.
  if (inApp) {
    btn.classList.add('hide');
    note.innerHTML = '<b>Open this page in Chrome</b> to install.';
    showSteps('Tap the menu <b>⋮</b> (top right), then choose <b>Open in Chrome</b> (or <b>Open in browser</b>). Then tap <b>Install MyUTME</b>.');
    return;
  }

  // iPhone: Safari has no install button, only Add to Home Screen.
  if (isIOS) {
    btn.textContent = 'Show me how to install';
    btn.disabled = false;
    note.textContent = '';
    btn.onclick = function () {
      if (!isSafari) {
        showSteps('Open this page in <b>Safari</b>, then follow the steps.');
        return;
      }
      showSteps('1. Tap the <b>Share</b> button (square with an arrow).<br>2. Scroll and tap <b>Add to Home Screen</b>.<br>3. Tap <b>Add</b>.');
    };
    return;
  }

  // Android / desktop Chrome, Edge, Samsung Internet
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    btn.disabled = false;
    note.textContent = 'Tap the button to install.';
  });
  window.addEventListener('appinstalled', function () {
    installedUi();
    // The app is on the home screen now. Download the rest of it in the background.
    try {
      navigator.serviceWorker.ready.then(function (reg) {
        if (reg.active) reg.active.postMessage({ type: 'CHECK_UPDATE' }, [new MessageChannel().port2]);
      });
    } catch (e) {}
  });

  btn.onclick = function () {
    if (!deferred) {
      showSteps('Tap the browser menu <b>⋮</b>, then choose <b>Install app</b> (or <b>Add to Home screen</b>).');
      return;
    }
    btn.disabled = true;
    deferred.prompt();
    deferred.userChoice.then(function (c) {
      deferred = null;
      if (c && c.outcome === 'accepted') installedUi();
      else { btn.disabled = true; note.textContent = 'Install was cancelled. Refresh this page to try again.'; }
    });
  };

  // If the browser has not offered the install after a few seconds, explain the manual way.
  setTimeout(function () {
    if (finished || deferred) return;
    btn.disabled = false;
    note.textContent = 'If nothing happens, MyUTME may already be installed. Look for it in your app list.';
    showSteps('To install by hand: tap the browser menu <b>⋮</b>, then <b>Install app</b> (or <b>Add to Home screen</b>).');
  }, 4000);
})();
</script>
</body>
</html>
